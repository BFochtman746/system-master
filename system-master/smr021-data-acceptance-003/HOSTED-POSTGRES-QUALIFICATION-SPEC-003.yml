name: SMR021 DATA-001 hosted PostgreSQL qualification spec

# REVIEWABLE SPEC ONLY. Do not promote or interpret as executed evidence.
# Becomes executable only after all Git-native payload parts and the runnable
# SHA-256 manifest are present on one immutable candidate commit.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REQUIRED_POSTGRES_VERSION: '18.6'
  REQUIRED_PGJDBC_VERSION: '42.7.13'

jobs:
  smr021-hosted-prequalification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: systemmaster
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d systemmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact Git custody and reconstruct candidate
        run: system-master/smr021-data-acceptance-003/rebuild-and-verify.sh "$RUNNER_TEMP/smr021"
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Acquire pgJDBC 42.7.13 and record digest
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/postgresql-42.7.13.jar" \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.13/postgresql-42.7.13.jar"
          sha256sum "$RUNNER_TEMP/postgresql-42.7.13.jar" | tee "$RUNNER_TEMP/pgjdbc.sha256"
      - name: Portable exact-subject qualification
        working-directory: ${{ runner.temp }}/smr021/tree
        run: ./tools/run_smr021_portable_qualification.sh | tee "$RUNNER_TEMP/portable.log"
      - name: PostgreSQL 18.6 + pgJDBC 42.7.13 qualification
        working-directory: ${{ runner.temp }}/smr021/tree
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
          PGJDBC_JAR: ${{ runner.temp }}/postgresql-42.7.13.jar
          PG_DB: systemmaster
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_PORT: '5432'
        run: ./tools/run_smr021_postgres_qualification.sh | tee "$RUNNER_TEMP/postgres.log"
      - name: Seal non-authoritative hosted evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/portable.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/postgres.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/pgjdbc.sha256" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          printf '%s\n' 'a01Pass=false' 'nativePass=false' 'productionAuthorized=false' 'promotionAuthorized=false' \
            > "$RUNNER_TEMP/evidence/authority-flags.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smr021-data001-hosted-prequalification-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
