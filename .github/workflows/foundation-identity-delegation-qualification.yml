name: Foundation Identity Through Contracts Qualification

on:
  pull_request:
    branches:
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/identity/**'
      - 'system-master/foundation-spine/contracts/**'
      - '.github/scripts/foundation-identity-delegation-qualify.js'
      - '.github/scripts/foundation-contracts-versioning-qualify.js'
      - '.github/workflows/foundation-identity-delegation-qualification.yml'
      - '.github/workflows/foundation-contracts-versioning-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-foundation-through-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify Contracts Versioning plus cumulative Root and Identity baseline
        run: node .github/scripts/foundation-contracts-versioning-qualify.js

      - name: Preserve Contracts Versioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-through-contracts-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-contracts-versioning-*/
          if-no-files-found: error
          retention-days: 30
