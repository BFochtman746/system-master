name: Foundation Identity Delegation Qualification

on:
  pull_request:
    branches:
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/identity/**'
      - '.github/scripts/foundation-identity-delegation-qualify.js'
      - '.github/workflows/foundation-identity-delegation-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-identity-delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify delegation and cumulative Foundation baseline
        run: node .github/scripts/foundation-identity-delegation-qualify.js

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-identity-delegation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-identity-delegation-*/
          if-no-files-found: error
          retention-days: 30
