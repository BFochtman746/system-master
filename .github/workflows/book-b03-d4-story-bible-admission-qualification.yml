name: Book B03 D4 Story Bible Admission Qualification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - 'system-master/book-system/book-story-bible-knowledge-v1.js'
      - 'system-master/book-system/book-story-bible-knowledge-v1.test.js'
      - 'system-master/book-system/book-knowledge-materializer-v1.js'
      - 'system-master/book-system/book-knowledge-materializer-v1.test.js'
      - 'system-master/book-system/book-knowledge-invalidation-v1.js'
      - 'system-master/book-system/book-knowledge-invalidation-v1.test.js'
      - 'system-master/book-system/book-story-bible-admission-v1.js'
      - 'system-master/book-system/book-story-bible-admission-v1.test.js'
      - 'system-master/book-system/content-object-admission-core.js'
      - 'system-master/book-system/version-and-rollback-core.js'
      - 'system-master/book-system/content-admission-author-decision-applicability-guard.js'
      - 'system-master/book-system/book-capability-binding-v1.registry.json'
      - '.github/workflows/book-b03-d4-story-bible-admission-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-d2-d3-d4-deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record and bind exact D4 bytes
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object system-master/book-system/book-story-bible-admission-v1.js)" = '9f01646fa9ad275bc0c43761658472bbe84eb042'
          test "$(git hash-object system-master/book-system/book-story-bible-admission-v1.test.js)" = 'a57be92b12d5a3c26160f61a3c585ae79f0852df'
      - name: Run B03 D1 K01-K32
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-knowledge-v1.test.js | tee b03-d1.log
          grep -F '"result":"PASS"' b03-d1.log
          grep -F '"denominator":"K01-K32"' b03-d1.log
          grep -F '"cases":32' b03-d1.log
      - name: Run B03 D2 M01-M20
        run: |
          set -euo pipefail
          node system-master/book-system/book-knowledge-materializer-v1.test.js | tee b03-d2.log
          grep -F '"result":"PASS"' b03-d2.log
          grep -F '"denominator":"M01-M20"' b03-d2.log
          grep -F '"cases":20' b03-d2.log
      - name: Run B03 D3 I01-I16
        run: |
          set -euo pipefail
          node system-master/book-system/book-knowledge-invalidation-v1.test.js | tee b03-d3.log
          grep -F '"result":"PASS"' b03-d3.log
          grep -F '"denominator":"I01-I16"' b03-d3.log
          grep -F '"cases":16' b03-d3.log
      - name: Run B03 D4 A01-A16 X01-X24
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-admission-v1.test.js | tee b03-d4.log
          grep -F '"result":"PASS"' b03-d4.log
          grep -F '"denominator":"A01-A16+X01-X24"' b03-d4.log
          grep -F '"cases":40' b03-d4.log
          grep -F '"cumulative_b03_cases":108' b03-d4.log
          grep -F '"b00_atomic_content_admission_composed":true' b03-d4.log
          grep -F '"isolated_b03_108_complete":true' b03-d4.log
          grep -F '"b03_e_cumulative_qualification_claimed":false' b03-d4.log
          grep -F '"b03_freeze_claimed":false' b03-d4.log
          grep -F '"b01_registry_modified":false' b03-d4.log
          grep -F '"historical_pass_transferred":0' b03-d4.log
          grep -F '"model_accuracy_claimed":false' b03-d4.log
          grep -F '"real_book_validation_claimed":false' b03-d4.log
          grep -F '"publication_standing_claimed":false' b03-d4.log
          grep -F '"production_standing_claimed":false' b03-d4.log
