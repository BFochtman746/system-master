name: Learning 001M-S08 Cumulative Qualification

on:
  push:
    branches:
      - learning/system-rebuild-001m-s08-cumulative-qualification-20260915
    paths:
      - qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S08-64CASE-QUALIFICATION-CONTRACT.json
      - qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S08-CLOSURE.md
      - .github/scripts/learning-system-rebuild-001m-s08-qualify.py
      - .github/workflows/learning-system-rebuild-001m-s08-qualify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-subject cumulative S08 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact subject
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Syntax check S08 qualification code
        shell: bash
        run: |
          python -m py_compile .github/scripts/learning-system-rebuild-001m-s08-qualify.py
      - name: Run S08 cumulative exact-subject qualification
        shell: bash
        run: |
          mkdir -p qualification-evidence
          python .github/scripts/learning-system-rebuild-001m-s08-qualify.py | tee qualification-evidence/s08-report.json
      - name: Upload exact-subject qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-system-rebuild-001m-s08-${{ github.sha }}
          path: |
            qualification-evidence/s08-report.json
            qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S08-64CASE-QUALIFICATION-CONTRACT.json
          if-no-files-found: error
          retention-days: 90
