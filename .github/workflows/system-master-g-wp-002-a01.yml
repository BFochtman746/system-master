name: System Master G-WP-002 A-01 Qualification

on:
  push:
    branches:
      - system-master/g-wp-002-a01
    paths:
      - "system-master/g-wp-002/**"
      - ".github/scripts/gwp002-qualify.js"
      - ".github/workflows/system-master-g-wp-002-a01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify G-WP-002 durable identity and recovery registry on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact G-WP-002 subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Execute repository-owned G-WP-002 qualifier
        shell: cmd
        run: node .github\scripts\gwp002-qualify.js

      - name: Publish G-WP-002 summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-gwp002-%GITHUB_RUN_ID%"
          echo ## SYSTEM-MASTER G-WP-002 A-01>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\subject.txt" type "%EVIDENCE_DIR%\subject.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\result.txt" type "%EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\qualification.txt" type "%EVIDENCE_DIR%\qualification.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\failure.txt" type "%EVIDENCE_DIR%\failure.txt">>"%GITHUB_STEP_SUMMARY%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"

      - name: Upload G-WP-002 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-master-g-wp-002-a01-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
