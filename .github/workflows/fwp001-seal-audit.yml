name: System Master F-WP-001 Seal Audit

on:
  push:
    branches:
      - system-master/f-wp-001-a01
    paths:
      - ".github/workflows/fwp001-seal-audit.yml"
      - ".github/scripts/fwp001-seal-audit.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit F-WP-001 sealed Git blob bytes
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository subject
        uses: actions/checkout@v4
      - name: Compute exact sealed hashes
        shell: cmd
        run: node .github\scripts\fwp001-seal-audit.js
