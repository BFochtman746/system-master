name: Programming Work Program Enforcement

on:
  push:
    branches: [main]
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/programs/PROGRAMMING-WORK-PROGRAM-LOCK-*.json'
      - 'governance/catalog/system-packets/PROGRAMMING.json'
      - 'governance/morning/CHAT-START-COMMAND-CONTRACT-*.md'
      - 'governance/morning/DAILY-CHAT-BOOTSTRAP-SCHEMA-*.json'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-*.json'
      - '.github/scripts/programming-work-program-enforce.js'
      - '.github/workflows/programming-work-program-enforcement.yml'
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/programs/PROGRAMMING-WORK-PROGRAM-LOCK-*.json'
      - 'governance/catalog/system-packets/PROGRAMMING.json'
      - 'governance/morning/CHAT-START-COMMAND-CONTRACT-*.md'
      - 'governance/morning/DAILY-CHAT-BOOTSTRAP-SCHEMA-*.json'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-*.json'
      - '.github/scripts/programming-work-program-enforce.js'
      - '.github/workflows/programming-work-program-enforcement.yml'
  workflow_dispatch:

concurrency:
  group: programming-work-program-enforcement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # was actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # was actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce Programming work-program scope
        run: node .github/scripts/programming-work-program-enforce.js
