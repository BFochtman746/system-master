name: Programming Work Program Enforcement

on:
  push:
    branches: [main]
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-004.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-001.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-001.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-008.json'
      - 'governance/programs/PROGRAMMING-WORK-PROGRAM-LOCK-001.json'
      - 'governance/catalog/system-packets/PROGRAMMING.json'
      - 'governance/morning/CHAT-START-COMMAND-CONTRACT-001.md'
      - 'governance/morning/DAILY-CHAT-BOOTSTRAP-SCHEMA-001.json'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-001.json'
      - '.github/scripts/programming-work-program-enforce.js'
      - '.github/workflows/programming-work-program-enforcement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce Programming work-program scope
        run: node .github/scripts/programming-work-program-enforce.js
