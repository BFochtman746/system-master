name: Book Workflow Scheduler Runtime Qualification

on:
  push:
    branches:
      - book/workflow-scheduler-runtime-001
      - book-system/control-v1
    paths:
      - 'system-master/book-system/book-workflow-scheduler-runtime.js'
      - 'system-master/book-system/book-workflow-scheduler-runtime.test.js'
      - 'system-master/book-system/book-workflow-execution-plan.js'
      - 'system-master/book-system/book-capability-routing-interface.js'
      - 'system-master/book-system/book-workflow-concurrency-rules.js'
      - 'system-master/book-system/book-workflow-retry-idempotency-rules.js'
      - 'system-master/book-system/book-workflow-durable-store.js'
      - 'system-master/book-system/book-workflow-state-model.js'
      - 'qualification/book-system/phase3a/BOOK-WORKFLOW-SCHEDULER-EXECUTION-RUNTIME-001.json'
      - '.github/workflows/book-workflow-scheduler-runtime-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Book scheduler runtime qualification
        run: node system-master/book-system/book-workflow-scheduler-runtime.test.js
