name: Book System Author Decision Queue Hosted Prequalification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "qualification/book-system/author-decision-001/**"
      - "system-master/book-system/author-decision-queue*.js"
      - ".github/scripts/book-system-author-decision-queue-001-qualify.js"
      - ".github/workflows/book-system-author-decision-queue-001-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Deterministic 48-case Author Decision Queue prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Run Author Decision Queue qualifier
        run: node .github/scripts/book-system-author-decision-queue-001-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOOK-SYSTEM-AUTHOR-DECISION-QUEUE-001-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/book-author-decision-queue-evidence
          if-no-files-found: warn
          retention-days: 30
