name: Book System Integration Proposal Runtime V2 Qualification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "system-master/book-system/integration-proposal-runtime-v2.js"
      - "system-master/book-system/integration-proposal-runtime-v2-core.js"
      - "qualification/book-system/integration-proposal-002/BOOK-SYSTEM-INTEGRATION-PROPOSAL-RUNTIME-002.json"
      - "qualification/book-system/integration-proposal-002/BOOK-SYSTEM-RUNTIME-V2-PREIMPLEMENTATION-RESEARCH-001.json"
      - "qualification/book-system/integration-proposal-002/INTEGRATION-PROPOSAL-RUNTIME-002-FIXTURES.json"
      - "qualification/book-system/service-interface-002/BOOK-SYSTEM-SERVICE-INTERFACE-REGISTRY-002.json"
      - ".github/scripts/book-system-integration-proposal-runtime-002-qualify.js"
      - ".github/scripts/a01-book-system-integration-proposal-runtime-002.js"
      - ".github/workflows/book-system-integration-proposal-runtime-002-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Deterministic hosted Runtime V2 prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Run Runtime V2 qualifier
        run: node .github/scripts/book-system-integration-proposal-runtime-002-qualify.js

  qualify:
    name: Authoritative A-01 Runtime V2 qualification
    needs: prequalify
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@main
    with:
      qualification_id: BOOK-SYSTEM-INTEGRATION-PROPOSAL-RUNTIME-002
      workstream_id: BOOK-SYSTEM
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref }}
      resume_on_pass: Close BOOK-SYSTEM-INTEGRATION-PROPOSAL-RUNTIME-002 on this exact SHA, reconcile Book control and Second Shift, then advance only to BOOK-SYSTEM-VERSION-AND-ROLLBACK-001.
      resume_on_failure: Classify the receipt first; repair only the failing Runtime V2 subject boundary for SUBJECT_FAILURE, and do not alter qualified Registry V2 or A-01 infrastructure without failure evidence requiring it.
      notification_target: book-system/control-v1
      execution_context: normal
      qualifier_timeout_minutes: 10
      job_timeout_minutes: 15
    secrets: inherit
