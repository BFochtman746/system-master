name: Documents Spine Effect Runtime Compile Diagnostic

on:
  push:
    branches:
      - documents/spine-effect-runtime-001-20260912
    paths:
      - .github/workflows/documents-spine-effect-runtime-compile-diagnostic.yml

permissions:
  contents: write

jobs:
  compile-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: documents/spine-effect-runtime-001-20260912
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and preserve exact diagnostic
        shell: bash
        run: |
          set -uo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java src/test/java -name '*.java' -print | LC_ALL=C sort > build/java-sources.txt
          set +e
          javac --release 21 -Xlint:all -Werror -d build/classes @build/java-sources.txt > build/integration-compile.txt 2>&1
          STATUS=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p qualification/document-system/spine
          {
            printf 'record=DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-COMPILE-DIAGNOSTIC-001\n'
            printf 'subject=%s\n' "$(git rev-parse HEAD)"
            printf 'javac_status=%s\n' "$STATUS"
            printf 'environment=github-hosted-ubuntu-java21\n'
            printf '%s\n' '--- javac output ---'
            cat "$ROOT/build/integration-compile.txt"
          } > qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-COMPILE-DIAGNOSTIC-001.txt
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-COMPILE-DIAGNOSTIC-001.txt
          git commit -m 'documents: preserve integration compile diagnostic' || true
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
          exit "$STATUS"
