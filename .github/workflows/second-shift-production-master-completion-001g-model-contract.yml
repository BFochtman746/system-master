name: Second Shift Production Master 001G AI Coding Model Contract

on:
  push:
    branches:
      - second-shift-production-master-completion-001
    paths:
      - control-gateway/python/a01_model_dispatch.py
      - tests/test_a01_model_dispatch.py
      - .github/workflows/second-shift-production-master-completion-001g-model-contract.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: second-shift-production-master-001g-model-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority:
    name: Wait for exact 001G authority binding
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Wait for recovery-v4 to authorize exact subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          expected = os.environ['EXPECTED_SHA'].lower()
          token = os.environ['GH_TOKEN']
          ref = 'control-gateway-state/active-work/second-shift-production-master-completion-001-recovery-v4'
          query = urllib.parse.urlencode({'ref': ref})
          url = 'https://api.github.com/repos/BFochtman746/system-master/contents/control-gateway-state/active-work/head.json?' + query
          for _ in range(60):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Author' + 'ization': 'Bear' + 'er ' + token,
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              head = json.loads(base64.b64decode(value['content']).decode('utf-8'))
              packet = head.get('packet', {})
              current = packet.get('current_operation', {})
              subject = str(packet.get('authoritative_subject', {}).get('oid', '')).lower()
              if (
                  subject == expected
                  and current.get('operation_id') == 'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001G'
                  and current.get('state') == 'ACTIVE'
                  and packet.get('qualification_state') == 'PASSED'
                  and packet.get('github_admission_state') == 'ADMITTED'
              ):
                  print(f"SECOND_SHIFT_001G_MODEL_AUTHORITY=PASS subject={subject} epoch={packet.get('authority_epoch')}")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('SECOND_SHIFT_001G_MODEL_AUTHORITY=FAIL exact subject was not rebound within bounded wait')
          PY

  hosted_preflight:
    name: Hosted AI coding model-contract qualification
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify bounded model contract and worker barriers
        run: |
          python -m py_compile control-gateway/python/a01_model_dispatch.py
          python tests/test_a01_model_dispatch.py
          python tests/test_a01_execution_worker_ai_coding.py
          echo SECOND_SHIFT_001G_MODEL_CONTRACT=PASS

  freeze:
    name: Freeze non-promoting 001G model-contract standing
    if: always()
    needs: [hosted_preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTED_RESULT: ${{ needs.hosted_preflight.result }}
    steps:
      - name: Enforce hosted contract PASS only
        run: test "$HOSTED_RESULT" = "success"
      - name: Write 001G model-contract standing
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          evidence={
            'protocol_version':'second-shift.production-master.001g-model-contract.v1',
            'phase':'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001G',
            'subject_sha':os.environ['SUBJECT_SHA'].lower(),
            'standing':'PASS',
            'ai_coding_model':'gpt-oss-20b-NPU',
            'hosted_contract_only':True,
            'live_ai_coding_smoke_passed':False,
            'live_ready_queue_touched':False,
            'repository_commit_authority_granted':False,
          }
          p=pathlib.Path('001g-model-contract-evidence')
          p.mkdir(parents=True,exist_ok=True)
          (p/'second-shift-production-master-001g-model-contract.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('SECOND_SHIFT_001G_MODEL_CONTRACT_STANDING=PASS')
          PY
      - name: Upload immutable 001G model-contract standing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-shift-production-master-001g-model-contract-${{ github.run_id }}
          path: 001g-model-contract-evidence
          if-no-files-found: error
          retention-days: 30
