name: LEARNING-LAB-IMPL-017 Stable Runtime Port

on:
  push:
    branches:
      - learning/impl-017-system-master-runtime-integration
    paths:
      - ".github/workflows/learning-impl-017.yml"
      - "learning/lab/system_master_bridge.py"
      - "system-master/learning-integration/impl-017/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-impl-017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify stable Learning port and current System Master shim on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8

    steps:
      - name: Checkout exact IMPL-017 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false

      - name: Prepare bounded evidence directories
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-impl-017-%GITHUB_RUN_ID%"
          set "PORT_CLASS_DIR=%RUNNER_TEMP%\learning-impl-017-port-%GITHUB_RUN_ID%"
          set "FULL_CLASS_DIR=%RUNNER_TEMP%\learning-impl-017-full-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          if not exist "%PORT_CLASS_DIR%" mkdir "%PORT_CLASS_DIR%"
          if not exist "%FULL_CLASS_DIR%" mkdir "%FULL_CLASS_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo PORT_CLASS_DIR=%PORT_CLASS_DIR%>>"%GITHUB_ENV%"
          echo FULL_CLASS_DIR=%FULL_CLASS_DIR%>>"%GITHUB_ENV%"
          echo %GITHUB_SHA%>"%EVIDENCE_DIR%\source-commit.txt"
          echo %RUNNER_NAME%>"%EVIDENCE_DIR%\runner.txt"
          python --version
          java -version
          javac -version

      - name: Compile Python Learning bridge
        shell: cmd
        run: |
          python -m py_compile learning\lab\system_master_bridge.py >"%EVIDENCE_DIR%\python-bridge-compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\python-bridge-compile.txt" & exit /b 1)

      - name: Prove Learning integration compiles without foundation packages
        shell: cmd
        run: |
          javac -d "%PORT_CLASS_DIR%" ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningExecutionPort.java ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningCapabilityAdapter.java ^
            >"%EVIDENCE_DIR%\learning-port-isolation-compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\learning-port-isolation-compile.txt" & exit /b 1)
          echo LEARNING_PORT_ISOLATION=PASS>"%EVIDENCE_DIR%\learning-port-isolation.txt"
          echo LEARNING_PORT_VERSION=LEARNING-EXECUTION-PORT-V1>>"%EVIDENCE_DIR%\learning-port-isolation.txt"
          echo FOUNDATION_PACKAGE_DEPENDENCY=NONE>>"%EVIDENCE_DIR%\learning-port-isolation.txt"
          type "%EVIDENCE_DIR%\learning-port-isolation.txt"

      - name: Compile current System Master compatibility shim and qualifier
        shell: cmd
        run: |
          javac -d "%FULL_CLASS_DIR%" ^
            system-master\f-wp-006\src\main\java\org\systemmaster\core\ExecutionGrantContracts.java ^
            system-master\f-wp-006\src\main\java\org\systemmaster\core\ExecutionGrantIssuer.java ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningExecutionPort.java ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningCapabilityAdapter.java ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\CurrentSystemMasterLearningAuthorizer.java ^
            system-master\learning-integration\impl-017\src\test\java\org\systemmaster\learning\Impl017IntegrationQualification.java ^
            >"%EVIDENCE_DIR%\current-shim-compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\current-shim-compile.txt" & exit /b 1)

      - name: Run focused stable-port integration qualification
        shell: cmd
        run: |
          java -cp "%FULL_CLASS_DIR%" org.systemmaster.learning.Impl017IntegrationQualification >"%EVIDENCE_DIR%\impl017-integration.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl017-integration.txt"
          exit /b %RC%

      - name: Publish IMPL-017 summary
        if: always()
        shell: cmd
        run: |
          echo ## LEARNING-LAB-IMPL-017 Stable Runtime Port>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\learning-port-isolation.txt" type "%EVIDENCE_DIR%\learning-port-isolation.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\impl017-integration.txt" type "%EVIDENCE_DIR%\impl017-integration.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload IMPL-017 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-impl-017-evidence
          path: ${{ runner.temp }}\learning-impl-017-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
