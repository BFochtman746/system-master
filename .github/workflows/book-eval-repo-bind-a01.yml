name: Books Canonical V2 Repo Bind A-01

on:
  push:
    branches:
      - book-eval-lemonade-001-repo-bind-v2-final
    paths:
      - ".github/workflows/book-eval-repo-bind-a01.yml"

permissions:
  contents: write

concurrency:
  group: book-eval-repo-bind-a01
  cancel-in-progress: false

jobs:
  bind-and-qualify:
    name: Reconstruct, bind, and qualify canonical Books V2
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reconstruct repository-native canonical package and qualify
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ExpectedJar = 'fedd5bfcb122c4c0d5fd7a7912574705c582596978dd60796e804b26e7549248'
          $ExpectedCorpus = '30bd9d0b2c348b33e6b17a81d639e64c7e7e8eef63d7d6c0bfc3175e94fe2b53'
          $ExpectedOntology = '3daf139be2c35eb706ad0d0a1b6275a72c1ff18c21bf09d97eb26c3eadd7b5d6'
          $ExpectedExecution = '7d9348ecdad344d8aa73dc0fe984aef85559084610504f50f8d35ef6a001fb06'

          $Evidence = Join-Path $env:RUNNER_TEMP ("book-eval-repo-bind-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $Evidence | Out-Null
          "EVIDENCE_DIR=$Evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          $Log = Join-Path $Evidence 'BOOK-EVAL-REPO-BIND-A01.txt'
          $Root = Join-Path $env:GITHUB_WORKSPACE 'books\qualification\book-eval-lemonade-001'
          $ManifestPath = Join-Path $Root 'PACKAGE-V2-REBUILD-MANIFEST.json'

          function Write-Log([string]$Text) {
            $Text | Tee-Object -FilePath $Log -Append | Write-Host
          }
          function Hash-Bytes([byte[]]$Bytes) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($sha.ComputeHash($Bytes))).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
          }
          function Hash-Ascii([string]$Text) {
            return Hash-Bytes ([System.Text.Encoding]::ASCII.GetBytes($Text))
          }
          function Reconstruct-Object([string]$Key, [string]$OutputRelative, [string]$ExpectedHash) {
            $spec = $Manifest.objects.PSObject.Properties[$Key].Value
            if (-not $spec) { throw "Manifest object missing: $Key" }
            if ($spec.sha256 -ne $ExpectedHash) { throw "Manifest frozen hash mismatch for $Key" }
            $dir = Join-Path $Root $spec.directory
            if (-not (Test-Path $dir)) { throw "Transport directory missing for $Key" }
            $parts = @(Get-ChildItem -LiteralPath $dir -File -Filter 'part-*' | Sort-Object Name)
            if ($parts.Count -ne [int]$spec.part_count) { throw "Part count mismatch for $Key: $($parts.Count)" }
            $builder = New-Object System.Text.StringBuilder
            for ($i = 0; $i -lt $parts.Count; $i++) {
              $part = [System.IO.File]::ReadAllText($parts[$i].FullName, [System.Text.Encoding]::ASCII)
              $partHash = Hash-Ascii $part
              if ($partHash -ne [string]$spec.part_sha256[$i]) { throw "Part hash mismatch for $Key part $i" }
              [void]$builder.Append($part)
            }
            $bytes = [Convert]::FromBase64String($builder.ToString())
            if ($bytes.Length -ne [int]$spec.source_bytes) { throw "Byte count mismatch for $Key" }
            $actualHash = Hash-Bytes $bytes
            if ($actualHash -ne $ExpectedHash) { throw "Reconstructed hash mismatch for $Key: $actualHash" }
            $outPath = Join-Path $Root $OutputRelative
            $outDir = Split-Path -Parent $outPath
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            [System.IO.File]::WriteAllBytes($outPath, $bytes)
            Write-Log ("reconstructed_" + $Key + "_sha256=" + $actualHash)
            return $actualHash
          }

          Write-Log 'qualification=BOOK-EVAL-LEMONADE-001-REPO-BIND-A01'
          Write-Log ("repository=" + $env:GITHUB_REPOSITORY)
          Write-Log ("trigger_commit=" + $env:GITHUB_SHA)
          Write-Log ("runner=" + $env:RUNNER_NAME)
          Write-Log ("identity=" + [System.Security.Principal.WindowsIdentity]::GetCurrent().Name)
          Write-Log 'source=repository_native_v2_transport'

          if (-not (Test-Path $ManifestPath)) { throw 'PACKAGE-V2-REBUILD-MANIFEST.json is missing.' }
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
          if ($Manifest.scoring_private_included -ne $false) { throw 'Manifest does not preserve blind/gold boundary.' }
          if ([string]$Manifest.source_kind -ne 'retained_a01_artifact_recovery') { throw 'Unexpected canonical source kind.' }
          Write-Log 'manifest_authority=PASS'

          $actualJar = Reconstruct-Object 'jar' 'book-eval-lemonade.jar' $ExpectedJar
          $actualCorpus = Reconstruct-Object 'corpus' 'provider-visible\BOOK-EVAL-CORPUS-INPUT-v2.jsonl' $ExpectedCorpus
          $actualOntology = Reconstruct-Object 'ontology' 'provider-visible\BOOK-EVAL-PROVIDER-ONTOLOGY-v2.json' $ExpectedOntology
          $actualExecution = Reconstruct-Object 'execution_manifest' 'runner-private\RUNNER-PRIVATE-EXECUTION-MANIFEST-v2.json' $ExpectedExecution
          Write-Log 'frozen_hashes=PASS_4_OF_4'

          $forbiddenDirs = @(Get-ChildItem -LiteralPath $Root -Directory -Recurse | Where-Object { $_.Name -ieq 'scoring-private' })
          $forbiddenFiles = @(Get-ChildItem -LiteralPath $Root -File -Recurse | Where-Object {
            $_.Name -match '^(BOOK-EVAL-(GOLD-CORPUS|HIDDEN-SPLIT|ORACLE-REGISTRY)|BOOK_EVAL_SCORING_PRIVATE_v2\.zip)'
          })
          if (($forbiddenDirs.Count + $forbiddenFiles.Count) -ne 0) { throw 'Forbidden scoring-private/gold artifact detected.' }
          Write-Log 'blind_gold_boundary=PASS'

          $javaText = (& java -version 2>&1 | Out-String).Trim()
          Write-Log ("java=" + ($javaText -replace "`r?`n", ' | '))
          $contractOut = Join-Path $Evidence 'contract-tests.txt'
          & java -cp (Join-Path $Root 'book-eval-lemonade.jar') org.systemmaster.tools.booklab.BookEvalLemonade001ContractTests *> $contractOut
          if ($LASTEXITCODE -ne 0) {
            Get-Content $contractOut | ForEach-Object { Write-Log $_ }
            throw "Book evaluator contract tests failed with exit code $LASTEXITCODE"
          }
          Get-Content $contractOut | ForEach-Object { Write-Log $_ }
          Write-Log 'contract_tests=PASS'

          $receipt = [ordered]@{
            packet_id = 'BOOK-EVAL-LEMONADE-001-REPO-BIND-001-PACKAGE-V2-REBUILD'
            standing = 'PASS_REPOSITORY_BOUND_A01_PREFLIGHT'
            trigger_commit = $env:GITHUB_SHA
            runner = $env:RUNNER_NAME
            source = 'repository_native_v2_transport'
            jar_sha256 = $actualJar
            corpus_sha256 = $actualCorpus
            ontology_sha256 = $actualOntology
            execution_manifest_sha256 = $actualExecution
            canonical_inputs_verified = '4/4'
            blind_gold_boundary = 'PASS'
            contract_tests = 'PASS'
          }
          $receiptPath = Join-Path $Root 'BOOK-EVAL-REPO-BIND-A01-RECEIPT.json'
          $receipt | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $receiptPath

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'books/qualification/book-eval-lemonade-001/book-eval-lemonade.jar' 'books/qualification/book-eval-lemonade-001/provider-visible/BOOK-EVAL-CORPUS-INPUT-v2.jsonl' 'books/qualification/book-eval-lemonade-001/provider-visible/BOOK-EVAL-PROVIDER-ONTOLOGY-v2.json' 'books/qualification/book-eval-lemonade-001/runner-private/RUNNER-PRIVATE-EXECUTION-MANIFEST-v2.json' 'books/qualification/book-eval-lemonade-001/BOOK-EVAL-REPO-BIND-A01-RECEIPT.json'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No canonical package changes were staged.' }
          git commit -m 'books: materialize canonical v2 package after A-01 qualification'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to commit canonical Books package.' }
          $bindCommit = (git rev-parse HEAD).Trim()
          git push origin ("HEAD:" + $env:GITHUB_REF_NAME)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push canonical Books package.' }
          Write-Log ("repository_bind_commit=" + $bindCommit)
          Write-Log 'repository_bind_commit=PASS'
          Write-Log 'standing=PASS_REPOSITORY_BOUND_A01_PREFLIGHT'
          Copy-Item -LiteralPath $receiptPath -Destination (Join-Path $Evidence 'BOOK-EVAL-REPO-BIND-A01-RECEIPT.json') -Force

      - name: Upload A-01 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: book-eval-repo-bind-a01-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
