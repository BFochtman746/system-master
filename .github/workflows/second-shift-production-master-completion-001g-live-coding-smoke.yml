name: Second Shift Production Master 001G Live AI Coding Smoke

on:
  push:
    branches:
      - second-shift-production-master-completion-001
    paths:
      - .github/workflows/second-shift-production-master-completion-001g-live-coding-smoke.yml
      - .github/scripts/a01-second-shift-supervisor-v2-qualify.js
      - control-gateway/python/a01_second_shift_001g_ai_coding_smoke.py
      - control-gateway/python/a01_execution_worker.py
      - tests/test_a01_github_ingress.py
      - tests/test_a01_second_shift_001g_ai_coding_smoke.py
      - tests/fixtures/second_shift_001g_ai_coding_smoke_target.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: second-shift-production-master-001g-live-coding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority:
    name: Wait for exact 001G live-coding authority binding
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Wait for recovery-v4 to authorize exact subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          expected = os.environ['EXPECTED_SHA'].lower()
          token = os.environ['GH_TOKEN']
          ref = 'control-gateway-state/active-work/second-shift-production-master-completion-001-recovery-v4'
          query = urllib.parse.urlencode({'ref': ref})
          url = 'https://api.github.com/repos/BFochtman746/system-master/contents/control-gateway-state/active-work/head.json?' + query
          for _ in range(180):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Author' + 'ization': 'Bear' + 'er ' + token,
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              head = json.loads(base64.b64decode(value['content']).decode('utf-8'))
              packet = head.get('packet', {})
              current = packet.get('current_operation', {})
              subject = str(packet.get('authoritative_subject', {}).get('oid', '')).lower()
              if (
                  subject == expected
                  and current.get('operation_id') == 'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001G'
                  and current.get('state') == 'ACTIVE'
                  and packet.get('qualification_state') == 'PASSED'
                  and packet.get('github_admission_state') == 'ADMITTED'
              ):
                  print(f"SECOND_SHIFT_001G_LIVE_CODING_AUTHORITY=PASS subject={subject} epoch={packet.get('authority_epoch')}")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('SECOND_SHIFT_001G_LIVE_CODING_AUTHORITY=FAIL exact subject was not rebound within bounded wait')
          PY

  hosted_preflight:
    name: Hosted live-coding smoke contract
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify smoke contract before A-01 execution
        run: |
          python -m py_compile control-gateway/python/a01_second_shift_001g_ai_coding_smoke.py
          python tests/test_a01_second_shift_001g_ai_coding_smoke.py
          node --check .github/scripts/a01-second-shift-supervisor-v2-qualify.js
          test "$(cat tests/fixtures/second_shift_001g_ai_coding_smoke_target.txt)" = "SECOND_SHIFT_001G_AI_CODING_SMOKE=BEFORE"
          echo SECOND_SHIFT_001G_LIVE_CODING_HOSTED_PREFLIGHT=PASS

  a01_live_coding:
    name: A-01 real bounded AI coding smoke
    needs: hosted_preflight
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@24e1089d3f904a5285810267d6241dc27719b54d
    with:
      qualification_id: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
      workstream_id: SECOND-SHIFT-CONTROL-GATEWAY
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref_name }}
      resume_on_pass: Return exact-subject 001G live AI coding smoke evidence only; do not admit live READY work.
      resume_on_failure: Preserve exact AI coding smoke evidence and repair only the demonstrated 001G coding boundary.
      notification_target: originating-workstream
      execution_context: normal
      qualifier_timeout_minutes: 40
      job_timeout_minutes: 45
      repair_attempt: 0
      max_repair_attempts: 1
      repair_transaction_id: ''
    secrets: inherit

  freeze:
    name: Freeze non-promoting 001G live-coding standing
    if: always()
    needs: [hosted_preflight, a01_live_coding]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTED_RESULT: ${{ needs.hosted_preflight.result }}
      A01_JOB_RESULT: ${{ needs.a01_live_coding.result }}
      A01_RESULT: ${{ needs.a01_live_coding.outputs.result_class }}
      A01_PROMOTION: ${{ needs.a01_live_coding.outputs.promotion_authorized }}
      A01_CONTROL_SHA: ${{ needs.a01_live_coding.outputs.control_plane_sha }}
      PINNED_CONTROL_SHA: 24e1089d3f904a5285810267d6241dc27719b54d
    steps:
      - name: Enforce exact non-promoting A-01 PASS
        run: |
          test "$HOSTED_RESULT" = "success"
          test "$A01_JOB_RESULT" = "success"
          test "$A01_RESULT" = "PASS"
          test "$A01_PROMOTION" != "true"
          test "$A01_CONTROL_SHA" = "$PINNED_CONTROL_SHA"
      - name: Write 001G live-coding standing
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          evidence={
            'protocol_version':'second-shift.production-master.001g-live-ai-coding-standing.v1',
            'phase':'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001G',
            'subject_sha':os.environ['SUBJECT_SHA'].lower(),
            'control_plane_sha':os.environ['PINNED_CONTROL_SHA'],
            'standing':'PASS',
            'model':'gpt-oss-20b-NPU',
            'executor_kind':'AI_CODING',
            'live_ai_coding_smoke_passed':True,
            'independent_evaluator_required':True,
            'live_ready_queue_touched':False,
            'repository_commit_authority_granted':False,
            'production_owner_work_admitted':False,
            'promotion_authorized':False,
            'qualification_id':'SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS',
            'evidence_source':'authoritative A-01 evidence/second-shift-001g-ai-coding-smoke-summary.json',
          }
          p=pathlib.Path('001g-live-coding-evidence')
          p.mkdir(parents=True,exist_ok=True)
          (p/'second-shift-production-master-001g-live-ai-coding-standing.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('SECOND_SHIFT_001G_LIVE_AI_CODING_STANDING=PASS')
          PY
      - name: Upload immutable 001G live-coding standing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-shift-production-master-001g-live-coding-${{ github.run_id }}
          path: 001g-live-coding-evidence
          if-no-files-found: error
          retention-days: 30
