name: Second Shift Production Master 001E Shadow Calibration

on:
  push:
    branches:
      - second-shift-production-master-completion-001
    paths:
      - .github/workflows/second-shift-production-master-completion-001e-shadow-calibration.yml
      - .github/scripts/a01-second-shift-production-master-001e-shadow-calibration.js
      - control-gateway/python/a01_second_shift_001e_shadow_calibration.py
      - tests/test_a01_second_shift_001e_shadow_calibration.py

permissions:
  contents: read
  actions: read

concurrency:
  group: second-shift-production-master-001e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authority:
    name: Wait for exact 001E authority binding
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          path: candidate
      - name: Wait for recovery-v4 to authorize exact subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          expected = os.environ['EXPECTED_SHA'].lower()
          token = os.environ['GH_TOKEN']
          ref = 'control-gateway-state/active-work/second-shift-production-master-completion-001-recovery-v4'
          query = urllib.parse.urlencode({'ref': ref})
          url = 'https://api.github.com/repos/BFochtman746/system-master/contents/control-gateway-state/active-work/head.json?' + query
          for _ in range(60):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Author' + 'ization': 'Bear' + 'er ' + token,
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  value = json.load(response)
              head = json.loads(base64.b64decode(value['content']).decode('utf-8'))
              packet = head.get('packet', {})
              current = packet.get('current_operation', {})
              subject = str(packet.get('authoritative_subject', {}).get('oid', '')).lower()
              if (
                  subject == expected
                  and current.get('operation_id') == 'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001E'
                  and current.get('state') == 'ACTIVE'
                  and packet.get('qualification_state') == 'PASSED'
                  and packet.get('github_admission_state') == 'ADMITTED'
              ):
                  print(f"SECOND_SHIFT_001E_AUTHORITY=PASS subject={subject} epoch={packet.get('authority_epoch')}")
                  raise SystemExit(0)
              time.sleep(5)
          raise SystemExit('SECOND_SHIFT_001E_AUTHORITY=FAIL exact subject was not rebound within bounded wait')
          PY

  hosted_preflight:
    name: Hosted dedicated shadow contract
    needs: authority
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify dedicated qualifier contract
        run: |
          python -m py_compile control-gateway/python/a01_second_shift_001e_shadow_calibration.py
          node --check .github/scripts/a01-second-shift-production-master-001e-shadow-calibration.js
          python tests/test_a01_second_shift_001e_shadow_calibration.py
          echo SECOND_SHIFT_001E_HOSTED_PREFLIGHT=PASS

  shadow:
    name: A-01 dedicated non-mutating 001E shadow calibration
    needs: hosted_preflight
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@df7c0a328b8708458518a15cdf7615e889475df9
    with:
      qualification_id: SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001E-SHADOW-CALIBRATION
      workstream_id: SYSTEM-MASTER
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref_name }}
      resume_on_pass: Return exact-subject 001E shadow calibration evidence only; do not begin canary.
      resume_on_failure: Preserve exact shadow evidence and repair only the demonstrated 001E boundary.
      notification_target: originating-workstream
      execution_context: normal
      qualifier_timeout_minutes: 25
      job_timeout_minutes: 30
      repair_attempt: 0
      max_repair_attempts: 1
      repair_transaction_id: ''
    secrets: inherit

  freeze:
    name: Freeze non-promoting 001E shadow standing
    if: always()
    needs: [hosted_preflight, shadow]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTED_RESULT: ${{ needs.hosted_preflight.result }}
      SHADOW_JOB_RESULT: ${{ needs.shadow.result }}
      SHADOW_RESULT: ${{ needs.shadow.outputs.result_class }}
      SHADOW_PROMOTION: ${{ needs.shadow.outputs.promotion_authorized }}
      SHADOW_CONTROL_SHA: ${{ needs.shadow.outputs.control_plane_sha }}
      PINNED_CONTROL_SHA: df7c0a328b8708458518a15cdf7615e889475df9
    steps:
      - name: Enforce durable shadow PASS only
        run: |
          test "$HOSTED_RESULT" = "success"
          test "$SHADOW_JOB_RESULT" = "success"
          test "$SHADOW_RESULT" = "PASS"
          test "$SHADOW_PROMOTION" != "true"
          test "$SHADOW_CONTROL_SHA" = "$PINNED_CONTROL_SHA"
      - name: Write 001E standing
        env:
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          evidence={
            'protocol_version':'second-shift.production-master.001e-shadow-standing.v2',
            'phase':'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001E',
            'subject_sha':os.environ['SUBJECT_SHA'].lower(),
            'control_plane_sha':os.environ['PINNED_CONTROL_SHA'],
            'standing':'PASS',
            'shadow_mode':True,
            'production_side_effects_authorized':False,
            'canary_authorized':False,
            'qualification_id':'SECOND-SHIFT-PRODUCTION-MASTER-COMPLETION-001E-SHADOW-CALIBRATION',
            'calibration_source':'authoritative A-01 evidence/second-shift-001e-shadow-calibration-summary.json',
          }
          p=pathlib.Path('.001e-shadow-evidence')
          p.mkdir(parents=True,exist_ok=True)
          (p/'second-shift-production-master-001e-shadow-standing.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('SECOND_SHIFT_001E_SHADOW_STANDING=PASS')
          PY
      - name: Upload immutable 001E standing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-shift-production-master-001e-${{ github.run_id }}-standing
          path: .001e-shadow-evidence
          if-no-files-found: error
          retention-days: 30
