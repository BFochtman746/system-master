name: Core SMR020 Runner Root Custody Probe

on:
  push:
    paths:
      - ".github/workflows/core-smr020-runner-root-custody-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Search bounded runner root custody
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Read-only runner-root candidate hash probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\actions-runner'
          $evidenceDir = Join-Path $env:RUNNER_TEMP ("smr020-root-custody-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
          $report = Join-Path $evidenceDir 'SMR020-RUNNER-ROOT-CUSTODY.txt'
          $targetDiff = '3721b21b26a2b71f762f09f2eab0ba4d1d8809909aa2d129d5960619a7672b34'
          $excludedTop = @('_work','_diag','bin','externals')
          $excludedNames = @('.credentials','.credentials_rsaparams','.runner','.service','.env')
          "probe=CORE-SMR020-RUNNER-ROOT-CUSTODY-PROBE-001" | Set-Content $report
          "scope=C:\actions-runner_NON_WORK_NON_DIAG_NON_BINARY_ONLY" | Add-Content $report
          "personal_home_scanned=false" | Add-Content $report
          "credential_files_read=false" | Add-Content $report
          "source_contents_uploaded=false" | Add-Content $report
          $candidates = @()
          foreach ($item in Get-ChildItem -LiteralPath $root -Force -ErrorAction SilentlyContinue) {
            if ($item.PSIsContainer) {
              if ($excludedTop -contains $item.Name) { continue }
              $candidates += Get-ChildItem -LiteralPath $item.FullName -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { ($_.Extension.ToLowerInvariant() -in @('.patch','.diff','.zip')) -and ($excludedNames -notcontains $_.Name) }
            } else {
              if (($item.Extension.ToLowerInvariant() -in @('.patch','.diff','.zip')) -and ($excludedNames -notcontains $item.Name)) { $candidates += $item }
            }
          }
          "candidate_files=$($candidates.Count)" | Add-Content $report
          $exact = 0
          foreach ($f in $candidates | Sort-Object FullName -Unique) {
            try {
              $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($h -eq $targetDiff) { $exact++; "EXACT_TARGET_DIFF path=$($f.FullName) size=$($f.Length) sha256=$h" | Add-Content $report }
              elseif ($f.Name -match '(?i)(SMR020|OPERATOR.?OPS|PLATFORM.?005|CHAT.?001A|REBUILD.?020)') { "named_candidate path=$($f.FullName) size=$($f.Length) sha256=$h" | Add-Content $report }
            } catch { }
          }
          "exact_target_diff_matches=$exact" | Add-Content $report
          "probe_complete=true" | Add-Content $report
          Get-Content $report
          "EVIDENCE_DIR=$evidenceDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload path/hash evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-smr020-runner-root-custody-probe
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
