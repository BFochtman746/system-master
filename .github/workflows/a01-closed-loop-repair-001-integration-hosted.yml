name: A01 Closed-Loop Repair 001 Integration Hosted Proof

on:
  push:
    branches:
      - core/a01-closed-loop-repair-001-integration-hosted

permissions:
  contents: read

jobs:
  prove-integration-subject:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact integration subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5ac0954bc684429f55a2ccf2edac2306024f87e7
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact integration identity and frozen baseline delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5ac0954bc684429f55a2ccf2edac2306024f87e7"
          git diff --exit-code 2391924666e4ef23dcac64490a8e160cb762f2d2 -- \
            .github/workflows/a01-control-plane-gateway.yml \
            .github/scripts/a01-control-plane.js \
            qualification/a01/a01-policy.json \
            qualification/a01/registry.json
          echo A01_INTEGRATION_FROZEN_BASELINE_DIFF=PASS

      - name: Validate canonical control plane from integration subject
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/a01-control-plane.js validate

      - name: Run closed-loop repair adversarial selftest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a01-repair-integration"
          A01_EVIDENCE_DIR="$RUNNER_TEMP/a01-repair-integration" node .github/scripts/a01-closed-loop-repair-selftest.js | tee "$RUNNER_TEMP/a01-repair-integration/stdout.txt"

      - name: Run existing A-01 control-plane regression selftest
        shell: bash
        run: |
          set -euo pipefail
          A01_EVIDENCE_DIR="$RUNNER_TEMP/a01-repair-integration" node .github/scripts/a01-control-plane-selftest.js | tee "$RUNNER_TEMP/a01-repair-integration/control-plane-regression.txt"

      - name: Record exact proof summary
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/a01-repair-integration"
          {
            echo "subject_sha=5ac0954bc684429f55a2ccf2edac2306024f87e7"
            echo "integration_base=2391924666e4ef23dcac64490a8e160cb762f2d2"
            echo "gateway_modified=false"
            echo "control_plane_executor_modified=false"
            echo "policy_modified=false"
            echo "registry_modified=false"
          } > "$RUNNER_TEMP/a01-repair-integration/summary.txt"

      - name: Upload hosted proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-closed-loop-repair-integration-hosted-${{ github.run_id }}
          path: ${{ runner.temp }}/a01-repair-integration
          if-no-files-found: error
          retention-days: 30
