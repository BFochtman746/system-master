name: Literary Prose Semantic Evidence Validator

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/**'
      - 'qualification/literary-prose-engine-001/unification-001/STEP-005-DIMENSION-AUTHORITY-MAP-v1.json'
      - 'qualification/literary-prose-engine-001/step-e/**'
      - 'qualification/literary-prose-engine-001/step-f/**'
      - '.github/workflows/literary-prose-semantic-evidence-validator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile semantic evidence path
        run: >-
          python -m py_compile
          qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/semantic_evidence_validator.py
          qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/test_semantic_evidence_validator.py
          qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/semantic_to_diagnostic_adapter.py
          qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/test_semantic_to_diagnostic_adapter.py
          qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/run_real_semantic_routing_fixtures.py
      - name: Run semantic authority assertions
        run: python qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/test_semantic_evidence_validator.py
      - name: Run semantic-to-diagnostic bridge assertions
        run: python qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/test_semantic_to_diagnostic_adapter.py
      - name: Run nine-case real-derived semantic routing qualification
        run: python qualification/literary-prose-engine-001/diagnostic-evidence-provider-002/run_real_semantic_routing_fixtures.py
