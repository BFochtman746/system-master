name: Controller v2 Foundation

on:
  push:
    branches:
      - 'controller-v2/**'
    paths:
      - 'controller-v2/**'
      - '.github/workflows/controller-v2-foundation.yml'
  pull_request:
    paths:
      - 'controller-v2/**'
      - '.github/workflows/controller-v2-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-v2-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    name: Kernel / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Show runtime
        run: node --version

      - name: Run Controller v2 cumulative tests
        working-directory: controller-v2
        run: node --test
