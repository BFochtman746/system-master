name: Learning Dependency Adjudication Batch 01 Prequalification

on:
  push:
    branches:
      - learning/dependency-adjudication-batch-01-20260910
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-CONTRACT-044.json"
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-01-CANDIDATE-044A.json"
      - ".github/scripts/learning-dependency-adjudication-batch-qualify.js"
      - ".github/workflows/learning-dependency-adjudication-batch-01-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Dependency evidence adjudication batch 01
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVIDENCE_DIR: learning-dependency-adjudication-batch-01-evidence
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check dependency validator
        run: node --check .github/scripts/learning-dependency-adjudication-batch-qualify.js
      - name: Validate deterministic dependency dispositions
        run: node .github/scripts/learning-dependency-adjudication-batch-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-DEPENDENCY-ADJUDICATION-BATCH-01-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-dependency-adjudication-batch-01-evidence
          if-no-files-found: warn
          retention-days: 30

# Owner contract: learning/control-v1@00117121ec08e27c00e0fad61aa5c455d1b06ab8.
# Machine-evidence adjudication only. No learner, SME, A-01, native, certification, or production authority is inferred.
