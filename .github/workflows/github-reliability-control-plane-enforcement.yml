name: GitHub Reliability Control Plane Enforcement

on:
  workflow_dispatch:
  push:
    branches:
      - 'infrastructure/github-reliability-control-plane-001-20260910'
    paths:
      - 'governance/github/**'
      - 'governance/architecture/SYSTEM-MASTER-GITHUB-RELIABILITY-CONTROL-PLANE-001.md'
      - 'governance/morning/MASTER-ROOT-CHAT-OPERATING-CONTRACT-001.md'
      - 'governance/CHAT-LANE-OPERATING-PROMPT-002.md'
      - 'governance/second-shift/SECOND-SHIFT-CONTINUOUS-DISPATCH-001.md'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-001.json'
      - '.github/scripts/github-reliability-control-plane-selftest.js'
      - '.github/scripts/github-write-authorization-enforce.js'
      - '.github/scripts/github-control-state.js'
      - '.github/scripts/second-shift-dispatch-controller.js'
      - '.github/workflows/github-reliability-control-plane-enforcement.yml'

permissions:
  contents: read

concurrency:
  group: github-reliability-control-plane-enforcement-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  selftest:
    name: Prove write authorization, fencing, durable state and dispatch invariants
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Initialize runner evidence
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $identity = [ordered]@{
            github_sha = $env:GITHUB_SHA
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            shell_identity = (& whoami).Trim()
            workspace = $env:GITHUB_WORKSPACE
            workspace_owner = (Get-Acl -LiteralPath $env:GITHUB_WORKSPACE).Owner
            git_version = (& git --version).Trim()
            node_version = (& node --version).Trim()
            recorded_at = [DateTime]::UtcNow.ToString('o')
          }
          $identity | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'runner-identity.json') -Encoding utf8

      - name: Verify exact checkout before execution
        shell: powershell
        run: |
          $actual = (& git -c "safe.directory=$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "SUBJECT_CHECKOUT_MISMATCH:$actual" }

      - name: Syntax check
        shell: cmd
        run: |
          node --check .github\scripts\github-reliability-control-plane-selftest.js
          node --check .github\scripts\github-write-authorization-enforce.js
          node --check .github\scripts\github-control-state.js
          node --check .github\scripts\second-shift-dispatch-controller.js

      - name: Run foundational control-plane self-test
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          & node "$env:GITHUB_WORKSPACE\.github\scripts\github-reliability-control-plane-selftest.js" | Tee-Object -FilePath (Join-Path $evidence 'selftest.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run write-authorization self-test
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          & node "$env:GITHUB_WORKSPACE\.github\scripts\github-write-authorization-enforce.js" selftest | Tee-Object -FilePath (Join-Path $evidence 'write-authorization-selftest.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run durable control-state self-test
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          & node "$env:GITHUB_WORKSPACE\.github\scripts\github-control-state.js" selftest | Tee-Object -FilePath (Join-Path $evidence 'control-state-selftest.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Second Shift dispatcher self-test and current plan
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          & node "$env:GITHUB_WORKSPACE\.github\scripts\second-shift-dispatch-controller.js" selftest | Tee-Object -FilePath (Join-Path $evidence 'second-shift-dispatch-selftest.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SECOND_SHIFT_PLAN_PATH = Join-Path $evidence 'second-shift-current-plan.json'
          & node "$env:GITHUB_WORKSPACE\.github\scripts\second-shift-dispatch-controller.js" plan | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record exact subject
        shell: powershell
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE '.github-control-plane-evidence'
          $actual = (& git -c "safe.directory=$env:GITHUB_WORKSPACE" rev-parse HEAD).Trim()
          Set-Content -LiteralPath (Join-Path $evidence 'subject-sha.txt') -Value $env:GITHUB_SHA -Encoding ascii
          Set-Content -LiteralPath (Join-Path $evidence 'checkout-sha.txt') -Value $actual -Encoding ascii
          if ($actual -ne $env:GITHUB_SHA) { throw "SUBJECT_CHECKOUT_MISMATCH_POST:$actual" }

      - name: Publish summary
        if: always()
        shell: powershell
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## GitHub Reliability Control Plane'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Subject: $env:GITHUB_SHA"
          foreach ($name in @('selftest.json','write-authorization-selftest.json','control-state-selftest.json','second-shift-dispatch-selftest.json','second-shift-current-plan.json')) {
            $result = Join-Path $env:GITHUB_WORKSPACE ".github-control-plane-evidence\$name"
            if (Test-Path $result) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### $name"
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
              Get-Content -LiteralPath $result | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
            }
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-reliability-control-plane-${{ github.run_id }}
          path: .github-control-plane-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
