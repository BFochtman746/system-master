name: GitHub Reliability Control Plane Enforcement

on:
  workflow_dispatch:
  push:
    paths:
      - 'governance/github/**'
      - 'governance/architecture/SYSTEM-MASTER-GITHUB-RELIABILITY-CONTROL-PLANE-001.md'
      - 'governance/second-shift/SECOND-SHIFT-CONTINUOUS-DISPATCH-001.md'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-001.json'
      - '.github/scripts/github-reliability-control-plane-selftest.js'
      - '.github/workflows/github-reliability-control-plane-enforcement.yml'
  pull_request:
    paths:
      - 'governance/github/**'
      - 'governance/architecture/SYSTEM-MASTER-GITHUB-RELIABILITY-CONTROL-PLANE-001.md'
      - 'governance/second-shift/SECOND-SHIFT-CONTINUOUS-DISPATCH-001.md'
      - 'governance/second-shift/SECOND-SHIFT-REGISTRY-001.json'
      - '.github/scripts/github-reliability-control-plane-selftest.js'
      - '.github/workflows/github-reliability-control-plane-enforcement.yml'

permissions:
  contents: read

concurrency:
  group: github-reliability-control-plane-enforcement-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  selftest:
    name: Prove write authorization, fencing, CAS and dispatch invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Syntax check
        run: node --check .github/scripts/github-reliability-control-plane-selftest.js

      - name: Run control-plane self-test
        run: |
          mkdir -p .github-control-plane-evidence
          node .github/scripts/github-reliability-control-plane-selftest.js | tee .github-control-plane-evidence/selftest.json

      - name: Record exact subject
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > .github-control-plane-evidence/subject-sha.txt
          git rev-parse HEAD > .github-control-plane-evidence/checkout-sha.txt
          test "$(cat .github-control-plane-evidence/checkout-sha.txt)" = "${GITHUB_SHA}"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          echo '## GitHub Reliability Control Plane' >> "$GITHUB_STEP_SUMMARY"
          echo "Subject: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .github-control-plane-evidence/selftest.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .github-control-plane-evidence/selftest.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-reliability-control-plane-${{ github.run_id }}
          path: .github-control-plane-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
