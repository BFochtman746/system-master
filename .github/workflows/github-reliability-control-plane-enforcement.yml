name: GitHub Reliability Control Plane Enforcement

on:
  workflow_dispatch:
  push:
    branches:
      - 'infrastructure/github-reliability-control-plane-001-20260910'
      - 'work/system-master/github-reliability-001-chat-*'
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-004.json'
      - 'governance/github/**'
      - 'governance/architecture/SYSTEM-MASTER-GITHUB-RELIABILITY-CONTROL-PLANE-001.md'
      - 'governance/morning/MASTER-ROOT-CHAT-OPERATING-CONTRACT-001.md'
      - 'governance/CHAT-LANE-OPERATING-PROMPT-002.md'
      - 'governance/second-shift/**'
      - '.github/scripts/github-reliability-control-plane-selftest.js'
      - '.github/scripts/github-write-authorization-enforce.js'
      - '.github/scripts/github-control-state.js'
      - '.github/scripts/github-native-git-transport.js'
      - '.github/scripts/second-shift-dispatch-controller.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/scripts/second-shift-enforce.js'
      - '.github/scripts/a01-control-plane-enforce.js'
      - '.github/workflows/github-reliability-control-plane-enforcement.yml'

permissions:
  contents: read

concurrency:
  group: github-reliability-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Prove authority, fencing, native Git and Second Shift invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Initialize evidence and verify checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github-control-plane-evidence
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > .github-control-plane-evidence/subject-sha.txt
          printf '%s\n' "$actual" > .github-control-plane-evidence/checkout-sha.txt
          {
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            git --version
            node --version
          } > .github-control-plane-evidence/runner-identity.txt

      - name: Syntax check portable controller
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/github-reliability-control-plane-selftest.js
          node --check .github/scripts/github-write-authorization-enforce.js
          node --check .github/scripts/github-control-state.js
          node --check .github/scripts/github-native-git-transport.js
          node --check .github/scripts/second-shift-dispatch-controller.js
          node --check .github/scripts/current-obligation-registry-enforce.js
          node --check .github/scripts/second-shift-enforce.js
          node --check .github/scripts/a01-control-plane-enforce.js

      - name: Run reliability control-plane self-tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/github-reliability-control-plane-selftest.js | tee .github-control-plane-evidence/selftest.json
          node .github/scripts/github-write-authorization-enforce.js selftest | tee .github-control-plane-evidence/write-authorization-selftest.json
          node .github/scripts/github-control-state.js selftest | tee .github-control-plane-evidence/control-state-selftest.json
          node .github/scripts/github-native-git-transport.js selftest | tee .github-control-plane-evidence/native-git-selftest.json

      - name: Validate live-independent governance invariants
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/current-obligation-registry-enforce.js | tee .github-control-plane-evidence/current-obligation-enforcement.txt
          node .github/scripts/second-shift-enforce.js --no-live --out=.github-control-plane-evidence/second-shift-static-enforcement.json
          node .github/scripts/a01-control-plane-enforce.js selftest | tee .github-control-plane-evidence/a01-enforcement-selftest.txt
          node .github/scripts/a01-control-plane-enforce.js scan | tee .github-control-plane-evidence/a01-enforcement-scan.txt

      - name: Prove Second Shift continuous-dispatch semantics
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/second-shift-dispatch-controller.js selftest | tee .github-control-plane-evidence/second-shift-dispatch-selftest.json
          SECOND_SHIFT_PLAN_PATH="$GITHUB_WORKSPACE/.github-control-plane-evidence/second-shift-current-plan.json" node .github/scripts/second-shift-dispatch-controller.js plan >/dev/null

      - name: Reverify exact subject
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf '%s\n' "$actual" > .github-control-plane-evidence/checkout-sha-post.txt
          test "$actual" = "$GITHUB_SHA"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GitHub Reliability Control Plane'
            echo "Subject: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo 'Portable controller validation is intentionally separated from A-01 native execution.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-reliability-control-plane-${{ github.run_id }}
          path: .github-control-plane-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
