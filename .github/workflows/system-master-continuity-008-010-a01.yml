name: System Master Continuity Replacement Signals Compatibility A-01

on:
  push:
    branches:
      - system-master/g-wp-008-010-continuity-slice

permissions:
  contents: read

jobs:
  qualify-continuity-008-010:
    name: Qualify Continuity Replacement + Signals + Compatibility on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact Continuity milestone subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
      - name: Execute repository-owned Continuity milestone qualifier
        shell: cmd
        run: node .github\scripts\g-continuity-008-010-qualify.js
      - name: Publish Continuity milestone summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-continuity-008-010-%GITHUB_RUN_ID%"
          echo ## SYSTEM MASTER — CONTINUITY ^& RECOVERY — REPLACEMENT + SIGNALS + COMPATIBILITY>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\subject.txt" type "%EVIDENCE_DIR%\subject.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\result.txt" type "%EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\qualification.txt" type "%EVIDENCE_DIR%\qualification.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\failure.txt" type "%EVIDENCE_DIR%\failure.txt">>"%GITHUB_STEP_SUMMARY%"
      - name: Upload Continuity milestone evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-master-continuity-008-010-a01-evidence
          path: ${{ runner.temp }}\system-master-continuity-008-010-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
