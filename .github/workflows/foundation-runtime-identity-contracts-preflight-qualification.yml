name: Foundation Runtime Identity Contracts Preflight Qualification

on:
  pull_request:
    branches:
      - system-master/control-v2
      - second-shift/core-durable-runtime-continuity-recovery-001-20260912
    paths:
      - 'system-master/foundation-spine/runtime-continuity/**'
      - 'system-master/foundation-spine/identity/**'
      - 'system-master/foundation-spine/contracts/**'
      - '.github/scripts/foundation-runtime-identity-contracts-preflight-qualify.js'
      - '.github/scripts/foundation-identity-delegation-qualify.js'
      - '.github/scripts/foundation-contracts-versioning-qualify.js'
      - '.github/workflows/foundation-runtime-identity-contracts-preflight-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-runtime-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify 26-case preflight and cumulative Root Identity Contracts baseline
        run: node .github/scripts/foundation-runtime-identity-contracts-preflight-qualify.js

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-runtime-preflight-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-runtime-preflight-*/
          if-no-files-found: error
          retention-days: 30
