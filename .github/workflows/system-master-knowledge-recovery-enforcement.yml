name: System Master Knowledge Recovery Enforcement

on:
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-007.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-002.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-013.json'
      - 'governance/knowledge-recovery/**'
      - 'governance/catalog/ingest/**'
      - 'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-003.json'
      - 'governance/catalog/schemas/SYSTEM-MASTER-*'
      - 'governance/catalog/system-packets/PROGRAMMING.json'
      - '.github/scripts/system-master-knowledge-recovery-current-enforce.js'
      - 'qualification/a01/registry.json'
      - '.github/workflows/system-master-knowledge-recovery-enforcement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-authority-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse current authority and preserved lineage inputs
        shell: bash
        run: |
          node -e "for (const p of ['governance/CURRENT-AUTHORITY.json','governance/SYSTEM-TOPOLOGY-007.json','governance/SYSTEM-COMPLETION-STATUS-002.json','governance/WORK-OBLIGATION-REGISTRY-013.json','governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-003.json','governance/catalog/ingest/programming/PROGRAMMING-INGEST-MANIFEST-003.json','governance/knowledge-recovery/SYSTEM-MASTER-KNOWLEDGE-RECOVERY-001-SUPERVISED-ACCEPTANCE.json','qualification/a01/registry.json']) JSON.parse(require('fs').readFileSync(p,'utf8'));"
          node --check .github/scripts/system-master-knowledge-recovery-current-enforce.js

      - name: Preserve supervised registration lineage
        shell: bash
        run: |
          node - <<'NODE'
          const r=require('./qualification/a01/registry.json');
          const q=r.qualifications['SYSTEM-MASTER-KNOWLEDGE-RECOVERY-PROGRAMMING-001'];
          if (r.registry_version < 30) throw new Error('REGISTRY_V30_REQUIRED');
          if (!q) throw new Error('KNOWLEDGE_RECOVERY_REGISTRATION_MISSING');
          if (q.workstream_id !== 'SYSTEM-MASTER' || q.gate_class !== 'focused' || q.source !== 'subject') throw new Error('KNOWLEDGE_RECOVERY_REGISTRATION_BOUNDARY');
          if (q.overnight_eligible !== false) throw new Error('HISTORICAL_REGISTRATION_MUST_REMAIN_NON_OVERNIGHT');
          console.log('KNOWLEDGE_RECOVERY_HISTORICAL_REGISTRATION=PASS');
          NODE

      - name: Enforce current authority pass one
        env:
          A01_EVIDENCE_DIR: ${{ runner.temp }}/kr-current-1
        run: node .github/scripts/system-master-knowledge-recovery-current-enforce.js

      - name: Enforce current authority pass two
        env:
          A01_EVIDENCE_DIR: ${{ runner.temp }}/kr-current-2
        run: node .github/scripts/system-master-knowledge-recovery-current-enforce.js

      - name: Compare deterministic current-authority reports
        shell: bash
        run: |
          cmp '${{ runner.temp }}/kr-current-1/knowledge-recovery-current-authority.json' '${{ runner.temp }}/kr-current-2/knowledge-recovery-current-authority.json'
          echo 'KNOWLEDGE_RECOVERY_CURRENT_AUTHORITY_DETERMINISM=PASS'

      - name: Upload current-authority enforcement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knowledge-recovery-current-authority-${{ github.run_id }}
          path: ${{ runner.temp }}/kr-current-1
          if-no-files-found: error
          retention-days: 30
