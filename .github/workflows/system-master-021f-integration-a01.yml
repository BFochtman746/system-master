name: System Master 021F Canonical Integration Qualification

on:
  push:
    branches:
      - system-master/021f-integration-a01

permissions:
  contents: read

jobs:
  qualify-021f-integration:
    name: Qualify complete 021F integration on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact 021F integration subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
      - name: Execute repository-owned 021F integration qualifier
        shell: cmd
        run: node .github\scripts\021f-integration-qualify.js
      - name: Publish integration summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-021f-integration-%GITHUB_RUN_ID%"
          echo ## SYSTEM-MASTER 021F CANONICAL INTEGRATION>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\subject.txt" type "%EVIDENCE_DIR%\subject.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\result.txt" type "%EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\failure.txt" type "%EVIDENCE_DIR%\failure.txt">>"%GITHUB_STEP_SUMMARY%"
      - name: Upload 021F integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-master-021f-integration-evidence
          path: ${{ runner.temp }}\system-master-021f-integration-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
