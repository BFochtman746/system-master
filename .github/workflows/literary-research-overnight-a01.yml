name: Literary Research Overnight A-01

on:
  schedule:
    - cron: '0 1 9 9 *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: LITERARY-RESEARCH-OVERNIGHT-DEEP-HARVEST
      workstream_id: LITERARY-PROSE
      subject_sha: 55fa713be0e9b704399bd75920d0186b406f8117
      origin_ref: refs/heads/literary-prose-engine-001
      resume_on_pass: Adjudicate the control-plane receipt and ingest the harvested batch through STEP-D source-registry and rights/task-fit gates; continue dependency-valid Literary Prose work.
      resume_on_failure: Classify SUBJECT_FAILURE vs INFRA_FAILURE vs CONTROL_PLANE_FAILURE, repair only the failing boundary when sufficient, and preserve established STEP-D through STEP-G standing.
      notification_target: literary-prose-engine-001
