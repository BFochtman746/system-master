name: Literary Prose Diagnostic Evidence Provider

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/diagnostic-evidence-provider-001/**'
      - 'qualification/literary-prose-engine-001/step-f/step_007_finding_calibration.py'
      - '.github/workflows/literary-prose-diagnostic-evidence-provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provider
        run: python -m py_compile qualification/literary-prose-engine-001/diagnostic-evidence-provider-001/text_observation_provider.py qualification/literary-prose-engine-001/diagnostic-evidence-provider-001/test_text_observation_provider.py
      - name: Run fail-closed provider assertions
        run: python qualification/literary-prose-engine-001/diagnostic-evidence-provider-001/test_text_observation_provider.py
