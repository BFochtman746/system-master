name: Second Shift Control Gateway Execution Worker Qualification

on:
  push:
    branches:
      - control-gateway/execution-worker-001
    paths:
      - 'control-gateway/**'
      - 'tools/second_shift_supervisor_v2.py'
      - 'tests/**'
      - '.github/workflows/second-shift-control-gateway-execution-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'control-gateway/**'
      - 'tools/second_shift_supervisor_v2.py'
      - 'tests/**'
      - '.github/workflows/second-shift-control-gateway-execution-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Authorized claim execution plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile worker and inherited control plane
        run: |
          python -m py_compile \
            tools/second_shift_supervisor_v2.py \
            control-gateway/python/a01_supervisor_adapter.py \
            control-gateway/python/a01_supervisor_coordination.py \
            control-gateway/python/a01_night_scheduler.py \
            control-gateway/python/a01_execution_worker.py \
            tests/test_control_gateway_a01_execution_worker.py \
            tests/test_control_gateway_a01_execution_worker_single_owner.py
      - name: Run execution worker qualification
        run: python tests/test_control_gateway_a01_execution_worker.py
      - name: Run single-owner adversarial qualification
        run: python tests/test_control_gateway_a01_execution_worker_single_owner.py
      - name: Run scheduler regression suite
        run: python tests/test_control_gateway_a01_night_scheduler.py
      - name: Run coordination regression suite
        run: python tests/test_control_gateway_a01_supervisor_coordination.py
      - name: Run supervisor optimized crash/concurrency suite
        run: python tests/run_second_shift_supervisor_v2_optimized.py
