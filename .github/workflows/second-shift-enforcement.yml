name: Second Shift Enforcement

on:
  workflow_dispatch:
  schedule:
    - cron: '28,58 0-6 * * *'
      timezone: 'America/New_York'
  push:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/repair/**'
      - 'governance/architecture/**'
      - 'governance/morning/**'
      - 'governance/CHAT-LANE-OPERATING-PROMPT-002.md'
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'governance/second-shift/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/second-shift-enforce.js'
      - '.github/scripts/second-shift-owner-coverage.js'
      - '.github/scripts/second-shift-execution-control-enforce.js'
      - '.github/scripts/second-shift-eight-lane-qualification.py'
      - 'tests/second-shift-execution-control-contract.test.js'
      - '.github/scripts/programming-work-program-enforce.js'
      - 'tools/second_shift_supervisor_v2.py'
      - '.github/workflows/second-shift-enforcement.yml'
      - '.github/workflows/programming-work-program-enforcement.yml'
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/repair/**'
      - 'governance/architecture/**'
      - 'governance/morning/**'
      - 'governance/CHAT-LANE-OPERATING-PROMPT-002.md'
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'governance/second-shift/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/second-shift-enforce.js'
      - '.github/scripts/second-shift-owner-coverage.js'
      - '.github/scripts/second-shift-execution-control-enforce.js'
      - '.github/scripts/second-shift-eight-lane-qualification.py'
      - 'tests/second-shift-execution-control-contract.test.js'
      - '.github/scripts/programming-work-program-enforce.js'
      - 'tools/second_shift_supervisor_v2.py'
      - '.github/workflows/second-shift-enforcement.yml'
      - '.github/workflows/programming-work-program-enforcement.yml'

permissions:
  contents: read

concurrency:
  group: second-shift-enforcement
  cancel-in-progress: false

jobs:
  enforce:
    name: Reject drift and qualify all current Second Shift lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Syntax check governance and Second Shift enforcement
        run: |
          node --check .github/scripts/program-job-lock-enforce.js
          node --check .github/scripts/current-obligation-registry-enforce.js
          node --check .github/scripts/second-shift-enforce.js
          node --check .github/scripts/second-shift-owner-coverage.js
          node --check .github/scripts/second-shift-execution-control-enforce.js
          node --check tests/second-shift-execution-control-contract.test.js
          node --check .github/scripts/programming-work-program-enforce.js
          node --check .github/scripts/validate-system-topology.js
          python3 -m py_compile .github/scripts/second-shift-eight-lane-qualification.py

      - name: Validate current topology and retired-system boundary
        run: node .github/scripts/validate-system-topology.js

      - name: Enforce locked program jobs and completion truth
        run: node .github/scripts/program-job-lock-enforce.js

      - name: Enforce Programming peer continuity and Website Building boundary
        run: node .github/scripts/programming-work-program-enforce.js

      - name: Enforce current obligation ownership
        run: node .github/scripts/current-obligation-registry-enforce.js

      - name: Enforce execution-control contract against live topology
        run: |
          mkdir -p .second-shift-enforcement
          node .github/scripts/second-shift-execution-control-enforce.js > .second-shift-enforcement/execution-control-contract.json

      - name: Qualify all current Second Shift execution lanes
        run: |
          python3 .github/scripts/second-shift-eight-lane-qualification.py --out=.second-shift-enforcement/current-lane-qualification.json

      - name: Run current execution-control and Mastery contract regressions
        run: node tests/second-shift-execution-control-contract.test.js

      - name: Self-test Second Shift invariants
        run: |
          node .github/scripts/second-shift-enforce.js --selftest
          node .github/scripts/second-shift-owner-coverage.js --selftest

      - name: Validate static Second Shift repository state
        if: github.event_name != 'schedule'
        run: |
          node .github/scripts/second-shift-enforce.js --no-live --out=.second-shift-enforcement/report.json
          node .github/scripts/second-shift-owner-coverage.js --no-live > .second-shift-enforcement/owner-coverage.json

      - name: Watch active shift against live owner refs and root authority
        if: github.event_name == 'schedule'
        run: |
          node .github/scripts/second-shift-enforce.js --watchdog --out=.second-shift-enforcement/report.json
          node .github/scripts/second-shift-owner-coverage.js --watchdog > .second-shift-enforcement/owner-coverage.json

      - name: Publish enforcement summary
        if: always()
        shell: bash
        run: |
          echo '## Second Shift Enforcement' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .second-shift-enforcement/execution-control-contract.json ]; then
            echo '### Topology / execution-control contract' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .second-shift-enforcement/execution-control-contract.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .second-shift-enforcement/current-lane-qualification.json ]; then
            echo '### Current-lane execution-control qualification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .second-shift-enforcement/current-lane-qualification.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .second-shift-enforcement/report.json ]; then
            echo '### Execution-control report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .second-shift-enforcement/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .second-shift-enforcement/owner-coverage.json ]; then
            echo '### Owner-coverage report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .second-shift-enforcement/owner-coverage.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload enforcement evidence
        if: always() && hashFiles('.second-shift-enforcement/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-shift-enforcement-${{ github.run_id }}
          path: .second-shift-enforcement/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
