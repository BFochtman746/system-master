name: PROPOSED LEARNING-LAB-IMPL-027 Adaptive Journey Evidence Continuation

on:
  push:
    branches:
      - learning/proposed-impl-027-adaptive-journey-evidence-continuation
    paths:
      - ".github/workflows/learning-proposed-impl-027.yml"
      - "learning/lab/learning_lab/adaptive_journey_continuation.py"
      - "learning/lab/system_master_interaction_bridge.py"
      - "learning/lab/tests/test_adaptive_journey_continuation.py"
      - "learning/lab/learning_lab/adaptive_entry.py"
      - "learning/lab/learning_lab/baseline_diagnostic.py"
      - "learning/lab/learning_lab/domain_general.py"
      - "learning/lab/learning_lab/engine.py"
      - "learning/lab/system_master_bridge.py"
      - "system-master/learning-integration/impl-017/src/main/java/org/systemmaster/learning/LearningExecutionPort.java"
      - "system-master/learning-integration/impl-025/src/main/java/org/systemmaster/learning/LearningCapabilityAdapter.java"
      - "system-master/learning-integration/impl-027/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-proposed-impl-027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify adaptive journey evidence continuation on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact proposed IMPL-027 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false

      - name: Prepare evidence
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-proposed-impl-027-%GITHUB_RUN_ID%"
          set "CLASS_DIR=%RUNNER_TEMP%\learning-proposed-impl-027-classes-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          if not exist "%CLASS_DIR%" mkdir "%CLASS_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo CLASS_DIR=%CLASS_DIR%>>"%GITHUB_ENV%"
          echo %GITHUB_SHA%>"%EVIDENCE_DIR%\source-commit.txt"
          echo %RUNNER_NAME%>"%EVIDENCE_DIR%\runner.txt"
          python --version >"%EVIDENCE_DIR%\python-version.txt" 2>&1
          java -version >"%EVIDENCE_DIR%\java-version.txt" 2>&1
          javac -version >"%EVIDENCE_DIR%\javac-version.txt" 2>&1
          type "%EVIDENCE_DIR%\python-version.txt"
          type "%EVIDENCE_DIR%\java-version.txt"
          type "%EVIDENCE_DIR%\javac-version.txt"

      - name: Compile interaction continuation boundary
        shell: cmd
        run: |
          python -m py_compile ^
            learning\lab\learning_lab\adaptive_journey_continuation.py ^
            learning\lab\system_master_interaction_bridge.py ^
            learning\lab\tests\test_adaptive_journey_continuation.py ^
            >"%EVIDENCE_DIR%\python-compile.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-compile.txt"
          exit /b %RC%

      - name: Run focused adaptive continuation tests
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_adaptive_journey_continuation >"%EVIDENCE_DIR%\python-impl027.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl027.txt"
          exit /b %RC%

      - name: Compile System Master interaction adapter without foundation packages
        shell: cmd
        run: |
          javac -d "%CLASS_DIR%" ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningExecutionPort.java ^
            system-master\learning-integration\impl-025\src\main\java\org\systemmaster\learning\LearningCapabilityAdapter.java ^
            system-master\learning-integration\impl-027\src\main\java\org\systemmaster\learning\LearningInteractionAdapter.java ^
            system-master\learning-integration\impl-027\src\test\java\org\systemmaster\learning\Impl027AdaptiveJourneyContinuationQualification.java ^
            >"%EVIDENCE_DIR%\java-port-compile.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\java-port-compile.txt"
          if not "%RC%"=="0" exit /b %RC%
          echo IMPL027_JAVA_FOUNDATION_DEPENDENCY=NONE>"%EVIDENCE_DIR%\java-isolation.txt"
          type "%EVIDENCE_DIR%\java-isolation.txt"

      - name: Run real Java to Python adaptive continuation qualification
        shell: cmd
        run: |
          java -cp "%CLASS_DIR%" org.systemmaster.learning.Impl027AdaptiveJourneyContinuationQualification >"%EVIDENCE_DIR%\impl027-integration.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl027-integration.txt"
          exit /b %RC%

      - name: Regress IMPL-016 adaptive journey authority
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_adaptive_entry_journey >"%EVIDENCE_DIR%\python-impl016-journey-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl016-journey-regression.txt"
          exit /b %RC%

      - name: Regress IMPL-026 provider configuration boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_production_provider_config >"%EVIDENCE_DIR%\python-impl026-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl026-regression.txt"
          exit /b %RC%

      - name: Publish proposed IMPL-027 summary
        if: always()
        shell: cmd
        run: |
          echo ## PROPOSED LEARNING-LAB-IMPL-027>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"
          echo Truth boundary: authorized persisted-journey evidence continuation proven through real System Master Java to Python runtime; tutor interaction continuation and native production deployment remain unproven.>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl027.txt" type "%EVIDENCE_DIR%\python-impl027.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\java-isolation.txt" type "%EVIDENCE_DIR%\java-isolation.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\impl027-integration.txt" type "%EVIDENCE_DIR%\impl027-integration.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl016-journey-regression.txt" type "%EVIDENCE_DIR%\python-impl016-journey-regression.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl026-regression.txt" type "%EVIDENCE_DIR%\python-impl026-regression.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload proposed IMPL-027 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-proposed-impl-027-evidence
          path: ${{ runner.temp }}\learning-proposed-impl-027-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
