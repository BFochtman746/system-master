name: GITHUB-A01 Controller Reconciliation 001C — Writer Exact-SHA Proving

on:
  push:
    branches:
      - github-a01-controller-forensic-reconciliation-001c-20260912
    paths:
      - 'control-gateway/**'
      - '.github/scripts/control-gateway-production-writer.js'
      - '.github/scripts/control-gateway-production-enforcement-audit.js'
      - '.github/scripts/control-gateway-production-r01-live-proof.js'
      - '.github/workflows/control-gateway-production-writer.yml'
      - '.github/workflows/control-gateway-production-r01-live-proof.yml'
      - '.github/workflows/github-a01-controller-forensic-reconciliation-001c-prove.yml'
      - 'governance/control-gateway/GITHUB-A01-CONTROLLER-FORENSIC-RECONCILIATION-001C-*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-cumulative:
    name: 001C controller + writer cumulative / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout exact 001C candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify exact candidate and policy syntax
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --check control-gateway/src/github-production-mutation.js
          node --check control-gateway/src/github-production-enforcement.js
          node --check .github/scripts/control-gateway-production-writer.js
          node --check .github/scripts/control-gateway-production-enforcement-audit.js
          node --check .github/scripts/control-gateway-production-r01-live-proof.js
          node -e "JSON.parse(require('fs').readFileSync('governance/control-gateway/GITHUB-A01-CONTROLLER-FORENSIC-RECONCILIATION-001C-ENFORCEMENT-POLICY.json','utf8'))"
      - name: Run full Control Gateway Node regression including 001C writer tests
        shell: bash
        run: node --test
        working-directory: control-gateway
      - name: Run bottom-up cumulative CG-008 through CG-011 qualification
        shell: bash
        env:
          A01_SUBJECT_SHA: ${{ github.sha }}
          A01_SUBJECT_ROOT: ${{ github.workspace }}
          A01_EVIDENCE_DIR: ${{ runner.temp }}/001c-portable-${{ matrix.node }}
          A01_QUALIFICATION_ID: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
          A01_WORKSTREAM_ID: SECOND-SHIFT-CONTROL-GATEWAY
        run: node .github/scripts/a01-second-shift-supervisor-v2-qualify.js

  independent-adversarial:
    name: 001C independent writer + controller adversarial closure
    needs: portable-cumulative
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact 001C candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Attack writer CAS, replay, byte-binding and controller restart invariants
        shell: bash
        run: |
          node --test control-gateway/test/github-production-mutation.test.js control-gateway/test/github-production-enforcement.test.js
          python tests/test_control_gateway_cg011_adversarial_closure.py
          python tests/test_control_gateway_cg011_dispatch_failure_replay.py

  a01-windows-cumulative:
    name: 001C exact-subject A-01 Windows cumulative qualification
    needs: [portable-cumulative, independent-adversarial]
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
      workstream_id: SECOND-SHIFT-CONTROL-GATEWAY
      subject_sha: ${{ github.sha }}
      origin_ref: refs/heads/github-a01-controller-forensic-reconciliation-001c-20260912
      resume_on_pass: Preserve exact 001C writer qualification evidence, but do not call production enforcement closed until the dedicated writer App identity and active all-branch ruleset are installed and live-read-back proves ordinary ChatGPT writes cannot bypass it.
      resume_on_failure: Keep 001B qualified and 001C production inactive; repair only the exact failing writer/controller boundary and rerun hosted then A-01 on the replacement exact SHA.
      notification_target: workstream:SECOND-SHIFT-CONTROL-GATEWAY
      execution_context: normal
      qualifier_timeout_minutes: 28
      job_timeout_minutes: 30
      repair_attempt: 0
      max_repair_attempts: 1
