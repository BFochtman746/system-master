name: Required Verification

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-verification-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  verification-required:
    name: required-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Java 21+
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_21_X64:-}" && -x "${JAVA_HOME_21_X64}/bin/javac" ]]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
            echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"
            echo "${java_home}/bin" >> "$GITHUB_PATH"
          fi

      - name: Report toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          mvn -version

      - name: Prove zero-test and under-discovery green is impossible
        shell: bash
        run: bash verification/probe-vacuous-green.sh

      - name: Run canonical repository verification
        shell: bash
        run: ./verify.sh

      - name: Require explicit non-vacuous result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d target/surefire-reports
          grep -R -Eq 'tests="[1-9][0-9]*"' target/surefire-reports/*.xml
          echo 'REQUIRED_VERIFICATION_NON_VACUOUS=PASS'
