name: Second Shift Control Gateway CG-011 A-01 Cumulative Host Qualification

on:
  push:
    branches:
      - second-shift-control-gateway/cg-011-a01-host-qualification-001
    paths:
      - '.github/scripts/a01-second-shift-supervisor-v2-qualify.js'
      - '.github/workflows/second-shift-control-gateway-cg-011-a01-host-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  a01-host-qualification:
    name: CG-011 real A-01 Windows cumulative Foundation gate
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
      workstream_id: SECOND-SHIFT-CONTROL-GATEWAY
      subject_sha: ${{ github.sha }}
      origin_ref: refs/heads/second-shift-control-gateway/cg-011-a01-host-qualification-001
      resume_on_pass: Record actual A-01 Windows PASS for the unchanged frozen CG-011 product bytes, reconcile the premature development-only freeze, and permit final Foundation freeze only after cumulative CG-008 through CG-011 evidence is preserved.
      resume_on_failure: Keep CG-011 Foundation freeze blocked, preserve the exact A-01 failure evidence, repair only the failing boundary, and rerun the full cumulative A-01 gate before any successor work.
      notification_target: obligation:SECOND-SHIFT-CONTROL-GATEWAY-CG-011-A01-HOST-QUALIFICATION-001
      execution_context: normal
      qualifier_timeout_minutes: 28
      job_timeout_minutes: 30
      repair_attempt: 0
      max_repair_attempts: 1
    secrets: inherit
