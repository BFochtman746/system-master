name: Book B04 E Isolated Cumulative Qualification

on:
  push:
    branches:
      - book-system/b04-e-qualification-calibration-v1
    paths:
      - 'system-master/book-system/book-b04-e-*'
      - '.github/workflows/book-b04-e-isolated-cumulative-qualification.yml'
  pull_request:
    branches:
      - book-system/b04-d3-reader-currentness-runtime-v1
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b04-e-qualification:
    name: Node ${{ matrix.node }} — B04 128 + cumulative B00/B01/B02/B03/B04
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22','24']
    env:
      EVENT_NAME: ${{ github.event_name }}
      HEAD_REF: ${{ github.head_ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Validate B04 E subject
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test "${HEAD_REF}" = "book-system/b04-e-qualification-calibration-v1"
            [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          else
            test "${GITHUB_REF}" = "refs/heads/book-system/b04-e-qualification-calibration-v1"
          fi

      - name: Checkout exact B04 E subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          else
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record exact subject
        shell: bash
        run: |
          set -euo pipefail
          echo "subject_sha=$(git rev-parse HEAD)" | tee b04-e-subject-${{ matrix.node }}.txt
          node --version | tee -a b04-e-subject-${{ matrix.node }}.txt

      - name: Freeze exact B04 E 128-case manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' | tee b04-e-manifest-${{ matrix.node }}.log
          const m=require('./system-master/book-system/book-b04-e-denominator-manifest-v1');
          if (!m.validateFrozenDenominatorV1()) process.exit(1);
          const counts=Object.fromEntries(Object.entries(m.CASE_IDS).map(([k,v])=>[k,v.length]));
          if (m.ALL_CASE_IDS.length !== 128) process.exit(1);
          console.log(JSON.stringify({result:'PASS',denominator:'B04-E-ISOLATED-128',counts,total:m.ALL_CASE_IDS.length,denominator_shrinkage:0,historical_pass_transferred:0}));
          NODE
          grep -F '"total":128' b04-e-manifest-${{ matrix.node }}.log
          grep -F '"denominator_shrinkage":0' b04-e-manifest-${{ matrix.node }}.log

      - name: B04 E01-E32 exposure frontier source currentness privacy
        shell: bash
        run: |
          set -euo pipefail
          node --test system-master/book-system/book-b04-e-exposure.test.js | tee b04-e-exposure-${{ matrix.node }}.log
          grep -F '# tests 32' b04-e-exposure-${{ matrix.node }}.log
          grep -F '# pass 32' b04-e-exposure-${{ matrix.node }}.log
          grep -F '# fail 0' b04-e-exposure-${{ matrix.node }}.log

      - name: B04 D01-D32 immutable dimensions sparse applicability non-scalar law
        shell: bash
        run: |
          set -euo pipefail
          node --test system-master/book-system/book-b04-e-dimensions.test.js | tee b04-e-dimensions-${{ matrix.node }}.log
          grep -F '# tests 32' b04-e-dimensions-${{ matrix.node }}.log
          grep -F '# pass 32' b04-e-dimensions-${{ matrix.node }}.log
          grep -F '# fail 0' b04-e-dimensions-${{ matrix.node }}.log

      - name: B04 P01-P24 perspective observation standing calibration evidence
        shell: bash
        run: |
          set -euo pipefail
          node --test system-master/book-system/book-b04-e-perspective.test.js | tee b04-e-perspective-${{ matrix.node }}.log
          grep -F '# tests 24' b04-e-perspective-${{ matrix.node }}.log
          grep -F '# pass 24' b04-e-perspective-${{ matrix.node }}.log
          grep -F '# fail 0' b04-e-perspective-${{ matrix.node }}.log

      - name: B04 U01-U24 understanding sparse projection cross-boundary law
        shell: bash
        run: |
          set -euo pipefail
          node --test system-master/book-system/book-b04-e-understanding.test.js | tee b04-e-understanding-${{ matrix.node }}.log
          grep -F '# tests 24' b04-e-understanding-${{ matrix.node }}.log
          grep -F '# pass 24' b04-e-understanding-${{ matrix.node }}.log
          grep -F '# fail 0' b04-e-understanding-${{ matrix.node }}.log

      - name: B04 I01-I16 invalidation currentness idempotency query content-addressing
        shell: bash
        run: |
          set -euo pipefail
          node --test system-master/book-system/book-b04-e-invalidation.test.js | tee b04-e-invalidation-${{ matrix.node }}.log
          grep -F '# tests 16' b04-e-invalidation-${{ matrix.node }}.log
          grep -F '# pass 16' b04-e-invalidation-${{ matrix.node }}.log
          grep -F '# fail 0' b04-e-invalidation-${{ matrix.node }}.log

      - name: B03 frozen 108 and cumulative integration
        shell: bash
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-knowledge-v1.test.js | tee b03-k01-k32-${{ matrix.node }}.log
          node system-master/book-system/book-knowledge-materializer-v1.test.js | tee b03-m01-m20-${{ matrix.node }}.log
          node --test system-master/book-system/book-knowledge-invalidation-v1.test.js | tee b03-i01-i16-${{ matrix.node }}.log
          node system-master/book-system/book-story-bible-admission-v1.test.js | tee b03-a01-x24-${{ matrix.node }}.log
          node system-master/book-system/book-b03-e-cumulative-integration.test.js | tee b03-e-integration-${{ matrix.node }}.log
          grep -F '"denominator":"K01-K32"' b03-k01-k32-${{ matrix.node }}.log
          grep -F '"cases":32' b03-k01-k32-${{ matrix.node }}.log
          grep -F '"denominator":"M01-M20"' b03-m01-m20-${{ matrix.node }}.log
          grep -F '"cases":20' b03-m01-m20-${{ matrix.node }}.log
          grep -F '"denominator":"I01-I16"' b03-i01-i16-${{ matrix.node }}.log
          grep -F '"cases":16' b03-i01-i16-${{ matrix.node }}.log
          grep -F '"denominator":"A01-A16+X01-X24"' b03-a01-x24-${{ matrix.node }}.log
          grep -F '"cases":40' b03-a01-x24-${{ matrix.node }}.log
          grep -F '"denominator":"B03-E-INTEGRATION-E01-E08"' b03-e-integration-${{ matrix.node }}.log
          grep -F '"cases":8' b03-e-integration-${{ matrix.node }}.log
          grep -F '"historical_pass_transferred":0' b03-e-integration-${{ matrix.node }}.log

      - name: B02 frozen 72 and cumulative recovery integration
        shell: bash
        run: |
          set -euo pipefail
          node system-master/book-system/book-source-recovery-acceptance-v1.test.js | tee b02-s01-s20-${{ matrix.node }}.log
          node system-master/book-system/book-existing-book-recovery-adapter-v1.test.js | tee b02-r01-r16-${{ matrix.node }}.log
          node system-master/book-system/book-recovered-baseline-admission-v1.test.js | tee b02-a01-x20-${{ matrix.node }}.log
          grep -F '"denominator":"S01-S20"' b02-s01-s20-${{ matrix.node }}.log
          grep -F '"cases":20' b02-s01-s20-${{ matrix.node }}.log
          grep -F '"denominator":"R01-R16"' b02-r01-r16-${{ matrix.node }}.log
          grep -F '"cases":16' b02-r01-r16-${{ matrix.node }}.log
          grep -F '"denominator":"A01-A16 + X01-X20"' b02-a01-x20-${{ matrix.node }}.log
          grep -F '"cases":36' b02-a01-x20-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b02-e-cumulative-001-qualify.js | tee b02-cumulative-${{ matrix.node }}.log

      - name: B01 frozen 64 and execution regressions
        shell: bash
        run: |
          set -euo pipefail
          node system-master/book-system/book-b01-e-frozen-denominator.test.js | tee b01-e-64-${{ matrix.node }}.log
          node system-master/book-system/book-capability-binding-v1.test.js | tee b01-d1-${{ matrix.node }}.log
          node .github/scripts/book-context-compiler-context-package-001-qualify.js | tee context-44-${{ matrix.node }}.log
          node system-master/book-system/context-compiler/book-context-compiler-b01-rebind.test.js | tee b01-d2-${{ matrix.node }}.log
          node system-master/book-system/book-execution-foundation-b01.test.js | tee b01-d3-${{ matrix.node }}.log
          node system-master/book-system/book-workflow-runtime-b01.test.js | tee b01-d4-${{ matrix.node }}.log
          node system-master/book-system/book-workflow-durable-store.test.js | tee durable-14-${{ matrix.node }}.log
          node system-master/book-system/book-workflow-scheduler-runtime.test.js | tee scheduler-direct-${{ matrix.node }}.log

      - name: B00 Q001-Q096 foundation denominator
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/book-system-canonical-parent-v2-core-001-qualify.js | tee q001-q036-${{ matrix.node }}.log
          node .github/scripts/book-system-canonical-parent-v2-store-001-qualify.js | tee q037-q050-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f5-version-admission-001-qualify.js | tee q051-q058-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f6b-lifecycle-rebind-001-qualify.js | tee q059-q060-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f7-author-decision-rebind-001-qualify.js | tee q061-q062-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f8-integration-proposal-rebind-001-qualify.js | tee q063-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f10-evidence-recovery-seam-001-qualify.js | tee q064-q066-q085-q090-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f9-export-freeze-rebind-001-qualify.js | tee q065-${{ matrix.node }}.log
          node .github/scripts/book-system-rights-custody-evidence-001-qualify.js | tee q067-q076-${{ matrix.node }}.log
          node .github/scripts/book-system-governing-style-profile-001-qualify.js | tee q077-q084-${{ matrix.node }}.log
          node .github/scripts/book-reconstruction-b00-f11-v1-v2-migration-001-qualify.js | tee q091-q096-${{ matrix.node }}.log

      - name: PRE01-PRE21 current-subject regressions and A01 calibration classification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/book-system-canonical-state-001-qualify.js | tee pre01-${{ matrix.node }}.log
          node .github/scripts/book-system-version-and-rollback-001-qualify-v2.js | tee pre02-${{ matrix.node }}.log
          node .github/scripts/book-system-content-object-admission-001-qualify.js | tee pre03-${{ matrix.node }}.log
          node .github/scripts/book-system-content-admission-author-decision-applicability-guard-004-qualify.js | tee pre04-${{ matrix.node }}.log
          node .github/scripts/book-system-lifecycle-transition-001-qualify.js | tee pre05-${{ matrix.node }}.log
          node .github/scripts/book-system-lifecycle-current-parent-compatibility-001-qualify-v2.js | tee pre06-${{ matrix.node }}.log
          node .github/scripts/book-system-lifecycle-current-parent-rebind-001-qualify.js | tee pre07-${{ matrix.node }}.log
          node .github/scripts/book-system-author-decision-queue-001-qualify-v2.js | tee pre08-${{ matrix.node }}.log
          node .github/scripts/book-system-author-decision-current-subject-guard-001-qualify.js | tee pre09-${{ matrix.node }}.log
          node .github/scripts/book-system-integration-proposal-runtime-002-qualify.js | tee pre10-${{ matrix.node }}.log
          node .github/scripts/book-system-export-freeze-001-reconciled-qualify.js | tee pre11-${{ matrix.node }}.log
          node .github/scripts/book-system-existing-book-recovery-semantic-core-001-qualify-v2.js | tee pre12-${{ matrix.node }}.log
          node .github/scripts/book-system-e2e-authority-guards-001-qualify.js | tee pre13-${{ matrix.node }}.log
          set +e
          node .github/scripts/book-system-end-to-end-authoring-001-qualify-v2.js 2>&1 | tee pre14-${{ matrix.node }}.log
          pre14_rc=${PIPESTATUS[0]}
          set -e
          if [ "$pre14_rc" -eq 0 ]; then
            echo '{"pre14_end_to_end_authoring":"PASS_CURRENT_SUBJECT","qualification_transfer":false}' > pre14-classification-${{ matrix.node }}.json
          else
            grep -F 'AUTHOR_GUARD_BYTES_DRIFTED_FROM_A01_SUBJECT' pre14-${{ matrix.node }}.log
            echo '{"pre14_end_to_end_authoring":"BLOCKED_A01_REQUIRED","reason":"CURRENT_AUTHOR_GUARD_BYTES_CHANGED_AFTER_REGISTERED_A01_SUBJECT","qualification_transfer":false}' > pre14-classification-${{ matrix.node }}.json
          fi
          node .github/scripts/book-workflow-orchestrator-authority-contract-001-qualify.js | tee pre15-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-book-admission-handoff-001-qualify.js | tee pre16-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-concurrency-rules-001-qualify.js | tee pre17-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-failure-semantics-001-qualify.js | tee pre18-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-retry-idempotency-rules-001-qualify.js | tee pre19-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-cancellation-resume-001-qualify.js | tee pre20-${{ matrix.node }}.log
          node .github/scripts/book-workflow-orchestrator-evidence-provenance-emission-001-qualify.js | tee pre21-${{ matrix.node }}.log

      - name: B04 runtime import smoke
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('./system-master/book-system/book-b04-e-denominator-manifest-v1').validateFrozenDenominatorV1()"
          node -e "require('./system-master/book-system/book-reader-dimension-registry-v1').validateRegistryV1()"
          node -e "require('./system-master/book-system/book-reader-exposure-projection-v1')"
          node -e "require('./system-master/book-system/book-reader-understanding-v1')"
          node -e "require('./system-master/book-system/book-reader-currentness-runtime-v1')"
          node -e "require('./system-master/book-system/book-reader-query-runtime-v1')"

      - name: Record B04 E external calibration fences
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pre14_standing="NOT_RUN"
          if [ -f pre14-classification-${{ matrix.node }}.json ]; then
            pre14_standing=$(node -e "process.stdout.write(require('./pre14-classification-${{ matrix.node }}.json').pre14_end_to_end_authoring)")
          fi
          cat > b04-e-calibration-fences-${{ matrix.node }}.json <<JSON
          {
            "MODEL_READER_SIMULATION_CALIBRATION_REQUIRED": "OPEN",
            "HUMAN_READER_ALIGNMENT_REQUIRED": "OPEN",
            "REAL_BOOK_LONG_FORM_CALIBRATION_REQUIRED": "OPEN",
            "PROVIDER_SUBJECT_ADMISSION_REQUIRED": "OPEN",
            "pre14_end_to_end_authoring": "${pre14_standing}",
            "isolated_b04_denominator": 128,
            "denominator_shrinkage": 0,
            "historical_pass_transferred": 0,
            "model_accuracy_claimed": false,
            "real_book_validation_claimed": false,
            "human_alignment_claimed": false,
            "publication_standing_claimed": false,
            "production_standing_claimed": false,
            "canonical_effect": false
          }
          JSON

      - name: Hash exact-subject evidence set
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=(b04-e-subject-${{ matrix.node }}.txt *.log b04-e-calibration-fences-${{ matrix.node }}.json)
          if [ -f pre14-classification-${{ matrix.node }}.json ]; then files+=(pre14-classification-${{ matrix.node }}.json); fi
          sha256sum "${files[@]}" > b04-e-node-${{ matrix.node }}.sha256

      - name: Upload exact-subject evidence set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-b04-e-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            b04-e-subject-${{ matrix.node }}.txt
            *.log
            b04-e-calibration-fences-${{ matrix.node }}.json
            pre14-classification-${{ matrix.node }}.json
            b04-e-node-${{ matrix.node }}.sha256
          if-no-files-found: error
