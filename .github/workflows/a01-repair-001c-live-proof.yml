# Retry 3 validates live durable transaction state after the reusable-workflow snapshot is resolved.
name: A-01 Repair 001C Live Proof

on:
  push:
    paths:
      - '.github/workflows/a01-repair-001c-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare_fixture:
    name: Prepare explicit synthetic repair-control fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transaction_id: ${{ steps.fixture.outputs.transaction_id }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind to latest main before fixture creation
        shell: bash
        run: git pull --ff-only origin main

      - name: Prepare A01_REQUEUE_READY synthetic control fixture
        id: fixture
        env:
          A01_001C_REPLACEMENT_SUBJECT_SHA: 93c03b424a052cd9fb9f7c47ca4efe33ef6b20d4
          A01_001C_PREQUAL_EVIDENCE: github-actions-run:34429967883:A-01-Repair-Ledger-Selftest:PASS
        shell: bash
        run: |
          git cat-file -e "$A01_001C_REPLACEMENT_SUBJECT_SHA^{commit}"
          node .github/scripts/a01-repair-001c-live-proof-prepare.js
          node .github/scripts/a01-repair-ledger-reconcile.js
          echo 'transaction_id=A01-REPAIR-001C-LIVE-PROOF-001' >> "$GITHUB_OUTPUT"

      - name: Commit durable fixture with bounded concurrent-main retry
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/repair qualification/a01/repair-requests
          if git diff --cached --quiet; then
            echo 'Fixture is already durable and ready.'
            exit 0
          fi
          git commit -m 'repair: stage synthetic 001C live proof transaction'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Concurrent main movement during fixture push attempt ${attempt}; rebasing and retrying without rewriting other-lane work."
            sleep 2
          done
          if [ "$pushed" != true ]; then
            echo 'Unable to persist the fixture after five bounded rebases; fail closed for manual reconciliation.' >&2
            exit 1
          fi

      - name: Publish fixture authority boundary
        shell: bash
        run: |
          echo '## A01-CLOSED-LOOP-REPAIR-001C LIVE PROOF' >> "$GITHUB_STEP_SUMMARY"
          echo 'Transaction: A01-REPAIR-001C-LIVE-PROOF-001' >> "$GITHUB_STEP_SUMMARY"
          echo 'Replacement subject: 93c03b424a052cd9fb9f7c47ca4efe33ef6b20d4' >> "$GITHUB_STEP_SUMMARY"
          echo 'The root failure seed is explicitly synthetic and is NOT an authoritative A-01/product failure. This run proves the replacement-rerun mechanics using a real registered A-01 execution only.' >> "$GITHUB_STEP_SUMMARY"

  rerun:
    name: Run exact replacement through canonical repair rerun path
    needs: prepare_fixture
    uses: ./.github/workflows/a01-repair-rerun.yml
    with:
      transaction_id: ${{ needs.prepare_fixture.outputs.transaction_id }}
      execution_context: normal
      qualifier_timeout_minutes: 10
      job_timeout_minutes: 15
      not_before: ''
      not_after: ''
