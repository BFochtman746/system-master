name: Book System Version and Rollback Hosted Prequalification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "qualification/book-system/version-and-rollback-001/**"
      - "system-master/book-system/version-and-rollback*.js"
      - ".github/scripts/book-system-version-and-rollback-001-qualify.js"
      - ".github/workflows/book-system-version-and-rollback-001-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Deterministic hosted prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Syntax check runtime and qualifier
        run: |
          node --check system-master/book-system/version-and-rollback-core.js
          node --check system-master/book-system/version-and-rollback.js
          node --check .github/scripts/book-system-version-and-rollback-001-qualify.js
      - name: Run 40-case Version and Rollback qualifier
        run: node .github/scripts/book-system-version-and-rollback-001-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-system-version-and-rollback-001-${{ github.run_id }}-hosted-evidence
          path: ${{ runner.temp }}/book-version-rollback-evidence
          if-no-files-found: warn
          retention-days: 30
