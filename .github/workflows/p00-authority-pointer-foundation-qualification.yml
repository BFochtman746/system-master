name: P00 Authority Pointer Foundation Qualification

on:
  push:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/contracts/P00-FOUNDATION-CONTRACT-001.md'
      - '.github/scripts/validate-governance.js'
      - '.github/scripts/system-brief.js'
      - '.github/workflows/p00-authority-pointer-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/contracts/P00-FOUNDATION-CONTRACT-001.md'
      - '.github/scripts/validate-governance.js'
      - '.github/scripts/system-brief.js'
      - '.github/workflows/p00-authority-pointer-foundation-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P00 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run exact P00 acceptance target
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-governance.js | tee /tmp/p00-validate-governance.log
          node .github/scripts/system-brief.js | tee /tmp/p00-system-brief.log
      - name: Emit exact-subject P00 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-output
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          subjects = [
              'governance/CURRENT-AUTHORITY.json',
              'governance/contracts/P00-FOUNDATION-CONTRACT-001.md',
              '.github/scripts/validate-governance.js',
              '.github/scripts/system-brief.js',
              '.github/workflows/p00-authority-pointer-foundation-qualification.yml',
          ]
          authority = json.loads(Path('governance/CURRENT-AUTHORITY.json').read_text(encoding='utf-8'))
          bindings = []
          for path in subjects:
              blob = subprocess.check_output(['git', 'rev-parse', f'HEAD:{path}'], text=True).strip()
              bindings.append({'path': path, 'git_blob_sha': blob})
          evidence = {
              'evidence_schema': '1.0',
              'contract_id': 'P00-FOUNDATION-1.0',
              'requirement_or_capability_id': 'P00',
              'owner_path': 'SYSTEM_MASTER/CORE',
              'authority_id': authority['authority_id'],
              'status': 'PASS',
              'source_identity': os.environ['GITHUB_SHA'],
              'acceptance_command': 'node .github/scripts/validate-governance.js && node .github/scripts/system-brief.js',
              'subjects': bindings,
              'logs': {
                  'validate_governance_sha256': hashlib.sha256(Path('/tmp/p00-validate-governance.log').read_bytes()).hexdigest(),
                  'system_brief_sha256': hashlib.sha256(Path('/tmp/p00-system-brief.log').read_bytes()).hexdigest(),
              },
          }
          Path('qualification-output/p00-foundation-1.0.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Preserve machine-readable P00 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: p00-foundation-1.0-evidence
          path: qualification-output/p00-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
