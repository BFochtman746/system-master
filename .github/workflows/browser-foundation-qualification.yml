name: Browser Foundation Qualification

on:
  push:
    paths:
      - 'governance/contracts/BROWSER-FOUNDATION-CONTRACT-*.md'
      - 'tools/browser_action_plan.py'
      - '.github/scripts/browser-foundation-qualify.py'
      - 'tests/test_browser_action_plan.py'
      - 'qualification/browser/**'
      - '.github/workflows/browser-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/contracts/BROWSER-FOUNDATION-CONTRACT-*.md'
      - 'tools/browser_action_plan.py'
      - '.github/scripts/browser-foundation-qualify.py'
      - 'tests/test_browser_action_plan.py'
      - 'qualification/browser/**'
      - '.github/workflows/browser-foundation-qualification.yml'
  workflow_dispatch:

concurrency:
  group: browser-foundation-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic Browser foundation
        run: python3 -m unittest tests.test_browser_action_plan
      - name: Qualify representative Browser corpus
        env:
          BROWSER_SOURCE_ID: ${{ github.sha }}
        run: python3 .github/scripts/browser-foundation-qualify.py
      - name: Preserve machine-readable Browser qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-foundation-1.0-evidence
          path: qualification-output/browser-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
