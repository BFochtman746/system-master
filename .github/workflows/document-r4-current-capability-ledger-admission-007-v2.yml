name: Document R4 Current Capability Ledger Admission 007 v2

on:
  push:
    branches:
      - documents/r4-current-capability-ledger-admission-007
    paths:
      - 'transport/document-r4/capability-ledger-007/incoming-v2/**'

permissions:
  contents: write

concurrency:
  group: document-r4-current-capability-ledger-admission-007-v2
  cancel-in-progress: false

jobs:
  admit:
    if: "${{ github.event.head_commit.message == 'documents: stage exact capability ledger transport 007 v2' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Gate 1 - preserve frozen 005 custody and 006 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7c720c41c15a7e569368f3923f706ca89a97c037 HEAD
          git merge-base --is-ancestor ded21b569e29b7d162c50f7cb0692874e3f3acc2 HEAD
          test -f transport/document-r4/READY
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('transport/document-r4/READY').read_text())
          assert r['armed'] is True
          assert r['source_subject_sha']=='ded21b569e29b7d162c50f7cb0692874e3f3acc2'
          assert r['qualification_id']=='CR001-R4-GITHUB-NATIVE-QUALIFICATION-005'
          assert r['historical_qualification_transfer'] is False
          PY
          test "$(git rev-parse HEAD:transport/document-r4/chunk-000.b64)" = 64034670dbbe18f6b629108bd1d9b1d8d81c4ac8
          test "$(git rev-parse HEAD:transport/document-r4/chunk-001.b64)" = 562ec2e184b6068e0f123c9e097d344a42c67dce
          test "$(git rev-parse HEAD:transport/document-r4/chunk-002.b64)" = 7b592c67e39a998301be7e5146533b842d724db2
          test "$(git rev-parse HEAD:transport/document-r4/chunk-003.b64)" = d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20
          test "$(git rev-parse HEAD:transport/document-r4/chunk-004.b64)" = 3518bf5ac92360b07f86c6107670da40f5830d1f
          git diff --exit-code ded21b569e29b7d162c50f7cb0692874e3f3acc2 -- recovered/document/cr001-r4

      - name: Gate 2 - verify SHA-gated ledger carrier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('transport/document-r4/capability-ledger-007/incoming-v2')
          m=json.loads((root/'LEDGER-PARTS.json').read_text())
          assert m['manifest_id']=='DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-TRANSFER-007'
          assert m['source_filename']=='ATOMIC_CAPABILITY_LEDGER_CR001_PROMOTED.xlsx'
          assert m['source_bytes']==303526
          assert m['source_sha256']=='dee2126069ef769983e305b2a351d7583cab02722dbdf32c82a5c36ff6a8b8bc'
          assert m['source_git_blob_sha1']=='f15ec8be5fc820282d537b12c5bd40d55b044bd0'
          assert m['encoded_bytes']==404704
          assert m['encoded_sha256']=='efe5e11fc5f61bb9c21e7a0f16736afe6977c61bef4acb06d02a471eb3e592f0'
          assert m['part_size_ceiling']==19000 and m['part_count']==22 and len(m['parts'])==22
          assert [p['ordinal'] for p in m['parts']]==list(range(22))
          declared=set()
          for p in m['parts']:
            path=root/p['filename']; declared.add(p['filename']); b=path.read_bytes()
            assert len(b)==p['bytes'] and len(b)<=19000
            assert hashlib.sha256(b).hexdigest()==p['sha256']
            assert subprocess.check_output(['git','hash-object',str(path)],text=True).strip()==p['git_blob_sha1']
          assert {p.name for p in root.glob('part-*.b64')}==declared
          PY

      - name: Gate 3 - reconstruct exact promoted workbook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p governance/documents/capability-ledger
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          root=pathlib.Path('transport/document-r4/capability-ledger-007/incoming-v2')
          m=json.loads((root/'LEDGER-PARTS.json').read_text())
          enc=b''.join((root/p['filename']).read_bytes() for p in m['parts'])
          assert len(enc)==404704
          assert hashlib.sha256(enc).hexdigest()=='efe5e11fc5f61bb9c21e7a0f16736afe6977c61bef4acb06d02a471eb3e592f0'
          raw=base64.b64decode(enc,validate=True)
          assert len(raw)==303526
          assert hashlib.sha256(raw).hexdigest()=='dee2126069ef769983e305b2a351d7583cab02722dbdf32c82a5c36ff6a8b8bc'
          pathlib.Path('governance/documents/capability-ledger/ATOMIC_CAPABILITY_LEDGER_CR001_PROMOTED.xlsx').write_bytes(raw)
          PY
          test "$(git hash-object governance/documents/capability-ledger/ATOMIC_CAPABILITY_LEDGER_CR001_PROMOTED.xlsx)" = f15ec8be5fc820282d537b12c5bd40d55b044bd0

      - name: Gate 4 - install workbook verifier
        run: python3 -m pip install --disable-pip-version-check 'openpyxl==3.1.5'

      - name: Gate 5 - verify denominator and generate deterministic owner evidence overlay
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_TRIGGER_SHA="$GITHUB_SHA" python3 - <<'PY'
          import collections,gzip,hashlib,io,json,openpyxl,os,pathlib
          root=pathlib.Path('governance/documents/capability-ledger')
          ledger=root/'ATOMIC_CAPABILITY_LEDGER_CR001_PROMOTED.xlsx'
          wb=openpyxl.load_workbook(ledger,read_only=True,data_only=True)
          ws=wb['Atomic Capability Ledger']; it=ws.iter_rows(values_only=True); headers=next(it); idx={v:i for i,v in enumerate(headers)}; rows=list(it)
          ids=[str(r[idx['capability_id']]) for r in rows]
          assert len(ids)==2935 and len(set(ids))==2935
          docx=[x for x in ids if x.startswith('UDM-DOCX-')]
          nums=sorted(int(x.rsplit('-',1)[1]) for x in docx)
          assert len(docx)==674 and nums==list(range(1,675))
          assert sum(595<=n<=634 for n in nums)==40
          assert sum(635<=n<=674 for n in nums)==40
          r674=next(r for r in rows if r[idx['capability_id']]=='UDM-DOCX-0674')
          assert 'full ISO XSD conformance' in str(r674[idx['atomic_capability']])
          assert 'exact Microsoft Word fidelity' in str(r674[idx['atomic_capability']])
          out=[]
          for r in rows:
            cid=str(r[idx['capability_id']]); pillar=str(r[idx['pillar']] or ''); status=str(r[idx['current_status']] or '')
            owner={'FOUNDATION':'DOCUMENTS_DOMAIN_FOUNDATION__CORE_SHARED_BOUNDARY_REVIEW','QUALIFICATION':'DOCUMENTS_DOMAIN_QUALIFICATION__CORE_SHARED_ASSURANCE_DEPENDENCY','SECURITY':'DOCUMENTS_DOCUMENT_SECURITY__CORE_SHARED_DEPENDENCY'}.get(pillar,'SYSTEM_MASTER/DOCUMENTS')
            n=int(cid.rsplit('-',1)[1]) if cid.startswith('UDM-DOCX-') else None
            if n is not None and 595<=n<=674:
              evidence='CURRENT_EXACT_SUBJECT_005__T13_T14_FRESH_REQUALIFICATION_PASS'; binding='CR001-R4-GITHUB-NATIVE-QUALIFICATION-005@ded21b569e29b7d162c50f7cb0692874e3f3acc2'
            elif 'VERIFIED' in status and not status.startswith('PARTIAL'):
              evidence='HISTORICAL_EXACT_SUBJECT_EVIDENCE__CURRENT_REQUALIFICATION_REQUIRED'; binding=None
            elif (('PENDING' in status and not status.startswith('PARTIAL')) or status=='ENGINE_REQUIRED'):
              evidence='REQUIREMENT_ONLY_OR_BACKFILL_REQUIRED'; binding=None
            else:
              evidence='RECOVERED_IMPLEMENTATION_OR_EVIDENCE__STANDING_AS_RECORDED'; binding=None
            out.append({'capability_id':cid,'source_pillar':pillar,'source_current_status':status,'reconciled_owner_disposition':owner,'evidence_class':evidence,'qualification_binding':binding,'historical_pass_transfer':False})
          owners=collections.Counter(x['reconciled_owner_disposition'] for x in out)
          evidence=collections.Counter(x['evidence_class'] for x in out)
          assert owners==collections.Counter({'SYSTEM_MASTER/DOCUMENTS':2802,'DOCUMENTS_DOMAIN_FOUNDATION__CORE_SHARED_BOUNDARY_REVIEW':88,'DOCUMENTS_DOMAIN_QUALIFICATION__CORE_SHARED_ASSURANCE_DEPENDENCY':25,'DOCUMENTS_DOCUMENT_SECURITY__CORE_SHARED_DEPENDENCY':20})
          assert evidence==collections.Counter({'RECOVERED_IMPLEMENTATION_OR_EVIDENCE__STANDING_AS_RECORDED':1612,'REQUIREMENT_ONLY_OR_BACKFILL_REQUIRED':690,'HISTORICAL_EXACT_SUBJECT_EVIDENCE__CURRENT_REQUALIFICATION_REQUIRED':553,'CURRENT_EXACT_SUBJECT_005__T13_T14_FRESH_REQUALIFICATION_PASS':80})
          raw=''.join(json.dumps(x,sort_keys=True,separators=(',',':'))+'\n' for x in out).encode()
          buf=io.BytesIO()
          with gzip.GzipFile(filename='',mode='wb',fileobj=buf,mtime=0,compresslevel=9) as gz: gz.write(raw)
          overlay=buf.getvalue(); op=root/'CURRENT_CAPABILITY_OWNER_EVIDENCE_OVERLAY_007.jsonl.gz'; op.write_bytes(overlay)
          summary={'schema':'DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-007','date':'2026-09-11','standing':'PASS__EXACT_PROMOTED_LEDGER_ADMITTED__CURRENT_OWNER_EVIDENCE_OVERLAY_BOUND','workflow_trigger_sha':os.environ['GITHUB_TRIGGER_SHA'],'ledger':{'path':str(ledger),'bytes':303526,'sha256':hashlib.sha256(ledger.read_bytes()).hexdigest(),'git_blob_sha1':'f15ec8be5fc820282d537b12c5bd40d55b044bd0','unique_capabilities':2935,'docx_rows':674,'t13_rows':40,'t14_rows':40},'overlay':{'path':str(op),'bytes':len(overlay),'sha256':hashlib.sha256(overlay).hexdigest(),'rows':2935,'owner_counts':dict(owners),'evidence_class_counts':dict(evidence)},'promotion_provenance':{'repair_packet':'DOCUMENT-DOCX-CLOSURE-REPAIR-001','exit_gate':'CUMULATIVE_DOCX_SOURCE_AND_LEDGER_RECONCILIATION_PASS','promoted_ledger_sha256':'dee2126069ef769983e305b2a351d7583cab02722dbdf32c82a5c36ff6a8b8bc'},'current_authority':{'work_package_owner':'SYSTEM_MASTER/DOCUMENTS','semantic_portfolio':'HEADLESS-CONTENT-ARTIFACTS-001','semantic_owner_path':'SYSTEM_MASTER','shared_runtime_provider':'SYSTEM_MASTER/CORE'},'current_exact_subject_binding':{'source_subject_sha':'ded21b569e29b7d162c50f7cb0692874e3f3acc2','qualification_id':'CR001-R4-GITHUB-NATIVE-QUALIFICATION-005','fresh_t13_t14_rows_bound':80},'nonclaims':['HISTORICAL_PASS_TRANSFER','ALL_2935_CURRENTLY_IMPLEMENTED','ALL_2935_CURRENTLY_QUALIFIED','FULL_ISO_XSD_CONFORMANCE','EXACT_MICROSOFT_WORD_FIDELITY','A01_PASS','PRODUCTION_PASS','DOCUMENTS_COMPLETE','FIRST_CLASS_DOCUMENT_SYSTEM_CREATED']}
          (root/'CURRENT-CAPABILITY-LEDGER-ADMISSION-007.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('OVERLAY_SHA256='+summary['overlay']['sha256'])
          PY

      - name: Gate 6 - seal closure records and remove temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_TRIGGER_SHA="$GITHUB_SHA" python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('governance/documents/capability-ledger'); summary=json.loads((root/'CURRENT-CAPABILITY-LEDGER-ADMISSION-007.json').read_text())
          overlay=root/'CURRENT_CAPABILITY_OWNER_EVIDENCE_OVERLAY_007.jsonl.gz'
          overlay_git=subprocess.check_output(['git','hash-object',str(overlay)],text=True).strip()
          receipt={'receipt_id':'DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-CLOSURE-RECEIPT-007','date':'2026-09-11','owner':'SYSTEM_MASTER/DOCUMENTS','work_package':'DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-007','standing':'CLOSED_PASS__EXACT_2935_LEDGER_ADMITTED__CURRENT_OWNER_EVIDENCE_OVERLAY_BOUND','006_base_commit':'7c720c41c15a7e569368f3923f706ca89a97c037','workflow_trigger_sha':os.environ['GITHUB_TRIGGER_SHA'],'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),'ledger_sha256':'dee2126069ef769983e305b2a351d7583cab02722dbdf32c82a5c36ff6a8b8bc','ledger_git_blob_sha1':'f15ec8be5fc820282d537b12c5bd40d55b044bd0','unique_capabilities':2935,'docx_rows':674,'t13_rows':40,'t14_rows':40,'overlay_sha256':summary['overlay']['sha256'],'overlay_git_blob_sha1':overlay_git,'overlay_rows':2935,'owner_counts':summary['overlay']['owner_counts'],'evidence_class_counts':summary['overlay']['evidence_class_counts'],'fresh_005_t13_t14_bindings':80,'admitted_source_subject_sha':'ded21b569e29b7d162c50f7cb0692874e3f3acc2','qualification_id':'CR001-R4-GITHUB-NATIVE-QUALIFICATION-005','source_mutated':False,'transport_payload_mutated':False,'ready_mutated':False,'qualification_mutated':False,'historical_pass_transfer':False,'nonclaims':['ALL_2935_CURRENTLY_IMPLEMENTED','ALL_2935_CURRENTLY_QUALIFIED','FULL_ISO_XSD_CONFORMANCE','EXACT_MICROSOFT_WORD_FIDELITY','A01_PASS','PRODUCTION_PASS','DOCUMENTS_COMPLETE'],'next_permitted_operation':'DOCUMENTS-R4-CAPABILITY-TRACE-RECONCILIATION-008 — bind the admitted 2935 capability denominator to current source/component/interface/test/dependency evidence, preserving owner and qualification boundaries and producing an exact open/reuse/repair/build denominator without completion inflation.'}
          p=pathlib.Path('documents/reconciliation'); p.mkdir(parents=True,exist_ok=True); (p/'DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-CLOSURE-RECEIPT-007.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (p/'DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-007.md').write_text('# DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-007\n\nStatus: CLOSED / PASS — EXACT 2,935-CAPABILITY LEDGER ADMITTED / CURRENT OWNER-EVIDENCE OVERLAY BOUND\n\nThe immutable promoted workbook is admitted at SHA-256 `dee2126069ef769983e305b2a351d7583cab02722dbdf32c82a5c36ff6a8b8bc`. The denominator is 2,935 unique capabilities, including 674 UDM-DOCX rows, T13 40 rows, and T14 40 rows. The overlay preserves historical evidence standing, binds only T13/T14 to fresh 005 exact-subject qualification, and does not transfer blanket PASS. Frozen 005 source, transport chunks, READY, and qualification are unchanged.\n')
          PY
          rm -rf transport/document-r4/capability-ledger-007/incoming-v2
          rm -f .github/workflows/document-r4-current-capability-ledger-admission-007-v2.yml
          git config user.name system-master-ledger-admission-bot
          git config user.email system-master-ledger-admission-bot@users.noreply.github.com
          git add -A
          test "$(git rev-parse HEAD:transport/document-r4/READY)" = "$(git hash-object transport/document-r4/READY)"
          test "$(git rev-parse HEAD:transport/document-r4/chunk-000.b64)" = 64034670dbbe18f6b629108bd1d9b1d8d81c4ac8
          test "$(git rev-parse HEAD:transport/document-r4/chunk-001.b64)" = 562ec2e184b6068e0f123c9e097d344a42c67dce
          test "$(git rev-parse HEAD:transport/document-r4/chunk-002.b64)" = 7b592c67e39a998301be7e5146533b842d724db2
          test "$(git rev-parse HEAD:transport/document-r4/chunk-003.b64)" = d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20
          test "$(git rev-parse HEAD:transport/document-r4/chunk-004.b64)" = 3518bf5ac92360b07f86c6107670da40f5830d1f
          git commit -m 'documents: admit exact current capability ledger 007'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Gate 7 - fast-forward only unchanged trigger and verify remote closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$FINAL_COMMIT"
          test "$(git rev-parse FETCH_HEAD:governance/documents/capability-ledger/ATOMIC_CAPABILITY_LEDGER_CR001_PROMOTED.xlsx)" = f15ec8be5fc820282d537b12c5bd40d55b044bd0
          test "$(git rev-parse FETCH_HEAD:transport/document-r4/chunk-000.b64)" = 64034670dbbe18f6b629108bd1d9b1d8d81c4ac8
          test "$(git rev-parse FETCH_HEAD:transport/document-r4/chunk-004.b64)" = 3518bf5ac92360b07f86c6107670da40f5830d1f
          git cat-file -e "FETCH_HEAD:transport/document-r4/READY"
          git cat-file -e "FETCH_HEAD:documents/reconciliation/DOCUMENTS-R4-CURRENT-CAPABILITY-LEDGER-ADMISSION-CLOSURE-RECEIPT-007.json"
          echo 'DOCUMENTS_R4_CURRENT_CAPABILITY_LEDGER_ADMISSION_007=CLOSED_PASS'
