name: LEARNING PILOT-001 RUN-001 Closed-Loop Completion Prequalification

on:
  push:
    branches: [learning/pilot-001-run-001-closed-loop-completion]
    paths:
      - ".github/workflows/learning-pilot-001-run-001-closed-loop-prequal.yml"
      - ".github/workflows/learning-pilot-001-run-001-closed-loop-a01.yml"
      - ".github/scripts/learning-pilot-001-run-001-closed-loop-qualify.js"
      - "learning/lab/LEARNING_LAB_PILOT_001_RUN_001_CLOSED_LOOP_COMPLETION.md"
      - "learning/lab/run_pilot001.py"
      - "learning/lab/run_pilot001_closed_loop.py"
      - "learning/lab/learning_lab/real_learner_pilot_completion.py"
      - "learning/lab/tests/test_real_learner_pilot_completion.py"
      - "learning/lab/tests/test_real_learner_pilot_closed_loop_launcher.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prequalify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false

      - name: Prepare evidence
        shell: bash
        run: |
          EVIDENCE_DIR="$RUNNER_TEMP/pilot001-run001-closed-loop-prequal-$GITHUB_RUN_ID"
          mkdir -p "$EVIDENCE_DIR"
          echo "EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-sha.txt"

      - name: Run repository-owned exact-subject qualifier
        shell: bash
        run: |
          A01_SUBJECT_SHA="$GITHUB_SHA" A01_EVIDENCE_DIR="$EVIDENCE_DIR" \
            node .github/scripts/learning-pilot-001-run-001-closed-loop-qualify.js

      - name: Verify thin caller remains shared-gateway only
        shell: bash
        run: |
          grep -q 'uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@main' \
            .github/workflows/learning-pilot-001-run-001-closed-loop-a01.yml
          ! grep -q 'runs-on:.*self-hosted' \
            .github/workflows/learning-pilot-001-run-001-closed-loop-a01.yml
          node .github/scripts/a01-control-plane-enforce.js selftest | tee "$EVIDENCE_DIR/control-plane-selftest.txt"
          node .github/scripts/a01-control-plane-enforce.js scan | tee "$EVIDENCE_DIR/control-plane-scan.txt"

      - name: Upload prequalification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-pilot-001-run-001-closed-loop-prequal-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot001-run001-closed-loop-prequal-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
