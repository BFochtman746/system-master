name: Literary Prose Perspective Revelation Calibration

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/perspective-revelation-calibration-003/**'
      - 'qualification/literary-prose-engine-001/extraction-calibration-001/candidate-002/source_heldout_label_ontology.py'
      - '.github/workflows/literary-prose-perspective-revelation-calibration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile perspective revelation calibration
        run: >-
          python -m py_compile
          qualification/literary-prose-engine-001/perspective-revelation-calibration-003/perspective_revelation_calibration.py
          qualification/literary-prose-engine-001/perspective-revelation-calibration-003/run_perspective_revelation_calibration_fixtures.py
      - name: Run perspective revelation calibration fixtures
        run: python qualification/literary-prose-engine-001/perspective-revelation-calibration-003/run_perspective_revelation_calibration_fixtures.py
