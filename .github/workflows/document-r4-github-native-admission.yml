name: Document R4 GitHub Native Admission

on:
  push:
    branches: [main]
    paths:
      - 'transport/document-r4/READY'

concurrency:
  group: document-r4-github-native-admission
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  admit-and-qualify:
    if: "${{ github.event.head_commit.message == 'transport: arm Document R4 import' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install bounded external qualification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils xz-utils
          command -v soffice
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdfimages

      - name: Reconstruct carrier and verify exact 225-file identity
        shell: bash
        run: |
          set -euo pipefail
          STAGE='transport/document-r4'
          ARCHIVE='/tmp/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz'
          EXPECTED='b6d0f8a98cea0615513eda07873b38532123585336de87c40350afeafa474edf'
          test -f "$STAGE/READY"
          test "$(find "$STAGE" -maxdepth 1 -name 'chunk-*.b64' -type f | wc -l)" -eq 100
          cat "$STAGE"/chunk-*.b64 | tr -d '\r\n' | base64 --decode > "$ARCHIVE"
          echo "$EXPECTED  $ARCHIVE" | sha256sum -c -
          python3 - <<'PY'
          import csv, hashlib, io, json, pathlib, tarfile
          archive = pathlib.Path('/tmp/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz')
          expected = 'b6d0f8a98cea0615513eda07873b38532123585336de87c40350afeafa474edf'
          raw = archive.read_bytes()
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('carrier digest mismatch')
          dest = pathlib.Path('recovered/document/cr001-r4')
          if dest.exists():
              raise SystemExit('destination already exists; refusing overwrite')
          source_dest = dest / 'source'
          evidence_dest = dest / 'evidence'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as tf:
              regular = [m for m in tf.getmembers() if m.isfile()]
              if len(regular) != 227:
                  raise SystemExit(f'expected 227 regular entries, got {len(regular)}')
              by_name = {}
              for member in regular:
                  rel = pathlib.PurePosixPath(member.name)
                  if rel.is_absolute() or '..' in rel.parts or member.name in by_name:
                      raise SystemExit(f'unsafe/duplicate tar path: {member.name}')
                  fh = tf.extractfile(member)
                  if fh is None:
                      raise SystemExit(f'unreadable tar member: {member.name}')
                  by_name[member.name] = fh.read()
              manifest_name = 'CANONICAL-SOURCE-TREE-MANIFEST.csv'
              receipt_name = 'RECONSTRUCTION-RECEIPT.json'
              if manifest_name not in by_name or receipt_name not in by_name:
                  raise SystemExit('required evidence missing')
              manifest_bytes = by_name[manifest_name]
              rows = list(csv.DictReader(io.StringIO(manifest_bytes.decode('utf-8-sig'))))
              if len(rows) != 225:
                  raise SystemExit(f'expected 225 manifest rows, got {len(rows)}')
              seen = set()
              for row in rows:
                  rel = pathlib.PurePosixPath(row['path'])
                  if rel.is_absolute() or '..' in rel.parts or str(rel) in seen:
                      raise SystemExit(f'unsafe/duplicate manifest path: {rel}')
                  seen.add(str(rel))
                  key = 'source/' + str(rel)
                  if key not in by_name:
                      raise SystemExit(f'missing source: {rel}')
                  data = by_name[key]
                  if len(data) != int(row['bytes']):
                      raise SystemExit(f'byte-size mismatch: {rel}')
                  if hashlib.sha256(data).hexdigest() != row['sha256']:
                      raise SystemExit(f'sha256 mismatch: {rel}')
                  data.decode('utf-8')
                  target = source_dest.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              evidence_dest.mkdir(parents=True, exist_ok=True)
              (evidence_dest / manifest_name).write_bytes(manifest_bytes)
              (evidence_dest / receipt_name).write_bytes(by_name[receipt_name])
              verification = {
                  'transport_tar_xz_sha256': expected,
                  'transport_regular_entries': len(regular),
                  'manifest_rows': len(rows),
                  'verified_source_files': len(seen),
                  'identity_result': 'PASS__225_OF_225_EXACT_MATCH'
              }
              (evidence_dest / 'GITHUB-NATIVE-IMPORT-VERIFICATION.json').write_text(json.dumps(verification, indent=2) + '\n')
          PY
          git diff --check

      - name: Commit immutable source-custody subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'system-master-admission-bot'
          git config user.email 'system-master-admission-bot@users.noreply.github.com'
          git add recovered/document/cr001-r4
          git commit -m 'document: admit exact CR001-R4 source custody'
          SUBJECT_SHA="$(git rev-parse HEAD)"
          echo "sha=$SUBJECT_SHA" >> "$GITHUB_OUTPUT"
          echo "DOCUMENT_R4_SOURCE_SUBJECT_SHA=$SUBJECT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Strict Java 21 compile exact source subject
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          OUT='/tmp/document-r4-classes'
          QUAL='/tmp/document-r4-qual'
          mkdir -p "$OUT" "$QUAL"
          mapfile -d '' JAVA_FILES < <(find "$ROOT/src/main/java" "$ROOT/src/test/java" -type f -name '*.java' -print0 | sort -z)
          test "${#JAVA_FILES[@]}" -eq 225
          printf 'java_source_files=%s\n' "${#JAVA_FILES[@]}" | tee "$QUAL/compile.log"
          javac --release 21 -Xlint:all -Werror -d "$OUT" "${JAVA_FILES[@]}" 2>&1 | tee -a "$QUAL/compile.log"
          echo 'STRICT_JAVA21_COMPILE=PASS' | tee -a "$QUAL/compile.log"

      - name: Run every portable Document suite
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          OUT='/tmp/document-r4-classes'
          QUAL='/tmp/document-r4-qual'
          : > "$QUAL/portable.log"
          COUNT=0
          while IFS= read -r file; do
            pkg="$(sed -n 's/^package \(.*\);/\1/p' "$file" | head -n 1)"
            cls="$(basename "$file" .java)"
            test -n "$pkg"
            fqcn="$pkg.$cls"
            echo "RUN=$fqcn" | tee -a "$QUAL/portable.log"
            java -cp "$OUT" "$fqcn" 2>&1 | tee -a "$QUAL/portable.log"
            COUNT=$((COUNT + 1))
          done < <(find "$ROOT/src/test/java" -type f -name '*PortableTests.java' | sort)
          test "$COUNT" -gt 0
          echo "PORTABLE_TEST_CLASSES_PASS=$COUNT" | tee -a "$QUAL/portable.log"
          echo "$COUNT" > "$QUAL/portable-count.txt"

      - name: Run T13 and T14 external qualification
        shell: bash
        run: |
          set -euo pipefail
          OUT='/tmp/document-r4-classes'
          QUAL='/tmp/document-r4-qual'
          SOFFICE="$(command -v soffice)"
          PDFINFO="$(command -v pdfinfo)"
          PDFTOTEXT="$(command -v pdftotext)"
          PDFTOPPM="$(command -v pdftoppm)"
          PDFIMAGES="$(command -v pdfimages)"
          : > "$QUAL/external.log"
          for cls in \
            org.systemmaster.tools.document.DocumentDocxMasteryT13ExternalQualification \
            org.systemmaster.tools.document.DocumentDocxMasteryT14ExternalQualification; do
            echo "RUN=$cls" | tee -a "$QUAL/external.log"
            java -cp "$OUT" "$cls" "$SOFFICE" "$PDFINFO" "$PDFTOTEXT" "$PDFTOPPM" "$PDFIMAGES" 2>&1 | tee -a "$QUAL/external.log"
          done
          echo 'R4_EXTERNAL_T13_T14=PASS' | tee -a "$QUAL/external.log"

      - name: Seal exact-subject receipt
        shell: bash
        env:
          SUBJECT_SHA: ${{ steps.subject.outputs.sha }}
        run: |
          set -euo pipefail
          QUAL='/tmp/document-r4-qual'
          DEST='qualification/document-r4/CR001-R4-GITHUB-NATIVE-QUALIFICATION-002'
          mkdir -p "$DEST"
          cp "$QUAL/compile.log" "$DEST/STRICT-JAVA21-COMPILE.log"
          cp "$QUAL/portable.log" "$DEST/PORTABLE-SUITES.log"
          cp "$QUAL/external.log" "$DEST/T13-T14-EXTERNAL.log"
          PORTABLE_COUNT="$(cat "$QUAL/portable-count.txt")"
          python3 - "$SUBJECT_SHA" "$PORTABLE_COUNT" <<'PY'
          import json, pathlib, sys
          subject_sha, portable_count = sys.argv[1], int(sys.argv[2])
          receipt = {
              'qualification_id': 'CR001-R4-GITHUB-NATIVE-QUALIFICATION-002',
              'qualified_git_subject_sha': subject_sha,
              'transport_tar_xz_sha256': 'b6d0f8a98cea0615513eda07873b38532123585336de87c40350afeafa474edf',
              'source_identity': 'PASS__225_OF_225_EXACT_MATCH',
              'strict_java21_compile': 'PASS',
              'portable_test_classes_passed': portable_count,
              'r4_t13_external': 'PASS',
              'r4_t14_external': 'PASS',
              'a01_pass': False,
              'native_office_pass': False,
              'production_pass': False,
              'standing': 'GITHUB_NATIVE_SOURCE_CUSTODY_PASS__FRESH_EXACT_GIT_SHA_PORTABLE_HOSTED_QUALIFICATION_PASS__A01_NATIVE_PRODUCTION_NOT_CLAIMED',
              'authority_boundary': 'Historical qualification did not transfer. Fresh hosted execution is bound to this exact Git subject.'
          }
          pathlib.Path('qualification/document-r4/CR001-R4-GITHUB-NATIVE-QUALIFICATION-002/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          printf '%s\n' "$SUBJECT_SHA" > "$DEST/QUALIFIED-SUBJECT-SHA.txt"
          git add "$DEST"
          git rm -r transport/document-r4
          git commit -m 'document: seal CR001-R4 exact-subject qualification'

      - name: Push only if trigger remains current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ github.sha }}"
          git push origin HEAD:main

      - name: Publish admission summary
        if: success()
        shell: bash
        run: |
          echo 'DOCUMENT_R4_GITHUB_NATIVE_ADMISSION=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'source_identity=225/225 exact manifest match' >> "$GITHUB_STEP_SUMMARY"
          echo 'strict_java21_compile=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'portable_suites=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 't13_external=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 't14_external=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'A-01/native Office/production authority not claimed.' >> "$GITHUB_STEP_SUMMARY"
