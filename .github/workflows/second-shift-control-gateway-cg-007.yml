name: Second Shift Control Gateway CG-007 Host Qualification

on:
  push:
    branches:
      - second-shift-control-gateway/cg-007-validator-closure
    paths:
      - 'control-gateway/**'
      - '.github/workflows/second-shift-control-gateway-cg-007.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Validator Closure / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout exact CG-007 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Syntax-check control-gateway JavaScript
        working-directory: control-gateway
        run: find src test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Parse CG-007 machine contract registry
        working-directory: control-gateway
        run: node -e "JSON.parse(require('node:fs').readFileSync('contracts/cg007-validation-contracts.json','utf8'))"
      - name: Run CG-003 through CG-007 qualification suite
        working-directory: control-gateway
        run: node --test
