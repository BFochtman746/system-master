name: Literary Prose STEP-008 Opportunity Admission Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/step-f/step_008_opportunity_admission.py'
      - 'qualification/literary-prose-engine-001/step-f/run_step_008_opportunity_admission_fixtures.py'
      - 'qualification/literary-prose-engine-001/unification-001/STEP-008-OPPORTUNITY-ADMISSION-CONTRACT-v1.json'
      - '.github/workflows/literary-prose-step-008-opportunity-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile STEP-008 opportunity admission
        run: python -m py_compile qualification/literary-prose-engine-001/step-f/step_008_opportunity_admission.py qualification/literary-prose-engine-001/step-f/run_step_008_opportunity_admission_fixtures.py
      - name: Qualify STEP-008 opportunity admission
        run: python qualification/literary-prose-engine-001/step-f/run_step_008_opportunity_admission_fixtures.py
