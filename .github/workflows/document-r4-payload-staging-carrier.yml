name: Document R4 SHA-Gated Carrier Staging 004

on:
  push:
    branches:
      - documents/r4-payload-staging-004
    paths:
      - 'transport/document-r4/incoming/carrier-parts/CARRIER-PARTS.json'

concurrency:
  group: document-r4-payload-staging-004
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble-verify-freeze-seal:
    if: "${{ github.event.head_commit.message == 'transport: stage SHA-gated Document R4 carrier parts' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact transfer subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify part objects and bind exact temporary carrier commit
        shell: bash
        run: |
          set -euo pipefail
          branch='documents/r4-payload-staging-004'
          root='transport/document-r4'
          incoming="$root/incoming/carrier-parts"
          manifest="$incoming/CARRIER-PARTS.json"
          carrier="$root/incoming/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz"
          test ! -e "$root/READY"
          remote_head="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          incoming=pathlib.Path('transport/document-r4/incoming/carrier-parts')
          spec=json.loads((incoming/'CARRIER-PARTS.json').read_text())
          actual=sorted(p.name for p in incoming.glob('part-*') if p.is_file())
          expected=[x['filename'] for x in spec['parts']]
          if actual != expected:
              raise SystemExit(f'part inventory mismatch expected={expected} actual={actual}')
          pieces=[]
          for item in spec['parts']:
              p=incoming/item['filename']
              b=p.read_bytes()
              if len(b) != item['bytes']:
                  raise SystemExit(f'part byte mismatch: {p}')
              if hashlib.sha256(b).hexdigest() != item['sha256']:
                  raise SystemExit(f'part sha256 mismatch: {p}')
              git_sha=subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
              if git_sha != item['git_blob_sha1']:
                  raise SystemExit(f'part Git blob mismatch: {p}: {git_sha}')
              pieces.append(b)
          encoded=b''.join(pieces)
          if len(encoded) != spec['encoded_bytes'] or hashlib.sha256(encoded).hexdigest() != spec['encoded_sha256']:
              raise SystemExit('encoded carrier mismatch')
          carrier=base64.b64decode(encoded, validate=True)
          if len(carrier) != spec['carrier_bytes'] or hashlib.sha256(carrier).hexdigest() != spec['carrier_sha256']:
              raise SystemExit('carrier identity mismatch')
          out=pathlib.Path('transport/document-r4/incoming')/spec['carrier_filename']
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(carrier)
          git_sha=subprocess.check_output(['git','hash-object',str(out)], text=True).strip()
          if git_sha != spec['carrier_git_blob_sha1']:
              raise SystemExit(f'carrier Git blob mismatch: {git_sha}')
          print(f'PARTS_VERIFIED={len(actual)}')
          print(f'CARRIER_BYTES={len(carrier)}')
          print(f'CARRIER_SHA256={hashlib.sha256(carrier).hexdigest()}')
          print(f'CARRIER_GIT_BLOB={git_sha}')
          PY
          cp "$manifest" /tmp/CARRIER-PARTS.json
          git config user.name 'system-master-staging-bot'
          git config user.email 'system-master-staging-bot@users.noreply.github.com'
          git rm -r "$incoming"
          git add "$carrier"
          git commit -m 'transport: bind exact temporary Document R4 carrier'
          carrier_commit="$(git rev-parse HEAD)"
          carrier_blob="$(git hash-object "$carrier")"
          test "$carrier_blob" = 'c775d9687f3d176f45dc8768c5636c60a387a8b8'
          printf '%s\n' "$carrier_commit" > /tmp/carrier-commit
          printf '%s\n' "$carrier_blob" > /tmp/carrier-blob

      - name: Derive canonical chunks and verify exact 225-file source
        shell: bash
        run: |
          set -euo pipefail
          root='transport/document-r4'
          carrier="$root/incoming/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          root=pathlib.Path('transport/document-r4')
          carrier=(root/'incoming/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz').read_bytes()
          if len(carrier) != 301008 or hashlib.sha256(carrier).hexdigest() != '77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd':
              raise SystemExit('temporary carrier changed')
          manifest=json.loads((root/'CHUNK-MANIFEST.json').read_text())
          expected_git={
            'chunk-000.b64':'64034670dbbe18f6b629108bd1d9b1d8d81c4ac8',
            'chunk-001.b64':'562ec2e184b6068e0f123c9e097d344a42c67dce',
            'chunk-002.b64':'7b592c67e39a998301be7e5146533b842d724db2',
            'chunk-003.b64':'d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20',
            'chunk-004.b64':'3518bf5ac92360b07f86c6107670da40f5830d1f',
          }
          off=0
          for item in manifest['chunks']:
              raw=carrier[off:off+item['raw_bytes']]
              off += item['raw_bytes']
              if len(raw) != item['raw_bytes'] or hashlib.sha256(raw).hexdigest() != item['raw_sha256']:
                  raise SystemExit(f'raw chunk mismatch: {item["filename"]}')
              encoded=base64.b64encode(raw)+b'\n'
              if len(encoded) != item['base64_file_bytes'] or hashlib.sha256(encoded).hexdigest() != item['base64_file_sha256']:
                  raise SystemExit(f'encoded chunk mismatch: {item["filename"]}')
              p=root/item['filename']
              p.write_bytes(encoded)
              git_sha=subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
              if git_sha != expected_git[item['filename']]:
                  raise SystemExit(f'chunk Git blob mismatch: {item["filename"]}: {git_sha}')
          if off != len(carrier):
              raise SystemExit(f'carrier partition mismatch {off} != {len(carrier)}')
          print(f'CHUNKS_ASSEMBLED={len(manifest["chunks"])}')
          PY
          rm -rf /tmp/document-r4-staged-source
          python3 tools/document-r4/verify_and_extract_transport.py \
            --contract "$root/TRANSPORT-CONTRACT.json" \
            --chunk-manifest "$root/CHUNK-MANIFEST.json" \
            --chunks "$root" \
            --carrier-out /tmp/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz \
            --extract-out /tmp/document-r4-staged-source
          test "$(find /tmp/document-r4-staged-source/source -type f -name '*.java' | wc -l)" -eq 225
          sha256sum /tmp/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz | grep '^77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd '

      - name: Freeze full staging state without arming
        shell: bash
        run: |
          set -euo pipefail
          root='transport/document-r4'
          python3 - <<'PY'
          import json, pathlib
          path=pathlib.Path('transport/document-r4/STAGING.json')
          staging=json.loads(path.read_text())
          staging.update({
            'status':'FULL_TRANSPORT_STAGED__NOT_ARMED',
            'staged_chunk_range':'000-004',
            'staged_chunks':5,
            'staged_raw_bytes':301008,
            'ready_marker_present':False,
            'github_native_source_custody':'BLOCKED',
            'historical_pass_transfer':False,
            'rule':'All 5 exact canonical payload chunks are committed and verified. READY remains forbidden in DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-004; GitHub-native source custody remains BLOCKED until the separate arming/admission operation runs fresh exact-subject qualification.'
          })
          path.write_text(json.dumps(staging, indent=2)+'\n')
          PY
          test ! -e "$root/READY"
          mkdir -p documents/reconciliation
          cp /tmp/CARRIER-PARTS.json documents/reconciliation/DOCUMENTS-R4-CARRIER-TRANSFER-MANIFEST-004.json
          rm -f "$root/incoming/CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz"
          rmdir "$root/incoming" 2>/dev/null || true
          rm -f .github/workflows/document-r4-payload-staging-carrier.yml
          git diff --check
          git add "$root" .github/workflows/document-r4-payload-staging-carrier.yml documents/reconciliation/DOCUMENTS-R4-CARRIER-TRANSFER-MANIFEST-004.json
          git commit -m 'transport: freeze exact Document R4 payload staged not armed'
          staging_commit="$(git rev-parse HEAD)"
          printf '%s\n' "$staging_commit" > /tmp/staging-commit
          test "$(git ls-tree "$staging_commit" "$root/chunk-000.b64" | awk '{print $3}')" = '64034670dbbe18f6b629108bd1d9b1d8d81c4ac8'
          test "$(git ls-tree "$staging_commit" "$root/chunk-001.b64" | awk '{print $3}')" = '562ec2e184b6068e0f123c9e097d344a42c67dce'
          test "$(git ls-tree "$staging_commit" "$root/chunk-002.b64" | awk '{print $3}')" = '7b592c67e39a998301be7e5146533b842d724db2'
          test "$(git ls-tree "$staging_commit" "$root/chunk-003.b64" | awk '{print $3}')" = 'd67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20'
          test "$(git ls-tree "$staging_commit" "$root/chunk-004.b64" | awk '{print $3}')" = '3518bf5ac92360b07f86c6107670da40f5830d1f'
          remote_head="$(git ls-remote origin refs/heads/documents/r4-payload-staging-004 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:documents/r4-payload-staging-004

      - name: Verify remote Git objects and remote 225-of-225 reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          api="https://api.github.com/repos/$repo"
          staging_commit="$(cat /tmp/staging-commit)"
          carrier_commit="$(cat /tmp/carrier-commit)"
          carrier_blob="$(cat /tmp/carrier-blob)"
          remote_head="$(git ls-remote origin refs/heads/documents/r4-payload-staging-004 | awk '{print $1}')"
          test "$remote_head" = "$staging_commit"
          mkdir -p /tmp/remote-r4
          python3 - "$api" "$staging_commit" "$carrier_blob" <<'PY'
          import base64, hashlib, json, os, pathlib, sys, urllib.request, urllib.error
          api, commit, carrier_blob = sys.argv[1:]
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          expected={
            'chunk-000.b64':('64034670dbbe18f6b629108bd1d9b1d8d81c4ac8','543548f83ba6a4326d3c06d07130f2fae7629c039942a2df7c4708adb05b75e5'),
            'chunk-001.b64':('562ec2e184b6068e0f123c9e097d344a42c67dce','0621f5e45f7e54247caae9cbf1cf061d65fc1efa3e64f05f18b33070ae0d3db3'),
            'chunk-002.b64':('7b592c67e39a998301be7e5146533b842d724db2','bdae07feeb48bdc8d50e257e2df10a7ca689eef72611d9f4298a3b303b639fec'),
            'chunk-003.b64':('d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20','f7e26743eaa47c4d03c339f7f73011b342171363ccd6cec32b7c1aaf2ae53b72'),
            'chunk-004.b64':('3518bf5ac92360b07f86c6107670da40f5830d1f','3b87a28d81c99941d0b1df20b120c34db4268d704ca35e5f2fc47df0705b579d'),
          }
          out=pathlib.Path('/tmp/remote-r4')
          for name,(git_sha,sha256) in expected.items():
              obj=get(f'{api}/git/blobs/{git_sha}')
              if obj['sha'] != git_sha: raise SystemExit(f'remote blob identity mismatch: {name}')
              data=base64.b64decode(obj['content'])
              if hashlib.sha256(data).hexdigest() != sha256: raise SystemExit(f'remote sha256 mismatch: {name}')
              (out/name).write_bytes(data)
          obj=get(f'{api}/git/blobs/{carrier_blob}')
          data=base64.b64decode(obj['content'])
          if obj['sha'] != carrier_blob or len(data) != 301008 or hashlib.sha256(data).hexdigest() != '77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd':
              raise SystemExit('remote temporary carrier verification failed')
          try:
              get(f'{api}/contents/transport/document-r4/READY?ref={commit}')
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          else:
              raise SystemExit('READY unexpectedly present remotely')
          print('REMOTE_CHUNK_BLOBS=5/5')
          print('REMOTE_CARRIER_BLOB=PASS')
          print('REMOTE_READY=ABSENT')
          PY
          rm -rf /tmp/document-r4-remote-source
          python3 tools/document-r4/verify_and_extract_transport.py \
            --contract transport/document-r4/TRANSPORT-CONTRACT.json \
            --chunk-manifest transport/document-r4/CHUNK-MANIFEST.json \
            --chunks /tmp/remote-r4 \
            --carrier-out /tmp/remote-r4-carrier.tar.xz \
            --extract-out /tmp/document-r4-remote-source
          test "$(find /tmp/document-r4-remote-source/source -type f -name '*.java' | wc -l)" -eq 225
          sha256sum /tmp/remote-r4-carrier.tar.xz | grep '^77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd '
          echo 'REMOTE_SOURCE_ROWS=225/225'

      - name: Seal 004 closure receipt after remote verification
        shell: bash
        run: |
          set -euo pipefail
          staging_commit="$(cat /tmp/staging-commit)"
          carrier_commit="$(cat /tmp/carrier-commit)"
          receipt='documents/reconciliation/DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-CLOSURE-RECEIPT-004.json'
          python3 - "$staging_commit" "$carrier_commit" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          staging_commit, carrier_commit, transfer_commit=sys.argv[1:]
          receipt={
            'receipt_id':'DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-CLOSURE-RECEIPT-004',
            'date':'2026-09-11',
            'owner':'SYSTEM_MASTER/DOCUMENTS',
            'work_package':'DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-004',
            'standing':'CLOSED_PASS__FULL_TRANSPORT_STAGED__NOT_ARMED',
            'transfer_commit':transfer_commit,
            'carrier_commit':carrier_commit,
            'staging_commit':staging_commit,
            'transfer':{
              'method':'26 SHA-gated whole Git blobs carrying RFC4648 base64 carrier text; no manually retyped payload bytes',
              'part_count':26,
              'encoded_bytes':401344,
              'encoded_sha256':'67e6e82c1b713c1939ccc3aa345ca2ceb0f3b086e0f849e27725c66b254f6f4f',
              'transfer_manifest_sha256':'58bba549fa395da331c86251be98645b7995c7318c0dfca9d15911b3fcb84a0f'
            },
            'carrier':{
              'filename':'CR001_R4_225_SOURCE_WITH_EVIDENCE_20260910.tar.xz',
              'bytes':301008,
              'sha256':'77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd',
              'git_blob_sha1':'c775d9687f3d176f45dc8768c5636c60a387a8b8',
              'remote_git_blob_verified':True
            },
            'chunks':[
              {'filename':'chunk-000.b64','git_blob_sha1':'64034670dbbe18f6b629108bd1d9b1d8d81c4ac8','sha256':'543548f83ba6a4326d3c06d07130f2fae7629c039942a2df7c4708adb05b75e5'},
              {'filename':'chunk-001.b64','git_blob_sha1':'562ec2e184b6068e0f123c9e097d344a42c67dce','sha256':'0621f5e45f7e54247caae9cbf1cf061d65fc1efa3e64f05f18b33070ae0d3db3'},
              {'filename':'chunk-002.b64','git_blob_sha1':'7b592c67e39a998301be7e5146533b842d724db2','sha256':'bdae07feeb48bdc8d50e257e2df10a7ca689eef72611d9f4298a3b303b639fec'},
              {'filename':'chunk-003.b64','git_blob_sha1':'d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20','sha256':'f7e26743eaa47c4d03c339f7f73011b342171363ccd6cec32b7c1aaf2ae53b72'},
              {'filename':'chunk-004.b64','git_blob_sha1':'3518bf5ac92360b07f86c6107670da40f5830d1f','sha256':'3b87a28d81c99941d0b1df20b120c34db4268d704ca35e5f2fc47df0705b579d'}
            ],
            'remote_chunk_git_blobs_verified':'5/5',
            'remote_source_verification':'225/225 exact path+size+SHA via canonical carrier reconstruction',
            'ready_marker_present':False,
            'staging_status':'FULL_TRANSPORT_STAGED__NOT_ARMED',
            'staging_frozen':True,
            'historical_pass_transfer':False,
            'github_native_source_custody':'BLOCKED_PENDING_SEPARATE_ARMING_ADMISSION',
            'nonclaims':['READY_ARMED','GITHUB_NATIVE_SOURCE_CUSTODY_PASS','HISTORICAL_QUALIFICATION_TRANSFER','DOCUMENTS_COMPLETE'],
            'next_permitted_operation':'Separate READY arming/admission operation with fresh exact-subject qualification; do not mutate frozen 004 staging payload.'
          }
          p=pathlib.Path('documents/reconciliation/DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-CLOSURE-RECEIPT-004.json')
          p.write_text(json.dumps(receipt, indent=2)+'\n')
          status=pathlib.Path('documents/reconciliation/DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-004.md')
          text=status.read_text()
          if 'Status: BLOCKED / EXTERNAL FILE-CAPABLE TRANSPORT REQUIRED' in text:
              text=text.replace('Status: BLOCKED / EXTERNAL FILE-CAPABLE TRANSPORT REQUIRED','Status: CLOSED / PASS — FULL TRANSPORT STAGED / NOT ARMED',1)
          if '## Closure resolution' not in text:
              text += f'\n## Closure resolution\n- Closure receipt: `DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-CLOSURE-RECEIPT-004.json`\n- Staging commit: `{staging_commit}`\n- Remote canonical chunk Git blobs: 5/5 verified.\n- Remote carrier SHA-256: `77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd`.\n- Exact source reconstruction: 225/225 verified.\n- `READY`: absent.\n- Historical PASS transfer: false.\n- GitHub-native source custody remains pending the separate arming/admission operation.\n'
          status.write_text(text)
          PY
          git diff --check
          git add "$receipt" documents/reconciliation/DOCUMENTS-R4-GITHUB-NATIVE-PAYLOAD-STAGING-004.md
          git commit -m 'documents: seal R4 payload staging 004 closure receipt'
          closure_commit="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/documents/r4-payload-staging-004 | awk '{print $1}')"
          test "$remote_head" = "$staging_commit"
          git push origin HEAD:documents/r4-payload-staging-004
          printf '%s\n' "$closure_commit" > /tmp/closure-commit
