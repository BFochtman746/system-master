name: Book System Lifecycle Current Parent Compatibility Hosted Prequalification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "qualification/book-system/lifecycle-transition-compatibility-001/**"
      - "qualification/book-system/export-freeze-001/BOOK-SYSTEM-LIFECYCLE-PARENT-IDENTITY-COMPATIBILITY-FINDING-001.json"
      - "system-master/book-system/lifecycle-current-parent-compatibility-adapter.js"
      - ".github/scripts/book-system-lifecycle-current-parent-compatibility-001-qualify.js"
      - ".github/workflows/book-system-lifecycle-current-parent-compatibility-001-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Lifecycle current-parent compatibility prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Syntax check compatibility adapter and qualifier
        run: |
          node --check system-master/book-system/lifecycle-current-parent-compatibility-adapter.js
          node --check .github/scripts/book-system-lifecycle-current-parent-compatibility-001-qualify.js
      - name: Run compatibility qualifier and Lifecycle v1 regressions
        run: node .github/scripts/book-system-lifecycle-current-parent-compatibility-001-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BOOK-SYSTEM-LIFECYCLE-CURRENT-PARENT-COMPATIBILITY-ADAPTER-001-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/book-lifecycle-current-parent-compatibility-evidence
          if-no-files-found: warn
          retention-days: 30
