name: LEARNING-LAB-QUAL-001 Integrated IMPL-016 V2 Qualification

on:
  push:
    branches:
      - learning/qual-001-integrated-impl016-v2
    paths:
      - "learning/qualification/RUN-QUAL-001-INTEGRATED-IMPL016-V2"

permissions:
  contents: read

concurrency:
  group: learning-qual-001-integrated-impl016-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify repaired IMPL-016 closed loop on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact integrated qualification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          architecture: x64
          check-latest: false

      - name: Prepare bounded evidence directory
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-qual-001-integrated-impl016-v2-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo source_commit=%GITHUB_SHA%>"%EVIDENCE_DIR%\provenance.txt"
          echo repaired_impl016_head=9e1fa5f3c087b2691b28b445f0be4eb60d1cd2aa>>"%EVIDENCE_DIR%\provenance.txt"
          echo export_repair_commit=9fba64a120ccb8c59b9b5f9b8cbf998f47228d12>>"%EVIDENCE_DIR%\provenance.txt"
          echo qual001_harness_blob=241afa9d12f38ade4f16f5aa5755db7ab919804b>>"%EVIDENCE_DIR%\provenance.txt"
          echo runner=%RUNNER_NAME%>>"%EVIDENCE_DIR%\provenance.txt"
          echo machine=%COMPUTERNAME%>>"%EVIDENCE_DIR%\provenance.txt"
          python --version>>"%EVIDENCE_DIR%\provenance.txt" 2>&1
          type "%EVIDENCE_DIR%\provenance.txt"

      - name: Compile Learning package
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m compileall -q learning_lab >"%EVIDENCE_DIR%\compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\compile.txt" & exit /b 1)

      - name: Run baseline diagnostic regression focus
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_baseline_diagnostic.py" -v >"%EVIDENCE_DIR%\baseline-tests.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\baseline-tests.txt"
          exit /b %RC%

      - name: Run adaptive multi-session regression focus
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_adaptive_multisession.py" -v >"%EVIDENCE_DIR%\adaptive-multisession-tests.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\adaptive-multisession-tests.txt"
          exit /b %RC%

      - name: Run IMPL-016 adaptive-entry continuity focus
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_adaptive_entry_journey.py" -v >"%EVIDENCE_DIR%\adaptive-entry-impl016-tests.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\adaptive-entry-impl016-tests.txt"
          exit /b %RC%

      - name: Run full Learning regression suite
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_*.py" -v >"%EVIDENCE_DIR%\full-learning-tests.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\full-learning-tests.txt"
          exit /b %RC%

      - name: Run QUAL-001 fail-first closed-loop campaign
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python qualification_qual001.py --output "%EVIDENCE_DIR%\qualification_receipt_qual001.json" >"%EVIDENCE_DIR%\qual001-stdout.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\qual001-stdout.txt"
          if exist "%EVIDENCE_DIR%\qualification_receipt_qual001.json" type "%EVIDENCE_DIR%\qualification_receipt_qual001.json"
          exit /b %RC%

      - name: Write integrated qualification marker
        shell: cmd
        run: |
          echo objective=LEARNING-LAB-QUAL-001-INTEGRATED-IMPL016-V2>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo source_commit=%GITHUB_SHA%>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo repaired_impl016_head=9e1fa5f3c087b2691b28b445f0be4eb60d1cd2aa>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo baseline_focus=PASS>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo adaptive_multisession_focus=PASS>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo adaptive_entry_impl016_focus=PASS>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo full_learning_suite=PASS>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo qual001_campaign=PASS>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo portable_closed_loop_behavior=PROVEN>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo production_system_master_integration=NOT_PROVEN>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo psychometric_validity=NOT_PROVEN>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo real_learner_effectiveness=NOT_PROVEN>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo target_native_iphone_behavior=NOT_PROVEN>>"%EVIDENCE_DIR%\integrated-summary.txt"
          echo qualification=PASS_LEARNING_QUAL_001_INTEGRATED_IMPL016_V2>>"%EVIDENCE_DIR%\integrated-summary.txt"
          type "%EVIDENCE_DIR%\integrated-summary.txt"

      - name: Publish integrated qualification summary
        if: always()
        shell: cmd
        run: |
          echo ## LEARNING-LAB-QUAL-001 INTEGRATED IMPL-016 V2>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"
          if defined EVIDENCE_DIR if exist "%EVIDENCE_DIR%\integrated-summary.txt" type "%EVIDENCE_DIR%\integrated-summary.txt">>"%GITHUB_STEP_SUMMARY%"
          if defined EVIDENCE_DIR if exist "%EVIDENCE_DIR%\qualification_receipt_qual001.json" type "%EVIDENCE_DIR%\qualification_receipt_qual001.json">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload integrated qualification evidence
        if: always() && env.EVIDENCE_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-qual-001-integrated-impl016-v2-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
