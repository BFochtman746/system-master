name: Book B03 D1 Story Bible Knowledge Qualification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - 'system-master/book-system/book-story-bible-knowledge-v1.js'
      - 'system-master/book-system/book-story-bible-knowledge-v1.test.js'
      - '.github/workflows/book-b03-d1-story-bible-knowledge-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-story-bible-knowledge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Record exact subject
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Run B03 D1 K01-K32
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-knowledge-v1.test.js | tee b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"result":"PASS"' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"denominator":"K01-K32"' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"cases":32' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"materializer_implemented":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"invalidation_engine_implemented":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"canonical_admission_implemented":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"b01_registry_modified":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"model_accuracy_claimed":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"historical_pass_transferred":0' b03-d1-k01-k32-${{ matrix.node-version }}.log
          grep -F '"canonical_effect":false' b03-d1-k01-k32-${{ matrix.node-version }}.log
