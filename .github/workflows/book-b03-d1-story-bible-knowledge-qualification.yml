name: Book B03 D1 Story Bible Knowledge Bootstrap Qualification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - '.github/workflows/book-b03-d1-story-bible-knowledge-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact D1 source and tests
        run: |
          set -euo pipefail
          mkdir -p system-master/book-system
          base64 -d qualification/book-system/reconstruction/.b03-d1-src-payload.b64 | gzip -d > system-master/book-system/book-story-bible-knowledge-v1.js
          base64 -d qualification/book-system/reconstruction/.b03-d1-test-payload.b64 | gzip -d > system-master/book-system/book-story-bible-knowledge-v1.test.js
      - name: Run locked K01-K32 denominator
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-knowledge-v1.test.js | tee b03-d1-k01-k32.log
          grep -F '"result":"PASS"' b03-d1-k01-k32.log
          grep -F '"denominator":"K01-K32"' b03-d1-k01-k32.log
          grep -F '"cases":32' b03-d1-k01-k32.log
          grep -F '"materializer_implemented":false' b03-d1-k01-k32.log
          grep -F '"invalidation_engine_implemented":false' b03-d1-k01-k32.log
          grep -F '"canonical_admission_implemented":false' b03-d1-k01-k32.log
          grep -F '"b01_registry_modified":false' b03-d1-k01-k32.log
          grep -F '"historical_pass_transferred":0' b03-d1-k01-k32.log
          grep -F '"canonical_effect":false' b03-d1-k01-k32.log
      - name: Commit D1 source and tests
        run: |
          set -euo pipefail
          git rm qualification/book-system/reconstruction/.b03-d1-src-payload.b64 qualification/book-system/reconstruction/.b03-d1-test-payload.b64
          git add system-master/book-system/book-story-bible-knowledge-v1.js system-master/book-system/book-story-bible-knowledge-v1.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'book: build B03 D1 story bible knowledge validator'
          git push origin HEAD:book-system/control-v1
