name: Control Gateway Native Bootstrap Ingress

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  validate-command:
    name: Validate owner-authenticated bootstrap command
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[CONTROL-GATEWAY-BOOTSTRAP] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bootstrap_request_json: ${{ steps.validate.outputs.bootstrap_request_json }}
    steps:
      - name: Validate exact native bootstrap envelope
        id: validate
        shell: bash
        env:
          CONTROL_GATEWAY_COMMAND_BODY: ${{ github.event.issue.body }}
          CONTROL_GATEWAY_ISSUE_TITLE: ${{ github.event.issue.title }}
          CONTROL_GATEWAY_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          command_file="${RUNNER_TEMP}/control-gateway-native-bootstrap.json"
          printf '%s' "${CONTROL_GATEWAY_COMMAND_BODY}" > "${command_file}"

          jq -e 'type == "object"' "${command_file}" >/dev/null
          test "$(jq -c 'keys' "${command_file}")" = '["bootstrap_request","command_id","kind","protocol_version"]'
          test "$(jq -r '.protocol_version // empty' "${command_file}")" = 'control-gateway.github-native-command.v1'
          test "$(jq -r '.kind // empty' "${command_file}")" = 'AUTHORITY_BOOTSTRAP'
          jq -e '.bootstrap_request | type == "object"' "${command_file}" >/dev/null

          command_id="$(jq -r '.command_id // empty' "${command_file}")"
          operation="$(jq -r '.bootstrap_request.operation // empty' "${command_file}")"
          repository="$(jq -r '.bootstrap_request.repository // empty' "${command_file}")"
          state_ref="$(jq -r '.bootstrap_request.state_ref // empty' "${command_file}")"

          [[ "${command_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          test "${CONTROL_GATEWAY_ISSUE_TITLE}" = "[CONTROL-GATEWAY-BOOTSTRAP] ${command_id}"
          test "${operation}" = 'CONTROL-GATEWAY-AUTHORITY-BOOTSTRAP-001'
          test "${repository}" = "${CONTROL_GATEWAY_REPOSITORY}"
          [[ "${state_ref}" =~ ^control-gateway-state/active-work/[A-Za-z0-9][A-Za-z0-9._/-]{0,218}$ ]]
          [[ "${state_ref}" != *'..'* ]]
          [[ "${state_ref}" != *'//'* ]]
          [[ "${state_ref}" != */ ]]

          bootstrap_request_json="$(jq -c '.bootstrap_request' "${command_file}")"
          printf 'bootstrap_request_json=%s\n' "${bootstrap_request_json}" >> "${GITHUB_OUTPUT}"

  execute-authority-bootstrap:
    name: Dedicated-writer genesis active-work publication
    needs: validate-command
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: control-gateway-production
    steps:
      - name: Checkout exact production controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify workflow is executing exact main head
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Mint repository-scoped dedicated writer App token
        id: writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CONTROL_GATEWAY_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_GATEWAY_WRITER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Execute create-only authority bootstrap
        shell: bash
        env:
          CONTROL_GATEWAY_BOOTSTRAP_REQUEST_JSON: ${{ needs.validate-command.outputs.bootstrap_request_json }}
          CONTROL_GATEWAY_WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
          CONTROL_GATEWAY_WRITER_ACTUAL_APP_SLUG: ${{ steps.writer-token.outputs.app-slug }}
          CONTROL_GATEWAY_WRITER_EXPECTED_APP_SLUG: ${{ vars.CONTROL_GATEWAY_WRITER_APP_SLUG }}
          CONTROL_GATEWAY_WRITER_INSTALLATION_ID: ${{ steps.writer-token.outputs.installation-id }}
          CONTROL_GATEWAY_WRITER_EVIDENCE_DIR: ${{ runner.temp }}/control-gateway-authority-bootstrap-${{ github.run_id }}
        run: node .github/scripts/control-gateway-authority-bootstrap.js
      - name: Upload immutable bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-gateway-authority-bootstrap-${{ github.run_id }}-evidence
          path: ${{ runner.temp }}/control-gateway-authority-bootstrap-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
