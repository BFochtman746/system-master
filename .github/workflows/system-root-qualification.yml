name: System Root Qualification

on:
  pull_request:
    branches:
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/system-root/**'
      - '.github/workflows/system-root-qualification.yml'
  push:
    branches:
      - foundation-system-root-build
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/system-root/**'
      - '.github/workflows/system-root-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-root-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify System Root
        shell: bash
        run: bash system-master/foundation-spine/system-root/qualification/run.sh
