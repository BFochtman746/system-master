name: CG-011 A-01 Host Qualification Bootstrap

on:
  push:
    branches:
      - system-master/a01-control-plane-cg011-host-qualification-001
    paths:
      - '.github/workflows/cg011-a01-host-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Register cumulative CG-011 A-01 host qualifier
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'qualification/a01/registry.json';
          const id = 'CG011-A01-FOUNDATION-CUMULATIVE-HOST-001';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!r.qualifications[id]) {
            r.registry_version = Number(r.registry_version || 0) + 1;
            r.qualifications[id] = {
              workstream_id: 'SECOND-SHIFT-CONTROL-GATEWAY',
              gate_class: 'consolidated',
              source: 'control_plane',
              executable: 'node',
              args: ['.github/scripts/a01-cg011-foundation-cumulative-qualify.js'],
              evidence_artifact: 'cg011-a01-foundation-cumulative-host',
              overnight_eligible: false,
              description: 'Run the exact admitted CG-011 subject on the Windows X64 A-01 host through cumulative Foundation F-WP-001..012 via F-WP-012 recursion, then rerun the existing SecondShiftSupervisorV2 A-01 host stress boundary. PASS is exact-SHA host evidence only and grants no production or promotion authority.'
            };
            fs.writeFileSync(p, JSON.stringify(r, null, 2) + '\n');
          }
          NODE
      - name: Validate registration
        shell: bash
        run: |
          node .github/scripts/a01-control-plane.js validate
          node --check .github/scripts/a01-cg011-foundation-cumulative-qualify.js
      - name: Commit registration
        shell: bash
        run: |
          if git diff --quiet -- qualification/a01/registry.json; then
            echo 'Registration already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qualification/a01/registry.json
          git commit -m 'CG-011 A-01: register cumulative Foundation host qualifier'
          git push origin HEAD:system-master/a01-control-plane-cg011-host-qualification-001
