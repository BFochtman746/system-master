name: P09 Repair Broker and Durable Lineage Foundation Qualification

on:
  pull_request:
    paths:
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/a01-repair-rerun*.js'
      - '.github/workflows/a01-repair-*.yml'
      - '.github/workflows/p09-repair-broker-lineage-foundation-qualification.yml'
      - 'governance/repair/**'
      - 'governance/contracts/P09-FOUNDATION-CONTRACT-001.md'
      - 'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-*.json'
      - 'qualification/a01/registry.json'
      - 'qualification/a01/a01-policy.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/a01-repair-rerun*.js'
      - '.github/workflows/a01-repair-*.yml'
      - '.github/workflows/p09-repair-broker-lineage-foundation-qualification.yml'
      - 'governance/repair/**'
      - 'governance/contracts/P09-FOUNDATION-CONTRACT-001.md'
      - 'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-*.json'
      - 'qualification/a01/registry.json'
      - 'qualification/a01/a01-policy.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Prequalify P09 repair classification and lineage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact P09 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Pin Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check P09 controls
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/a01-closed-loop-repair.js
          node --check .github/scripts/a01-closed-loop-repair-selftest.js
          node --check .github/scripts/a01-repair-broker.js
          node --check .github/scripts/a01-repair-broker-selftest.js
          node --check .github/scripts/a01-repair-ledger.js
          node --check .github/scripts/a01-repair-ledger-reconcile.js
          node --check .github/scripts/a01-repair-ledger-selftest.js
          node --check .github/scripts/a01-repair-rerun-selftest.js
      - name: Prove classification, durable lineage, rerun and reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/a01-closed-loop-repair-selftest.js
          node .github/scripts/a01-repair-broker-selftest.js
          node .github/scripts/a01-repair-ledger-selftest.js
          node .github/scripts/a01-repair-rerun-selftest.js
          node .github/scripts/a01-repair-ledger-reconcile.js
      - name: Assert P09 authority boundaries and CI enforcement
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('qualification/a01/registry.json', 'utf8'));
          const repairRegistry = JSON.parse(fs.readFileSync('governance/repair/REPAIR-LEDGER-REGISTRY-001.json', 'utf8'));
          const broker = fs.readFileSync('.github/scripts/a01-repair-broker.js', 'utf8');
          const ledger = fs.readFileSync('.github/scripts/a01-repair-ledger.js', 'utf8');
          const selftestWorkflow = fs.readFileSync('.github/workflows/a01-repair-ledger-selftest.yml', 'utf8');
          const rerunWorkflow = fs.readFileSync('.github/workflows/a01-repair-rerun.yml', 'utf8');
          const contract = fs.readFileSync('governance/contracts/P09-FOUNDATION-CONTRACT-001.md', 'utf8');
          const crosswalk = JSON.parse(fs.readFileSync('governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-003.json', 'utf8'));

          const live = registry.qualifications['A01-CLOSED-LOOP-REPAIR-SELFTEST'];
          if (!live || live.workstream_id !== 'SYSTEM-MASTER' || live.gate_class !== 'focused' || live.source !== 'subject') throw new Error('P09_REGISTERED_LIVE_QUALIFIER_INVALID');
          if (!broker.includes("classification === 'REPAIRABLE_SUBJECT'")) throw new Error('P09_CHANGED_SHA_CLASSIFICATION_GUARD_MISSING');
          if (!broker.includes("classification === 'RETRYABLE_INFRA'")) throw new Error('P09_INFRA_ROUTE_MISSING');
          if (!broker.includes("classification === 'CONTROL_PLANE_OWNER_ROUTE'")) throw new Error('P09_CONTROL_ROUTE_MISSING');
          if (!broker.includes("tx.classification === 'REPAIRABLE_SUBJECT'")) throw new Error('P09_FINALIZATION_CLASSIFICATION_GUARD_MISSING');
          if (!ledger.includes("MAX_SAME_SHA_INFRA_RETRIES = 1")) throw new Error('P09_INFRA_RETRY_BOUND_MISSING');
          if (!ledger.includes("A01_RETRY_TICKET_EMITTED")) throw new Error('P09_INFRA_RETRY_LINEAGE_EVENT_MISSING');
          if (!ledger.includes("A01_REPLACEMENT_TICKET_EMITTED")) throw new Error('P09_CHANGED_SHA_LINEAGE_EVENT_MISSING');
          if (!selftestWorkflow.includes('node .github/scripts/a01-repair-ledger-reconcile.js')) throw new Error('P09_RECONCILE_NOT_ENFORCED_IN_CI');
          if (!rerunWorkflow.includes('repair_transaction_id: ${{ needs.prepare.outputs.transaction_id }}')) throw new Error('P09_RERUN_TRANSACTION_BINDING_MISSING');
          if (!repairRegistry.rules.some(x => x.includes('P11 owns night-wide scheduling'))) throw new Error('P09_P11_BUDGET_AUTHORITY_BOUNDARY_MISSING');
          const p09 = crosswalk.platform_requirements.find(x => x.platform_id === 'P09');
          if (!p09 || p09.implementation !== '.github/scripts/a01-repair-ledger.js') throw new Error('P09_CANONICAL_IMPLEMENTATION_POINTER_MISSING');
          if (!contract.includes('P11') || !contract.includes('changed-SHA product repair')) throw new Error('P09_CONTRACT_BOUNDARY_MISSING');
          console.log('P09_HOSTED_PREQUALIFICATION=PASS');
          NODE

  live_a01:
    name: Live exact-SHA A-01 repair qualification
    needs: prequalify
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: A01-CLOSED-LOOP-REPAIR-SELFTEST
      workstream_id: SYSTEM-MASTER
      subject_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      origin_ref: ${{ github.head_ref || github.ref }}
      resume_on_pass: 'Adjudicate P09 exact-SHA repair classification and durable-lineage evidence.'
      resume_on_failure: 'Preserve the same repair subject, classify the P09 failure truthfully, and repair only the failing repair-control boundary.'
      notification_target: foundation-p09
      execution_context: normal
      qualifier_timeout_minutes: 28
      job_timeout_minutes: 30
    secrets: inherit

  assert_live_result:
    name: Assert authoritative P09 live result
    needs: [prequalify, live_a01]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless live A-01 proves exact-subject repair qualification
        shell: bash
        env:
          LIVE_JOB_RESULT: ${{ needs.live_a01.result }}
          RESULT_CLASS: ${{ needs.live_a01.outputs.result_class }}
          PROMOTION_AUTHORIZED: ${{ needs.live_a01.outputs.promotion_authorized }}
          ADMISSION_STATE: ${{ needs.live_a01.outputs.admission_state }}
          CONTROL_PLANE_SHA: ${{ needs.live_a01.outputs.control_plane_sha }}
          EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$LIVE_JOB_RESULT" = "success"
          test "$ADMISSION_STATE" = "ADMITTED"
          test "$RESULT_CLASS" = "PASS"
          test "$PROMOTION_AUTHORIZED" = "false"
          [[ "$EXPECTED_SUBJECT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CONTROL_PLANE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${CONTROL_PLANE_SHA,,}" = "${EXPECTED_CONTROL_PLANE_SHA,,}"
          printf 'P09_LIVE_A01=PASS\nP09_RESULT_CLASS=%s\nP09_PROMOTION_AUTHORIZED=%s\nP09_SUBJECT_SHA=%s\nP09_CONTROL_PLANE_SHA=%s\n' "$RESULT_CLASS" "$PROMOTION_AUTHORIZED" "$EXPECTED_SUBJECT_SHA" "$CONTROL_PLANE_SHA"
