name: Learning Dependency Adjudication Batch 10 Prequalification
on:
  push:
    branches: [learning/dependency-adjudication-batch-10-20260910]
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-10-CANDIDATE-053A.json"
      - ".github/scripts/learning-dependency-adjudication-batch-generic-qualify.js"
      - ".github/workflows/learning-dependency-adjudication-batch-10-prequal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Dependency evidence adjudication final batch 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPENDENCY_CANDIDATE: LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-10-CANDIDATE-053A.json
      EXPECTED_CONTROL_HEAD: 80b344cd68c1473386bed170b8ebaf37dafe31d9
      START_INDEX: 45
      EXPECTED_COUNT: 1
      CUMULATIVE_COUNT: 46
      REMAINING_COUNT: 0
      EVIDENCE_DIR: learning-dependency-adjudication-batch-10-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check reusable validator
        run: node --check .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Validate final dependency candidate 46
        run: node .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-DEPENDENCY-ADJUDICATION-BATCH-10-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-dependency-adjudication-batch-10-evidence
          if-no-files-found: warn
          retention-days: 30
