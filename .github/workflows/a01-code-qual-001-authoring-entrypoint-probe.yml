name: A01 CODE QUAL 001 Authoring Entrypoint Probe

on:
  push:
    branches:
      - qualification/a01-code-qual-001-sealed-stress-baseline
    paths:
      - '.github/workflows/a01-code-qual-001-authoring-entrypoint-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-authoring-entrypoints:
    name: Probe A-01 coding-agent entrypoints
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe installed authoring CLIs without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('codex','chatgpt','claude','aider','opencode','copilot','gh','python','py','node','npm','git')
          $results = @()
          foreach ($name in $names) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $cmd) {
              $results += [ordered]@{ name = $name; present = $false; path = $null; version = $null }
              continue
            }
            $version = $null
            foreach ($args in @(@('--version'), @('-V'), @('version'))) {
              try {
                $output = & $cmd.Source @args 2>&1 | Select-Object -First 3
                if ($LASTEXITCODE -eq 0 -and $output) {
                  $version = (($output | ForEach-Object { $_.ToString().Trim() }) -join ' | ')
                  break
                }
              } catch { }
            }
            $results += [ordered]@{ name = $name; present = $true; path = $cmd.Source; version = $version }
          }

          $credentialNames = @('OPENAI_API_KEY','ANTHROPIC_API_KEY','GITHUB_TOKEN','GH_TOKEN')
          $credentialPresence = [ordered]@{}
          foreach ($n in $credentialNames) {
            $credentialPresence[$n] = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))
          }

          $agentNames = @('codex','chatgpt','claude','aider','opencode','copilot')
          $availableAgents = @($results | Where-Object { $_.present -and $agentNames -contains $_.name } | ForEach-Object { $_.name })
          $probe = [ordered]@{
            protocol = 'a01.code-authoring-entrypoint-probe.v1'
            runner_name = $env:RUNNER_NAME
            os = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            observed_at_utc = [DateTime]::UtcNow.ToString('o')
            commands = $results
            credential_presence_only = $credentialPresence
            available_authoring_agents = $availableAgents
            authoring_entrypoint_found = ($availableAgents.Count -gt 0)
          }
          New-Item -ItemType Directory -Force -Path a01-code-qual-probe | Out-Null
          $probe | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath a01-code-qual-probe/authoring-entrypoint-probe.json -Encoding utf8
          Get-Content -LiteralPath a01-code-qual-probe/authoring-entrypoint-probe.json

      - name: Publish probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-code-qual-001-authoring-entrypoint-probe-${{ github.run_id }}
          path: a01-code-qual-probe/authoring-entrypoint-probe.json
          if-no-files-found: error
          retention-days: 30
