name: A01 CODE QUAL 001 Authoring Entrypoint Probe

on:
  push:
    branches:
      - qualification/a01-code-qual-001-sealed-stress-baseline
    paths:
      - '.github/workflows/a01-code-qual-001-authoring-entrypoint-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-authoring-entrypoints:
    name: Probe A-01 coding-agent entrypoints
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe installed authoring CLIs without exposing credentials
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @('codex','chatgpt','claude','aider','opencode','copilot','gh','python','py','node','npm','git')
          $results = @()
          foreach ($name in $names) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $cmd) {
              $results += [ordered]@{ name = $name; present = $false; path = $null; version = $null }
              continue
            }
            $version = $null
            foreach ($args in @(@('--version'), @('-V'), @('version'))) {
              try {
                $output = & $cmd.Source @args 2>&1 | Select-Object -First 3
                if ($LASTEXITCODE -eq 0 -and $output) {
                  $version = (($output | ForEach-Object { $_.ToString().Trim() }) -join ' | ')
                  break
                }
              } catch { }
            }
            $results += [ordered]@{ name = $name; present = $true; path = $cmd.Source; version = $version }
          }

          $credentialNames = @('OPENAI_API_KEY','ANTHROPIC_API_KEY','GITHUB_TOKEN','GH_TOKEN')
          $credentialPresence = [ordered]@{}
          foreach ($n in $credentialNames) {
            $credentialPresence[$n] = -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))
          }

          $agentNames = @('codex','chatgpt','claude','aider','opencode','copilot')
          $availableAgents = @($results | Where-Object { $_.present -and $agentNames -contains $_.name } | ForEach-Object { $_.name })
          $probe = [ordered]@{
            protocol = 'a01.code-authoring-entrypoint-probe.v1'
            runner_name = $env:RUNNER_NAME
            os = [System.Environment]::OSVersion.VersionString
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            observed_at_utc = [DateTime]::UtcNow.ToString('o')
            commands = $results
            credential_presence_only = $credentialPresence
            available_authoring_agents = $availableAgents
            authoring_entrypoint_found = ($availableAgents.Count -gt 0)
          }
          New-Item -ItemType Directory -Force -Path a01-code-qual-probe | Out-Null
          $probe | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath a01-code-qual-probe/authoring-entrypoint-probe.json -Encoding utf8
          Get-Content -LiteralPath a01-code-qual-probe/authoring-entrypoint-probe.json

      - name: Correlate Claude metadata to exact overnight window without reading transcript content
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $claude = Get-Command claude -ErrorAction SilentlyContinue | Select-Object -First 1
          $authReady = $false
          if ($null -ne $claude) {
            try {
              & $claude.Source auth status *> $null
              $authReady = ($LASTEXITCODE -eq 0)
            } catch {
              $authReady = $false
            }
          }

          $windowStart = [DateTime]::Parse('2026-09-15T05:15:28Z').ToUniversalTime()
          $windowEnd = [DateTime]::Parse('2026-09-15T06:29:02Z').ToUniversalTime()
          $claudeRoot = Join-Path $env:USERPROFILE '.claude'
          $allFiles = @()
          if (Test-Path -LiteralPath $claudeRoot) {
            $allFiles = @(Get-ChildItem -LiteralPath $claudeRoot -File -Recurse -Force -ErrorAction SilentlyContinue)
          }
          $windowFiles = @($allFiles | Where-Object { $_.LastWriteTimeUtc -ge $windowStart -and $_.LastWriteTimeUtc -le $windowEnd })
          $projectWindowFiles = @($windowFiles | Where-Object { $_.FullName -match '[\\/]projects[\\/]' })
          $systemMasterWindowFiles = @($projectWindowFiles | Where-Object { $_.FullName -match '(?i)system[-_]?master' })
          $latest = $allFiles | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1

          $meta = [ordered]@{
            protocol = 'a01.code-authoring-history-metadata.v1'
            content_read = $false
            claude_present = ($null -ne $claude)
            claude_auth_status_exit_success = $authReady
            claude_root_present = (Test-Path -LiteralPath $claudeRoot)
            overnight_window_start_utc = $windowStart.ToString('o')
            overnight_window_end_utc = $windowEnd.ToString('o')
            claude_files_modified_in_window = $windowFiles.Count
            claude_project_files_modified_in_window = $projectWindowFiles.Count
            system_master_named_project_files_modified_in_window = $systemMasterWindowFiles.Count
            system_master_named_project_activity_in_window = ($systemMasterWindowFiles.Count -gt 0)
            latest_claude_metadata_write_utc = $(if ($null -ne $latest) { $latest.LastWriteTimeUtc.ToString('o') } else { $null })
          }
          $meta | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath a01-code-qual-probe/claude-overnight-metadata.json -Encoding utf8
          Get-Content -LiteralPath a01-code-qual-probe/claude-overnight-metadata.json

      - name: Publish probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-code-qual-001-authoring-entrypoint-probe-${{ github.run_id }}
          path: a01-code-qual-probe/
          if-no-files-found: error
          retention-days: 30
