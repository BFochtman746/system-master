name: A-01 Persistent Python Install

on:
  push:
    branches:
      - runner/python-install-001
    paths:
      - ".github/workflows/a01-python-install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a01-python-install
  cancel-in-progress: false

jobs:
  install:
    name: Install and verify Python 3.13.15 on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact installer contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Inspect current Python state
        shell: cmd
        run: |
          echo COMPUTERNAME=%COMPUTERNAME%
          echo USERNAME=%USERNAME%
          echo USERPROFILE=%USERPROFILE%
          where py 2>nul || echo py launcher not currently on PATH
          where python 2>nul || echo python not currently on PATH
          exit /b 0

      - name: Download and verify official Python installer
        shell: cmd
        run: |
          set "INSTALLER=%RUNNER_TEMP%\python-3.13.15-amd64.exe"
          if exist "%INSTALLER%" del /q "%INSTALLER%"
          curl.exe -L --fail --silent --show-error "https://www.python.org/ftp/python/3.13.15/python-3.13.15-amd64.exe" -o "%INSTALLER%"
          if errorlevel 1 exit /b 1
          certutil -hashfile "%INSTALLER%" SHA256
          certutil -hashfile "%INSTALLER%" SHA256 | find /I "edec09c4853aeae9ac36efb8c9f95b6b8e2fee65eee56d9767a8b7c69c574403" >nul
          if errorlevel 1 (
            echo ERROR: Python installer SHA-256 mismatch.
            exit /b 1
          )
          echo Verified official Python 3.13.15 installer SHA-256.

      - name: Install Python persistently for A-01 runner
        shell: cmd
        run: |
          set "INSTALLER=%RUNNER_TEMP%\python-3.13.15-amd64.exe"
          set "TARGET=C:\actions-runner\Python313"
          set "LOG=%RUNNER_TEMP%\python-install.log"
          if exist "%TARGET%\python.exe" (
            echo Existing runner-local Python found.
            "%TARGET%\python.exe" --version
            exit /b 0
          )
          echo Installing full Python runtime to %TARGET% for runner account %USERNAME%.
          "%INSTALLER%" /quiet InstallAllUsers=0 TargetDir="%TARGET%" PrependPath=0 Include_launcher=0 Include_test=0 Include_pip=1 Include_doc=0 Include_tcltk=0 /log "%LOG%"
          set "RC=%ERRORLEVEL%"
          echo Installer exit code: %RC%
          if exist "%LOG%" type "%LOG%"
          if "%RC%"=="0" exit /b 0
          if "%RC%"=="3010" exit /b 0
          exit /b %RC%

      - name: Verify persistent runner-local interpreter
        shell: cmd
        run: |
          set "PYTHON_EXE=C:\actions-runner\Python313\python.exe"
          if not exist "%PYTHON_EXE%" (
            echo ERROR: Persistent Python executable not found at %PYTHON_EXE%.
            exit /b 1
          )
          "%PYTHON_EXE%" --version
          "%PYTHON_EXE%" -c "import sys,sqlite3,unittest; print(sys.executable); print(sys.version); print('stdlib-ok')"
          "%PYTHON_EXE%" -m pip --version

      - name: Publish stable runner Python pointer
        shell: cmd
        run: |
          >"C:\actions-runner\python.cmd" echo @echo off
          >>"C:\actions-runner\python.cmd" echo "C:\actions-runner\Python313\python.exe" %%*
          call C:\actions-runner\python.cmd --version
          echo Stable runner command: C:\actions-runner\python.cmd

      - name: Remove installer
        if: always()
        shell: cmd
        run: |
          if exist "%RUNNER_TEMP%\python-3.13.15-amd64.exe" del /q "%RUNNER_TEMP%\python-3.13.15-amd64.exe"
