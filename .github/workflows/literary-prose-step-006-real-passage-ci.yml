name: Literary Prose STEP-006 Real-Passage Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/step-f/step_006_applicability.py'
      - 'qualification/literary-prose-engine-001/step-f/run_step_006_real_passage_fixtures.py'
      - '.github/workflows/literary-prose-step-006-real-passage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify STEP-006 real-passage sparse applicability
        run: python qualification/literary-prose-engine-001/step-f/run_step_006_real_passage_fixtures.py
