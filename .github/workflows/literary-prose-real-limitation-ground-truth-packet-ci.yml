name: Literary Prose Real Limitation Ground Truth Packet

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/step-f/PROSE-REAL-LIMITATION-GROUND-TRUTH-AUTHOR-PACKET-001.json'
      - 'qualification/literary-prose-engine-001/step-f/validate_real_limitation_ground_truth_packet.py'
      - '.github/workflows/literary-prose-real-limitation-ground-truth-packet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile packet validator
        run: python -m py_compile qualification/literary-prose-engine-001/step-f/validate_real_limitation_ground_truth_packet.py
      - name: Validate packet structure
        run: >-
          python qualification/literary-prose-engine-001/step-f/validate_real_limitation_ground_truth_packet.py
          qualification/literary-prose-engine-001/step-f/PROSE-REAL-LIMITATION-GROUND-TRUTH-AUTHOR-PACKET-001.json
      - name: Require labels when author packet is authoritative
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          packet = Path('qualification/literary-prose-engine-001/step-f/PROSE-REAL-LIMITATION-GROUND-TRUTH-AUTHOR-PACKET-001.json')
          data = json.loads(packet.read_text(encoding='utf-8'))
          if data.get('labels_authoritative') is True:
              subprocess.run([
                  'python',
                  'qualification/literary-prose-engine-001/step-f/validate_real_limitation_ground_truth_packet.py',
                  str(packet),
                  '--require-labels',
              ], check=True)
          else:
              print('author labels not yet authoritative; --require-labels gate deferred')
          PY
