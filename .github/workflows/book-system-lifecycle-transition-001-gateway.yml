name: Book System Lifecycle Transition A-01 Submission

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "qualification/book-system/lifecycle-transition-001/**"
      - "system-master/book-system/lifecycle-transition-engine.js"
      - "system-master/book-system/lifecycle-transition-engine-runtime.js"
      - ".github/scripts/book-system-lifecycle-transition-001-qualify.js"
      - ".github/scripts/a01-book-system-lifecycle-transition-001.js"
      - ".github/workflows/book-system-lifecycle-transition-001-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@main
    with:
      qualification_id: BOOK-SYSTEM-LIFECYCLE-TRANSITION-ENGINE-001
      workstream_id: BOOK-SYSTEM
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref }}
      resume_on_pass: Close BOOK-SYSTEM-LIFECYCLE-TRANSITION-ENGINE-001 on this exact SHA and continue BOOK-SYSTEM-INTEGRATION-PROPOSAL-RUNTIME-001.
      resume_on_failure: Repair only the failing lifecycle-transition or control-plane boundary and rerun the minimum sufficient registered gate.
      notification_target: book-system/control-v1
      execution_context: normal
      qualifier_timeout_minutes: 10
      job_timeout_minutes: 15
    secrets: inherit
