name: BOOK-EVAL-LEMONADE-001 Blind Resume 002 State Probe

on:
  push:
    branches:
      - book-eval-lemonade-001-blind-resume-002
    paths:
      - "qualification/book-eval-lemonade-001/RUN-BLIND-STATE-PROBE-V2"

permissions:
  contents: read

concurrency:
  group: book-eval-lemonade-001-blind-state-probe-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Read-only probe persisted E4/E5 blind state on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Probe exact persisted blind state
        shell: cmd
        run: call qualification\book-eval-lemonade-001\a01-blind-state-probe-v2.cmd

      - name: Publish state probe summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE=%RUNNER_TEMP%\book-eval-blind-state-probe-v2-%GITHUB_RUN_ID%"
          echo ## BOOK-EVAL-LEMONADE-001 BLIND RESUME 002 STATE PROBE>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE%\state-probe-v2-summary.txt" type "%EVIDENCE%\state-probe-v2-summary.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload state probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: book-eval-lemonade-001-blind-state-probe-v2-evidence
          path: ${{ runner.temp }}\book-eval-blind-state-probe-v2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
