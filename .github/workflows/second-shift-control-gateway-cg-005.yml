name: Second Shift Control Gateway CG-005 Host Qualification

on:
  push:
    branches:
      - second-shift-control-gateway/cg-005-github-admission
    paths:
      - 'control-gateway/**'
      - '.github/workflows/second-shift-control-gateway-cg-005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: GitHub Mutation Admission / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CG005_LIVE_REF: control-gateway-state/active-work/second-shift-control-gateway-dev
      CG005_EXPECTED_PUBLICATION_COMMIT: e71d19360562c2f6e5d40c9d1b87fc9bca80e47b
      CG005_EXPECTED_PACKET_DIGEST: 3c05d7fc1b5b16553b782f7aba33e8be87bb5d295c94d681cd1df3f6f6ef7d52
      CG005_EXPECTED_AUTHORITY_SUBJECT: 59ed4c2857f0af35e339c2378956b110bf078119
      CG005_EXPECTED_TARGET_PREDECESSOR: 76c63ca0d48e3691142cb02ffa37f9a4e6a1f005
      CG005_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact CG-005 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show runtime
        run: node --version
      - name: Run CG-003 through CG-005 qualification suite including live GitHub admission
        working-directory: control-gateway
        run: node --test
