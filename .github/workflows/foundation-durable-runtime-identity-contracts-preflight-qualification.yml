name: Foundation Durable Runtime Identity Contracts Preflight Qualification

on:
  push:
    branches:
      - second-shift/core-durable-runtime-identity-contracts-preflight-adapter-001-20260912
    paths:
      - 'system-master/foundation-spine/durable-runtime/**'
      - 'system-master/foundation-spine/system-root/**'
      - 'system-master/foundation-spine/identity/**'
      - 'system-master/foundation-spine/contracts/**'
      - '.github/scripts/foundation-durable-runtime-identity-contracts-preflight-qualify.js'
      - '.github/scripts/foundation-contracts-versioning-qualify.js'
      - '.github/scripts/foundation-identity-delegation-qualify.js'
      - '.github/scripts/foundation-system-root-qualify.js'
      - '.github/workflows/foundation-durable-runtime-identity-contracts-preflight-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-durable-runtime-identity-contracts-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify bounded preflight plus available cumulative Foundation regressions
        run: node .github/scripts/foundation-durable-runtime-identity-contracts-preflight-qualify.js

      - name: Preserve Durable Runtime preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-durable-runtime-ic-preflight-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-durable-runtime-ic-preflight-*/
          if-no-files-found: error
          retention-days: 30
