name: Foundation Work Project Qualification

on:
  push:
    branches:
      - foundation/work-chain-recovery-001-20260912
    paths:
      - 'system-master/foundation-spine/work-project/**'
      - '.github/scripts/foundation-work-project-qualify.js'
      - '.github/workflows/foundation-work-project-qualification.yml'
  pull_request:
    branches:
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/work-project/**'
      - '.github/scripts/foundation-work-project-qualify.js'
      - '.github/workflows/foundation-work-project-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-work-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Qualify Work Project and cumulative Foundation baseline
        run: node .github/scripts/foundation-work-project-qualify.js

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-work-project-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/foundation-work-project-*/
          if-no-files-found: error
          retention-days: 30
