name: Learning 001M-S02 Qualification

on:
  push:
    branches:
      - learning/system-rebuild-001m-s02-learner-model-srl-runtime-20260912
    paths:
      - '.github/scripts/learning-system-rebuild-001m-s02-qualify.py'
      - '.github/workflows/learning-system-rebuild-001m-s02-qualify.yml'
      - 'learning/lab/learning_lab/learner_model.py'
      - 'learning/lab/tests/test_learner_model_srl.py'
      - 'qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S02-48CASE-QUALIFICATION-CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run S02 isolated and cumulative qualification
        run: python .github/scripts/learning-system-rebuild-001m-s02-qualify.py
