name: Learning 001M-S02 Qualification

on:
  push:
    branches:
      - learning/system-rebuild-001m-s02-learner-model-srl-runtime-20260912
    paths:
      - '.github/scripts/learning-system-rebuild-001m-s02-qualify.py'
      - '.github/workflows/learning-system-rebuild-001m-s02-qualify.yml'
      - 'learning/lab/learning_lab/learner_model.py'
      - 'learning/lab/tests/test_learner_model_srl.py'
      - 'qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S02-56CASE-QUALIFICATION-CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check changed runtime and qualifier
        run: |
          python -m py_compile learning/lab/learning_lab/learner_model.py
          python -m py_compile learning/lab/tests/test_learner_model_srl.py
          python -m py_compile .github/scripts/learning-system-rebuild-001m-s02-qualify.py

      - name: Run S02 isolated and cumulative qualification
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/learning-system-rebuild-001m-s02-qualify.py | tee learning-system-rebuild-001m-s02-result.json

      - name: Upload exact-subject qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-system-rebuild-001m-s02-${{ github.sha }}
          path: learning-system-rebuild-001m-s02-result.json
          if-no-files-found: error
