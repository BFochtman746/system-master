name: Safe Runner Bootstrap Qualification

on:
  push:
    paths:
      - ".github/workflows/safe-runner-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-runner-bootstrap
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Windows self-hosted runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Create bounded evidence directory
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-bootstrap-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"

      - name: Inventory runner without enumerating secrets
        shell: cmd
        run: |
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          echo qualification=SAFE-RUNNER-BOOTSTRAP-001>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo repository=%GITHUB_REPOSITORY%>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo commit=%GITHUB_SHA%>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo runner_os=%RUNNER_OS%>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo runner_arch=%RUNNER_ARCH%>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo actions_transport=proven-by-dispatch-and-artifact-upload>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo evidence_integrity=github-artifact-sha256>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo workspace_write_scope=runner_temp_only>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          echo secrets_enumerated=false>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          git --version>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>&1
          echo optional_tool_paths:>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          where node>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>nul || echo node=not-found>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          where npm>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>nul || echo npm=not-found>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          where python>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>nul || echo python=not-found>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          where py>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>nul || echo py=not-found>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          where dotnet>>"%EVIDENCE_DIR%\runner-bootstrap.txt" 2>nul || echo dotnet=not-found>>"%EVIDENCE_DIR%\runner-bootstrap.txt"
          type "%EVIDENCE_DIR%\runner-bootstrap.txt"
          findstr /x /c:"qualification=SAFE-RUNNER-BOOTSTRAP-001" "%EVIDENCE_DIR%\runner-bootstrap.txt">nul
          findstr /x /c:"runner_os=Windows" "%EVIDENCE_DIR%\runner-bootstrap.txt">nul
          findstr /x /c:"runner_arch=X64" "%EVIDENCE_DIR%\runner-bootstrap.txt">nul

      - name: Publish job summary
        if: always()
        shell: cmd
        run: |
          echo ## SAFE-RUNNER-BOOTSTRAP-001>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\runner-bootstrap.txt" (
            echo ~~~text>>"%GITHUB_STEP_SUMMARY%"
            type "%EVIDENCE_DIR%\runner-bootstrap.txt">>"%GITHUB_STEP_SUMMARY%"
            echo ~~~>>"%GITHUB_STEP_SUMMARY%"
          ) else (
            echo Evidence report was not created.>>"%GITHUB_STEP_SUMMARY%"
          )

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-runner-bootstrap-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
