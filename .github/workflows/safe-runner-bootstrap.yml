name: Safe Runner Bootstrap Qualification

on:
  push:
    paths:
      - ".github/workflows/safe-runner-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-runner-bootstrap
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify Windows self-hosted runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Create bounded evidence directory
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-bootstrap-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"

      - name: Inventory runner without enumerating secrets
        shell: cmd
        run: |
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          (
            echo qualification=SAFE-RUNNER-BOOTSTRAP-001
            echo repository=%GITHUB_REPOSITORY%
            echo commit=%GITHUB_SHA%
            echo runner_os=%RUNNER_OS%
            echo runner_arch=%RUNNER_ARCH%
            echo actions_transport=proven-by-dispatch-and-artifact-upload
            echo evidence_integrity=github-artifact-sha256
            echo workspace_write_scope=runner_temp_only
            echo secrets_enumerated=false
            echo git:
            git --version
            echo node:
            where node >nul 2>nul && node --version || echo not-found
            echo npm:
            where npm >nul 2>nul && npm --version || echo not-found
            echo python:
            where python >nul 2>nul && python --version || echo not-found
            echo py:
            where py >nul 2>nul && py --version || echo not-found
            echo dotnet:
            where dotnet >nul 2>nul && dotnet --version || echo not-found
          ) > "%EVIDENCE_DIR%\runner-bootstrap.txt"
          type "%EVIDENCE_DIR%\runner-bootstrap.txt"
          exit /b 0

      - name: Publish job summary
        if: always()
        shell: cmd
        run: |
          echo ## SAFE-RUNNER-BOOTSTRAP-001>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\runner-bootstrap.txt" (
            echo ~~~text>>"%GITHUB_STEP_SUMMARY%"
            type "%EVIDENCE_DIR%\runner-bootstrap.txt">>"%GITHUB_STEP_SUMMARY%"
            echo ~~~>>"%GITHUB_STEP_SUMMARY%"
          ) else (
            echo Evidence report was not created.>>"%GITHUB_STEP_SUMMARY%"
          )

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safe-runner-bootstrap-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
