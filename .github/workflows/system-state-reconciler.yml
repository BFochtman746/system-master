name: System State Reconciler

on:
  workflow_dispatch:
  push:
    paths:
      - 'governance/**'
      - 'qualification/a01/registry.json'
      - 'qualification/a01/repair-requests/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/scripts/system-state-reconciler.js'
      - '.github/scripts/system-state-reconciler-legacy.js'
      - '.github/scripts/second-shift-enforce.js'
      - '.github/scripts/second-shift-owner-coverage.js'
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/a01-repair-rerun*.js'
      - '.github/workflows/a01-control-plane-gateway.yml'
      - '.github/workflows/a01-repair-*.yml'
      - '.github/workflows/program-job-lock-enforcement.yml'
      - '.github/workflows/current-obligation-registry-enforcement.yml'
      - '.github/workflows/second-shift-enforcement.yml'
      - '.github/workflows/system-state-reconciler.yml'
  pull_request:
    paths:
      - 'governance/**'
      - 'qualification/a01/registry.json'
      - 'qualification/a01/repair-requests/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/scripts/system-state-reconciler.js'
      - '.github/scripts/system-state-reconciler-legacy.js'
      - '.github/scripts/second-shift-enforce.js'
      - '.github/scripts/second-shift-owner-coverage.js'
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/a01-repair-rerun*.js'
      - '.github/workflows/a01-control-plane-gateway.yml'
      - '.github/workflows/a01-repair-*.yml'
      - '.github/workflows/program-job-lock-enforcement.yml'
      - '.github/workflows/current-obligation-registry-enforcement.yml'
      - '.github/workflows/second-shift-enforcement.yml'
      - '.github/workflows/system-state-reconciler.yml'

concurrency:
  group: system-state-reconciler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Compile repository truth and reject job/state drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Syntax check reconciler, job locks and repair controls
        run: |
          node --check .github/scripts/program-job-lock-enforce.js
          node --check .github/scripts/current-obligation-registry-enforce.js
          node --check .github/scripts/system-state-reconciler.js
          node --check .github/scripts/system-state-reconciler-legacy.js
          node --check .github/scripts/second-shift-enforce.js
          node --check .github/scripts/second-shift-owner-coverage.js
          node --check .github/scripts/a01-closed-loop-repair.js
          node --check .github/scripts/a01-closed-loop-repair-selftest.js
          node --check .github/scripts/a01-repair-broker.js
          node --check .github/scripts/a01-repair-broker-selftest.js
          node --check .github/scripts/a01-repair-ledger.js
          node --check .github/scripts/a01-repair-ledger-selftest.js
          node --check .github/scripts/a01-repair-rerun-selftest.js
          node --check .github/scripts/a01-repair-ledger-reconcile.js

      - name: Enforce program jobs and product completion truth
        run: node .github/scripts/program-job-lock-enforce.js

      - name: Enforce current obligation ownership
        run: node .github/scripts/current-obligation-registry-enforce.js

      - name: Self-test repository-state invariants
        run: node .github/scripts/system-state-reconciler.js --selftest

      - name: Self-test Second Shift execution invariants
        run: |
          node .github/scripts/second-shift-enforce.js --selftest
          node .github/scripts/second-shift-owner-coverage.js --selftest

      - name: Self-test bounded closed-loop repair contract
        run: node .github/scripts/a01-closed-loop-repair-selftest.js

      - name: Self-test owner-lane repair broker
        run: node .github/scripts/a01-repair-broker-selftest.js

      - name: Self-test durable repair lifecycle
        run: node .github/scripts/a01-repair-ledger-selftest.js

      - name: Self-test same-transaction A-01 rerun lifecycle
        run: node .github/scripts/a01-repair-rerun-selftest.js

      - name: Reconcile repair event ledger, inboxes and replacement tickets
        run: node .github/scripts/a01-repair-ledger-reconcile.js

      - name: Validate Second Shift static control state
        run: |
          node .github/scripts/second-shift-enforce.js --no-live --out=.state-reconciler/SECOND-SHIFT-ENFORCEMENT-REPORT.json
          node .github/scripts/second-shift-owner-coverage.js --no-live > .state-reconciler/SECOND-SHIFT-OWNER-COVERAGE-REPORT.json

      - name: Reconcile static System Master repository state
        if: github.event_name != 'workflow_dispatch'
        run: node .github/scripts/system-state-reconciler.js --no-live --out=.state-reconciler

      - name: Reconcile live System Master owner refs
        if: github.event_name == 'workflow_dispatch'
        run: node .github/scripts/system-state-reconciler.js --out=.state-reconciler

      - name: Publish reconciliation summary
        if: always()
        shell: bash
        run: |
          if [ -f .state-reconciler/SECOND-SHIFT-ENFORCEMENT-REPORT.json ]; then
            echo '## Second Shift Enforcement Report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state-reconciler/SECOND-SHIFT-ENFORCEMENT-REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .state-reconciler/SECOND-SHIFT-OWNER-COVERAGE-REPORT.json ]; then
            echo '## Second Shift Owner Coverage Report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state-reconciler/SECOND-SHIFT-OWNER-COVERAGE-REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .state-reconciler/SYSTEM-STATE-DRIFT-REPORT.json ]; then
            echo '## System State Drift Report' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state-reconciler/SYSTEM-STATE-DRIFT-REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .state-reconciler/DERIVED-CURRENT-STATE.json ]; then
            echo '## Derived Current State' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .state-reconciler/DERIVED-CURRENT-STATE.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
