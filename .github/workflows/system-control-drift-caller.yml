    paths:
      - 'system-master/control-v2/**'
      - '.github/workflows/system-control-drift-caller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: BFochtman746/system-master/.github/workflows/system-control-drift-reusable.yml@main
    with:
      control_branch: system-master/control-v2
      subject_sha: ${{ github.sha }}
