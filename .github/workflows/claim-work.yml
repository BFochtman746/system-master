name: Claim Work

# CORRELATION CONTRACT — load-bearing, do not reformat casually.
#
# workflow_dispatch answers 204 with no run id, so ActionsRunPoller cannot address the run
# it just started. It finds the run by matching the claim id in the run title
# (display_title, which is this run-name evaluated). Without a run-name every run here is
# titled "Claim Work", the claim id appears nowhere, and a poller-wrapped consumer refuses
# EVERY claim with DISPATCH_RUN_NOT_FOUND_WITHIN_WINDOW — wedging the driver, which is
# strictly worse than the honest ACTIONS_DISPATCHED it replaces.
#
# The square brackets are not decoration. ActionsRunPoller.titleCorrelates requires the
# claim id to appear as a WHOLE TOKEN, and it treats '-' and '_' as identifier characters
# so that claim `job-1` can never be satisfied by the run for `job-11`. A separator that is
# itself an identifier character (e.g. "Claim-Work-job-1") fails that boundary check and
# breaks correlation. '[' and ']' are non-identifier, so they delimit correctly.
#
# ClaimWorkCorrelationTest reads THIS FILE and proves the rendered title correlates, so the
# YAML and the Java matcher cannot drift apart silently.
run-name: Claim Work [${{ inputs.claim_id }}]

# The delegated work executor — what ActionsDispatch actually starts for a claim.
#
# Split from claim-driver.yml on purpose: the driver decides WHICH claim runs and records
# evidence, this workflow performs the work. Keeping them apart is what makes GitHub
# Actions the executor rather than a wrapper around one, and it means the work step can
# grow per claim type without touching the lifecycle.
#
# workflow_dispatch only. Like the driver, this is never a required check and never runs
# on a pull request, so it cannot become a merge gate that fails to report.
#
# HONEST SCOPE: the work step below records what it was asked to do and produces a
# durable artifact. It is a real, verifiable execution path, not a simulation — but the
# repository-specific work each claim type should perform is not defined yet, and this
# file is where it goes when it is.

on:
  workflow_dispatch:
    inputs:
      claim_id:
        description: 'Claim being executed'
        required: true
        type: string
      payload_digest:
        description: 'Payload digest carried by the claim'
        required: false
        type: string

# Per-claim serialization: the ledger already refuses a second consumer for the same
# claim, and this keeps two dispatches of the same id from overlapping on the runner too.
concurrency:
  group: claim-work-${{ inputs.claim_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  perform:
    name: claim-work
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Perform delegated work
        env:
          # Untrusted dispatch inputs stay in the environment, never interpolated into
          # the shell body.
          IN_CLAIM_ID: ${{ inputs.claim_id }}
          IN_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
        run: |
          set -euo pipefail
          mkdir -p claim-evidence
          receipt="claim-evidence/${IN_CLAIM_ID//[^A-Za-z0-9._-]/_}.txt"
          {
            printf 'claim_id=%s\n' "$IN_CLAIM_ID"
            printf 'payload_digest=%s\n' "${IN_PAYLOAD_DIGEST:-none}"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'executed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$receipt"
          {
            echo "### Claim work"
            echo
            echo '```'
            cat "$receipt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-${{ github.run_id }}
          path: claim-evidence/
          if-no-files-found: error
          retention-days: 30
