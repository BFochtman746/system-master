name: Claim Work
run-name: "claim:${{ inputs.claim_id }} dispatch:${{ inputs.dispatch_id }}"

# The delegated work executor — what ActionsDispatch actually starts for a claim.
#
# workflow_dispatch only. The dispatch_id is generated before the dispatch POST and is
# included verbatim in this run-name. ActionsRunPoller compares the complete display_title,
# so similarly named claims (for example job-1 and job-11) cannot cross-correlate.

on:
  workflow_dispatch:
    inputs:
      claim_id:
        description: 'Claim being executed'
        required: true
        type: string
      payload_digest:
        description: 'Payload digest carried by the claim'
        required: false
        type: string
      dispatch_id:
        description: 'Unique pre-dispatch correlation identity'
        required: true
        type: string

# Per-claim serialization: a second dispatch of the same claim cannot overlap the first.
concurrency:
  group: claim-work-${{ inputs.claim_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  perform:
    name: claim-work
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Perform delegated work
        env:
          # Untrusted dispatch inputs stay in the environment, never interpolated into
          # the shell body.
          IN_CLAIM_ID: ${{ inputs.claim_id }}
          IN_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          IN_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          set -euo pipefail
          mkdir -p claim-evidence
          receipt="claim-evidence/${IN_CLAIM_ID//[^A-Za-z0-9._-]/_}.txt"
          {
            printf 'claim_id=%s\n' "$IN_CLAIM_ID"
            printf 'payload_digest=%s\n' "${IN_PAYLOAD_DIGEST:-none}"
            printf 'dispatch_id=%s\n' "$IN_DISPATCH_ID"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'executed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$receipt"
          {
            echo "### Claim work"
            echo
            echo '```'
            cat "$receipt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claim-evidence-${{ github.run_id }}
          path: claim-evidence/
          if-no-files-found: error
          retention-days: 30
