name: Learning Baseline Import 014 Hosted

on:
  push:
    branches:
      - learning/repo-baseline-import-014-hosted
    paths:
      - "learning/import/impl014-hosted/READY"

permissions:
  contents: write

concurrency:
  group: learning-repo-baseline-import-014-hosted
  cancel-in-progress: false

jobs:
  import-baseline:
    name: Verify and preserve cumulative IMPL-014 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact trigger commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Create bounded import workspace
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/learning-baseline-import-$GITHUB_RUN_ID"
          STAGE_DIR="$RUNNER_TEMP/learning-baseline-stage-$GITHUB_RUN_ID"
          mkdir -p "$EVIDENCE_DIR" "$STAGE_DIR"
          {
            echo "EVIDENCE_DIR=$EVIDENCE_DIR"
            echo "STAGE_DIR=$STAGE_DIR"
          } >> "$GITHUB_ENV"
          {
            echo "objective=LEARNING-REPO-BASELINE-IMPORT-014"
            echo "trigger_commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "runner=$RUNNER_NAME"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
          } > "$EVIDENCE_DIR/run-context.txt"

      - name: Reconstruct verified transport package
        shell: bash
        run: |
          set -euo pipefail
          node learning/import/impl014/reconstruct_transport.js learning/import/impl014-br/chunks "$STAGE_DIR/impl014-governed.tar.br" 704a60f78935270d3d9a79dda97136d308e9fb4584af5521398778176da75387 15 > "$EVIDENCE_DIR/transport-reconstruct.json"
          cat "$EVIDENCE_DIR/transport-reconstruct.json"

      - name: Extract bounded governed transport
        shell: bash
        run: |
          set -euo pipefail
          node learning/import/impl014-br/extract_tarbr.js "$STAGE_DIR/impl014-governed.tar.br" "$STAGE_DIR/extract" 249 > "$EVIDENCE_DIR/transport-extract.json"
          cat "$EVIDENCE_DIR/transport-extract.json"

      - name: Verify governed hashes and copy baseline
        shell: bash
        run: |
          set -euo pipefail
          node learning/import/impl014/verify_and_copy.js "$STAGE_DIR/extract" learning/lab "$EVIDENCE_DIR/import-receipt.json" 8e2e84f093d05c12d1f705f774d4c3964bb76ae395ce5d279d00e8eeb6caa710 > "$EVIDENCE_DIR/verify-copy-stdout.json"
          cat "$EVIDENCE_DIR/import-receipt.json"

      - name: Prove repository mutation is bounded
        shell: bash
        run: |
          set -euo pipefail
          node learning/import/impl014/guard_git_scope.js "$EVIDENCE_DIR/git-scope.json"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/precommit-status.txt"
          cat "$EVIDENCE_DIR/git-scope.json"

      - name: Commit and push exact baseline bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- learning/lab
          if git diff --cached --quiet; then
            echo "No baseline files staged" >&2
            exit 1
          fi
          git commit -m "learning: import cumulative qualified IMPL-014 baseline"
          BASELINE_SHA="$(git rev-parse HEAD)"
          echo "$BASELINE_SHA" > "$EVIDENCE_DIR/baseline-commit.txt"
          git status --porcelain > "$EVIDENCE_DIR/post-commit-status.txt"
          test ! -s "$EVIDENCE_DIR/post-commit-status.txt"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          git ls-remote origin "refs/heads/$GITHUB_REF_NAME" > "$EVIDENCE_DIR/remote-head.txt"
          grep -q "^$BASELINE_SHA" "$EVIDENCE_DIR/remote-head.txt"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## LEARNING-REPO-BASELINE-IMPORT-014"
            test -f "$EVIDENCE_DIR/run-context.txt" && cat "$EVIDENCE_DIR/run-context.txt" || true
            test -f "$EVIDENCE_DIR/import-receipt.json" && cat "$EVIDENCE_DIR/import-receipt.json" || true
            if test -f "$EVIDENCE_DIR/baseline-commit.txt"; then
              echo "baseline_commit:"
              cat "$EVIDENCE_DIR/baseline-commit.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload baseline import evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-repo-baseline-import-014-hosted-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
