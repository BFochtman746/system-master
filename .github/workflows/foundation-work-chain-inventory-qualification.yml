name: Foundation Work Chain Recovery Inventory Qualification

on:
  pull_request:
    branches:
      - system-master/control-v2
    paths:
      - 'system-master/foundation-spine/work-chain/**'
      - '.github/scripts/foundation-work-chain-inventory-qualify.js'
      - '.github/workflows/foundation-work-chain-inventory-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-work-chain-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qualify lossless recovery inventory
        run: node .github/scripts/foundation-work-chain-inventory-qualify.js
