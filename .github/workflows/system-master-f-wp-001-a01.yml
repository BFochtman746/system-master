name: System Master F-WP-001 A-01 Qualification

on:
  push:
    branches:
      - system-master/f-wp-001-a01
    paths:
      - "system-master/f-wp-001/**"
      - ".github/scripts/fwp001-qualify.js"
      - ".github/workflows/system-master-f-wp-001-a01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-master-f-wp-001-a01
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify F-WP-001 on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout exact repository subject
        uses: actions/checkout@v4

      - name: Execute repository-owned F-WP-001 qualifier
        shell: cmd
        run: node .github\scripts\fwp001-qualify.js

      - name: Publish qualification summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\system-master-fwp001-%GITHUB_RUN_ID%"
          echo ## SYSTEM-MASTER F-WP-001 A-01>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\subject.txt" type "%EVIDENCE_DIR%\subject.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\result.txt" type "%EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if not exist "%EVIDENCE_DIR%\result.txt" echo result=FAIL_OR_INCOMPLETE>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\qualification.txt" type "%EVIDENCE_DIR%\qualification.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\failure.txt" type "%EVIDENCE_DIR%\failure.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload F-WP-001 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: system-master-f-wp-001-a01-evidence
          path: ${{ runner.temp }}/system-master-fwp001-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
