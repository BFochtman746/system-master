name: Documents Spine Effect Runtime Qualification

on:
  push:
    branches:
      - documents/spine-effect-runtime-001-20260912
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-runtime-portable:
    name: Java 21 strict / isolated 48+44 / cumulative portable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict compile current admitted source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java src/test/java -name '*.java' -print | LC_ALL=C sort > build/java-sources.txt
          javac --release 21 -Xlint:all -Werror -d build/classes @build/java-sources.txt
      - name: Isolated REBUILD-48 plus MASTER-44
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          java -cp build/classes org.systemmaster.tools.document.DocumentSpineEffectRuntimePortableTests | tee build/effect-runtime-isolated.txt
          grep -Fx 'DOCUMENT_SPINE_EFFECT_RUNTIME_PORTABLE_PASS REBUILD=48 MASTER=44' build/effect-runtime-isolated.txt
      - name: Cumulative portable regression
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          : > build/cumulative-portable.txt
          while IFS= read -r file; do
            class="${file#src/test/java/}"
            class="${class%.java}"
            class="${class//\//.}"
            printf 'RUN %s\n' "$class" | tee -a build/cumulative-portable.txt
            java -cp build/classes "$class" | tee -a build/cumulative-portable.txt
          done < <(find src/test/java -name '*PortableTests.java' -print | LC_ALL=C sort)
      - name: Preserve exact-subject receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          {
            printf 'subject=%s\n' "$GITHUB_SHA"
            printf 'environment=github-hosted-ubuntu-java21\n'
            printf 'isolated=REBUILD-48+MASTER-44\n'
            printf 'native-office=NOT_EXECUTED\n'
            printf 'publication=AUTO_NOT_AUTHORIZED\n'
            printf 'a01=NOT_EXECUTED\n'
          } > "$ROOT/build/exact-subject-receipt.txt"
