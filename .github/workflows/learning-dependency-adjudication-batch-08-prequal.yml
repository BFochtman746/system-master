name: Learning Dependency Adjudication Batch 08 Prequalification
on:
  push:
    branches: [learning/dependency-adjudication-batch-08-20260910]
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-08-CANDIDATE-051A.json"
      - ".github/scripts/learning-dependency-adjudication-batch-generic-qualify.js"
      - ".github/workflows/learning-dependency-adjudication-batch-08-prequal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Dependency evidence adjudication batch 08
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPENDENCY_CANDIDATE: LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-08-CANDIDATE-051A.json
      EXPECTED_CONTROL_HEAD: a82cb5964993e51777824d713b3ca33d7b1201ed
      START_INDEX: 35
      EXPECTED_COUNT: 5
      CUMULATIVE_COUNT: 40
      REMAINING_COUNT: 6
      EVIDENCE_DIR: learning-dependency-adjudication-batch-08-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check reusable validator
        run: node --check .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Validate candidates 36 through 40
        run: node .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-DEPENDENCY-ADJUDICATION-BATCH-08-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-dependency-adjudication-batch-08-evidence
          if-no-files-found: warn
          retention-days: 30

# Registration refresh only; candidate semantics and evidence boundaries are unchanged.
