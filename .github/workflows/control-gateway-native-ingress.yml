name: Control Gateway Native GitHub Ingress

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: control-gateway-production-writer
  cancel-in-progress: false

jobs:
  receipt-cas-write:
    name: Owner-only native ingress to receipt-consuming writer
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER' &&
      startsWith(github.event.issue.title, '[CONTROL-GATEWAY] ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: control-gateway-production
    steps:
      - name: Checkout exact production controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify workflow is executing exact main event head
        shell: bash
        run: |
          test "${GITHUB_EVENT_NAME}" = "issues"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Initialize immutable evidence directory
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/control-gateway-native-ingress-${GITHUB_RUN_ID}"
          mkdir -p "${evidence_dir}"
          echo "CONTROL_GATEWAY_WRITER_EVIDENCE_DIR=${evidence_dir}" >> "${GITHUB_ENV}"

      - name: Validate and bind native GitHub ingress
        id: ingress
        shell: bash
        run: node .github/scripts/control-gateway-native-ingress.js

      - name: Mint repository-scoped dedicated writer App token
        id: writer-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.CONTROL_GATEWAY_WRITER_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_GATEWAY_WRITER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Execute admitted exact-CAS mutation
        shell: bash
        env:
          CONTROL_GATEWAY_STATE_REF: ${{ steps.ingress.outputs.state_ref }}
          CONTROL_GATEWAY_MUTATION_REQUEST_JSON: ${{ steps.ingress.outputs.mutation_request_json }}
          CONTROL_GATEWAY_MUTATION_PLAN_JSON: ${{ steps.ingress.outputs.mutation_plan_json }}
          CONTROL_GATEWAY_WRITER_TOKEN: ${{ steps.writer-token.outputs.token }}
        run: node .github/scripts/control-gateway-production-writer.js

      - name: Upload immutable execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: control-gateway-native-ingress-${{ github.run_id }}-evidence
          path: ${{ env.CONTROL_GATEWAY_WRITER_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
