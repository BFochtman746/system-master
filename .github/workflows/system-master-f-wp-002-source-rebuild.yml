name: System Master F-WP-002 Source Rebuild

on:
  push:
    branches:
      - system-master/f-wp-002-a01
    paths:
      - '.github/workflows/system-master-f-wp-002-source-rebuild.yml'
      - 'qualification/fwp002/rebuild-source.js'
      - 'qualification/fwp002/source-payload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-master-f-wp-002-source-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild sealed F-WP-002 source on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact reconstruction subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verify test and commit F-WP-002 source
        shell: cmd
        run: node qualification\fwp002\rebuild-source.js

      - name: Publish source rebuild summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\fwp002-source-rebuild-%GITHUB_RUN_ID%"
          echo ## SYSTEM-MASTER F-WP-002 SOURCE REBUILD>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\result.txt" type "%EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\commit.txt" type "%EVIDENCE_DIR%\commit.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\qualification.txt" type "%EVIDENCE_DIR%\qualification.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\failure.txt" type "%EVIDENCE_DIR%\failure.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload source rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-master-f-wp-002-source-rebuild-evidence
          path: ${{ runner.temp }}/fwp002-source-rebuild-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
