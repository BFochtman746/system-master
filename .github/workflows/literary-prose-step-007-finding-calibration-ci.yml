name: Literary Prose STEP-007 Finding Calibration Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/step-f/step_007_finding_calibration.py'
      - 'qualification/literary-prose-engine-001/step-f/run_step_007_finding_calibration_fixtures.py'
      - '.github/workflows/literary-prose-step-007-finding-calibration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify STEP-007 finding calibration
        run: python qualification/literary-prose-engine-001/step-f/run_step_007_finding_calibration_fixtures.py
