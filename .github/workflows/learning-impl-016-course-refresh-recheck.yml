name: LEARNING-LAB-IMPL-016 Course Refresh Recheck

on:
  push:
    branches:
      - learning/impl-016-adaptive-entry-continuity
    paths:
      - ".github/workflows/learning-impl-016-course-refresh-recheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recheck:
    name: Verify course refresh regression on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          architecture: "x64"
          check-latest: false
      - name: Compile repaired fixture test
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m compileall -q learning_lab tests\test_course_refresh.py
      - name: Run course refresh regression
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest tests.test_course_refresh -v
