name: Learning Dependency Adjudication Batch 07 Prequalification

on:
  push:
    branches:
      - learning/dependency-adjudication-batch-07-20260910
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-07-CANDIDATE-050A.json"
      - ".github/scripts/learning-dependency-adjudication-batch-generic-qualify.js"
      - ".github/workflows/learning-dependency-adjudication-batch-07-prequal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Dependency evidence adjudication batch 07
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPENDENCY_CANDIDATE: LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-07-CANDIDATE-050A.json
      EXPECTED_CONTROL_HEAD: d1b26d1bef4fd8ef0f65e82ef68052e14344ed5b
      START_INDEX: 30
      EXPECTED_COUNT: 5
      CUMULATIVE_COUNT: 35
      REMAINING_COUNT: 11
      EVIDENCE_DIR: learning-dependency-adjudication-batch-07-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check reusable validator
        run: node --check .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Validate candidates 31 through 35
        run: node .github/scripts/learning-dependency-adjudication-batch-generic-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-DEPENDENCY-ADJUDICATION-BATCH-07-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-dependency-adjudication-batch-07-evidence
          if-no-files-found: warn
          retention-days: 30
