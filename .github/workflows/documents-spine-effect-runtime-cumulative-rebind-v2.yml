name: Documents Spine Effect Runtime Cumulative Rebind V2

on:
  push:
    branches:
      - documents/spine-effect-runtime-001-20260912
    paths:
      - .github/workflows/documents-spine-effect-runtime-cumulative-rebind-v2.yml

permissions:
  contents: write

jobs:
  rebind-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: documents/spine-effect-runtime-001-20260912
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply portable explicit-admission rebind
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/documents-spine-effect-runtime-cumulative-rebind.py
          git diff --check
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE/src/test/java
          git commit -m 'documents: rebind portable spine effects to explicit admission provider'
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
          echo "QUALIFIED_SUBJECT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify exact rebound subject
        shell: bash
        run: |
          set +e
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java src/test/java -name '*.java' -print | LC_ALL=C sort > build/java-sources.txt
          javac --release 21 -Xlint:all -Werror -d build/classes @build/java-sources.txt > build/rebind-compile.txt 2>&1
          COMPILE=$?
          ISOLATED=99
          OWNER_ROUTE=99
          CUMULATIVE=99
          COUNT=0
          if [ "$COMPILE" -eq 0 ]; then
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpineEffectRuntimePortableTests > build/rebind-isolated.txt 2>&1
            ISOLATED=$?
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpine002APortableTests > build/rebind-owner-route.txt 2>&1
            OWNER_ROUTE=$?
            : > build/rebind-cumulative.txt
            CUMULATIVE=0
            while IFS= read -r file; do
              class="${file#src/test/java/}"
              class="${class%.java}"
              class="${class//\//.}"
              printf 'RUN %s\n' "$class" >> build/rebind-cumulative.txt
              java -cp "$(pwd)/build/classes" "$class" >> build/rebind-cumulative.txt 2>&1
              STATUS=$?
              if [ "$STATUS" -ne 0 ]; then CUMULATIVE=1; fi
              COUNT=$((COUNT + 1))
            done < <(find src/test/java -name '*PortableTests.java' -print | LC_ALL=C sort)
          else
            : > build/rebind-isolated.txt
            : > build/rebind-owner-route.txt
            : > build/rebind-cumulative.txt
          fi
          echo "COMPILE_STATUS=$COMPILE" >> "$GITHUB_ENV"
          echo "ISOLATED_STATUS=$ISOLATED" >> "$GITHUB_ENV"
          echo "OWNER_ROUTE_STATUS=$OWNER_ROUTE" >> "$GITHUB_ENV"
          echo "CUMULATIVE_STATUS=$CUMULATIVE" >> "$GITHUB_ENV"
          echo "CUMULATIVE_COUNT=$COUNT" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          if [ "$COMPILE" -eq 0 ] && [ "$ISOLATED" -eq 0 ] && [ "$OWNER_ROUTE" -eq 0 ] && [ "$CUMULATIVE" -eq 0 ]; then
            exit 0
          fi
          exit 1
      - name: Preserve exact attempt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          mkdir -p qualification/document-system/spine
          {
            printf 'record=DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003\n'
            printf 'subject=%s\n' "${QUALIFIED_SUBJECT:-UNAVAILABLE}"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'environment=github-hosted-ubuntu-java21\n'
            printf 'compile_status=%s\n' "${COMPILE_STATUS:-99}"
            printf 'isolated_48_44_status=%s\n' "${ISOLATED_STATUS:-99}"
            printf 'owner_route_status=%s\n' "${OWNER_ROUTE_STATUS:-99}"
            printf 'cumulative_status=%s\n' "${CUMULATIVE_STATUS:-99}"
            printf 'cumulative_classes=%s\n' "${CUMULATIVE_COUNT:-0}"
            printf 'portable_test_provider=PortableTestDocumentEffectAdmission__QUALIFIER_ONLY\n'
            printf 'real_external_policy_provider=NOT_EXECUTED\n'
            printf 'native_office=NOT_EXECUTED\n'
            printf 'publication_authorization=NOT_EXECUTED\n'
            printf 'a01=NOT_EXECUTED\n'
            printf '%s\n' '--- compile ---'
            cat "$ROOT/build/rebind-compile.txt" 2>/dev/null || true
            printf '%s\n' '--- isolated ---'
            cat "$ROOT/build/rebind-isolated.txt" 2>/dev/null || true
            printf '%s\n' '--- owner route ---'
            cat "$ROOT/build/rebind-owner-route.txt" 2>/dev/null || true
            printf '%s\n' '--- cumulative tail ---'
            tail -n 180 "$ROOT/build/rebind-cumulative.txt" 2>/dev/null || true
          } > qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003.txt
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003.txt
          git commit -m 'documents: preserve explicit-admission cumulative qualification evidence' || true
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
