name: P07 Foundation Admission Commit Once

on:
  push:
    paths:
      - '.github/workflows/p07-foundation-admission-commit-once.yml'

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Admit P07 receipt and regenerate matrix projection
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const registryPath = 'governance/census/FOUNDATION-CLOSURE-EVIDENCE-REGISTRY-001.json';
          const matrixPath = 'governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md';

          const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          if (registry.authority_id !== 'CURRENT-AUTHORITY-005') throw new Error(`REGISTRY_AUTHORITY_MISMATCH ${registry.authority_id}`);
          if (registry.entries.some(e => e.requirement_or_capability_id === 'P07')) throw new Error('P07_ALREADY_ADMITTED');
          const p06Index = registry.entries.findIndex(e => e.requirement_or_capability_id === 'P06');
          if (p06Index < 0 || p06Index !== registry.entries.length - 1) throw new Error('P06_NOT_CURRENT_REGISTRY_TAIL');

          registry.entries.push({
            requirement_or_capability_id: 'P07',
            owner_path: 'SYSTEM_MASTER/CORE',
            authority_id: 'CURRENT-AUTHORITY-005',
            status: 'PASS',
            subject_sha: '2bf022c5f39d0b3275d66f91883a5551b67c583f',
            subjects: [
              {path:'governance/CURRENT-AUTHORITY.json',git_blob_sha:'a67b9641023e0504a5557d8f7ecd3e0e76087f44'},
              {path:'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-003.json',git_blob_sha:'9f7f4df7e9cfbcd1ca13b58af19b61adf8f977ab'},
              {path:'governance/WORK-OBLIGATION-REGISTRY-017.json',git_blob_sha:'48834ad914edb18b9e48e25e3e5c8dc65c4b9b4e'},
              {path:'governance/SYSTEM-TOPOLOGY-007.json',git_blob_sha:'7ab634e41cdce2e288cef9f74930f93a7ef54e82'},
              {path:'governance/architecture/SYSTEM-MASTER-TOOL-OWNER-ALLOCATION-006.json',git_blob_sha:'401a9748c18bdfe30361f40553788dcf497fa1c4'},
              {path:'governance/contracts/P07-FOUNDATION-CONTRACT-001.md',git_blob_sha:'2299e28cbc7dc2aeb2307a9b5a7d4e84eba52fcb'},
              {path:'.github/scripts/a01-admission-barrier.js',git_blob_sha:'bc0259865e7b79565b06c8c4ae0a56b8b6a5db03'},
              {path:'qualification/a01/a01-policy.json',git_blob_sha:'57a840e2fcb326584328bf45a5acd8f449b7ff57'},
              {path:'qualification/a01/registry.json',git_blob_sha:'25c63063b2124fc7dd787251e0d80deffcdf0f6c'},
              {path:'.github/workflows/a01-control-plane-gateway.yml',git_blob_sha:'5cc1659f9947c88d293111983d7814c328eb61ae'},
              {path:'.github/workflows/a01-control-plane-admission-broker.yml',git_blob_sha:'4aa78d04ffb362219fd17ba7eaedc35f327af5a4'},
              {path:'.github/workflows/a01-control-plane-enforcement.yml',git_blob_sha:'27286774ce8b1d839188b5b5d5e6993d9af0494f'},
              {path:'.github/workflows/p07-a01-admission-barrier-foundation-qualification.yml',git_blob_sha:'79a68639b03d7c9e492d56e2eb0fd215af185cb9'}
            ],
            qualification: {
              workflow_run_id: 34926943360,
              workflow_name: 'P07 A-01 Admission Barrier Foundation Qualification',
              artifact_id: 10380440701,
              artifact_name: 'p07-foundation-1.0-evidence',
              artifact_digest: 'sha256:779bfc8f18f392eec0435184d03eb8c8d594648fa705ec080fe5b091f53ec168',
              head_sha: '2bf022c5f39d0b3275d66f91883a5551b67c583f',
              conclusion: 'success'
            },
            evidence_refs: [
              'https://github.com/BFochtman746/system-master/actions/runs/34926943360',
              'https://api.github.com/repos/BFochtman746/system-master/actions/artifacts/10380440701'
            ]
          });
          fs.writeFileSync(registryPath, JSON.stringify(registry, null, 2) + '\n');

          let matrix = fs.readFileSync(matrixPath, 'utf8');
          const replaceExactly = (from, to, label) => {
            const count = matrix.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}_EXPECTED_ONCE actual=${count}`);
            matrix = matrix.replace(from, to);
          };
          replaceExactly('| `COMPLETE_WITH_EVIDENCE` | 7 |', '| `COMPLETE_WITH_EVIDENCE` | 8 |', 'COMPLETE_COUNT');
          replaceExactly('| `ACTIVE_GAP` | 43 |', '| `ACTIVE_GAP` | 42 |', 'ACTIVE_COUNT');
          replaceExactly('**Foundation 1.0 completion with evidence: 14% (7 of 50 in-scope rows).**', '**Foundation 1.0 completion with evidence: 16% (8 of 50 in-scope rows).**', 'FOUNDATION_PERCENT');
          replaceExactly('| `P07` | P07 | SYSTEM_MASTER/CORE | `ACTIVE_GAP` | Contract populated; current-authority Foundation evidence receipt not registered. |', '| `P07` | P07 | SYSTEM_MASTER/CORE | `COMPLETE_WITH_EVIDENCE` | Fresh current-authority PASS receipt admitted for exact subject `2bf022c5f39d0b3275d66f91883a5551b67c583f`; four-context admission alignment plus fail-closed registration, identity, wrapper, timeout and overnight guards proven. |', 'P07_ROW');
          const unresolvedMarker = '## Unresolved gap successor register';
          if ((matrix.split(unresolvedMarker).length - 1) !== 1) throw new Error('UNRESOLVED_MARKER_EXPECTED_ONCE');
          const p07Evidence = '`P07` is current-complete with exact-subject evidence from GitHub Actions run `34926943360`, artifact `10380440701`, bound to subject `2bf022c5f39d0b3275d66f91883a5551b67c583f`; the barrier admits registered `normal`, `recovery`, and `repair` contexts with exact subject/control-plane identity, recognizes `overnight` and applies its stricter policy, refuses unregistered and invalid-context requests fail-closed, and proves gateway-to-broker admission wiring before subject checkout.\n\n';
          matrix = matrix.replace(unresolvedMarker, p07Evidence + unresolvedMarker);
          replaceExactly('43 `ACTIVE_GAP` rows remain.', '42 `ACTIVE_GAP` rows remain.', 'UNRESOLVED_COUNT');
          replaceExactly('**Exact next ACTIVE_GAP: `P07` - A-01 admission barrier.**', '**Exact next ACTIVE_GAP: `P08` - Qualification execution and PASS semantics.**', 'NEXT_GAP');
          replaceExactly('Continue `P07-P12`, `P15`, then owner-valid capability gaps in dependency-valid order.', 'Continue `P08-P12`, `P15`, then owner-valid capability gaps in dependency-valid order.', 'SUCCESSOR_RANGE');
          fs.writeFileSync(matrixPath, matrix);
          NODE

          git diff --check
          git config user.name 'BFochtman746'
          git config user.email '85698619+BFochtman746@users.noreply.github.com'
          git add governance/census/FOUNDATION-CLOSURE-EVIDENCE-REGISTRY-001.json governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md
          git commit -m 'Foundation P07: admit current evidence and advance closure to P08'
          git push origin HEAD:${GITHUB_REF_NAME}
