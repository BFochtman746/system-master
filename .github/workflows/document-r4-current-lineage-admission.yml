name: Document R4 Current-Lineage Source Admission

on:
  push:
    branches:
      - documents/r4-current-lineage-admission-20260912
    paths:
      - .github/workflows/document-r4-current-lineage-admission.yml

permissions:
  contents: write

concurrency:
  group: document-r4-current-lineage-admission-20260912
  cancel-in-progress: false

jobs:
  admit-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OWNER_BASE_SHA: a3197edd202b1d0d27fecfca2fb31ba1fb12aa8d
      CARRIER_SHA256: 77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd
      MANIFEST_SHA256: ed36fc9cfd38b04a8d0174efed06b03e8e25b0a45fc0adc4d47fe3457c2ee367
      SOURCE_ROWS: '225'
      CONTRACT_BLOB: e171d148dfb4e267031b00d62740ef1ede6a0552
      CHUNK_MANIFEST_BLOB: d9f04e99454f792424c24d82a01eae484b803990
      CHUNK_000_BLOB: 64034670dbbe18f6b629108bd1d9b1d8d81c4ac8
      CHUNK_001_BLOB: 562ec2e184b6068e0f123c9e097d344a42c67dce
      CHUNK_002_BLOB: 7b592c67e39a998301be7e5146533b842d724db2
      CHUNK_003_BLOB: d67f828a421b0af4c75d3c5b6a2c25b8ca2a1c20
      CHUNK_004_BLOB: 3518bf5ac92360b07f86c6107670da40f5830d1f
      VERIFY_BLOB: 54d97c6499404a115431fdd57e10bbc25a7f4f13
      TEST_BLOB: aeae7891d15c2a6a78ef093ec38d0d70e32924d5
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - name: Checkout exact trigger subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prove owner lineage and immutable bridge
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$OWNER_BASE_SHA" "$GITHUB_SHA"
          B='transport/document-r4-bridge-005'
          test "$(git rev-parse "$GITHUB_SHA:$B/TRANSPORT-CONTRACT.json")" = "$CONTRACT_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/CHUNK-MANIFEST.json")" = "$CHUNK_MANIFEST_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/chunk-000.b64")" = "$CHUNK_000_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/chunk-001.b64")" = "$CHUNK_001_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/chunk-002.b64")" = "$CHUNK_002_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/chunk-003.b64")" = "$CHUNK_003_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/chunk-004.b64")" = "$CHUNK_004_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/verify_and_extract_transport.py")" = "$VERIFY_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$B/test_transport_contract.py")" = "$TEST_BLOB"

      - name: Reconstruct and verify exact 225-file source
        shell: bash
        run: |
          set -euo pipefail
          B='transport/document-r4-bridge-005'
          rm -rf /tmp/r4-current recovered/document/cr001-r4
          mkdir -p /tmp/r4-current/chunks
          cp "$B"/chunk-*.b64 /tmp/r4-current/chunks/
          python3 "$B/verify_and_extract_transport.py" \
            --contract "$B/TRANSPORT-CONTRACT.json" \
            --chunk-manifest "$B/CHUNK-MANIFEST.json" \
            --chunks /tmp/r4-current/chunks \
            --carrier-out /tmp/r4-current/carrier.tar.xz \
            --extract-out /tmp/r4-current/extracted \
            | tee /tmp/r4-current/source-verification.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          q=json.loads(pathlib.Path('/tmp/r4-current/source-verification.json').read_text())
          assert q['result']=='PASS' and q['carrier_sha256']=='77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd'
          assert q['chunks_verified']==5 and q['source_rows_verified']==225
          m=pathlib.Path('/tmp/r4-current/extracted/evidence/CANONICAL-SOURCE-TREE-MANIFEST.csv').read_bytes()
          assert hashlib.sha256(m).hexdigest()=='ed36fc9cfd38b04a8d0174efed06b03e8e25b0a45fc0adc4d47fe3457c2ee367'
          PY
          cp -a /tmp/r4-current/extracted recovered/document/cr001-r4
          git config user.name system-master-documents-worker
          git config user.email system-master-documents-worker@users.noreply.github.com
          git add recovered/document/cr001-r4
          git commit -m 'documents: admit exact CR001-R4 source tree on current lineage'
          echo "SOURCE_SUBJECT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE_SHA=$(git show -s --format=%T HEAD)" >> "$GITHUB_ENV"

      - name: Configure Java 21 and external qualification tools
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install bounded document qualification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          command -v soffice
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdfimages

      - name: Strict Java 21 compile exact source subject
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          OUT='/tmp/r4-current/classes'; QUAL='/tmp/r4-current/qual'
          mkdir -p "$OUT" "$QUAL"
          mapfile -d '' JAVA_FILES < <(find "$ROOT/src/main/java" "$ROOT/src/test/java" -type f -name '*.java' -print0 | sort -z)
          test "${#JAVA_FILES[@]}" -eq 225
          printf 'java_source_files=%s\n' "${#JAVA_FILES[@]}" | tee "$QUAL/compile.log"
          javac --release 21 -Xlint:all -Werror -d "$OUT" "${JAVA_FILES[@]}" 2>&1 | tee -a "$QUAL/compile.log"
          echo 'STRICT_JAVA21_COMPILE=PASS' | tee -a "$QUAL/compile.log"

      - name: Run all portable Document suites
        shell: bash
        run: |
          set -euo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          OUT='/tmp/r4-current/classes'; QUAL='/tmp/r4-current/qual'
          : > "$QUAL/portable.log"; COUNT=0
          while IFS= read -r file; do
            pkg="$(sed -n 's/^package \(.*\);/\1/p' "$file" | head -n 1)"
            cls="$(basename "$file" .java)"; test -n "$pkg"
            fqcn="$pkg.$cls"; echo "RUN=$fqcn" | tee -a "$QUAL/portable.log"
            java -cp "$OUT" "$fqcn" 2>&1 | tee -a "$QUAL/portable.log"
            COUNT=$((COUNT + 1))
          done < <(find "$ROOT/src/test/java" -type f -name '*PortableTests.java' | sort)
          test "$COUNT" -gt 0
          echo "PORTABLE_TEST_CLASSES_PASS=$COUNT" | tee -a "$QUAL/portable.log"
          echo "$COUNT" > "$QUAL/portable-count.txt"

      - name: Run T13 and T14 hosted external qualification
        shell: bash
        run: |
          set -euo pipefail
          OUT='/tmp/r4-current/classes'; QUAL='/tmp/r4-current/qual'
          : > "$QUAL/external.log"
          for cls in \
            org.systemmaster.tools.document.DocumentDocxMasteryT13ExternalQualification \
            org.systemmaster.tools.document.DocumentDocxMasteryT14ExternalQualification; do
            echo "RUN=$cls" | tee -a "$QUAL/external.log"
            java -cp "$OUT" "$cls" "$(command -v soffice)" "$(command -v pdfinfo)" "$(command -v pdftotext)" "$(command -v pdftoppm)" "$(command -v pdfimages)" 2>&1 | tee -a "$QUAL/external.log"
          done
          echo 'R4_EXTERNAL_T13_T14=PASS' | tee -a "$QUAL/external.log"

      - name: Seal exact-subject qualification and push only on unchanged branch
        shell: bash
        run: |
          set -euo pipefail
          QUAL='/tmp/r4-current/qual'
          DEST='qualification/document-r4/CR001-R4-CURRENT-LINEAGE-QUALIFICATION-001'
          mkdir -p "$DEST"
          cp "$QUAL/compile.log" "$DEST/STRICT-JAVA21-COMPILE.log"
          cp "$QUAL/portable.log" "$DEST/PORTABLE-SUITES.log"
          cp "$QUAL/external.log" "$DEST/T13-T14-EXTERNAL.log"
          PORTABLE_COUNT="$(cat "$QUAL/portable-count.txt")"
          python3 - "$SOURCE_SUBJECT_SHA" "$SOURCE_TREE_SHA" "$PORTABLE_COUNT" "$GITHUB_RUN_ID" <<'PY'
          import json,pathlib,sys
          subject,tree,count,run=sys.argv[1],sys.argv[2],int(sys.argv[3]),int(sys.argv[4])
          receipt={
            'qualification_id':'CR001-R4-CURRENT-LINEAGE-QUALIFICATION-001',
            'owner':'SYSTEM_MASTER/DOCUMENTS',
            'qualified_source_subject_sha':subject,
            'qualified_source_tree_sha':tree,
            'owner_base_sha':'a3197edd202b1d0d27fecfca2fb31ba1fb12aa8d',
            'source_identity':'PASS__225_OF_225_EXACT_PATH_SIZE_SHA',
            'source_manifest_sha256':'ed36fc9cfd38b04a8d0174efed06b03e8e25b0a45fc0adc4d47fe3457c2ee367',
            'bridge_carrier_sha256':'77a6e2288d475865622bad4b2c66647a599c26a3899c6617b33d7b2b334855bd',
            'strict_java21_compile':'PASS',
            'portable_test_classes_passed':count,
            'r4_t13_hosted_external':'PASS',
            'r4_t14_hosted_external':'PASS',
            'workflow_run_id':run,
            'historical_pass_transfer':False,
            'a01_pass':False,'native_office_pass':False,'production_pass':False,
            'standing':'GITHUB_NATIVE_EXACT_SOURCE_TREE_CUSTODY_PASS__FRESH_CURRENT_LINEAGE_HOSTED_QUALIFICATION_PASS__A01_NATIVE_PRODUCTION_NOT_CLAIMED'
          }
          pathlib.Path('qualification/document-r4/CR001-R4-CURRENT-LINEAGE-QUALIFICATION-001/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          printf '%s\n' "$SOURCE_SUBJECT_SHA" > "$DEST/QUALIFIED-SOURCE-SUBJECT-SHA.txt"
          git add "$DEST"
          git commit -m 'documents: seal R4 current-lineage exact-subject qualification'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
