name: A-01 Unblock Exact ARM Run 34291041277

on:
  push:
    branches:
      - system-master/a01-unblock-34291041277

permissions:
  actions: write
  contents: read

jobs:
  cancel-exact-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel exact receipt-preserved stale ARM run until terminal
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            status=$(gh api "repos/${REPO}/actions/runs/34291041277" --jq .status)
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api "repos/${REPO}/actions/runs/34291041277" --jq .conclusion)
              echo "ARM run is terminal: ${conclusion}"
              exit 0
            fi
            gh api --method POST "repos/${REPO}/actions/runs/34291041277/force-cancel" >/dev/null || true
            echo "force-cancel attempt ${attempt}; current status=${status}"
            sleep 5
          done
          status=$(gh api "repos/${REPO}/actions/runs/34291041277" --jq .status)
          echo "ARM run did not become terminal; final status=${status}" >&2
          exit 1
