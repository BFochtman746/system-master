name: CG-011 A-01 Closure Repair — Bottom-Up Cumulative Gate

on:
  push:
    branches:
      - second-shift-control-gateway/cg-011-a01-closure-repair
    paths:
      - '.github/scripts/a01-second-shift-supervisor-v2-qualify.js'
      - '.github/workflows/second-shift-control-gateway-cg-011-a01-closure-repair.yml'
      - 'control-gateway/**'
      - 'tests/**'
      - 'tools/second_shift_supervisor_v2.py'
      - 'governance/control-gateway/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portable-cumulative:
    name: Portable cumulative Foundation gate / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout exact repair subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify exact subject identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --version
          python --version
      - name: Run bottom-up cumulative CG-008 through CG-011 qualification
        shell: bash
        env:
          A01_SUBJECT_SHA: ${{ github.sha }}
          A01_SUBJECT_ROOT: ${{ github.workspace }}
          A01_EVIDENCE_DIR: ${{ runner.temp }}/cg011-portable-${{ matrix.node }}
          A01_QUALIFICATION_ID: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
          A01_WORKSTREAM_ID: SECOND-SHIFT-CONTROL-GATEWAY
        run: node .github/scripts/a01-second-shift-supervisor-v2-qualify.js

  independent-adversarial:
    name: Independent CG-011 closure audit
    needs: portable-cumulative
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact already-qualified repair subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Recheck exact subject and attack closure invariants independently
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python tests/test_control_gateway_cg011_adversarial_closure.py
          python tests/test_control_gateway_cg011_dispatch_failure_replay.py

  a01-windows-cumulative:
    name: Exact-subject A-01 Windows cumulative qualification
    needs: [portable-cumulative, independent-adversarial]
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS
      workstream_id: SECOND-SHIFT-CONTROL-GATEWAY
      subject_sha: ${{ github.sha }}
      origin_ref: refs/heads/second-shift-control-gateway/cg-011-a01-closure-repair
      resume_on_pass: Preserve the A-01 PASS receipt for the exact CG-011 closure-repair subject, reconcile the premature r28 freeze, and issue a replacement terminal freeze only after the same subject has hosted and A-01 cumulative PASS evidence.
      resume_on_failure: Keep the r28 closure historical only, mark CG-011 A-01 closure repair BLOCKED, repair the exact failing Foundation boundary, and rerun hosted cumulative plus A-01 on the replacement exact subject before any freeze.
      notification_target: workstream:SECOND-SHIFT-CONTROL-GATEWAY
      execution_context: normal
      qualifier_timeout_minutes: 28
      job_timeout_minutes: 30
      repair_attempt: 0
      max_repair_attempts: 1
