name: LEARNING PILOT-001 RUN-001 Prequalification

on:
  push:
    branches: [learning/pilot-001-run-001-real-participant-stage-1]
    paths:
      - ".github/workflows/learning-pilot-001-run-001-prequal.yml"
      - ".github/scripts/learning-pilot-001-run-001-human-session-qualify.js"
      - "learning/lab/learning_lab/real_learner_pilot_human_session.py"
      - "learning/lab/learning_lab/real_learner_pilot_runtime_binding.py"
      - "learning/lab/system_master_real_learner_human_session_bridge.py"
      - "learning/lab/tests/test_real_learner_pilot_human_session.py"
      - "qualification/a01/registry.json"
      - "qualification/a01/legacy-direct-workflows.json"
      - ".github/workflows/learning-pilot-001-run-001-human-session.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  A01_SUBJECT_SHA: ${{ github.sha }}

jobs:
  prequalify:
    name: Deterministic prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
      - name: Prepare prequalification evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/learning-pilot-run001-prequal-$GITHUB_RUN_ID"
          echo "A01_EVIDENCE_DIR=$RUNNER_TEMP/learning-pilot-run001-prequal-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Execute registered qualifier off A-01
        shell: bash
        run: node .github/scripts/learning-pilot-001-run-001-human-session-qualify.js
      - name: Verify shared control-plane enforcement
        shell: bash
        run: |
          node .github/scripts/a01-control-plane-enforce.js selftest
          node .github/scripts/a01-control-plane-enforce.js scan
      - name: Upload prequalification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-pilot-001-run-001-prequalification-${{ github.run_id }}
          path: ${{ runner.temp }}/learning-pilot-run001-prequal-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
