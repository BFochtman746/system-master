name: Literary Prose Real-Book Admission Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/real-book-qualification/**'
      - '.github/workflows/literary-prose-real-book-admission-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify admission gate
        run: python qualification/literary-prose-engine-001/real-book-qualification/run_real_book_admission_fixtures.py
