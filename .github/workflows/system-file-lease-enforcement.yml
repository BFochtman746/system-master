name: System File Lease Enforcement

# (e) The gate that keeps the single-writer layer honest.
#
# Runs on pull_request because that is where the chokepoint is: once main requires
# PRs, every mutation passes through here. A push trigger is kept for main so that
# anything landing by another route is still audited after the fact rather than
# silently accepted.
#
# This workflow exists specifically so the lock cannot fail the way its predecessors
# did — SYSTEM-PROGRAM-JOB-LOCK-001.json validates JSON against JSON, and
# chat-recovery-gate.js was imported by nothing but its own test. Both stayed "green"
# by never being in a position to object.

# A REQUIRED CHECK MUST ALWAYS REPORT.
#
# This trigger deliberately carries no `paths:` filter, and removing it was a bug fix.
# Both jobs below are bound as REQUIRED status checks on main. A path-filtered workflow
# does not report a neutral or skipped result when its paths do not match — it never
# starts, so GitHub holds the required check permanently "pending" and the pull request
# can never merge. PR #143 (execution-claims) touched no governed path and was blocked
# by exactly this, with no failing check to point at.
#
# So the filtering moved inside: system-file-lease-enforce.js computes the governed
# paths in the commit range itself and exits 0 when there are none. The gate is no
# weaker for it — it still fails a governed mutation that carries no lease receipt,
# which is the only thing it was ever meant to object to. The cost is a few seconds
# of runner time on unrelated pull requests, which is the correct trade for a
# chokepoint that cannot deadlock.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/second-shift/**'
      - 'governance/control-gateway/**'
      - 'system-master/control-gateway-lock/**'

jobs:
  lease-receipts:
    name: Governed mutations carry lease receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the audit walks merge-base..HEAD, which a shallow clone cannot resolve.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit lease receipts on governed system files
        run: node .github/scripts/system-file-lease-enforce.js

  lock-runtime:
    name: Single-writer runtime qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and qualify the lease registry
        run: |
          set -euo pipefail
          mkdir -p /tmp/lockbuild
          javac -d /tmp/lockbuild \
            system-master/control-gateway-lock/src/main/java/org/systemmaster/core/SystemFileLeaseRegistry.java \
            system-master/control-gateway-lock/src/main/java/org/systemmaster/core/SystemFileLeaseRegistryTest.java \
            system-master/f-wp-007/src/main/java/org/systemmaster/core/ExecutionLeaseManager.java \
            system-master/f-wp-007/src/main/java/org/systemmaster/core/CoordinationContracts.java
          java -cp /tmp/lockbuild org.systemmaster.core.SystemFileLeaseRegistryTest
