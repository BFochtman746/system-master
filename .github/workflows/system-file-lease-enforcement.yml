name: System File Lease Enforcement

# The required single-writer chokepoint. It proves both immutable commit-level lease
# receipts and PR-level ownership so multiple open PRs cannot concurrently claim the
# same protected operation or system-file boundary.
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'system-master/owner-lane-execution-lease-adoption-*'
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/second-shift/**'
      - 'governance/control-gateway/**'
      - 'system-master/control-gateway-lock/**'
      - 'control-gateway/**'
      - '.github/scripts/system-file-lease-enforce.js'
      - '.github/scripts/system-file-lease-enforce.test.js'
      - '.github/workflows/system-file-lease-enforcement.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  lease-receipts:
    name: Governed mutations carry lease receipts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Qualify PR-level single-writer semantics
        run: node .github/scripts/system-file-lease-enforce.test.js
      - name: Audit lease receipts and competing open PR writers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/system-file-lease-enforce.js

  lock-runtime:
    name: Single-writer runtime qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and qualify the lease registry
        run: |
          set -euo pipefail
          mkdir -p /tmp/lockbuild
          javac -d /tmp/lockbuild \
            system-master/control-gateway-lock/src/main/java/org/systemmaster/core/SystemFileLeaseRegistry.java \
            system-master/control-gateway-lock/src/main/java/org/systemmaster/core/SystemFileLeaseRegistryTest.java \
            system-master/f-wp-007/src/main/java/org/systemmaster/core/ExecutionLeaseManager.java \
            system-master/f-wp-007/src/main/java/org/systemmaster/core/CoordinationContracts.java
          java -cp /tmp/lockbuild org.systemmaster.core.SystemFileLeaseRegistryTest

  lease-repair-exact-subject:
    name: Lease repair exact-subject qualification
    if: startsWith(github.ref, 'refs/heads/system-master/owner-lane-execution-lease-adoption-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact lease-repair subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify lease recovery and production CAS semantics
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/control-gateway-production-writer.js
          node --test control-gateway/test/github-production-mutation.test.js
          node --test control-gateway/test/github-system-file-lease.test.js
          node .github/scripts/system-file-lease-enforce.test.js
      - name: Run canonical repository verification
        shell: bash
        run: |
          set -euo pipefail
          bash ./verify.sh
