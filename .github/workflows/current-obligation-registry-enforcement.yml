name: Current Obligation Registry Enforcement

on:
  workflow_dispatch:
  push:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/EXPECTATION-REGISTRY-*.json'
      - 'governance/REALLOCATION-LEDGER-*.json'
      - 'governance/second-shift/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/workflows/current-obligation-registry-enforcement.yml'
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/SYSTEM-TOPOLOGY-*.json'
      - 'governance/SYSTEM-PROGRAM-JOB-LOCK-*.json'
      - 'governance/SYSTEM-COMPLETION-STATUS-*.json'
      - 'governance/COMPLETION-LEDGER-*.json'
      - 'governance/WORK-OBLIGATION-REGISTRY-*.json'
      - 'governance/EXPECTATION-REGISTRY-*.json'
      - 'governance/REALLOCATION-LEDGER-*.json'
      - 'governance/second-shift/**'
      - '.github/scripts/program-job-lock-enforce.js'
      - '.github/scripts/current-obligation-registry-enforce.js'
      - '.github/workflows/current-obligation-registry-enforcement.yml'

concurrency:
  group: current-obligation-registry-enforcement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-current-registry:
    name: Validate authority-selected obligations against locked jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Syntax check
        run: |
          node --check .github/scripts/program-job-lock-enforce.js
          node --check .github/scripts/current-obligation-registry-enforce.js
      - name: Validate program jobs and completion truth
        run: node .github/scripts/program-job-lock-enforce.js
      - name: Validate CURRENT-AUTHORITY selected obligation registry
        run: node .github/scripts/current-obligation-registry-enforce.js
