name: Calendar Foundation Qualification

on:
  push:
    paths:
      - 'governance/contracts/CALENDAR-FOUNDATION-CONTRACT-*.md'
      - 'tools/calendar_action_plan.py'
      - '.github/scripts/calendar-foundation-qualify.py'
      - 'tests/test_calendar_action_plan.py'
      - 'qualification/calendar/**'
      - '.github/workflows/calendar-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/contracts/CALENDAR-FOUNDATION-CONTRACT-*.md'
      - 'tools/calendar_action_plan.py'
      - '.github/scripts/calendar-foundation-qualify.py'
      - 'tests/test_calendar_action_plan.py'
      - 'qualification/calendar/**'
      - '.github/workflows/calendar-foundation-qualification.yml'
  workflow_dispatch:

concurrency:
  group: calendar-foundation-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic Calendar foundation
        run: python3 -m unittest tests.test_calendar_action_plan
      - name: Qualify representative Calendar corpus
        env:
          CALENDAR_SOURCE_ID: ${{ github.sha }}
        run: python3 .github/scripts/calendar-foundation-qualify.py
      - name: Preserve machine-readable Calendar qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: calendar-foundation-1.0-evidence
          path: qualification-output/calendar-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
