name: P15 A-01 Morning Receipt

on:
  schedule:
    # 12:15 UTC is after the 07:00 America/New_York Second Shift boundary in both
    # EDT (11:00 UTC) and EST (12:00 UTC).
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p15-a01-morning-receipt
  cancel-in-progress: false

jobs:
  morning-receipt:
    name: Read-only A-01 morning receipt
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      A01_SUPERVISOR_DB: ${{ vars.A01_SUPERVISOR_DB || 'C:\SystemMaster\a01-supervisor.db' }}
    steps:
      - name: Checkout exact main authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Emit read-only morning receipt
        id: receipt
        shell: powershell
        env:
          PYTHONPATH: ${{ github.workspace }}\control-gateway\python;${{ github.workspace }}
        run: |
          $receiptPath = Join-Path $env:RUNNER_TEMP "a01-morning-receipt-$env:GITHUB_RUN_ID.json"
          & python -m a01_morning_receipt --db "$env:A01_SUPERVISOR_DB" --json 2>&1 | Tee-Object -FilePath $receiptPath
          $code = $LASTEXITCODE
          "receipt_path=$receiptPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "receipt_exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Upload immutable morning receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-morning-receipt-${{ github.run_id }}
          path: ${{ steps.receipt.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Surface operator attention as workflow state
        if: always()
        shell: powershell
        env:
          RECEIPT_EXIT_CODE: ${{ steps.receipt.outputs.receipt_exit_code }}
        run: |
          if ($env:RECEIPT_EXIT_CODE -eq '0') {
            Write-Host 'P15_MORNING_RECEIPT=CLEAN'
            exit 0
          }
          if ($env:RECEIPT_EXIT_CODE -eq '1') {
            Write-Error 'P15_MORNING_RECEIPT=ATTENTION_REQUIRED'
            exit 1
          }
          Write-Error "P15_MORNING_RECEIPT=UNREADABLE exit=$env:RECEIPT_EXIT_CODE"
          exit 1
