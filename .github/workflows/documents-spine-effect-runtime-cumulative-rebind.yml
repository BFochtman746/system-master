name: Documents Spine Effect Runtime Cumulative Rebind

on:
  push:
    branches:
      - documents/spine-effect-runtime-001-20260912
    paths:
      - .github/workflows/documents-spine-effect-runtime-cumulative-rebind.yml

permissions:
  contents: write

jobs:
  rebind-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: documents/spine-effect-runtime-001-20260912
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Rebind qualifier-only callers to explicit admission provider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE')
          util = root / 'src/test/java/org/systemmaster/tools/document/PortableTestDocumentEffectAdmission.java'
          util.parent.mkdir(parents=True, exist_ok=True)
          util.write_text(r'''package org.systemmaster.tools.document;

import org.systemmaster.tools.document.spine.DocumentEffectAdmissionDecision;
import org.systemmaster.tools.document.spine.DocumentEffectAdmissionProvider;

import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.security.NoSuchAlgorithmException;
import java.time.Clock;
import java.time.Instant;
import java.util.HexFormat;
import java.util.Objects;

/** Qualifier-only explicit effect-admission provider. Never production authority. */
public final class PortableTestDocumentEffectAdmission {
    private static final String POLICY_REVISION = "documents-portable-test-effect-policy-r1";
    private static final String POLICY_DIGEST = sha("documents-portable-test-effect-policy-r1");

    private PortableTestDocumentEffectAdmission() {
    }

    public static DocumentEffectAdmissionProvider provider(Clock clock) {
        Objects.requireNonNull(clock, "clock");
        return (job, plan, sourceGraph) -> new DocumentEffectAdmissionDecision(
                DocumentEffectAdmissionDecision.SCHEMA_V1,
                "portable-test-effect-" + job.jobId(),
                DocumentEffectAdmissionDecision.Disposition.ALLOW,
                job.jobId(),
                job.mode(),
                sourceGraph.sourceSha256(),
                sourceGraph.semanticDigest(),
                plan.operation().intentDigest(),
                plan.digest(),
                DocumentEffectAdmissionDecision.capabilitySetDigest(plan),
                POLICY_REVISION,
                POLICY_DIGEST,
                "PORTABLE_TEST_ONLY_EXPLICIT_ALLOW",
                Instant.now(clock));
    }

    private static String sha(String material) {
        try {
            return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256")
                    .digest(material.getBytes(StandardCharsets.UTF_8)));
        } catch (NoSuchAlgorithmException exception) {
            throw new IllegalStateException(exception);
        }
    }
}
''', encoding='utf-8')

          def find_close(text, open_idx):
              depth = 0
              quote = None
              escape = False
              i = open_idx
              while i < len(text):
                  ch = text[i]
                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'"):
                          quote = ch
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise RuntimeError('unbalanced UniversalDocumentSpine constructor')

          def split_top_level(content):
              parts = []
              start = 0
              depth = 0
              quote = None
              escape = False
              for i, ch in enumerate(content):
                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch in '([{':
                      depth += 1
                  elif ch in ')]}':
                      depth -= 1
                  elif ch == ',' and depth == 0:
                      parts.append(content[start:i])
                      start = i + 1
              parts.append(content[start:])
              return parts

          changed = []
          total_rebound = 0
          for path in sorted((root / 'src/test/java').rglob('*.java')):
              if path.name in {'DocumentSpine002APortableTests.java', 'PortableTestDocumentEffectAdmission.java'}:
                  continue
              text = path.read_text(encoding='utf-8')
              needle = 'new UniversalDocumentSpine('
              pos = 0
              out = []
              last = 0
              rebound = 0
              while True:
                  idx = text.find(needle, pos)
                  if idx < 0:
                      break
                  open_idx = idx + len(needle) - 1
                  close_idx = find_close(text, open_idx)
                  content = text[open_idx + 1:close_idx]
                  parts = split_top_level(content)
                  if len(parts) == 5:
                      clock_expr = parts[4].strip()
                      new_content = content + ',\n                org.systemmaster.tools.document.PortableTestDocumentEffectAdmission.provider(' + clock_expr + ')'
                      out.append(text[last:open_idx + 1])
                      out.append(new_content)
                      out.append(')')
                      last = close_idx + 1
                      rebound += 1
                      total_rebound += 1
                  pos = close_idx + 1
              if rebound:
                  out.append(text[last:])
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append((str(path), rebound))
          if total_rebound == 0:
              raise SystemExit('no five-argument portable UniversalDocumentSpine callers found to rebind')
          print('rebound callers:', total_rebound)
          for path, count in changed:
              print(count, path)
          PY
          git diff --check
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE/src/test/java
          git commit -m 'documents: bind portable effect callers to explicit admission service'
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
          printf 'QUALIFIED_SUBJECT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify rebound exact subject and preserve evidence
        shell: bash
        run: |
          set -uo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java src/test/java -name '*.java' -print | LC_ALL=C sort > build/java-sources.txt
          set +e
          javac --release 21 -Xlint:all -Werror -d build/classes @build/java-sources.txt > build/integration-compile-r3.txt 2>&1
          COMPILE=$?
          ISOLATED=99
          INTEGRATION=99
          CUMULATIVE=99
          COUNT=0
          if [ "$COMPILE" -eq 0 ]; then
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpineEffectRuntimePortableTests > build/integration-isolated-r3.txt 2>&1
            ISOLATED=$?
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpine002APortableTests > build/integration-route-r3.txt 2>&1
            INTEGRATION=$?
            : > build/integration-cumulative-r3.txt
            CUMULATIVE=0
            while IFS= read -r file; do
              class="${file#src/test/java/}"
              class="${class%.java}"
              class="${class//\//.}"
              printf 'RUN %s\n' "$class" >> build/integration-cumulative-r3.txt
              java -cp "$(pwd)/build/classes" "$class" >> build/integration-cumulative-r3.txt 2>&1
              STATUS=$?
              if [ "$STATUS" -ne 0 ]; then CUMULATIVE=$STATUS; fi
              COUNT=$((COUNT + 1))
            done < <(find src/test/java -name '*PortableTests.java' -print | LC_ALL=C sort)
          else
            : > build/integration-isolated-r3.txt
            : > build/integration-route-r3.txt
            : > build/integration-cumulative-r3.txt
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p qualification/document-system/spine
          {
            printf 'record=DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003\n'
            printf 'subject=%s\n' "$QUALIFIED_SUBJECT"
            printf 'environment=github-hosted-ubuntu-java21\n'
            printf 'compile_status=%s\n' "$COMPILE"
            printf 'isolated_48_44_status=%s\n' "$ISOLATED"
            printf 'owner_route_status=%s\n' "$INTEGRATION"
            printf 'cumulative_status=%s\n' "$CUMULATIVE"
            printf 'cumulative_classes=%s\n' "$COUNT"
            printf '%s\n' '--- compile ---'
            cat "$ROOT/build/integration-compile-r3.txt"
            printf '%s\n' '--- isolated ---'
            cat "$ROOT/build/integration-isolated-r3.txt"
            printf '%s\n' '--- owner route ---'
            cat "$ROOT/build/integration-route-r3.txt"
            printf '%s\n' '--- cumulative tail ---'
            tail -n 160 "$ROOT/build/integration-cumulative-r3.txt"
          } > qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003.txt
          PASS=0
          if [ "$COMPILE" -eq 0 ] && [ "$ISOLATED" -eq 0 ] && [ "$INTEGRATION" -eq 0 ] && [ "$CUMULATIVE" -eq 0 ]; then PASS=1; fi
          if [ "$PASS" -eq 1 ]; then
            export CUMULATIVE_COUNT="$COUNT"
            export RUN_ID="$GITHUB_RUN_ID"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
            'record_id': 'DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001',
            'owner_system_id': 'DOCUMENTS',
            'owner_path': 'SYSTEM_MASTER/DOCUMENTS',
            'control_ref_observed_before_build': 'documents/control-v1',
            'control_head_observed_before_build': '92cdf489d5b3d4294f6b90104ec1753cc2da289f',
            'candidate_branch': 'documents/spine-effect-runtime-001-20260912',
            'qualified_subject_sha': os.environ['QUALIFIED_SUBJECT'],
            'workflow_run_id': int(os.environ['RUN_ID']),
            'environment': {'runner': 'github-hosted', 'os': 'ubuntu-latest', 'java': 'Temurin 21', 'standing': 'HOSTED_PORTABLE_ONLY'},
            'status': 'QUALIFIED_PORTABLE__OWNER_CONTROL_FREEZE_PENDING',
            'integration_contract': [
              'UniversalDocumentSpine MASTER/REBUILD routes delegate to DocumentExistingArtifactEffectExecutor',
              'effectful execution fails closed without an explicit DocumentEffectAdmissionProvider',
              'READ/EXTRACT remain callable through the five-argument construction path without effect admission',
              'portable effect qualifiers explicitly inject PortableTestDocumentEffectAdmission and do not stand in for production policy authority',
              'legacy inline mutation is removed from UniversalDocumentSpine',
              'legacy action PASS/PREPARED evidence without effect-admission bindings fails closed in executor reconstruction',
              'PREPARED candidate reconciliation forbids blind mutation replay',
              'MASTER remains same-format and downstream proof/version/publication remain separate authorities'
            ],
            'qualification': {
              'strict_compile': 'PASS',
              'isolated': {'REBUILD': {'passed': 48, 'planned': 48}, 'MASTER': {'passed': 44, 'planned': 44}},
              'owner_route_integration': 'PASS',
              'cumulative_portable_test_classes_passed': int(os.environ['CUMULATIVE_COUNT']),
              'cumulative_portable_test_classes_planned': int(os.environ['CUMULATIVE_COUNT'])
            },
            'nonclaims': [
              'NO_NATIVE_MICROSOFT_OFFICE_PASS', 'NO_TARGET_DEVICE_PASS',
              'NO_REAL_EXTERNAL_POLICY_PROVIDER_CORRECTNESS_CLAIM', 'NO_HUMAN_OR_AUTHOR_AUTHORITY_CLAIM',
              'NO_PRIVATE_SOURCE_PERMISSION_CLAIM', 'NO_PUBLICATION_AUTHORIZATION_CLAIM',
              'NO_PRODUCTION_STANDING', 'NO_A01_PASS', 'NO_PROSE_WORK'
            ],
            'successor': {
              'objective_id': 'DOCUMENTS-SPINE-EFFECT-RUNTIME-FREEZE-001',
              'state': 'READY_IF_OWNER_HEAD_UNCHANGED_AND_NO_OVERLAP',
              'required_work': [
                're-read CURRENT-AUTHORITY and exact documents/control-v1 live head',
                're-read Documents delegation and repair state and reject stale overlaps',
                'reconcile the exact qualified integration subject onto the live Documents owner lineage',
                'preserve exact qualification evidence and update Documents control evidence',
                'do not claim native/external/publication/A-01 standing'
              ]
            }
          }
          Path('qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          fi
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-003.txt
          if [ -f qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json ]; then
            git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json
          fi
          git commit -m 'documents: preserve cumulative integration qualification evidence' || true
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
          if [ "$PASS" -ne 1 ]; then exit 1; fi
