name: A-01 Control Plane Gateway

on:
  push:
    branches:
      - 'system-master/a01-control-plane-*'
    paths:
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'governance/**'
      - 'qualification/a01/**'
      - '.github/scripts/a01-control-plane*.js'
      - '.github/scripts/a01-admission-*.js'
      - '.github/scripts/a01-overnight-*.js'
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/a01-runner-guard.ps1'
      - '.github/workflows/a01-control-plane-gateway.yml'
      - '.github/workflows/a01-control-plane-admission-broker.yml'
      - '.github/workflows/a01-control-plane-executor.yml'
      - '.github/workflows/a01-repair-broker.yml'
      - '.github/workflows/a01-repair-rerun.yml'
      - '.github/workflows/a01-repair-rerun-adjudicate.yml'
      - '.github/workflows/a01-overnight-night-shift.yml'
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Registered qualification ID
        required: true
        default: A01-CONTROL-PLANE-SELFTEST
      workstream_id:
        description: Owning workstream
        required: true
        default: SYSTEM-MASTER
      subject_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
      origin_ref:
        description: Workstream branch/ref that owns the return ticket
        required: true
      resume_on_pass:
        description: Authorized continuation after PASS
        required: true
      resume_on_failure:
        description: Authorized continuation after failure
        required: true
      execution_context:
        description: Registered execution context
        required: true
        default: normal
        type: choice
        options: [normal, recovery, repair, overnight]
      repair_attempt:
        description: Product repair attempts already consumed for this failure lineage
        required: false
        default: 0
        type: number
      max_repair_attempts:
        description: Maximum bounded product repair attempts for this lineage
        required: false
        default: 1
        type: number
      advanced_json:
        description: >-
          Optional JSON object carrying the advanced fields that no longer fit inside
          GitHub's ten-input limit for manual dispatch. Recognised keys:
          notification_target, qualifier_timeout_minutes, job_timeout_minutes,
          not_before, not_after, repair_transaction_id. Example:
          {"qualifier_timeout_minutes": 28, "job_timeout_minutes": 30}
        required: false
        default: '{}'
        type: string
  workflow_call:
    inputs:
      qualification_id: {type: string, required: true}
      workstream_id: {type: string, required: true}
      subject_sha: {type: string, required: true}
      origin_ref: {type: string, required: true}
      resume_on_pass: {type: string, required: true}
      resume_on_failure: {type: string, required: true}
      notification_target: {type: string, required: true}
      execution_context: {type: string, required: false, default: normal}
      qualifier_timeout_minutes: {type: number, required: false, default: 28}
      job_timeout_minutes: {type: number, required: false, default: 30}
      not_before: {type: string, required: false, default: ''}
      not_after: {type: string, required: false, default: ''}
      repair_attempt: {type: number, required: false, default: 0}
      max_repair_attempts: {type: number, required: false, default: 1}
      repair_transaction_id: {type: string, required: false, default: ''}
    outputs:
      result_class:
        description: Authoritative receipt result class when execution occurs
        value: ${{ jobs.route.outputs.result_class }}
      promotion_authorized:
        description: Exact-subject promotion authorization
        value: ${{ jobs.route.outputs.promotion_authorized }}
      repair_transaction_id:
        description: Existing rerun transaction or newly brokered transaction
        value: ${{ jobs.route.outputs.repair_transaction_id }}
      repair_transaction_state:
        description: Durable repair route state when created
        value: ${{ jobs.route.outputs.repair_transaction_state }}
      repair_target_inbox:
        description: Canonical repair inbox selected on non-PASS
        value: ${{ jobs.route.outputs.repair_target_inbox }}
      admission_state:
        description: Trusted metadata-only pre-run admission result
        value: ${{ jobs.route.outputs.admission_state }}
      control_plane_sha:
        description: Exact control-plane commit used for admission and execution
        value: ${{ jobs.route.outputs.control_plane_sha }}

permissions:
  contents: read
  actions: read

jobs:
  route:
    name: Route through trusted metadata-only admission before subject execution
    uses: ./.github/workflows/a01-control-plane-admission-broker.yml
    with:
      qualification_id: ${{ inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST' }}
      workstream_id: ${{ inputs.workstream_id || 'SYSTEM-MASTER' }}
      subject_sha: ${{ inputs.subject_sha || github.sha }}
      origin_ref: ${{ inputs.origin_ref || github.ref }}
      resume_on_pass: ${{ inputs.resume_on_pass || 'Adjudicate PASS and continue the next dependency-valid objective.' }}
      resume_on_failure: ${{ inputs.resume_on_failure || 'Adjudicate evidence, repair the failing boundary, and rerun the minimum sufficient gate.' }}
      notification_target: ${{ inputs.notification_target || fromJSON(inputs.advanced_json || '{}').notification_target || 'originating-workstream' }}
      execution_context: ${{ inputs.execution_context || 'normal' }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes || fromJSON(inputs.advanced_json || '{}').qualifier_timeout_minutes || 28 }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes || fromJSON(inputs.advanced_json || '{}').job_timeout_minutes || 30 }}
      not_before: ${{ inputs.not_before || fromJSON(inputs.advanced_json || '{}').not_before || '' }}
      not_after: ${{ inputs.not_after || fromJSON(inputs.advanced_json || '{}').not_after || '' }}
      repair_attempt: ${{ inputs.repair_attempt || 0 }}
      max_repair_attempts: ${{ inputs.max_repair_attempts || 1 }}
      repair_transaction_id: ${{ inputs.repair_transaction_id || fromJSON(inputs.advanced_json || '{}').repair_transaction_id || '' }}
