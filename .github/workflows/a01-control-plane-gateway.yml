name: A-01 Control Plane Gateway

on:
  workflow_call:
    inputs:
      qualification_id:
        type: string
        required: true
      workstream_id:
        type: string
        required: true
      subject_sha:
        type: string
        required: true
      expected_control_plane_sha:
        type: string
        required: true
      origin_ref:
        type: string
        required: true
      resume_on_pass:
        type: string
        required: true
      resume_on_failure:
        type: string
        required: true
      notification_target:
        type: string
        required: true
      execution_context:
        type: string
        required: false
        default: normal
      qualifier_timeout_minutes:
        type: number
        required: false
        default: 28
      job_timeout_minutes:
        type: number
        required: false
        default: 30
      not_before:
        type: string
        required: false
        default: ''
      not_after:
        type: string
        required: false
        default: ''
      repair_attempt:
        type: number
        required: false
        default: 0
      max_repair_attempts:
        type: number
        required: false
        default: 1
      repair_transaction_id:
        type: string
        required: false
        default: ''
    outputs:
      result_class:
        description: Authoritative A-01 result from the internal executor
        value: ${{ jobs.execute.outputs.result_class }}
      promotion_authorized:
        description: Exact-subject promotion authority from the internal executor
        value: ${{ jobs.execute.outputs.promotion_authorized }}
      repair_transaction_id:
        description: Existing or newly brokered durable repair transaction
        value: ${{ jobs.execute.outputs.repair_transaction_id }}
      repair_transaction_state:
        description: Repair transaction route state when newly brokered
        value: ${{ jobs.execute.outputs.repair_transaction_state }}
      repair_target_inbox:
        description: Canonical repair inbox when newly brokered
        value: ${{ jobs.execute.outputs.repair_target_inbox }}
      control_plane_sha:
        description: Exact admitted control-plane SHA
        value: ${{ jobs.admit.outputs.control_plane_sha }}

permissions:
  contents: read
  actions: read

jobs:
  admit:
    name: Hosted registration and exact-identity admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      control_plane_sha: ${{ steps.preflight.outputs.control_plane_sha }}
      policy_version: ${{ steps.preflight.outputs.policy_version }}
      registry_version: ${{ steps.preflight.outputs.registry_version }}
      standing: ${{ steps.preflight.outputs.standing }}
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact qualification subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.subject_sha }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - name: Verify registration, ownership, wrapper and dual identity
        id: preflight
        env:
          A01_CONTROL_ROOT: ${{ github.workspace }}/control-plane
          A01_SUBJECT_ROOT: ${{ github.workspace }}/subject
          A01_QUALIFICATION_ID: ${{ inputs.qualification_id }}
          A01_WORKSTREAM_ID: ${{ inputs.workstream_id }}
          A01_SUBJECT_SHA: ${{ inputs.subject_sha }}
          A01_EXPECTED_CONTROL_PLANE_SHA: ${{ inputs.expected_control_plane_sha }}
          A01_ADMISSION_EVIDENCE_DIR: ${{ runner.temp }}/a01-admission-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: node "$A01_CONTROL_ROOT/.github/scripts/a01-admission-preflight.js"

      - name: Publish admission summary
        shell: bash
        run: |
          echo '## A-01 HOSTED ADMISSION' >> "$GITHUB_STEP_SUMMARY"
          echo "Standing: ${{ steps.preflight.outputs.standing }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Control plane: ${{ steps.preflight.outputs.control_plane_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Subject: ${{ inputs.subject_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualification: ${{ inputs.qualification_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry version: ${{ steps.preflight.outputs.registry_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'A-01 Windows capacity has not been acquired before this point.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hosted admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-admission-${{ inputs.qualification_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a01-admission-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30

  execute:
    name: Execute admitted request through internal A-01 executor
    needs: admit
    uses: ./.github/workflows/a01-control-plane-executor.yml
    with:
      qualification_id: ${{ inputs.qualification_id }}
      workstream_id: ${{ inputs.workstream_id }}
      subject_sha: ${{ inputs.subject_sha }}
      origin_ref: ${{ inputs.origin_ref }}
      resume_on_pass: ${{ inputs.resume_on_pass }}
      resume_on_failure: ${{ inputs.resume_on_failure }}
      notification_target: ${{ inputs.notification_target }}
      execution_context: ${{ inputs.execution_context }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      not_before: ${{ inputs.not_before }}
      not_after: ${{ inputs.not_after }}
      repair_attempt: ${{ inputs.repair_attempt }}
      max_repair_attempts: ${{ inputs.max_repair_attempts }}
      repair_transaction_id: ${{ inputs.repair_transaction_id }}
    secrets: inherit
