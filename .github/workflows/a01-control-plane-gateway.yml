name: A-01 Control Plane Gateway

on:
  push:
    branches:
      - 'system-master/a01-control-plane-*'
    paths:
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'governance/**'
      - 'qualification/a01/**'
      - '.github/scripts/a01-control-plane*.js'
      - '.github/scripts/a01-admission-*.js'
      - '.github/scripts/a01-overnight-*.js'
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/a01-runner-guard.ps1'
      - '.github/workflows/a01-admission-broker.yml'
      - '.github/workflows/a01-control-plane-gateway.yml'
      - '.github/workflows/a01-repair-broker.yml'
      - '.github/workflows/a01-repair-rerun.yml'
      - '.github/workflows/a01-repair-rerun-adjudicate.yml'
      - '.github/workflows/a01-overnight-night-shift.yml'
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Registered qualification ID
        required: true
        default: A01-CONTROL-PLANE-SELFTEST
      workstream_id:
        description: Owning workstream
        required: true
        default: SYSTEM-MASTER
      subject_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
      origin_ref:
        description: Workstream branch/ref that owns the return ticket
        required: true
      resume_on_pass:
        description: Authorized continuation after PASS
        required: true
      resume_on_failure:
        description: Authorized continuation after failure
        required: true
      notification_target:
        description: Logical notification target
        required: true
        default: originating-workstream
      execution_context:
        description: Normal or centrally scheduled overnight execution
        required: true
        default: normal
        type: choice
        options: [normal, overnight]
      qualifier_timeout_minutes:
        description: Registered qualifier runtime budget
        required: true
        default: 28
        type: number
      job_timeout_minutes:
        description: Outer GitHub job budget including evidence cleanup
        required: true
        default: 30
        type: number
      not_before:
        description: Overnight admission start ISO timestamp
        required: false
        default: ''
      not_after:
        description: Overnight admission end ISO timestamp
        required: false
        default: ''
      repair_attempt:
        description: Product repair attempts already consumed for this failure lineage
        required: false
        default: 0
        type: number
      max_repair_attempts:
        description: Maximum bounded product repair attempts for this lineage, 0-2
        required: false
        default: 1
        type: number
      repair_transaction_id:
        description: Existing durable repair transaction for a replacement or same-SHA retry; blank for ordinary first-pass A-01 requests
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      qualification_id:
        type: string
        required: true
      workstream_id:
        type: string
        required: true
      subject_sha:
        type: string
        required: true
      origin_ref:
        type: string
        required: true
      resume_on_pass:
        type: string
        required: true
      resume_on_failure:
        type: string
        required: true
      notification_target:
        type: string
        required: true
      execution_context:
        type: string
        required: false
        default: normal
      qualifier_timeout_minutes:
        type: number
        required: false
        default: 28
      job_timeout_minutes:
        type: number
        required: false
        default: 30
      not_before:
        type: string
        required: false
        default: ''
      not_after:
        type: string
        required: false
        default: ''
      repair_attempt:
        type: number
        required: false
        default: 0
      max_repair_attempts:
        type: number
        required: false
        default: 1
      repair_transaction_id:
        type: string
        required: false
        default: ''
    outputs:
      result_class:
        description: Authoritative receipt result class when emitted, or INFRA_FAILURE when runner preflight blocks execution
        value: ${{ jobs.qualify.outputs.result_class }}
      promotion_authorized:
        description: Exact-subject promotion authorization
        value: ${{ jobs.qualify.outputs.promotion_authorized }}
      repair_transaction_id:
        description: Existing rerun transaction ID or newly brokered transaction ID on a first-pass non-PASS
        value: ${{ inputs.repair_transaction_id || jobs.repair_broker.outputs.transaction_id }}
      repair_transaction_state:
        description: Newly brokered route state on an ordinary non-PASS; rerun state is adjudicated asynchronously against the existing transaction
        value: ${{ jobs.repair_broker.outputs.transaction_state }}
      repair_target_inbox:
        description: Canonical owner inbox selected by the initial broker
        value: ${{ jobs.repair_broker.outputs.target_inbox }}

permissions:
  contents: read
  actions: read

concurrency:
  group: a01-global-r2
  queue: max
  cancel-in-progress: false

jobs:
  repair_lineage_guard:
    name: Validate optional repair lineage against immutable gateway authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable repair authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate existing transaction binding when this is a repair rerun
        if: ${{ inputs.repair_transaction_id != '' }}
        env:
          REPAIR_TRANSACTION_ID: ${{ inputs.repair_transaction_id }}
          EXPECTED_QUALIFICATION_ID: ${{ inputs.qualification_id }}
          EXPECTED_WORKSTREAM_ID: ${{ inputs.workstream_id }}
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
          EXPECTED_ORIGIN_REF: ${{ inputs.origin_ref }}
        shell: bash
        run: |
          node --check .github/scripts/a01-repair-ledger.js
          node - <<'NODE'
          const ledger = require('./.github/scripts/a01-repair-ledger');
          const c = ledger.prepareRerun({ transaction_id: process.env.REPAIR_TRANSACTION_ID });
          const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
          if (c.qualification_id !== process.env.EXPECTED_QUALIFICATION_ID) throw new Error('REPAIR_RERUN_QUALIFICATION_MISMATCH');
          if (c.workstream_id !== process.env.EXPECTED_WORKSTREAM_ID) throw new Error('REPAIR_RERUN_WORKSTREAM_MISMATCH');
          if (!same(c.subject_sha, process.env.EXPECTED_SUBJECT_SHA)) throw new Error('REPAIR_RERUN_SUBJECT_MISMATCH');
          if (c.origin_ref !== process.env.EXPECTED_ORIGIN_REF) throw new Error('REPAIR_RERUN_ORIGIN_REF_MISMATCH');
          console.log(`REPAIR_RERUN_LINEAGE_VALID transaction_id=${c.transaction_id} state=${c.transaction_state} subject=${c.subject_sha}`);
          NODE

      - name: Ordinary A-01 request has no existing repair transaction
        if: ${{ inputs.repair_transaction_id == '' }}
        run: echo 'No repair_transaction_id supplied; ordinary initial A-01 request path remains unchanged.'

  qualify:
    name: A-01 registered qualification
    needs: repair_lineage_guard
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: ${{ inputs.job_timeout_minutes || 30 }}
    outputs:
      post_action: ${{ steps.control.outputs.post_action }}
      result_class: ${{ steps.control.outputs.result_class || steps.guard.outputs.result_class }}
      promotion_authorized: ${{ steps.control.outputs.promotion_authorized }}
    env:
      A01_QUALIFICATION_ID: ${{ inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST' }}
      A01_WORKSTREAM_ID: ${{ inputs.workstream_id || 'SYSTEM-MASTER' }}
      A01_SUBJECT_SHA: ${{ inputs.subject_sha || github.sha }}
      A01_ORIGIN_REF: ${{ inputs.origin_ref || github.ref }}
      A01_RESUME_ON_PASS: ${{ inputs.resume_on_pass || 'Adjudicate PASS and continue the next dependency-valid objective.' }}
      A01_RESUME_ON_FAILURE: ${{ inputs.resume_on_failure || 'Adjudicate evidence, repair the failing boundary, and rerun through a fresh central admission dispatch when control-plane authority changes.' }}
      A01_NOTIFICATION_TARGET: ${{ inputs.notification_target || 'originating-workstream' }}
      A01_EXECUTION_CONTEXT: ${{ inputs.execution_context || 'normal' }}
      A01_QUALIFIER_TIMEOUT_MINUTES: ${{ inputs.qualifier_timeout_minutes || 28 }}
      A01_NOT_BEFORE: ${{ inputs.not_before || '' }}
      A01_NOT_AFTER: ${{ inputs.not_after || '' }}
      A01_REPAIR_ATTEMPT: ${{ inputs.repair_attempt || 0 }}
      A01_MAX_REPAIR_ATTEMPTS: ${{ inputs.max_repair_attempts || 1 }}
      A01_REPAIR_TRANSACTION_ID: ${{ inputs.repair_transaction_id || '' }}
    steps:
      - name: Checkout canonical control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-plane
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Enforce canonical four-system topology before A-01 admission
        shell: cmd
        run: node "%GITHUB_WORKSPACE%\control-plane\.github\scripts\validate-system-topology.js"

      - name: Prepare control-plane roots and evidence
        shell: cmd
        run: |
          set "A01_CONTROL_ROOT=%GITHUB_WORKSPACE%\control-plane"
          set "A01_SUBJECT_ROOT=%GITHUB_WORKSPACE%\subject"
          set "A01_EVIDENCE_DIR=%RUNNER_TEMP%\a01-control-plane-%GITHUB_RUN_ID%"
          set "A01_ARTIFACT_NAME=%A01_QUALIFICATION_ID%-%GITHUB_RUN_ID%-evidence"
          if not exist "%A01_EVIDENCE_DIR%" mkdir "%A01_EVIDENCE_DIR%"
          echo A01_CONTROL_ROOT=%A01_CONTROL_ROOT%>>"%GITHUB_ENV%"
          echo A01_SUBJECT_ROOT=%A01_SUBJECT_ROOT%>>"%GITHUB_ENV%"
          echo A01_EVIDENCE_DIR=%A01_EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo A01_ARTIFACT_NAME=%A01_ARTIFACT_NAME%>>"%GITHUB_ENV%"

      - name: Bind exact control-plane identity
        shell: powershell
        run: |
          $actual = (& git -C "$env:GITHUB_WORKSPACE\control-plane" rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -notmatch '^[0-9a-f]{40}$') { throw "INVALID_CONTROL_PLANE_SHA:$actual" }
          "A01_CONTROL_PLANE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $binding = [ordered]@{
            binding_version = 1
            control_plane_sha = $actual
            qualification_id = $env:A01_QUALIFICATION_ID
            subject_sha = $env:A01_SUBJECT_SHA
            gateway_run_id = $env:GITHUB_RUN_ID
            gateway_run_attempt = $env:GITHUB_RUN_ATTEMPT
            recorded_at = [DateTime]::UtcNow.ToString('o')
          }
          $binding | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:A01_EVIDENCE_DIR 'control-plane-request-binding.json') -Encoding utf8

      - name: Bind optional repair transaction into the A-01 evidence envelope
        if: ${{ inputs.repair_transaction_id != '' }}
        shell: powershell
        run: |
          $lineage = [ordered]@{
            lineage_version = 2
            transaction_id = $env:A01_REPAIR_TRANSACTION_ID
            qualification_id = $env:A01_QUALIFICATION_ID
            workstream_id = $env:A01_WORKSTREAM_ID
            subject_sha = $env:A01_SUBJECT_SHA
            control_plane_sha = $env:A01_CONTROL_PLANE_SHA
            origin_ref = $env:A01_ORIGIN_REF
            repair_attempt = [int]$env:A01_REPAIR_ATTEMPT
            max_repair_attempts = [int]$env:A01_MAX_REPAIR_ATTEMPTS
            gateway_run_id = $env:GITHUB_RUN_ID
            gateway_run_attempt = $env:GITHUB_RUN_ATTEMPT
            recorded_at = [DateTime]::UtcNow.ToString('o')
          }
          $lineage | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:A01_EVIDENCE_DIR 'repair-lineage.json') -Encoding utf8

      - name: Guard A-01 runner health before subject acquisition
        id: guard
        continue-on-error: true
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\control-plane\.github\scripts\a01-runner-guard.ps1" -Mode preflight -EvidenceDir $env:A01_EVIDENCE_DIR
          exit $LASTEXITCODE

      - name: Checkout exact qualification subject
        if: steps.guard.outcome == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.subject_sha || github.sha }}
          path: subject
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Validate canonical control-plane policy and registry
        if: steps.guard.outcome == 'success'
        shell: cmd
        run: node "%A01_CONTROL_ROOT%\.github\scripts\a01-control-plane.js" validate

      - name: Execute registered qualification and emit dual-identity receipt
        id: control
        if: steps.guard.outcome == 'success'
        continue-on-error: true
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class A01QualificationSleepGuard {
            [DllImport("kernel32.dll", SetLastError = true)]
            public static extern uint SetThreadExecutionState(uint esFlags);
          }
          '@
          $ES_CONTINUOUS = [Convert]::ToUInt32('80000000', 16)
          $ES_SYSTEM_REQUIRED = [Convert]::ToUInt32('00000001', 16)
          $guardState = [A01QualificationSleepGuard]::SetThreadExecutionState($ES_CONTINUOUS -bor $ES_SYSTEM_REQUIRED)
          if ($guardState -eq 0) { throw 'A01_SLEEP_GUARD_START_FAILED' }
          try {
            & node "$env:A01_CONTROL_ROOT\.github\scripts\a01-control-plane-execute-v2.js"
            $exitCode = $LASTEXITCODE
          } finally {
            [void][A01QualificationSleepGuard]::SetThreadExecutionState($ES_CONTINUOUS)
          }
          exit $exitCode

      - name: Publish control-plane receipt summary
        if: always()
        shell: cmd
        run: |
          echo ## A-01 CONTROL PLANE>>"%GITHUB_STEP_SUMMARY%"
          echo Qualification: %A01_QUALIFICATION_ID%>>"%GITHUB_STEP_SUMMARY%"
          echo Subject: %A01_SUBJECT_SHA%>>"%GITHUB_STEP_SUMMARY%"
          echo Control plane: %A01_CONTROL_PLANE_SHA%>>"%GITHUB_STEP_SUMMARY%"
          echo Context: %A01_EXECUTION_CONTEXT%>>"%GITHUB_STEP_SUMMARY%"
          echo Repair transaction: %A01_REPAIR_TRANSACTION_ID%>>"%GITHUB_STEP_SUMMARY%"
          echo Artifact: %A01_ARTIFACT_NAME%>>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\control-plane-request-binding.json" type "%A01_EVIDENCE_DIR%\control-plane-request-binding.json">>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\runner-preflight.json" type "%A01_EVIDENCE_DIR%\runner-preflight.json">>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\repair-lineage.json" type "%A01_EVIDENCE_DIR%\repair-lineage.json">>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\control-plane-binding.json" type "%A01_EVIDENCE_DIR%\control-plane-binding.json">>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\result.txt" type "%A01_EVIDENCE_DIR%\result.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%A01_EVIDENCE_DIR%\receipt.json" type "%A01_EVIDENCE_DIR%\receipt.json">>"%GITHUB_STEP_SUMMARY%"

      - name: Record A-01 postflight and clean stale job temp
        if: always()
        continue-on-error: true
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\control-plane\.github\scripts\a01-runner-guard.ps1") {
            & "$env:GITHUB_WORKSPACE\control-plane\.github\scripts\a01-runner-guard.ps1" -Mode postflight -EvidenceDir $env:A01_EVIDENCE_DIR
          }

      - name: Upload authoritative A-01 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.A01_ARTIFACT_NAME }}
          path: ${{ env.A01_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Schedule registered Windows reboot handoff
        if: steps.control.outcome == 'success' && steps.control.outputs.post_action == 'windows_reboot'
        shell: powershell
        run: |
          & shutdown.exe /r /t 30 /d p:4:1 /c 'System Master registered A-01 qualification reboot handoff'
          if ($LASTEXITCODE -ne 0) { throw "WINDOWS_REBOOT_SCHEDULE_FAILED:$LASTEXITCODE" }
          Write-Host 'WINDOWS_REBOOT_SCHEDULED delay_seconds=30; A-01 job will finish cleanly before reboot.'

      - name: Preserve authoritative qualification conclusion
        if: always() && (steps.guard.outcome != 'success' || steps.control.outputs.result_class != 'PASS')
        shell: cmd
        run: exit /b 1

  repair_broker:
    name: Route ordinary non-PASS receipt to durable repair broker
    needs: qualify
    if: ${{ always() && inputs.repair_transaction_id == '' && needs.qualify.outputs.result_class != '' && needs.qualify.outputs.result_class != 'PASS' }}
    uses: ./.github/workflows/a01-repair-broker.yml
    with:
      receipt_id: ${{ format('a01-run-{0}-{1}', github.run_id, inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST') }}
      qualification_id: ${{ inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST' }}
      workstream_id: ${{ inputs.workstream_id || 'SYSTEM-MASTER' }}
      failed_subject_sha: ${{ inputs.subject_sha || github.sha }}
      result_class: ${{ needs.qualify.outputs.result_class }}
      evidence_pointer: ${{ format('artifact:{0}-{1}-evidence', inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST', github.run_id) }}
      repair_attempt: ${{ inputs.repair_attempt || 0 }}
      max_repair_attempts: ${{ inputs.max_repair_attempts || 1 }}

  disruptive-settle:
    name: Hold A-01 admission through registered reboot window
    needs: qualify
    if: needs.qualify.outputs.post_action == 'windows_reboot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve global admission lock while A-01 reboots
        shell: bash
        run: |
          echo 'Registered Windows reboot scheduled; preserving a01-global-r2 admission lock for 90 seconds.'
          sleep 90
          echo 'Registered reboot settle window complete; verification may now acquire A-01.'
