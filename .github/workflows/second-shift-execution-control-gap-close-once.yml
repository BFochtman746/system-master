name: One-shot Second Shift execution-control baseline

on:
  push:
    branches:
      - repair/second-shift-execution-control-29of29-20260914

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run exact committed contract suite
        shell: bash
        run: |
          set +e
          node tests/second-shift-execution-control-contract.test.js 2>&1 | tee /tmp/execution-control-before.txt
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/execution-control-before.txt >> "$GITHUB_STEP_SUMMARY"
          grep -F '"suite": "SECOND_SHIFT_EXECUTION_CONTROL_CONTRACT_STRESS"' /tmp/execution-control-before.txt
          grep -F '"cases": 29' /tmp/execution-control-before.txt
          exit "$status"
