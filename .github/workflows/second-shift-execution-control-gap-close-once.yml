name: One-shot Second Shift execution-control verification

on:
  push:
    branches:
      - repair/second-shift-execution-control-29of29-20260914

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Rerun exact committed contract suite
        shell: bash
        run: |
          node --check .github/scripts/second-shift-enforce.js
          test "$(git rev-parse HEAD:tests/second-shift-execution-control-contract.test.js)" = "51510180c8545407746f2bdd0cd9937379ce5926"
          node tests/second-shift-execution-control-contract.test.js 2>&1 | tee /tmp/execution-control-final.txt
          grep -F '"suite": "SECOND_SHIFT_EXECUTION_CONTROL_CONTRACT_STRESS"' /tmp/execution-control-final.txt
          grep -F '"cases": 29' /tmp/execution-control-final.txt
          grep -F '"passed": 29' /tmp/execution-control-final.txt
          grep -F '"failed": 0' /tmp/execution-control-final.txt
          echo '## Exact committed execution-control suite' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/execution-control-final.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
