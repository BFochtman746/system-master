name: Second Shift Controller Stress Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - reliability/second-shift-controller-stress-20260911
    paths:
      - '.github/scripts/second-shift-controller-stress-report.js'
      - '.github/workflows/second-shift-controller-stress-report.yml'

permissions:
  contents: read

concurrency:
  group: second-shift-controller-stress-evidence-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  evidence:
    name: Preserve exhaustive controller blind spots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact stress subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run exhaustive stress and print diagnostics
        id: stress
        continue-on-error: true
        run: node .github/scripts/second-shift-controller-stress-report.js
      - name: Upload visible stress report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: second-shift-controller-stress-evidence-${{ github.run_id }}
          path: second-shift-stress-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Mark diagnostic blind spots as expected failure
        if: steps.stress.outcome == 'failure'
        run: |
          echo 'Diagnostic suite intentionally found controller blind spots.'
          exit 0
