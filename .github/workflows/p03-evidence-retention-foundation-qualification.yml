name: P03 Evidence Retention Foundation Qualification

on:
  push:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-*.json'
      - 'governance/contracts/P03-FOUNDATION-CONTRACT-001.md'
      - 'governance/PLATFORM-DISPOSITION-DECISIONS-001.md'
      - 'control-gateway/python/a01_evidence_retention.py'
      - 'control-gateway/python/test_a01_evidence_retention.py'
      - '.github/workflows/p03-evidence-retention-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/CURRENT-AUTHORITY.json'
      - 'governance/catalog/SYSTEM-MASTER-CAPABILITY-CROSSWALK-*.json'
      - 'governance/contracts/P03-FOUNDATION-CONTRACT-001.md'
      - 'governance/PLATFORM-DISPOSITION-DECISIONS-001.md'
      - 'control-gateway/python/a01_evidence_retention.py'
      - 'control-gateway/python/test_a01_evidence_retention.py'
      - '.github/workflows/p03-evidence-retention-foundation-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact P03 subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Run exact P03 acceptance target
        shell: bash
        working-directory: control-gateway/python
        env:
          PYTHONPATH: ${{ github.workspace }}/control-gateway/python:${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m unittest test_a01_evidence_retention -v 2>&1 | tee /tmp/p03-test.log
          grep -Eq '^Ran 20 tests in ' /tmp/p03-test.log
          grep -Eq '^OK$' /tmp/p03-test.log
      - name: Emit exact-subject P03 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-output
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path('.')
          authority = json.loads((root / 'governance/CURRENT-AUTHORITY.json').read_text())
          crosswalk = json.loads((root / authority['capability_crosswalk']).read_text())
          p03 = next(row for row in crosswalk['platform_requirements'] if row['platform_id'] == 'P03')
          if authority['authority_id'] != 'CURRENT-AUTHORITY-005':
              raise SystemExit(f"AUTHORITY_MISMATCH {authority['authority_id']}")
          if p03.get('owner_path') != 'SYSTEM_MASTER/CORE':
              raise SystemExit(f"OWNER_MISMATCH {p03.get('owner_path')}")
          if p03.get('implementation') != 'control-gateway/python/a01_evidence_retention.py':
              raise SystemExit(f"IMPLEMENTATION_MISMATCH {p03.get('implementation')}")
          subjects = [
              'governance/CURRENT-AUTHORITY.json',
              authority['capability_crosswalk'],
              'governance/contracts/P03-FOUNDATION-CONTRACT-001.md',
              'governance/PLATFORM-DISPOSITION-DECISIONS-001.md',
              'control-gateway/python/a01_evidence_retention.py',
              'control-gateway/python/test_a01_evidence_retention.py',
              '.github/workflows/p03-evidence-retention-foundation-qualification.yml',
          ]
          blob = lambda p: subprocess.check_output(['git','rev-parse',f'HEAD:{p}'], text=True).strip()
          test_log = pathlib.Path('/tmp/p03-test.log').read_bytes()
          evidence = {
              'evidence_schema': '1.0',
              'contract_id': 'P03-FOUNDATION-1.0',
              'requirement_or_capability_id': 'P03',
              'owner_path': 'SYSTEM_MASTER/CORE',
              'authority_id': authority['authority_id'],
              'status': 'PASS',
              'source_identity': os.environ['GITHUB_SHA'],
              'implementation': p03['implementation'],
              'python_version': sys.version.split()[0],
              'test_count': 20,
              'acceptance_commands': ['python -m unittest test_a01_evidence_retention -v'],
              'subjects': [{'path': p, 'git_blob_sha': blob(p)} for p in subjects],
              'logs': {'unittest_sha256': hashlib.sha256(test_log).hexdigest()},
          }
          pathlib.Path('qualification-output/p03-foundation-1.0.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY
      - name: Preserve machine-readable P03 qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-foundation-1.0-evidence
          path: qualification-output/p03-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
