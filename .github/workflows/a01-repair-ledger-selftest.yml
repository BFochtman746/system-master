name: A-01 Repair Ledger Selftest

on:
  push:
    paths:
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/workflows/a01-repair-broker.yml'
      - '.github/workflows/a01-repair-ledger-ingest.yml'
      - '.github/workflows/a01-repair-receipt-ingest.yml'
      - '.github/workflows/a01-repair-finalize.yml'
      - '.github/workflows/a01-repair-ledger-selftest.yml'
      - 'governance/repair/**'
      - 'qualification/a01/schema/return-ticket.schema.json'
  pull_request:
    paths:
      - '.github/scripts/a01-closed-loop-repair*.js'
      - '.github/scripts/a01-repair-broker*.js'
      - '.github/scripts/a01-repair-ledger*.js'
      - '.github/workflows/a01-repair-broker.yml'
      - '.github/workflows/a01-repair-ledger-ingest.yml'
      - '.github/workflows/a01-repair-receipt-ingest.yml'
      - '.github/workflows/a01-repair-finalize.yml'
      - '.github/workflows/a01-repair-ledger-selftest.yml'
      - 'governance/repair/**'
      - 'qualification/a01/schema/return-ticket.schema.json'

permissions:
  contents: read

jobs:
  qualify-repair-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact control candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Syntax checks
        run: |
          node --check .github/scripts/a01-closed-loop-repair.js
          node --check .github/scripts/a01-repair-broker.js
          node --check .github/scripts/a01-repair-ledger.js
          node --check .github/scripts/a01-closed-loop-repair-selftest.js
          node --check .github/scripts/a01-repair-broker-selftest.js
          node --check .github/scripts/a01-repair-ledger-selftest.js

      - name: Closed-loop failure-classification selftest
        run: node .github/scripts/a01-closed-loop-repair-selftest.js

      - name: Receipt broker routing selftest
        run: node .github/scripts/a01-repair-broker-selftest.js

      - name: Durable ledger, owner dispatch and replacement-ticket selftest
        run: node .github/scripts/a01-repair-ledger-selftest.js

      - name: Record bounded authority standing
        run: |
          echo '## A01-CLOSED-LOOP-REPAIR-001B PREQUALIFICATION' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS proves deterministic control logic only: receipt routing, durable ledger/inbox projection, owner-worker dispatch packet, changed-SHA prequalification binding, and replacement-ticket emission.' >> "$GITHUB_STEP_SUMMARY"
          echo 'It does not prove an autonomous coding agent repaired real product code and does not grant A-01 PASS, promotion, publication or production authority.' >> "$GITHUB_STEP_SUMMARY"
