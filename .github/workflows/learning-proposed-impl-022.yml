name: PROPOSED LEARNING-LAB-IMPL-022 Live Multi-Sample Acquisition

on:
  push:
    branches:
      - learning/proposed-impl-022-live-multisample-acquisition
    paths:
      - ".github/workflows/learning-proposed-impl-022.yml"
      - "learning/lab/learning_lab/provider_multi_sample_acquisition.py"
      - "learning/lab/tests/test_provider_multi_sample_acquisition.py"
      - "learning/lab/learning_lab/provider_acquisition.py"
      - "learning/lab/learning_lab/provider_multi_candidate_runtime.py"
      - "learning/lab/learning_lab/multi_candidate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-proposed-impl-022-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify bounded crash-safe provider multi-sampling on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout exact proposed IMPL-022 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false

      - name: Prepare evidence
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-proposed-impl-022-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo %GITHUB_SHA%>"%EVIDENCE_DIR%\source-commit.txt"
          echo %RUNNER_NAME%>"%EVIDENCE_DIR%\runner.txt"
          python --version

      - name: Compile proposed multi-sample acquisition
        shell: cmd
        run: |
          python -m py_compile ^
            learning\lab\learning_lab\provider_multi_sample_acquisition.py ^
            learning\lab\tests\test_provider_multi_sample_acquisition.py ^
            >"%EVIDENCE_DIR%\python-compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\python-compile.txt" & exit /b 1)

      - name: Run focused proposed IMPL-022 acquisition tests
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_provider_multi_sample_acquisition >"%EVIDENCE_DIR%\python-provider-multi-sample.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-provider-multi-sample.txt"
          exit /b %RC%

      - name: Regress IMPL-021 provider selection boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_provider_multi_candidate_runtime >"%EVIDENCE_DIR%\python-impl021-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl021-regression.txt"
          exit /b %RC%

      - name: Publish proposed IMPL-022 summary
        if: always()
        shell: cmd
        run: |
          echo ## PROPOSED LEARNING-LAB-IMPL-022>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"
          echo Truth boundary: controlled provider callables; not external production-provider qualification.>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-provider-multi-sample.txt" type "%EVIDENCE_DIR%\python-provider-multi-sample.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl021-regression.txt" type "%EVIDENCE_DIR%\python-impl021-regression.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload proposed IMPL-022 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-proposed-impl-022-evidence
          path: ${{ runner.temp }}\learning-proposed-impl-022-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
