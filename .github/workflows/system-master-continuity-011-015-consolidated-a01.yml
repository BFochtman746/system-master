name: System Master Continuity G-WP-011-015 Consolidated A-01

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Safe prequalification before A-01
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Continuity subject with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate shared control plane and migrated Continuity boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A01_EVIDENCE_DIR: ${{ runner.temp }}/continuity-011-015-prequalification-${{ github.run_id }}
        run: |
          node .github/scripts/a01-control-plane.js validate
          node .github/scripts/a01-control-plane-enforce.js selftest
          node .github/scripts/a01-control-plane-enforce.js scan
          node .github/scripts/g-continuity-011-015-control-plane-qualify.js

  qualify:
    name: Route exact subject through shared A-01 gateway
    needs: prequalify
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: SYSTEM-MASTER-CONTINUITY-G-WP-011-015-CONSOLIDATED
      workstream_id: SYSTEM-MASTER-CONTINUITY
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref }}
      resume_on_pass: Adjudicate the control-plane receipt and preserve the exact tested SHA and legacy 143-assertion qualification truth. Do not conflate ordinary integration with target lifecycle or human evidence.
      resume_on_failure: Classify SUBJECT_FAILURE versus INFRA_FAILURE or CONTROL_PLANE_FAILURE, repair only the failing boundary when sufficient, and rerun the minimum gate.
      notification_target: system-master-continuity-workstream
