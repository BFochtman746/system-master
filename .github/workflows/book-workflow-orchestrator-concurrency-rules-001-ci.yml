name: Book Workflow Orchestrator Concurrency Rules 001

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - 'qualification/book-system/book-prose-integration/orchestrator/BOOK-WORKFLOW-ORCHESTRATOR-CONCURRENCY-RULES-001.json'
      - 'system-master/book-system/book-workflow-concurrency-rules.js'
      - '.github/scripts/book-workflow-orchestrator-concurrency-rules-001-qualify.js'
      - '.github/workflows/book-workflow-orchestrator-concurrency-rules-001-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Qualify orchestrator concurrency rules
        env:
          NODE_OPTIONS: --experimental-default-type=commonjs
        run: node .github/scripts/book-workflow-orchestrator-concurrency-rules-001-qualify.js
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-workflow-orchestrator-concurrency-rules-001-${{ github.run_id }}
          path: ${{ runner.temp }}/book-workflow-orchestrator-concurrency-rules-001-summary.json
          if-no-files-found: error
