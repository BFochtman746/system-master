name: LEARNING-LAB-IMPL-016 Repaired Qualification

on:
  push:
    branches:
      - learning/impl-016-adaptive-entry-continuity
    paths:
      - ".github/workflows/learning-impl-016-recheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Recheck repaired IMPL-016 on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact implementation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          architecture: "x64"
          check-latest: false
      - name: Prepare evidence directory
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-impl-016-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          python --version
      - name: Compile Learning package
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m compileall -q learning_lab >"%EVIDENCE_DIR%\compile.txt" 2>&1
          if errorlevel 1 (type "%EVIDENCE_DIR%\compile.txt" & exit /b 1)
      - name: Run IMPL-016 focused tests
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest tests.test_adaptive_entry_journey -v >"%EVIDENCE_DIR%\impl016-focused.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl016-focused.txt"
          exit /b %RC%
      - name: Run predecessor baseline diagnostic regression
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_baseline_diagnostic.py" -v >"%EVIDENCE_DIR%\impl015-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl015-regression.txt"
          exit /b %RC%
      - name: Run adaptive multi-session regression
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest discover -s tests -p "test_adaptive_multisession.py" -v >"%EVIDENCE_DIR%\adaptive-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\adaptive-regression.txt"
          exit /b %RC%
      - name: Upload IMPL-016 evidence
        if: always() && env.EVIDENCE_DIR != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-impl-016-evidence
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30
