name: A-01 Current Selftest Close Obligation Once 2026-09-11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a01-current-selftest-close-obligation-once-2026-09-11.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: a01-control-plane-maintenance
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Rebind to latest main
        run: git pull --ff-only origin main

      - name: Close exact current-SHA A-01 obligation and persist bounded receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const registryPath = 'governance/WORK-OBLIGATION-REGISTRY-009.json';
          const r = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
          const id = 'A01-CONTROL-PLANE-SELFTEST-CURRENT-SHA-QUALIFICATION-001';
          const o = r.obligations.find(x => x.obligation_id === id);
          if (!o) throw new Error('OBLIGATION_NOT_FOUND');
          if (o.state !== 'READY' && o.state !== 'CLOSED') throw new Error(`UNEXPECTED_STATE:${o.state}`);
          Object.assign(o, {
            state: 'CLOSED',
            final_standing: 'A01_EXACT_SUBJECT_PASS',
            final_result_class: 'PASS',
            exact_subject_sha: '7df303eafdc425d51d9be964c7e0ffd4ae21cf13',
            exact_control_plane_sha: '7df303eafdc425d51d9be964c7e0ffd4ae21cf13',
            a01_run_id: 34596555005,
            a01_artifact_id: 10262098747,
            a01_artifact_name: 'A01-CONTROL-PLANE-SELFTEST-34596555005-evidence',
            a01_artifact_sha256: 'b8362c117a4975d7b02e3bb6d44050aa377511b5365752487bd8e20c93bae6ff',
            promotion_authorized: true,
            closed_at: '2026-09-11T11:58:40Z',
            objective: 'Closed by authoritative A-01 PASS on exact subject/control-plane SHA 7df303eafdc425d51d9be964c7e0ffd4ae21cf13 after repairing the bootstrap overnight-authority link and aligning the stale legacy-workflow freeze selftest invariant to the authoritative v2 retirement contract. This PASS is exact-subject evidence only and does not transfer to later changed bytes.'
          });
          fs.writeFileSync(registryPath, JSON.stringify(r, null, 2) + '\n');

          const record = {
            qualification_record_id: 'A01-CONTROL-PLANE-SELFTEST-CURRENT-SHA-QUALIFICATION-001',
            qualification_id: 'A01-CONTROL-PLANE-SELFTEST',
            workstream_id: 'SYSTEM-MASTER',
            gate_class: 'promotion',
            result_class: 'PASS',
            subject_sha: '7df303eafdc425d51d9be964c7e0ffd4ae21cf13',
            control_plane_sha: '7df303eafdc425d51d9be964c7e0ffd4ae21cf13',
            workflow_run_id: 34596555005,
            evidence_artifact_id: 10262098747,
            evidence_artifact_name: 'A01-CONTROL-PLANE-SELFTEST-34596555005-evidence',
            evidence_artifact_sha256: 'b8362c117a4975d7b02e3bb6d44050aa377511b5365752487bd8e20c93bae6ff',
            promotion_authorized: true,
            completed_at: '2026-09-11T11:58:34.059Z',
            repairs_proven: [
              'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md carries the required qualification/a01/overnight/A01-OVERNIGHT-001.md authority link.',
              'The legacy direct-workflow freeze selftest validates authoritative version 2 and exact retained runner-support membership against governance/archive/ACTIONS-WORKFLOW-RETIREMENT-2026-09-10.json.'
            ],
            predecessor_dead_letter_transaction: 'A01-REPAIR-a01-run-34431764843-A01-CONTROL-PLANE-SELFTEST-A1',
            predecessor_pass_transfer: false,
            authority_boundary: 'PASS is authoritative only for the exact subject/control-plane SHA above. It does not transfer across later repository changes, topology changes, owner changes, or other qualification subjects.'
          };
          const out = 'qualification/a01/control-plane/A01-CONTROL-PLANE-SELFTEST-CURRENT-SHA-QUALIFICATION-001.json';
          fs.mkdirSync(path.dirname(out), { recursive: true });
          fs.writeFileSync(out, JSON.stringify(record, null, 2) + '\n');
          NODE

      - name: Commit durable closure evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add governance/WORK-OBLIGATION-REGISTRY-009.json qualification/a01/control-plane/A01-CONTROL-PLANE-SELFTEST-CURRENT-SHA-QUALIFICATION-001.json
          git diff --cached --quiet && exit 0
          git commit -m 'Close current A-01 selftest obligation after exact PASS'
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep 2
          done
          test "$pushed" = true
