name: Root Authority Registry Qualification

on:
  push:
    branches:
      - foundation-root-authority-registry
  pull_request:
    branches:
      - system-master/control-v2

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify System Root and Authority Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Root Registry subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout live operational authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: legacy
          fetch-depth: 1
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Strict compile, qualification, live migration parity, and performance
        env:
          ROOT_REGISTRY_EVIDENCE_CLASS: HOSTED / CI
          ROOT_REGISTRY_RUN_STRESS: '1'
          ROOT_REGISTRY_PERSIST_EVIDENCE_TO: ${{ github.workspace }}/root-registry-evidence
        run: bash subject/system-master/foundation-spine/root-authority-registry/qualification/qualify.sh subject legacy

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-authority-registry-qualification-${{ github.sha }}
          path: root-registry-evidence
          if-no-files-found: error
          retention-days: 30
