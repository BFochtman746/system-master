name: Learning Assessment Target Domain V Batch 02 Prequalification
on:
  push:
    branches: [learning/assessment-target-domain-v-batch-02-20260910]
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001B-ASSESSMENT-TARGET-DOMAIN-V-BATCH-02-CANDIDATE-039A.json"
      - ".github/scripts/learning-assessment-target-batch-qualify.js"
      - ".github/workflows/learning-assessment-target-domain-v-batch-02-prequal.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    name: Domain V assessment-target batch 02 exact-source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASSESSMENT_CANDIDATE: LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001B-ASSESSMENT-TARGET-DOMAIN-V-BATCH-02-CANDIDATE-039A.json
      TOPOLOGY_CANDIDATE: LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001A-DOMAIN-V-BATCH-02-CANDIDATE-020.json
      ASSESSMENT_DOMAIN: V
      ASSESSMENT_BATCH_INDEX: 2
      EXPECTED_TARGET_COUNT: 1
      CUMULATIVE_TARGET_COUNT: 6
      DOMAIN_TARGET_TOTAL: 6
      EVIDENCE_DIR: learning-assessment-target-domain-v-batch-02-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check reusable validator
        run: node --check .github/scripts/learning-assessment-target-batch-qualify.js
      - name: Validate final Domain V assessment targets
        run: node .github/scripts/learning-assessment-target-batch-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-ASSESSMENT-TARGET-DOMAIN-V-BATCH-02-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-assessment-target-domain-v-batch-02-evidence
          if-no-files-found: warn
          retention-days: 30
