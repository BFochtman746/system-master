name: Learning 001M-S04 Qualification

on:
  push:
    branches:
      - learning/system-rebuild-001m-s04-reanchor-stage-20260912
      - learning/system-rebuild-001m-s04-tutoring-adaptive-runtime-20260912
    paths:
      - learning/lab/learning_lab/adaptive_mastery_binding.py
      - learning/lab/learning_lab/adaptive_policy.py
      - learning/lab/learning_lab/adaptive_tutor_continuation.py
      - learning/lab/learning_lab/domain_tutor_compat.py
      - learning/lab/learning_lab/instructional_policy.py
      - learning/lab/learning_lab/policy_governed_tutor.py
      - learning/lab/tests/test_tutoring_adaptive_s04.py
      - learning/lab/tests/test_tutoring_adaptive_s04_binding_scope.py
      - learning/lab/tests/test_tutoring_adaptive_s04_model_participation.py
      - qualification/learning/rebuild/LEARNING-SYSTEM-REBUILD-001M-S04-72CASE-QUALIFICATION-CONTRACT.json
      - .github/scripts/learning-system-rebuild-001m-s04-qualify.py
      - .github/scripts/learning-system-rebuild-001m-s03-qualify.py
      - .github/workflows/learning-system-rebuild-001m-s04-qualify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check S04 runtime and qualification code
        run: |
          python -m py_compile \
            learning/lab/learning_lab/adaptive_mastery_binding.py \
            learning/lab/learning_lab/adaptive_policy.py \
            learning/lab/learning_lab/adaptive_tutor_continuation.py \
            learning/lab/learning_lab/domain_tutor_compat.py \
            learning/lab/learning_lab/instructional_policy.py \
            learning/lab/learning_lab/policy_governed_tutor.py \
            learning/lab/tests/test_tutoring_adaptive_s04.py \
            learning/lab/tests/test_tutoring_adaptive_s04_binding_scope.py \
            learning/lab/tests/test_tutoring_adaptive_s04_model_participation.py \
            .github/scripts/learning-system-rebuild-001m-s04-qualify.py

      - name: Run S04 isolated and cumulative qualification
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/learning-system-rebuild-001m-s04-qualify.py 2>&1 | tee learning-system-rebuild-001m-s04-result.json

      - name: Upload exact-subject qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-system-rebuild-001m-s04-${{ github.sha }}
          path: learning-system-rebuild-001m-s04-result.json
          if-no-files-found: error
