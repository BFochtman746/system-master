name: A-01 Overnight Night Shift - GitHub Scheduler Retired

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional operator note for retirement/audit inspection
        required: false
        default: ''

permissions:
  contents: read

jobs:
  retired:
    name: GitHub scheduler retired - A-01 supervisor owns night scheduling
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Publish retirement standing
        shell: bash
        run: |
          echo 'GITHUB_SCHEDULER_RETIRED=1'
          echo 'A01_SCHEDULING_OWNER=SecondShiftSupervisorV2'
          echo 'GITHUB_ROLE=MANUAL_AUDIT_ONLY'
          echo '## A-01 OVERNIGHT GITHUB SCHEDULER RETIRED' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow has no cron, no night-plan construction, no slot chain, and no A-01 execution dispatch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Night scheduling authority resides on A-01 in the Control Gateway supervisor scheduler.' >> "$GITHUB_STEP_SUMMARY"
