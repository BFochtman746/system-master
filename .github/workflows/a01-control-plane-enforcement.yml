name: A-01 Control Plane Enforcement

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/a01-control-plane*.js'
      - '.github/scripts/a01-admission-*.js'
      - '.github/scripts/a01-overnight-*.js'
      - '.github/scripts/a01-runner-guard.ps1'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/validate-system-control-branch.js'
      - '.github/scripts/control-gateway-*.js'
      - '.github/scripts/github-adapter-*.js'
      - 'control-gateway/**'
      - 'qualification/a01/**'
      - 'governance/**'
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'SYSTEMS.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/a01-control-plane*.js'
      - '.github/scripts/a01-admission-*.js'
      - '.github/scripts/a01-overnight-*.js'
      - '.github/scripts/a01-runner-guard.ps1'
      - '.github/scripts/validate-system-topology.js'
      - '.github/scripts/validate-system-control-branch.js'
      - '.github/scripts/control-gateway-*.js'
      - '.github/scripts/github-adapter-*.js'
      - 'control-gateway/**'
      - 'qualification/a01/**'
      - 'governance/**'
      - 'SYSTEM-MASTER-WORKSTREAM-BOOTSTRAP.md'
      - 'SYSTEMS.md'

permissions:
  contents: read

jobs:
  enforce:
    name: Reject ungoverned A-01 admission, direct executor, topology, or scheduling paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Enforce System Master parent topology and authority registries
        run: node .github/scripts/validate-system-topology.js
      - name: Self-test enforcement logic
        run: node .github/scripts/a01-control-plane-enforce.js selftest
      - name: Enforce gateway broker executor and central night scheduler
        run: node .github/scripts/a01-control-plane-enforce.js scan
      - name: Self-test hosted registration admission logic
        run: node .github/scripts/a01-admission-barrier.js selftest
      - name: Validate governance pointer chain and registries
        run: node .github/scripts/validate-governance.js

  control-gateway-suite:
    name: Control Gateway deterministic test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control gateway subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Report runtime
        run: node --version
      - name: Run Control Gateway test suite and retain summary
        working-directory: control-gateway
        shell: bash
        run: |
          set -euo pipefail
          node --test | tee /tmp/control-gateway-test.out
      - name: Assert executable test coverage was not silently emptied
        working-directory: control-gateway
        shell: bash
        run: |
          set -euo pipefail
          FILE_COUNT="$(find test -name '*.test.js' | wc -l | tr -d ' ')"
          TEST_COUNT="$(awk '/^# tests / {print $3}' /tmp/control-gateway-test.out | tail -1)"
          PASS_COUNT="$(awk '/^# pass / {print $3}' /tmp/control-gateway-test.out | tail -1)"
          echo "control-gateway test files: $FILE_COUNT"
          echo "control-gateway tests: ${TEST_COUNT:-0}; pass: ${PASS_COUNT:-0}"
          test "$FILE_COUNT" -ge 1
          test -n "$TEST_COUNT"
          test "$TEST_COUNT" -ge 150
          test -n "$PASS_COUNT"
          test "$PASS_COUNT" -ge 150

  ingress-suite:
    name: A-01 ingress, receipt and evidence suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ingress subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Pin Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - name: Run ingress suite
        working-directory: control-gateway/python
        env:
          PYTHONPATH: ${{ github.workspace }}/control-gateway/python:${{ github.workspace }}
        run: python -m unittest test_a01_github_ingress test_a01_morning_receipt test_a01_evidence_retention -v
