name: Book System Canonical Content Object Admission Hosted Prequalification

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - "qualification/book-system/content-object-admission-001/**"
      - "system-master/book-system/content-object-admission*.js"
      - ".github/scripts/book-system-content-object-admission-001-qualify.js"
      - ".github/workflows/book-system-content-object-admission-001-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prequalify:
    name: Deterministic hosted prequalification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Syntax check admission runtime and qualifier
        run: |
          node --check system-master/book-system/content-object-admission-core.js
          node --check system-master/book-system/content-object-admission.js
          node --check .github/scripts/book-system-content-object-admission-001-qualify.js
      - name: Re-run qualified Version and Rollback regression boundary
        run: node .github/scripts/book-system-version-and-rollback-001-qualify-v2.js
      - name: Run canonical content-object admission qualifier
        run: node .github/scripts/book-system-content-object-admission-001-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-system-content-object-admission-001-${{ github.run_id }}-hosted-evidence
          path: ${{ runner.temp }}/book-content-admission-001-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
