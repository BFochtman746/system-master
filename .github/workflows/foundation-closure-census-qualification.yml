name: Foundation Closure Census Qualification

# Evidence receipts can bind any repository path. Run on every repository change so
# exact-subject drift cannot evade immediate Foundation evidence invalidation.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Verify evidence and recompute Foundation closure truth
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout census subject with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax check integrity controls
        run: |
          node --check .github/scripts/foundation-closure-matrix.js
          node --check .github/scripts/foundation-closure-evidence-verify.js
      - name: Verify historical and current evidence subject bindings
        run: node .github/scripts/foundation-closure-evidence-verify.js
      - name: Recompute canonical matrix and summary
        run: |
          mkdir -p .foundation-census
          node .github/scripts/foundation-closure-matrix.js --summary | tee .foundation-census/summary.json
          node .github/scripts/foundation-closure-matrix.js --out .foundation-census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md
          node .github/scripts/foundation-closure-matrix.js --json > .foundation-census/matrix.json
      - name: Reject committed matrix drift
        shell: bash
        run: |
          set -euo pipefail
          diff -u governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md .foundation-census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md
      - name: Assert integrity invariants
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('.foundation-census/matrix.json', 'utf8'));
          if (m.module_count !== 66 || m.capability_entries !== 50 || m.platform_entries !== 16) process.exit(2);
          const complete = new Set(m.rows.filter(r => r.current_state === 'COMPLETE_WITH_EVIDENCE').map(r => r.requirement_or_capability_id));
          for (const id of ['P00','P01','P02','P03']) if (!complete.has(id)) process.exit(3);
          for (const row of m.rows) {
            if (row.current_state === 'DURABLY_BLOCKED_EXTERNAL_HUMAN_PRIVATE_NATIVE' && row._unpopulated_required.length) process.exit(4);
            if (row.current_state === 'COMPLETE_WITH_EVIDENCE' && (!row.evidence_pointer || row.evidence_pointer === 'UNPOPULATED')) process.exit(5);
          }
          NODE
      - name: Upload generated census evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-closure-census-${{ github.run_id }}
          path: .foundation-census/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
