name: Chat Foundation Qualification

on:
  push:
    paths:
      - 'governance/contracts/CHAT-FOUNDATION-CONTRACT-*.md'
      - 'governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md'
      - 'tools/chat_turn_plan.py'
      - '.github/scripts/chat-foundation-qualify.py'
      - '.github/scripts/foundation-closure-matrix.js'
      - 'tests/test_chat_turn_plan.py'
      - 'qualification/chat/**'
      - '.github/workflows/chat-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/contracts/CHAT-FOUNDATION-CONTRACT-*.md'
      - 'governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md'
      - 'tools/chat_turn_plan.py'
      - '.github/scripts/chat-foundation-qualify.py'
      - '.github/scripts/foundation-closure-matrix.js'
      - 'tests/test_chat_turn_plan.py'
      - 'qualification/chat/**'
      - '.github/workflows/chat-foundation-qualification.yml'
  workflow_dispatch:

concurrency:
  group: chat-foundation-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deterministic Chat foundation
        run: python3 -m unittest tests.test_chat_turn_plan
      - name: Qualify representative Chat corpus
        env:
          CHAT_SOURCE_ID: ${{ github.sha }}
        run: python3 .github/scripts/chat-foundation-qualify.py
      - name: Verify canonical Foundation census disposition
        run: |
          node .github/scripts/foundation-closure-matrix.js --out /tmp/foundation-matrix.md
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md'),
              Path('/tmp/foundation-matrix.md'),
          ]
          for path in paths:
              normalized = path.with_name(path.name + '.normalized')
              normalized.write_text(path.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')
          PY
          diff -u \
            governance/census/FOUNDATION-CLOSURE-CENSUS-001-DISPOSITION-MATRIX.md.normalized \
            /tmp/foundation-matrix.md.normalized
      - name: Preserve machine-readable Chat qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: chat-foundation-1.0-evidence
          path: qualification-output/chat-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
