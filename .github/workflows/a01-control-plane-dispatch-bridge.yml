name: A-01 Control Plane Dispatch Bridge

on:
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Registered qualification ID
        required: true
      workstream_id:
        description: Owning workstream
        required: true
      subject_sha:
        description: Exact 40-character commit SHA to qualify
        required: true
      origin_ref:
        description: Workstream branch/ref that owns the return ticket
        required: true
      resume_on_pass:
        description: Authorized continuation after PASS
        required: true
      resume_on_failure:
        description: Authorized continuation after failure
        required: true
      notification_target:
        description: Logical notification target
        required: false
        default: originating-workstream
      execution_context:
        description: Normal or centrally scheduled overnight execution
        required: true
        default: normal
        type: choice
        options: [normal, overnight]
      qualifier_timeout_minutes:
        description: Registered qualifier runtime budget
        required: true
        default: 28
        type: number
      job_timeout_minutes:
        description: Outer GitHub job budget including evidence cleanup
        required: true
        default: 30
        type: number
      not_before:
        description: Overnight admission start ISO timestamp
        required: false
        default: ''
      not_after:
        description: Overnight admission end ISO timestamp
        required: false
        default: ''
      repair_attempt:
        description: Product repair attempts already consumed for this failure lineage
        required: false
        default: 0
        type: number
      max_repair_attempts:
        description: Maximum bounded product repair attempts for this lineage, 0-2
        required: false
        default: 1
        type: number
      repair_transaction_id:
        description: Existing durable repair transaction for a replacement or same-SHA retry; blank for ordinary first-pass A-01 requests
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate external A-01 dispatch packet before reusable routing
    runs-on: ubuntu-latest
    steps:
      - name: Validate dispatch packet shape
        shell: bash
        env:
          QUALIFICATION_ID: ${{ inputs.qualification_id }}
          WORKSTREAM_ID: ${{ inputs.workstream_id }}
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          ORIGIN_REF: ${{ inputs.origin_ref }}
          RESUME_ON_PASS: ${{ inputs.resume_on_pass }}
          RESUME_ON_FAILURE: ${{ inputs.resume_on_failure }}
          EXECUTION_CONTEXT: ${{ inputs.execution_context }}
          QUALIFIER_TIMEOUT_MINUTES: ${{ inputs.qualifier_timeout_minutes }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
          REPAIR_ATTEMPT: ${{ inputs.repair_attempt }}
          MAX_REPAIR_ATTEMPTS: ${{ inputs.max_repair_attempts }}
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_ID"
          test -n "$WORKSTREAM_ID"
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$ORIGIN_REF"
          test -n "$RESUME_ON_PASS"
          test -n "$RESUME_ON_FAILURE"
          case "$EXECUTION_CONTEXT" in normal|overnight) ;; *) exit 1 ;; esac
          [[ "$QUALIFIER_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]]
          [[ "$JOB_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]]
          [[ "$REPAIR_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$MAX_REPAIR_ATTEMPTS" =~ ^[0-9]+$ ]]
          test "$REPAIR_ATTEMPT" -le "$MAX_REPAIR_ATTEMPTS"
          echo A01_DISPATCH_BRIDGE_PREFLIGHT=PASS

  route:
    name: Dispatch through reusable A-01 Control Plane Gateway
    needs: preflight
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: ${{ inputs.qualification_id }}
      workstream_id: ${{ inputs.workstream_id }}
      subject_sha: ${{ inputs.subject_sha }}
      origin_ref: ${{ inputs.origin_ref }}
      resume_on_pass: ${{ inputs.resume_on_pass }}
      resume_on_failure: ${{ inputs.resume_on_failure }}
      notification_target: ${{ inputs.notification_target }}
      execution_context: ${{ inputs.execution_context }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      not_before: ${{ inputs.not_before }}
      not_after: ${{ inputs.not_after }}
      repair_attempt: ${{ inputs.repair_attempt }}
      max_repair_attempts: ${{ inputs.max_repair_attempts }}
      repair_transaction_id: ${{ inputs.repair_transaction_id }}
