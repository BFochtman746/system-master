name: Document R4 exact-hash custody recovery

on:
  push:
    branches:
      - document/cr001-r4-github-native-import-candidate-20260910
    paths:
      - '.github/workflows/document-r4-github-native-import.yml'

permissions:
  contents: write

concurrency:
  group: document-r4-exact-hash-custody-recovery
  cancel-in-progress: false

jobs:
  recover-exact-source:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Locate exact R4 custody by SHA-256, regardless of filename
        id: locate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $handoffSha = 'ada701cfa15e6162b6cdf67bc6c0803540a611b08a23aeeeddd1045d8ce2d8ab'
          $packetShas = [ordered]@{
            r2 = 'ed3b9feeb5ad93637b1a5a59598003ca21caf794809c4bec4f09e9454d518637'
            r3 = '66260502655e0840f597b6a2dc06ec941b79d7e02b1c16b0a061ee953b698665'
            r4 = 'cea84e5628af671cabc5dc3ed0b37dce38ff264019b04fefcd6c2b347f2b47e2'
          }
          $roots = @(
            (Join-Path $env:USERPROFILE 'Downloads'),
            (Join-Path $env:USERPROFILE 'Desktop'),
            (Join-Path $env:USERPROFILE 'Documents'),
            (Join-Path $env:USERPROFILE 'OneDrive\Downloads'),
            (Join-Path $env:USERPROFILE 'OneDrive\Desktop'),
            (Join-Path $env:USERPROFILE 'OneDrive\Documents')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $candidates = @()
          foreach ($root in $roots) {
            $candidates += Get-ChildItem -LiteralPath $root -Filter '*.zip' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Length -ge 65536 -and $_.Length -le 104857600 -and $_.LastWriteTimeUtc -ge [datetime]'2026-08-30T00:00:00Z' }
          }
          $candidates = $candidates | Sort-Object FullName -Unique
          Write-Host "HASH_SEARCH_CANDIDATES=$($candidates.Count)"
          $matches = @{}
          foreach ($file in $candidates) {
            $sha = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -eq $handoffSha) {
              "mode=handoff" >> $env:GITHUB_OUTPUT
              "handoff=$($file.FullName)" >> $env:GITHUB_OUTPUT
              Write-Host "FOUND_EXACT_R4_HANDOFF hash=$sha bytes=$($file.Length)"
              exit 0
            }
            foreach ($key in $packetShas.Keys) {
              if ($sha -eq $packetShas[$key]) {
                $matches[$key] = $file.FullName
                Write-Host "FOUND_HISTORICAL_PACKET key=$key hash=$sha bytes=$($file.Length)"
              }
            }
          }
          if ($matches.Count -eq 3) {
            'mode=packets' >> $env:GITHUB_OUTPUT
            "r2=$($matches['r2'])" >> $env:GITHUB_OUTPUT
            "r3=$($matches['r3'])" >> $env:GITHUB_OUTPUT
            "r4=$($matches['r4'])" >> $env:GITHUB_OUTPUT
            Write-Host 'FOUND_EXACT_HISTORICAL_PACKET_TRIO_BY_HASH'
            exit 0
          }
          throw "EXACT_R4_CUSTODY_NOT_FOUND handoff=0 historical_packets=$($matches.Count)/3 candidates=$($candidates.Count)"

      - name: Reconstruct and verify exact 225-file R4 source
        id: reconstruct
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'document-r4-exact-hash-recovery'
          Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $work -ItemType Directory | Out-Null
          $mode = '${{ steps.locate.outputs.mode }}'
          if ($mode -eq 'handoff') {
            $archive = '${{ steps.locate.outputs.handoff }}'
            $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne 'ada701cfa15e6162b6cdf67bc6c0803540a611b08a23aeeeddd1045d8ce2d8ab') { throw 'HANDOFF_SHA_DRIFT' }
            $expanded = Join-Path $work 'handoff'
            Expand-Archive -LiteralPath $archive -DestinationPath $expanded
            $sourceRoot = $expanded
            $manifest = Join-Path $expanded 'CANONICAL-SOURCE-TREE-MANIFEST.csv'
            $receipt = Join-Path $expanded 'RECONSTRUCTION-RECEIPT.json'
          } elseif ($mode -eq 'packets') {
            $expected = @{
              '${{ steps.locate.outputs.r2 }}' = 'ed3b9feeb5ad93637b1a5a59598003ca21caf794809c4bec4f09e9454d518637'
              '${{ steps.locate.outputs.r3 }}' = '66260502655e0840f597b6a2dc06ec941b79d7e02b1c16b0a061ee953b698665'
              '${{ steps.locate.outputs.r4 }}' = 'cea84e5628af671cabc5dc3ed0b37dce38ff264019b04fefcd6c2b347f2b47e2'
            }
            foreach ($entry in $expected.GetEnumerator()) {
              $actual = (Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $entry.Value) { throw "PACKET_SHA_MISMATCH $($entry.Key)" }
            }
            $r2 = Join-Path $work 'r2'; $r3 = Join-Path $work 'r3'; $r4 = Join-Path $work 'r4'
            Expand-Archive -LiteralPath '${{ steps.locate.outputs.r2 }}' -DestinationPath $r2
            Expand-Archive -LiteralPath '${{ steps.locate.outputs.r3 }}' -DestinationPath $r3
            Expand-Archive -LiteralPath '${{ steps.locate.outputs.r4 }}' -DestinationPath $r4
            $r2root = Get-ChildItem $r2 -Directory | Select-Object -First 1
            $r4root = Get-ChildItem $r4 -Directory | Select-Object -First 1
            $sourceRoot = Join-Path $work 'reconstructed'
            New-Item $sourceRoot -ItemType Directory | Out-Null
            Copy-Item -LiteralPath (Join-Path $r2root.FullName 'materialized-pre-t13\01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Destination (Join-Path $sourceRoot '01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Recurse
            Copy-Item -Path (Join-Path $r3 'source-overlay\01_CURRENT_DOCUMENT_PROCESSING_MODULE\*') -Destination (Join-Path $sourceRoot '01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Recurse -Force
            Copy-Item -Path (Join-Path $r4root.FullName 'source-overlay\01_CURRENT_DOCUMENT_PROCESSING_MODULE\*') -Destination (Join-Path $sourceRoot '01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Recurse -Force
            $manifest = Join-Path $r4root.FullName 'CANONICAL-SOURCE-TREE-MANIFEST.csv'
            $receipt = $null
          } else {
            throw "UNKNOWN_RECOVERY_MODE $mode"
          }
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'CANONICAL_MANIFEST_MISSING' }
          $rows = Import-Csv -LiteralPath $manifest
          if ($rows.Count -ne 225) { throw "CANONICAL_MANIFEST_ROW_COUNT_MISMATCH $($rows.Count)" }
          $seen = @{}
          foreach ($row in $rows) {
            if ($seen.ContainsKey($row.path)) { throw "DUPLICATE_MANIFEST_PATH $($row.path)" }
            $seen[$row.path] = $true
            $file = Join-Path $sourceRoot ($row.path -replace '/', '\')
            if (-not (Test-Path -LiteralPath $file)) { throw "SOURCE_FILE_MISSING $($row.path)" }
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $actualSize = (Get-Item -LiteralPath $file).Length
            if ($actualHash -ne $row.sha256 -or $actualSize -ne [int64]$row.bytes) { throw "SOURCE_IDENTITY_MISMATCH $($row.path)" }
          }
          $java = Get-ChildItem (Join-Path $sourceRoot '01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Filter '*.java' -File -Recurse
          if ($java.Count -ne 225) { throw "RECONSTRUCTED_JAVA_COUNT_MISMATCH $($java.Count)" }
          "source_root=$sourceRoot" >> $env:GITHUB_OUTPUT
          "manifest=$manifest" >> $env:GITHUB_OUTPUT
          if ($receipt) { "receipt=$receipt" >> $env:GITHUB_OUTPUT }
          Write-Host 'R4_SOURCE_IDENTITY_PASS_225_OF_225'

      - name: Commit verified source custody and remove stale transport staging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'recovered/document/cr001-r4'
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          New-Item (Join-Path $dest 'source') -ItemType Directory -Force | Out-Null
          New-Item (Join-Path $dest 'evidence') -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path '${{ steps.reconstruct.outputs.source_root }}' '01_CURRENT_DOCUMENT_PROCESSING_MODULE') -Destination (Join-Path $dest 'source') -Recurse
          Copy-Item -LiteralPath '${{ steps.reconstruct.outputs.manifest }}' -Destination (Join-Path $dest 'evidence\CANONICAL-SOURCE-TREE-MANIFEST.csv')
          if ('${{ steps.reconstruct.outputs.receipt }}') {
            Copy-Item -LiteralPath '${{ steps.reconstruct.outputs.receipt }}' -Destination (Join-Path $dest 'evidence\RECONSTRUCTION-RECEIPT.json')
          }
          $evidence = [ordered]@{
            recovery_id = 'CR001-R4-GITHUB-NATIVE-EXACT-HASH-CUSTODY-003'
            recovered_authority = 'CR001-R4'
            recovery_mode = '${{ steps.locate.outputs.mode }}'
            canonical_manifest_rows = 225
            source_identity = 'PASS__225_OF_225_EXACT_SHA256_AND_SIZE'
            historical_pass_transfer = $false
            a01_pass = $false
            native_office_pass = $false
            production_pass = $false
            note = 'A-01 was used only as a bounded custody-location host. This is not an A-01 qualification/admission claim.'
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $dest 'evidence\GITHUB-NATIVE-CUSTODY-RECOVERY.json') -Encoding utf8
          git rm -r --ignore-unmatch .document-import-staging/cr001-r4
          git config user.name 'system-master-custody-recovery'
          git config user.email 'system-master-custody-recovery@users.noreply.github.com'
          git add -- $dest
          git commit -m 'document: recover exact CR001-R4 source custody by hash'
          $subject = (git rev-parse HEAD).Trim()
          git push origin HEAD:${{ github.ref_name }}
          Write-Host "DOCUMENT_R4_SOURCE_CUSTODY_PUSHED=$subject"
