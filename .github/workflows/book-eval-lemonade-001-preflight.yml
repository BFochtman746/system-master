name: BOOK-EVAL-LEMONADE-001 A-01 Preflight Qualification

on:
  push:
    branches:
      - book-eval-lemonade-001-repo-bind-001
    paths:
      - ".github/workflows/book-eval-lemonade-001-preflight.yml"
      - "qualification/book-eval-lemonade-001/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-eval-lemonade-001-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify frozen Book evaluator and Lemonade model on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact objective commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Run bounded A-01 preflight
        shell: cmd
        run: call qualification\book-eval-lemonade-001\a01-preflight.cmd

      - name: Publish preflight summary
        if: always()
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\book-eval-lemonade-001-preflight-%GITHUB_RUN_ID%"
          echo ## BOOK-EVAL-LEMONADE-001-REPO-BIND-001>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\preflight-summary.txt" (
            echo ~~~text>>"%GITHUB_STEP_SUMMARY%"
            type "%EVIDENCE_DIR%\preflight-summary.txt">>"%GITHUB_STEP_SUMMARY%"
            echo ~~~>>"%GITHUB_STEP_SUMMARY%"
          ) else (
            echo Preflight summary was not created.>>"%GITHUB_STEP_SUMMARY%"
          )

      - name: Upload A-01 preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: book-eval-lemonade-001-preflight-evidence
          path: ${{ runner.temp }}\book-eval-lemonade-001-preflight-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
