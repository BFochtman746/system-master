name: BOOK Reconstruction B00 F3 Qualification

on:
  push:
    branches:
      - book-system/reconstruction-b00-parent-v2
    paths:
      - 'system-master/book-system/canonical-parent-v2-core.js'
      - 'system-master/book-system/canonical-parent-v2-sqlite-store.js'
      - 'system-master/book-system/rights-custody-evidence-core.js'
      - '.github/scripts/book-system-canonical-parent-v2-core-001-qualify.js'
      - '.github/scripts/book-system-canonical-parent-v2-store-001-qualify.js'
      - '.github/scripts/book-system-rights-custody-evidence-001-qualify.js'
      - '.github/workflows/book-reconstruction-b00-f3-qualify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Node ${{ matrix.node }} — Q001-Q050 + Q067-Q076
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Record exact subject
        run: |
          echo "subject_sha=${GITHUB_SHA}" | tee b00-f3-subject-node-${{ matrix.node }}.txt
          git rev-parse HEAD | tee -a b00-f3-subject-node-${{ matrix.node }}.txt
          node --version | tee -a b00-f3-subject-node-${{ matrix.node }}.txt
      - name: Run Q001-Q036 pure-core baseline
        run: node .github/scripts/book-system-canonical-parent-v2-core-001-qualify.js | tee b00-f3-core-node-${{ matrix.node }}.log
      - name: Run Q037-Q050 durable-store baseline
        run: node .github/scripts/book-system-canonical-parent-v2-store-001-qualify.js | tee b00-f3-store-node-${{ matrix.node }}.log
      - name: Run Q067-Q076 rights-custody denominator
        run: node .github/scripts/book-system-rights-custody-evidence-001-qualify.js | tee b00-f3-rights-node-${{ matrix.node }}.log
      - name: Hash evidence
        if: always()
        run: sha256sum b00-f3-subject-node-${{ matrix.node }}.txt b00-f3-core-node-${{ matrix.node }}.log b00-f3-store-node-${{ matrix.node }}.log b00-f3-rights-node-${{ matrix.node }}.log > b00-f3-node-${{ matrix.node }}.sha256
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-reconstruction-b00-f3-node-${{ matrix.node }}-${{ github.sha }}
          path: |
            b00-f3-subject-node-${{ matrix.node }}.txt
            b00-f3-core-node-${{ matrix.node }}.log
            b00-f3-store-node-${{ matrix.node }}.log
            b00-f3-rights-node-${{ matrix.node }}.log
            b00-f3-node-${{ matrix.node }}.sha256
          if-no-files-found: error
