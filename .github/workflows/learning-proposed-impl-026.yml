name: PROPOSED LEARNING-LAB-IMPL-026 Production Provider Configuration

on:
  push:
    branches:
      - learning/proposed-impl-026-production-provider-configuration
    paths:
      - ".github/workflows/learning-proposed-impl-026.yml"
      - "learning/lab/system_master_bridge.py"
      - "learning/lab/learning_lab/production_provider_config.py"
      - "learning/lab/learning_lab/http_research_provider.py"
      - "learning/lab/learning_lab/http_model_provider.py"
      - "learning/lab/learning_lab/provider_multi_sample_acquisition.py"
      - "learning/lab/learning_lab/provider_multi_candidate_runtime.py"
      - "learning/lab/qualification_impl026_system_master_configured_provider.py"
      - "learning/lab/qualification_impl025_system_master_full_http.py"
      - "learning/lab/tests/test_production_provider_config.py"
      - "learning/lab/tests/test_http_research_provider.py"
      - "learning/lab/tests/test_http_model_provider.py"
      - "learning/lab/tests/test_provider_multi_sample_acquisition.py"
      - "learning/lab/tests/test_provider_multi_candidate_runtime.py"
      - "system-master/learning-integration/impl-017/src/main/java/org/systemmaster/learning/LearningExecutionPort.java"
      - "system-master/learning-integration/impl-025/**"
      - "system-master/learning-integration/impl-026/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-proposed-impl-026-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify production provider configuration boundary on A-01
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout exact proposed IMPL-026 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Provision pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false

      - name: Prepare evidence
        shell: cmd
        run: |
          set "EVIDENCE_DIR=%RUNNER_TEMP%\learning-proposed-impl-026-%GITHUB_RUN_ID%"
          set "CLASS_DIR=%RUNNER_TEMP%\learning-proposed-impl-026-classes-%GITHUB_RUN_ID%"
          if not exist "%EVIDENCE_DIR%" mkdir "%EVIDENCE_DIR%"
          if not exist "%CLASS_DIR%" mkdir "%CLASS_DIR%"
          echo EVIDENCE_DIR=%EVIDENCE_DIR%>>"%GITHUB_ENV%"
          echo CLASS_DIR=%CLASS_DIR%>>"%GITHUB_ENV%"
          echo %GITHUB_SHA%>"%EVIDENCE_DIR%\source-commit.txt"
          echo %RUNNER_NAME%>"%EVIDENCE_DIR%\runner.txt"
          python --version >"%EVIDENCE_DIR%\python-version.txt" 2>&1
          java -version >"%EVIDENCE_DIR%\java-version.txt" 2>&1
          javac -version >"%EVIDENCE_DIR%\javac-version.txt" 2>&1
          type "%EVIDENCE_DIR%\python-version.txt"
          type "%EVIDENCE_DIR%\java-version.txt"
          type "%EVIDENCE_DIR%\javac-version.txt"

      - name: Compile configured provider boundary
        shell: cmd
        run: |
          python -m py_compile ^
            learning\lab\system_master_bridge.py ^
            learning\lab\learning_lab\production_provider_config.py ^
            learning\lab\qualification_impl026_system_master_configured_provider.py ^
            learning\lab\tests\test_production_provider_config.py ^
            >"%EVIDENCE_DIR%\python-compile.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-compile.txt"
          exit /b %RC%

      - name: Run focused provider configuration tests
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_production_provider_config >"%EVIDENCE_DIR%\python-impl026-config.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl026-config.txt"
          exit /b %RC%

      - name: Compile System Master configured provider adapter without foundation packages
        shell: cmd
        run: |
          javac -d "%CLASS_DIR%" ^
            system-master\learning-integration\impl-017\src\main\java\org\systemmaster\learning\LearningExecutionPort.java ^
            system-master\learning-integration\impl-025\src\main\java\org\systemmaster\learning\LearningCapabilityAdapter.java ^
            system-master\learning-integration\impl-026\src\main\java\org\systemmaster\learning\ConfiguredProviderLearningAdapter.java ^
            system-master\learning-integration\impl-026\src\test\java\org\systemmaster\learning\Impl026ConfiguredProviderQualification.java ^
            system-master\learning-integration\impl-025\src\test\java\org\systemmaster\learning\Impl025FullHttpProviderIntegrationQualification.java ^
            >"%EVIDENCE_DIR%\java-port-compile.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\java-port-compile.txt"
          if not "%RC%"=="0" exit /b %RC%
          echo IMPL026_JAVA_FOUNDATION_DEPENDENCY=NONE>"%EVIDENCE_DIR%\java-isolation.txt"
          type "%EVIDENCE_DIR%\java-isolation.txt"

      - name: Run real Java to configured Python to HTTP qualification
        shell: cmd
        run: |
          python learning\lab\qualification_impl026_system_master_configured_provider.py --class-dir "%CLASS_DIR%" >"%EVIDENCE_DIR%\impl026-integration.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl026-integration.txt"
          exit /b %RC%

      - name: Regress IMPL-025 direct full HTTP System Master path
        shell: cmd
        run: |
          python learning\lab\qualification_impl025_system_master_full_http.py --class-dir "%CLASS_DIR%" >"%EVIDENCE_DIR%\impl025-integration-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\impl025-integration-regression.txt"
          exit /b %RC%

      - name: Regress IMPL-024 research HTTP boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_http_research_provider >"%EVIDENCE_DIR%\python-impl024-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl024-regression.txt"
          exit /b %RC%

      - name: Regress IMPL-023 model HTTP boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_http_model_provider >"%EVIDENCE_DIR%\python-impl023-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl023-regression.txt"
          exit /b %RC%

      - name: Regress IMPL-022 acquisition boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_provider_multi_sample_acquisition >"%EVIDENCE_DIR%\python-impl022-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl022-regression.txt"
          exit /b %RC%

      - name: Regress IMPL-021 selection boundary
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\learning\lab"
          python -m unittest -v tests.test_provider_multi_candidate_runtime >"%EVIDENCE_DIR%\python-impl021-regression.txt" 2>&1
          set "RC=%ERRORLEVEL%"
          type "%EVIDENCE_DIR%\python-impl021-regression.txt"
          exit /b %RC%

      - name: Publish proposed IMPL-026 summary
        if: always()
        shell: cmd
        run: |
          echo ## PROPOSED LEARNING-LAB-IMPL-026>>"%GITHUB_STEP_SUMMARY%"
          echo Commit: %GITHUB_SHA%>>"%GITHUB_STEP_SUMMARY%"
          echo Truth boundary: production provider configuration policy and System Master configured invocation proven using real local HTTP; external production provider/API execution remains unproven.>>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl026-config.txt" type "%EVIDENCE_DIR%\python-impl026-config.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\java-isolation.txt" type "%EVIDENCE_DIR%\java-isolation.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\impl026-integration.txt" type "%EVIDENCE_DIR%\impl026-integration.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\impl025-integration-regression.txt" type "%EVIDENCE_DIR%\impl025-integration-regression.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl024-regression.txt" type "%EVIDENCE_DIR%\python-impl024-regression.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl023-regression.txt" type "%EVIDENCE_DIR%\python-impl023-regression.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl022-regression.txt" type "%EVIDENCE_DIR%\python-impl022-regression.txt">>"%GITHUB_STEP_SUMMARY%"
          if exist "%EVIDENCE_DIR%\python-impl021-regression.txt" type "%EVIDENCE_DIR%\python-impl021-regression.txt">>"%GITHUB_STEP_SUMMARY%"

      - name: Upload proposed IMPL-026 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: learning-proposed-impl-026-evidence
          path: ${{ runner.temp }}\learning-proposed-impl-026-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
