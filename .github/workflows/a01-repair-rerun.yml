name: A-01 Repair Rerun

on:
  workflow_dispatch:
    inputs:
      transaction_id:
        description: Existing durable repair transaction in A01_REQUEUE_READY or RETRY_REQUEST_READY
        required: true
        type: string
      execution_context:
        description: Normal or centrally admitted overnight execution
        required: true
        default: normal
        type: choice
        options: [normal, overnight]
      qualifier_timeout_minutes:
        description: Registered qualifier runtime budget
        required: true
        default: 28
        type: number
      job_timeout_minutes:
        description: Outer A-01 job budget
        required: true
        default: 30
        type: number
      not_before:
        description: Optional overnight admission start ISO timestamp
        required: false
        default: ''
        type: string
      not_after:
        description: Optional overnight admission end ISO timestamp
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      transaction_id:
        required: true
        type: string
      execution_context:
        required: false
        default: normal
        type: string
      qualifier_timeout_minutes:
        required: false
        default: 28
        type: number
      job_timeout_minutes:
        required: false
        default: 30
        type: number
      not_before:
        required: false
        default: ''
        type: string
      not_after:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Resolve exact same-transaction rerun context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transaction_id: ${{ steps.context.outputs.transaction_id }}
      qualification_id: ${{ steps.context.outputs.qualification_id }}
      workstream_id: ${{ steps.context.outputs.workstream_id }}
      subject_sha: ${{ steps.context.outputs.subject_sha }}
      origin_ref: ${{ steps.context.outputs.origin_ref }}
      resume_on_pass: ${{ steps.context.outputs.resume_on_pass }}
      resume_on_failure: ${{ steps.context.outputs.resume_on_failure }}
      notification_target: ${{ steps.context.outputs.notification_target }}
      repair_attempt: ${{ steps.context.outputs.repair_attempt }}
      max_repair_attempts: ${{ steps.context.outputs.max_repair_attempts }}
      control_plane_sha: ${{ steps.control.outputs.control_plane_sha }}
    steps:
      - name: Checkout immutable repair authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind repair rerun control-plane SHA
        id: control
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "${{ github.sha }}" ]; then
            echo "REPAIR_CONTROL_PLANE_SHA_MISMATCH expected=${{ github.sha }} actual=$actual" >&2
            exit 2
          fi
          echo "control_plane_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Validate rerun control and resolve transaction
        id: context
        env:
          TRANSACTION_ID: ${{ inputs.transaction_id }}
        shell: bash
        run: |
          node --check .github/scripts/a01-repair-ledger.js
          node .github/scripts/a01-repair-rerun-selftest.js
          mkdir -p .repair-rerun
          node - <<'NODE' > .repair-rerun/input.json
          console.log(JSON.stringify({ transaction_id: process.env.TRANSACTION_ID }))
          NODE
          node .github/scripts/a01-repair-ledger.js prepare-rerun < .repair-rerun/input.json > .repair-rerun/context.json
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const c = require('./.repair-rerun/context.json');
          for (const key of ['transaction_id','qualification_id','workstream_id','subject_sha','origin_ref','resume_on_pass','resume_on_failure','notification_target','repair_attempt','max_repair_attempts']) {
            const value = c[key];
            if (value === undefined || value === null || String(value).includes('\n')) throw new Error(`invalid workflow output ${key}`);
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Publish admission context
        run: |
          echo '## A-01 Repair Rerun Admission' >> "$GITHUB_STEP_SUMMARY"
          echo "Control-plane SHA: ${{ steps.control.outputs.control_plane_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .repair-rerun/context.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'This context grants A-01 admission only. It is not PASS.' >> "$GITHUB_STEP_SUMMARY"

  execute:
    name: Execute replacement subject through same-commit canonical A-01 gateway
    needs: prepare
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: ${{ needs.prepare.outputs.qualification_id }}
      workstream_id: ${{ needs.prepare.outputs.workstream_id }}
      subject_sha: ${{ needs.prepare.outputs.subject_sha }}
      origin_ref: ${{ needs.prepare.outputs.origin_ref }}
      resume_on_pass: ${{ needs.prepare.outputs.resume_on_pass }}
      resume_on_failure: ${{ needs.prepare.outputs.resume_on_failure }}
      notification_target: ${{ needs.prepare.outputs.notification_target }}
      execution_context: ${{ inputs.execution_context }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      not_before: ${{ inputs.not_before }}
      not_after: ${{ inputs.not_after }}
      repair_attempt: ${{ fromJSON(needs.prepare.outputs.repair_attempt) }}
      max_repair_attempts: ${{ fromJSON(needs.prepare.outputs.max_repair_attempts) }}
      repair_transaction_id: ${{ needs.prepare.outputs.transaction_id }}
