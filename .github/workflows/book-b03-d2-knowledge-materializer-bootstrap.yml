name: Book B03 D2 Knowledge Materializer Bootstrap

on:
  push:
    branches:
      - book-system/control-v1
    paths:
      - '.github/workflows/book-b03-d2-knowledge-materializer-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact D2 bytes
        run: |
          set -euo pipefail
          cat qualification/book-system/reconstruction/.b03-d2-src-00.b64 qualification/book-system/reconstruction/.b03-d2-src-01.b64 | base64 -d | gzip -d > system-master/book-system/book-knowledge-materializer-v1.js
          cat qualification/book-system/reconstruction/.b03-d2-test-00.b64 | base64 -d | gzip -d > system-master/book-system/book-knowledge-materializer-v1.test.js
          test "$(git hash-object system-master/book-system/book-knowledge-materializer-v1.js)" = '37b34b4c5d137d11630d410c24fe8a5c93af289a'
          test "$(git hash-object system-master/book-system/book-knowledge-materializer-v1.test.js)" = '080b4686ec2f3c683df34846cda9014ae39aab2d'
      - name: Run locked D1 and D2 denominators
        run: |
          set -euo pipefail
          node system-master/book-system/book-story-bible-knowledge-v1.test.js | tee b03-d1-k01-k32.log
          grep -F '"result":"PASS"' b03-d1-k01-k32.log
          grep -F '"denominator":"K01-K32"' b03-d1-k01-k32.log
          grep -F '"cases":32' b03-d1-k01-k32.log
          node system-master/book-system/book-knowledge-materializer-v1.test.js | tee b03-d2-m01-m20.log
          grep -F '"result":"PASS"' b03-d2-m01-m20.log
          grep -F '"denominator":"M01-M20"' b03-d2-m01-m20.log
          grep -F '"cases":20' b03-d2-m01-m20.log
          grep -F '"materializer_implemented":true' b03-d2-m01-m20.log
          grep -F '"calibration_policy_implemented":true' b03-d2-m01-m20.log
          grep -F '"invalidation_engine_implemented":false' b03-d2-m01-m20.log
          grep -F '"canonical_admission_implemented":false' b03-d2-m01-m20.log
          grep -F '"b01_registry_modified":false' b03-d2-m01-m20.log
          grep -F '"model_accuracy_claimed":false' b03-d2-m01-m20.log
          grep -F '"historical_pass_transferred":0' b03-d2-m01-m20.log
          grep -F '"canonical_effect":false' b03-d2-m01-m20.log
      - name: Commit qualified D2 source and tests
        run: |
          set -euo pipefail
          git rm qualification/book-system/reconstruction/.b03-d2-src-00.b64 qualification/book-system/reconstruction/.b03-d2-src-01.b64 qualification/book-system/reconstruction/.b03-d2-test-00.b64
          git add system-master/book-system/book-knowledge-materializer-v1.js system-master/book-system/book-knowledge-materializer-v1.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'book: build B03 D2 knowledge materializer and calibration policy'
          git push origin HEAD:book-system/control-v1
