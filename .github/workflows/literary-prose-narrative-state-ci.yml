name: Literary Prose Narrative State Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/narrative-state-001/NARRATIVE-STATE-CONTRACT-v1.json'
      - 'qualification/literary-prose-engine-001/narrative-state-001/NARRATIVE-STATE-MATERIALIZATION-CONTRACT-v1.json'
      - 'qualification/literary-prose-engine-001/narrative-state-001/narrative_state.py'
      - 'qualification/literary-prose-engine-001/narrative-state-001/materialize_narrative_state.py'
      - 'qualification/literary-prose-engine-001/narrative-state-001/run_narrative_state_fixtures.py'
      - 'qualification/literary-prose-engine-001/narrative-state-001/run_materialization_fixtures.py'
      - '.github/workflows/literary-prose-narrative-state-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile narrative-state modules
        run: python -m py_compile qualification/literary-prose-engine-001/narrative-state-001/narrative_state.py qualification/literary-prose-engine-001/narrative-state-001/materialize_narrative_state.py qualification/literary-prose-engine-001/narrative-state-001/run_narrative_state_fixtures.py qualification/literary-prose-engine-001/narrative-state-001/run_materialization_fixtures.py
      - name: Qualify narrative-state representation
        run: python qualification/literary-prose-engine-001/narrative-state-001/run_narrative_state_fixtures.py
      - name: Qualify narrative-state materialization admission
        run: python qualification/literary-prose-engine-001/narrative-state-001/run_materialization_fixtures.py
