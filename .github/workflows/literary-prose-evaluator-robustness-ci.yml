name: Literary Prose Evaluator Robustness Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/evaluator-robustness-002/EVALUATOR-ROBUSTNESS-CONTRACT-v1.json'
      - 'qualification/literary-prose-engine-001/evaluator-robustness-002/evaluator_robustness.py'
      - 'qualification/literary-prose-engine-001/evaluator-robustness-002/run_evaluator_robustness_fixtures.py'
      - '.github/workflows/literary-prose-evaluator-robustness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile evaluator robustness modules
        run: python -m py_compile qualification/literary-prose-engine-001/evaluator-robustness-002/evaluator_robustness.py qualification/literary-prose-engine-001/evaluator-robustness-002/run_evaluator_robustness_fixtures.py
      - name: Qualify evaluator robustness analyzer
        run: python qualification/literary-prose-engine-001/evaluator-robustness-002/run_evaluator_robustness_fixtures.py
