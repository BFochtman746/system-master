name: Controller v2 Reference Kernel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'controller-v2/reference-kernel/**'
      - '.github/workflows/controller-v2-reference-kernel.yml'

permissions:
  contents: read

concurrency:
  group: controller-v2-reference-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compile kernel and tests
        run: |
          python -m py_compile \
            controller-v2/reference-kernel/controller_kernel.py \
            controller-v2/reference-kernel/test_controller_kernel.py

      - name: Run reference-kernel denominator
        run: |
          python -m unittest discover \
            -s controller-v2/reference-kernel \
            -p 'test_*.py' \
            -v
