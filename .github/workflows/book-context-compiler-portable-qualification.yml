name: Book Context Compiler Portable Qualification

on:
  push:
    branches:
      - book/context-compiler-001-second-shift-20260911
      - main
    paths:
      - 'system-master/book-system/context-compiler/**'
      - '.github/scripts/book-context-compiler-context-package-001-qualify.js'
      - '.github/workflows/book-context-compiler-portable-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # was actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # was actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify Book context compiler
        run: node .github/scripts/book-context-compiler-context-package-001-qualify.js
