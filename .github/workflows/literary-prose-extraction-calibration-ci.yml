name: Literary Prose Extraction Calibration Qualification

on:
  push:
    branches:
      - literary-prose-engine-001
    paths:
      - 'qualification/literary-prose-engine-001/extraction-calibration-001/**'
      - '.github/workflows/literary-prose-extraction-calibration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON artifacts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('qualification/literary-prose-engine-001/extraction-calibration-001')
          for path in sorted(root.rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON_PASS {path}')
          PY
      - name: Compile extraction calibration modules
        run: >-
          python -m py_compile
          qualification/literary-prose-engine-001/extraction-calibration-001/narrative_extraction_calibration.py
          qualification/literary-prose-engine-001/extraction-calibration-001/extractor_provider.py
          qualification/literary-prose-engine-001/extraction-calibration-001/cautious_semantic_extractor.py
          qualification/literary-prose-engine-001/extraction-calibration-001/run_extraction_calibration_fixtures.py
          qualification/literary-prose-engine-001/extraction-calibration-001/run_no_model_baseline.py
          qualification/literary-prose-engine-001/extraction-calibration-001/run_candidate_source_heldout.py
      - name: Qualify calibration failure detection and abstention semantics
        run: python qualification/literary-prose-engine-001/extraction-calibration-001/run_extraction_calibration_fixtures.py
      - name: Qualify source-bound provider contract and no-model baseline
        run: python qualification/literary-prose-engine-001/extraction-calibration-001/run_no_model_baseline.py
      - name: Qualify real source-to-observation candidate on source-heldout evidence
        run: python qualification/literary-prose-engine-001/extraction-calibration-001/run_candidate_source_heldout.py
