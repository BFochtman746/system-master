name: A-01 Canonical Qualification Dispatch

on:
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Registered qualification ID
        required: true
        type: string
      workstream_id:
        description: Registered owning workstream
        required: true
        type: string
      subject_sha:
        description: Exact 40-character subject SHA
        required: true
        type: string
      origin_ref:
        description: Owning workstream return ref
        required: true
        type: string
      resume_on_pass:
        description: Authorized continuation after PASS
        required: true
        type: string
      resume_on_failure:
        description: Authorized continuation after non-PASS
        required: true
        type: string
      notification_target:
        description: Logical notification target
        required: true
        default: originating-workstream
        type: string
      execution_context:
        description: Normal or centrally scheduled overnight execution
        required: true
        default: normal
        type: choice
        options: [normal, overnight]
      qualifier_timeout_minutes:
        description: Registered qualifier runtime budget
        required: true
        default: 28
        type: number
      job_timeout_minutes:
        description: Outer A-01 job budget
        required: true
        default: 30
        type: number
      not_before:
        description: Optional overnight admission start ISO timestamp
        required: false
        default: ''
        type: string
      not_after:
        description: Optional overnight admission end ISO timestamp
        required: false
        default: ''
        type: string
      repair_attempt:
        description: Product repair attempts already consumed
        required: false
        default: 0
        type: number
      max_repair_attempts:
        description: Maximum product repair attempts
        required: false
        default: 1
        type: number
      repair_transaction_id:
        description: Existing repair transaction ID; blank for ordinary qualification
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  bind:
    name: Bind dispatch to current default-branch control plane
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      control_plane_sha: ${{ steps.bind.outputs.control_plane_sha }}
    steps:
      - name: Require canonical main dispatch
        id: bind
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "A01_FRONT_DOOR_REQUIRES_MAIN:${GITHUB_REF}" >&2; exit 1; }
          test "${#GITHUB_SHA}" -eq 40 || { echo "INVALID_CONTROL_PLANE_SHA:${GITHUB_SHA}" >&2; exit 1; }
          echo "control_plane_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "A01_FRONT_DOOR_BOUND control_plane_sha=${GITHUB_SHA} subject_sha=${{ inputs.subject_sha }}"

  qualify:
    name: Admit and execute canonical A-01 qualification
    needs: bind
    uses: ./.github/workflows/a01-control-plane-gateway.yml
    with:
      qualification_id: ${{ inputs.qualification_id }}
      workstream_id: ${{ inputs.workstream_id }}
      subject_sha: ${{ inputs.subject_sha }}
      expected_control_plane_sha: ${{ needs.bind.outputs.control_plane_sha }}
      origin_ref: ${{ inputs.origin_ref }}
      resume_on_pass: ${{ inputs.resume_on_pass }}
      resume_on_failure: ${{ inputs.resume_on_failure }}
      notification_target: ${{ inputs.notification_target }}
      execution_context: ${{ inputs.execution_context }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes }}
      not_before: ${{ inputs.not_before }}
      not_after: ${{ inputs.not_after }}
      repair_attempt: ${{ inputs.repair_attempt }}
      max_repair_attempts: ${{ inputs.max_repair_attempts }}
      repair_transaction_id: ${{ inputs.repair_transaction_id }}
    secrets: inherit
