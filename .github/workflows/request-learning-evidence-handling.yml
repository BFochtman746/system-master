name: Request Learning Evidence Handling Hosted Qualification

on:
  push:
    branches: [learning/request-evidence-handling-8e32036e]

permissions:
  contents: read

jobs:
  prequalify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact product subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8e32036e254097908f7ad4dfedf06517a2660f45
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          architecture: x64
          check-latest: false
      - name: Compile evidence-handling boundary
        run: python -m py_compile learning/lab/run_pilot001.py learning/lab/run_pilot001_closed_loop.py learning/lab/run_pilot001_review_intake.py learning/lab/learning_lab/real_learner_pilot_review_intake.py learning/lab/learning_lab/real_learner_pilot_handoff.py learning/lab/learning_lab/real_learner_pilot_preflight.py
      - name: Run focused human-evidence boundary
        working-directory: learning/lab
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_real_learner_pilot_review_intake \
            tests.test_real_learner_pilot_evidence_notice \
            tests.test_real_learner_pilot_handoff \
            tests.test_real_learner_pilot_preflight \
            tests.test_real_learner_pilot_completion \
            tests.test_real_learner_pilot_closed_loop_launcher \
            tests.test_real_learner_pilot_console \
            tests.test_real_learner_pilot_withdrawal \
            tests.test_real_learner_pilot_human_session \
            tests.test_real_learner_pilot_runtime_binding \
            tests.test_real_learner_pilot \
            2>&1 | tee "$RUNNER_TEMP/evidence-handling-focused.txt"
          grep -q '^OK$' "$RUNNER_TEMP/evidence-handling-focused.txt"
          grep -q 'Ran 67 tests' "$RUNNER_TEMP/evidence-handling-focused.txt"
      - name: Run complete Learning Lab regression
        working-directory: learning/lab
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/evidence-handling-full.txt"
          grep -q '^OK$' "$RUNNER_TEMP/evidence-handling-full.txt"
          grep -q 'Ran 698 tests' "$RUNNER_TEMP/evidence-handling-full.txt"
      - name: Exercise participant-facing local evidence notice and preflight
        shell: bash
        run: |
          STATE="$RUNNER_TEMP/pilot001-evidence-handling-state"
          python learning/lab/run_pilot001.py --state-root "$STATE" --preflight-only > "$RUNNER_TEMP/evidence-handling-notice.txt"
          grep -q 'Pilot evidence is stored locally on this machine by default' "$RUNNER_TEMP/evidence-handling-notice.txt"
          grep -q 'does not automatically upload pilot evidence to GitHub' "$RUNNER_TEMP/evidence-handling-notice.txt"
          grep -q 'external export or integrity anchoring is a separate controlled operation' "$RUNNER_TEMP/evidence-handling-notice.txt"
          grep -q 'Standing: READY_FOR_EXPLICIT_PARTICIPANT_CONSENT' "$RUNNER_TEMP/evidence-handling-notice.txt"
          test -d "$STATE"
          test -z "$(find "$STATE" -mindepth 1 -maxdepth 1 -print -quit)"
          ! grep -Fq "$STATE" "$RUNNER_TEMP/evidence-handling-notice.txt"
      - name: Verify review-intake CLI has no implicit export action
        shell: bash
        run: |
          python learning/lab/run_pilot001_review_intake.py --help > "$RUNNER_TEMP/review-intake-help.txt"
          grep -q 'No network upload is performed' "$RUNNER_TEMP/review-intake-help.txt"
          grep -q 'write-local-packet' "$RUNNER_TEMP/review-intake-help.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-evidence-handling-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence-handling-focused.txt
            ${{ runner.temp }}/evidence-handling-full.txt
            ${{ runner.temp }}/evidence-handling-notice.txt
            ${{ runner.temp }}/review-intake-help.txt
          if-no-files-found: error
          retention-days: 14
