name: Controller V2 Foundation CI

on:
  push:
    branches:
      - controller-v2/foundation-002
    paths:
      - 'controller-v2/**'
      - '.github/workflows/controller-v2-foundation-ci.yml'
  pull_request:
    paths:
      - 'controller-v2/**'
      - '.github/workflows/controller-v2-foundation-ci.yml'

permissions:
  contents: read

concurrency:
  group: controller-v2-foundation-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Foundation invariants / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: controller-v2
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          check-latest: true

      - name: Verify canonical integration line
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          authority = json.loads(Path('WORK-AUTHORITY.json').read_text())
          expected = authority['canonical_branch']
          actual = os.environ['BRANCH_NAME']
          if actual != expected:
              raise SystemExit(f'non-canonical Controller 2.0 branch: {actual} != {expected}')
          print('canonical branch', actual)
          PY

      - name: Runtime identity
        run: |
          python --version
          python - <<'PY'
          import sqlite3
          print('sqlite', sqlite3.sqlite_version)
          PY

      - name: Compile controller
        run: python -m compileall -q controller_v2 tests

      - name: Run foundation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
