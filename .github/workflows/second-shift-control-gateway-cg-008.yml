name: Second Shift Control Gateway CG-008 Host Qualification

on:
  push:
    branches:
      - second-shift-control-gateway/cg-008-supervisor-integration
    paths:
      - 'control-gateway/**'
      - 'governance/control-gateway/**'
      - 'qualification/a01/registry.json'
      - '.github/scripts/a01-second-shift-supervisor-v2-qualify.js'
      - '.github/workflows/second-shift-supervisor-v2-a01-windows-stress.yml'
      - '.github/workflows/second-shift-control-gateway-cg-008.yml'
      - 'tools/second_shift_supervisor_v2.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Supervisor Integration / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CG008_LIVE_REF: control-gateway-state/active-work/second-shift-control-gateway-dev
      CG008_EXPECTED_PUBLICATION_COMMIT: 278c010c561d87fc55bea9c6b5cc736e50390fb7
      CG008_EXPECTED_PACKET_DIGEST: e44b17e197c86800ffd94e935674d5c5f2fcadd1c6f480ed26e913a4e1f910f1
      CG008_EXPECTED_AUTHORITY_SUBJECT: 51a0976f2f3265702e6005a36d70f9e9f240ad63
      CG008_EXPECTED_WORK_REF: second-shift-control-gateway/cg-008-supervisor-integration
      CG008_EXPECTED_OPERATION: SECOND-SHIFT-CONTROL-GATEWAY-CG-008
      CG008_EXPECTED_PREDECESSOR_RECEIPT: SECOND-SHIFT-CONTROL-GATEWAY-CG-007-HOST-QUALIFICATION-34669882162
      CG008_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact CG-008 subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show runtimes
        run: |
          node --version
          python --version
      - name: Validate A-01 registry and wrapper syntax
        run: |
          node .github/scripts/a01-control-plane.js validate
          node --check .github/scripts/a01-second-shift-supervisor-v2-qualify.js
      - name: Verify legacy stress route is gateway-only and registered
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/second-shift-supervisor-v2-a01-windows-stress.yml', 'utf8');
          if (/runs-on\s*:\s*\[[^\]]*self-hosted/i.test(workflow)) throw new Error('legacy stress route still declares direct self-hosted runner');
          if (!workflow.includes('uses: ./.github/workflows/a01-control-plane-gateway.yml')) throw new Error('legacy stress route does not use canonical A-01 gateway');
          if (!workflow.includes('qualification_id: SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS')) throw new Error('legacy route qualification identity mismatch');
          const registry = JSON.parse(fs.readFileSync('qualification/a01/registry.json', 'utf8'));
          const entry = registry.qualifications['SECOND-SHIFT-SUPERVISOR-V2-A01-STRESS'];
          if (!entry) throw new Error('Second Shift A-01 qualification missing from registry');
          if (entry.workstream_id !== 'SECOND-SHIFT-CONTROL-GATEWAY' || entry.source !== 'subject' || entry.executable !== 'node') throw new Error('Second Shift registry ownership/source mismatch');
          if (entry.args.length !== 1 || entry.args[0] !== '.github/scripts/a01-second-shift-supervisor-v2-qualify.js') throw new Error('Second Shift registry wrapper mismatch');
          console.log('CG008_A01_ROUTE_CONTRACT=PASS');
          NODE
      - name: Run Control Gateway CG-003 through CG-008 tests including live authority
        working-directory: control-gateway
        run: node --test
      - name: Compile supervisor integration Python
        run: |
          python -m py_compile tools/second_shift_supervisor_v2.py control-gateway/python/a01_supervisor_adapter.py tests/test_control_gateway_a01_supervisor_adapter.py tests/test_second_shift_supervisor_v2.py tests/run_second_shift_supervisor_v2_optimized.py
      - name: Run gateway to supervisor adapter tests
        run: python tests/test_control_gateway_a01_supervisor_adapter.py
      - name: Run preserved supervisor crash and concurrency stress
        run: python tests/run_second_shift_supervisor_v2_optimized.py
