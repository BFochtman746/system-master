name: Book B04-D1 Reader Exposure Qualification

on:
  push:
    branches:
      - book-system/b04-d1-reader-exposure-v1
    paths:
      - 'system-master/book-system/book-reader-dimension-registry-v1.js'
      - 'system-master/book-system/book-reader-exposure-projection-v1.js'
      - 'system-master/book-system/book-reader-d1.test.js'
      - '.github/workflows/book-b04-d1-reader-exposure-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Require exact D1 branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/book-system/b04-d1-reader-exposure-v1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: B03 knowledge baseline
        shell: bash
        run: node system-master/book-system/book-story-bible-knowledge-v1.test.js
      - name: B03 cumulative integration baseline
        shell: bash
        run: node system-master/book-system/book-b03-e-cumulative-integration.test.js
      - name: B04 D1 registry and exposure qualification
        shell: bash
        run: node --test system-master/book-system/book-reader-d1.test.js
      - name: Runtime import smoke
        shell: bash
        run: |
          node -e "require('./system-master/book-system/book-reader-dimension-registry-v1').validateRegistryV1()"
          node -e "require('./system-master/book-system/book-reader-exposure-projection-v1')"
