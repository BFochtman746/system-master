name: Automation Foundation Qualification

on:
  push:
    paths:
      - 'governance/contracts/AUTOMATION-FOUNDATION-CONTRACT-*.md'
      - 'tools/automation_plan.py'
      - '.github/scripts/automation-foundation-qualify.py'
      - 'tests/test_automation_plan.py'
      - 'qualification/automation/**'
      - '.github/workflows/automation-foundation-qualification.yml'
  pull_request:
    paths:
      - 'governance/contracts/AUTOMATION-FOUNDATION-CONTRACT-*.md'
      - 'tools/automation_plan.py'
      - '.github/scripts/automation-foundation-qualify.py'
      - 'tests/test_automation_plan.py'
      - 'qualification/automation/**'
      - '.github/workflows/automation-foundation-qualification.yml'
  workflow_dispatch:

concurrency:
  group: automation-foundation-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic Automation foundation
        run: python3 -m unittest tests.test_automation_plan
      - name: Qualify representative Automation corpus
        env:
          AUTOMATION_SOURCE_ID: ${{ github.sha }}
        run: python3 .github/scripts/automation-foundation-qualify.py
      - name: Preserve machine-readable Automation qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: automation-foundation-1.0-evidence
          path: qualification-output/automation-foundation-1.0.json
          if-no-files-found: error
          retention-days: 30
