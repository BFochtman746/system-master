name: System Master Continuity Target Windows Reboot Qualification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify-target-windows-reboot:
    name: Qualify TARGET_WINDOWS_REBOOT through A-01 control plane
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@main
    with:
      qualification_id: CONTINUITY-TARGET-WINDOWS-REBOOT
      workstream_id: SYSTEM-MASTER-CONTINUITY
      subject_sha: ${{ github.sha }}
      origin_ref: ${{ github.ref }}
      resume_on_pass: Adjudicate the receipt. If the subject phase is ARM, allow the registered reboot handoff and then advance only QUALIFICATION-SUBJECT.json to VERIFY. If the subject phase is VERIFY, record TARGET_WINDOWS_REBOOT PASS for G-RQ-004 and the Windows arm of G-RQ-072 while leaving iOS and production authorization incomplete.
      resume_on_failure: Classify the receipt failure, repair only the failing Continuity reboot boundary, and rerun the minimum sufficient phase without rewriting prior reboot evidence.
      notification_target: originating-workstream
