name: Learning Dependency Adjudication Batch 02 Prequalification

on:
  push:
    branches:
      - learning/dependency-adjudication-batch-02-20260910
    paths:
      - "qualification/learning/LEARNING-FULL-STANDARD-CURRICULUM-COMPILER-001C-DEPENDENCY-EVIDENCE-ADJUDICATION-BATCH-02-CANDIDATE-045A.json"
      - ".github/scripts/learning-dependency-adjudication-batch-02-qualify.js"
      - ".github/workflows/learning-dependency-adjudication-batch-02-prequal.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Dependency evidence adjudication batch 02
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Record exact subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'SUBJECT_SHA=%s\n' "${GITHUB_SHA}"
      - name: Syntax check dependency validator
        run: node --check .github/scripts/learning-dependency-adjudication-batch-02-qualify.js
      - name: Validate dependency dispositions 06 through 10
        run: node .github/scripts/learning-dependency-adjudication-batch-02-qualify.js
      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LEARNING-DEPENDENCY-ADJUDICATION-BATCH-02-${{ github.sha }}-hosted-evidence
          path: ${{ runner.temp }}/learning-dependency-adjudication-batch-02-evidence
          if-no-files-found: warn
          retention-days: 30

# Machine-evidence adjudication only; protected human and authority boundaries remain unchanged.
