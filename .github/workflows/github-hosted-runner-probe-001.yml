name: GitHub Hosted Runner Probe 001

on:
  push:
    branches:
      - 'qualification/github-hosted-runner-probe-001'
    paths:
      - '.github/workflows/github-hosted-runner-probe-001.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-slim
    steps:
      - name: Confirm hosted runner allocation
        shell: bash
        run: |
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "GITHUB_HOSTED_RUNNER_PROBE=PASS"
