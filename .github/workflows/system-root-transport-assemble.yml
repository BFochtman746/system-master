name: System Root Transport Assemble

on:
  push:
    branches:
      - foundation-system-root-build
    paths:
      - '.github/workflows/system-root-transport-assemble.yml'

permissions:
  contents: write

concurrency:
  group: system-root-transport-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: foundation-system-root-build
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble byte-exact sources
        shell: bash
        run: |
          set -euo pipefail
          ROOT='system-master/foundation-spine/system-root'
          T="$ROOT/.transport"
          mkdir -p "$ROOT/src/main/java/org/systemmaster/foundation/root" "$ROOT/src/test/java/org/systemmaster/foundation/root"
          cat "$T"/FileSystemRootStore.java.part-* > "$ROOT/src/main/java/org/systemmaster/foundation/root/FileSystemRootStore.java"
          cat "$T"/SystemRootQualificationTest.java.part-* > "$ROOT/src/test/java/org/systemmaster/foundation/root/SystemRootQualificationTest.java"
          cat "$T"/SystemRootPerformanceTest.java.part-* > "$ROOT/src/test/java/org/systemmaster/foundation/root/SystemRootPerformanceTest.java"
          test "$(sha256sum "$ROOT/src/main/java/org/systemmaster/foundation/root/FileSystemRootStore.java" | cut -d' ' -f1)" = 'e4f5a5e91a11ee31c53597ef07b361aad82b6f57e4cc3617e40f959ce7f07d60'
          test "$(sha256sum "$ROOT/src/test/java/org/systemmaster/foundation/root/SystemRootQualificationTest.java" | cut -d' ' -f1)" = '8b39d67b75134724b8b2d7b9714e362a91fc1c70630d6f83cb24ec8ce09ebfb3'
          test "$(sha256sum "$ROOT/src/test/java/org/systemmaster/foundation/root/SystemRootPerformanceTest.java" | cut -d' ' -f1)" = '288e8e881e5cc286819d137ced788b57ab0ade7d681c79a3bf80478b28a851e6'

      - name: Run standalone qualification
        shell: bash
        run: bash system-master/foundation-spine/system-root/qualification/run.sh

      - name: Commit assembled qualified sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r system-master/foundation-spine/system-root/.transport
          git add system-master/foundation-spine/system-root/src/main/java/org/systemmaster/foundation/root/FileSystemRootStore.java
          git add system-master/foundation-spine/system-root/src/test/java/org/systemmaster/foundation/root/SystemRootQualificationTest.java
          git add system-master/foundation-spine/system-root/src/test/java/org/systemmaster/foundation/root/SystemRootPerformanceTest.java
          git commit -m 'Assemble and qualify System Root persistence and tests'
          git push origin HEAD:foundation-system-root-build
