      resume_on_failure: Preserve the authoritative receipt and repair only the demonstrated Version/Rollback or A-01 boundary; do not weaken lifecycle, author, publication, concurrency, lineage, or restore safeguards and do not advance to Author Decision Queue.
      notification_target: book-system/control-v1
      execution_context: normal
      qualifier_timeout_minutes: 28
      job_timeout_minutes: 30
