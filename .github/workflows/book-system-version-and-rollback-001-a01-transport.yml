    paths:
      - .github/workflows/book-system-version-and-rollback-001-a01-transport.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: Request canonical A-01 Version and Rollback qualification
    uses: BFochtman746/system-master/.github/workflows/a01-control-plane-gateway.yml@main
    with:
      qualification_id: BOOK-SYSTEM-VERSION-AND-ROLLBACK-001
      workstream_id: BOOK-SYSTEM
      subject_sha: 402ab84a14e9d345530d60394ebc36176541dd21
      origin_ref: refs/heads/book-system/control-v1
