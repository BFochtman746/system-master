name: Documents Spine Effect Runtime Integration Repair

on:
  push:
    branches:
      - documents/spine-effect-runtime-001-20260912
    paths:
      - .github/workflows/documents-spine-effect-runtime-integration-repair.yml

permissions:
  contents: write

jobs:
  repair-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: documents/spine-effect-runtime-001-20260912
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Repair integrated engine identity and commit exact subject
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE/src/main/java/org/systemmaster/tools/document/spine/UniversalDocumentSpine.java')
          text = p.read_text(encoding='utf-8')
          old = 'public final class UniversalDocumentSpine {\n'
          new = 'public final class UniversalDocumentSpine {\n    private static final String ENGINE_ID = DocumentExistingArtifactEffectExecutor.ENGINE_ID;\n\n'
          if 'private static final String ENGINE_ID = DocumentExistingArtifactEffectExecutor.ENGINE_ID;' not in text:
              if text.count(old) != 1:
                  raise SystemExit('unexpected UniversalDocumentSpine class declaration')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE/src/main/java/org/systemmaster/tools/document/spine/UniversalDocumentSpine.java
          if ! git diff --cached --quiet; then
            git commit -m 'documents: bind integrated spine engine identity to effect executor'
            git push origin HEAD:documents/spine-effect-runtime-001-20260912
          fi
          printf 'QUALIFIED_SUBJECT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Qualify exact repaired subject and preserve diagnostics
        shell: bash
        run: |
          set -uo pipefail
          ROOT='recovered/document/cr001-r4/source/01_CURRENT_DOCUMENT_PROCESSING_MODULE'
          cd "$ROOT"
          rm -rf build/classes
          mkdir -p build/classes
          find src/main/java src/test/java -name '*.java' -print | LC_ALL=C sort > build/java-sources.txt
          set +e
          javac --release 21 -Xlint:all -Werror -d build/classes @build/java-sources.txt > build/integration-compile-r2.txt 2>&1
          COMPILE=$?
          ISOLATED=99
          INTEGRATION=99
          CUMULATIVE=99
          COUNT=0
          if [ "$COMPILE" -eq 0 ]; then
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpineEffectRuntimePortableTests > build/integration-isolated-r2.txt 2>&1
            ISOLATED=$?
            java -cp "$(pwd)/build/classes" org.systemmaster.tools.document.DocumentSpine002APortableTests > build/integration-route-r2.txt 2>&1
            INTEGRATION=$?
            : > build/integration-cumulative-r2.txt
            CUMULATIVE=0
            while IFS= read -r file; do
              class="${file#src/test/java/}"
              class="${class%.java}"
              class="${class//\//.}"
              printf 'RUN %s\n' "$class" >> build/integration-cumulative-r2.txt
              java -cp "$(pwd)/build/classes" "$class" >> build/integration-cumulative-r2.txt 2>&1
              STATUS=$?
              if [ "$STATUS" -ne 0 ]; then CUMULATIVE=$STATUS; fi
              COUNT=$((COUNT + 1))
            done < <(find src/test/java -name '*PortableTests.java' -print | LC_ALL=C sort)
          else
            : > build/integration-isolated-r2.txt
            : > build/integration-route-r2.txt
            : > build/integration-cumulative-r2.txt
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p qualification/document-system/spine
          {
            printf 'record=DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-002\n'
            printf 'subject=%s\n' "$QUALIFIED_SUBJECT"
            printf 'environment=github-hosted-ubuntu-java21\n'
            printf 'compile_status=%s\n' "$COMPILE"
            printf 'isolated_48_44_status=%s\n' "$ISOLATED"
            printf 'owner_route_status=%s\n' "$INTEGRATION"
            printf 'cumulative_status=%s\n' "$CUMULATIVE"
            printf 'cumulative_classes=%s\n' "$COUNT"
            printf '%s\n' '--- compile ---'
            cat "$ROOT/build/integration-compile-r2.txt"
            printf '%s\n' '--- isolated ---'
            cat "$ROOT/build/integration-isolated-r2.txt"
            printf '%s\n' '--- owner route ---'
            cat "$ROOT/build/integration-route-r2.txt"
            printf '%s\n' '--- cumulative tail ---'
            tail -n 120 "$ROOT/build/integration-cumulative-r2.txt"
          } > qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-002.txt
          PASS=0
          if [ "$COMPILE" -eq 0 ] && [ "$ISOLATED" -eq 0 ] && [ "$INTEGRATION" -eq 0 ] && [ "$CUMULATIVE" -eq 0 ]; then PASS=1; fi
          if [ "$PASS" -eq 1 ]; then
            export CUMULATIVE_COUNT="$COUNT"
            export RUN_ID="$GITHUB_RUN_ID"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
            'record_id': 'DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001',
            'owner_system_id': 'DOCUMENTS',
            'owner_path': 'SYSTEM_MASTER/DOCUMENTS',
            'control_ref_observed_before_build': 'documents/control-v1',
            'control_head_observed_before_build': '92cdf489d5b3d4294f6b90104ec1753cc2da289f',
            'candidate_branch': 'documents/spine-effect-runtime-001-20260912',
            'qualified_subject_sha': os.environ['QUALIFIED_SUBJECT'],
            'workflow_run_id': int(os.environ['RUN_ID']),
            'environment': {'runner': 'github-hosted', 'os': 'ubuntu-latest', 'java': 'Temurin 21', 'standing': 'HOSTED_PORTABLE_ONLY'},
            'status': 'QUALIFIED_PORTABLE__OWNER_CONTROL_FREEZE_PENDING',
            'integration_contract': [
              'UniversalDocumentSpine MASTER/REBUILD routes delegate to DocumentExistingArtifactEffectExecutor',
              'effectful execution fails closed without an explicit DocumentEffectAdmissionProvider',
              'READ/EXTRACT remain callable through the five-argument construction path without effect admission',
              'legacy inline mutation is removed from UniversalDocumentSpine',
              'legacy action PASS/PREPARED evidence without effect-admission bindings fails closed in executor reconstruction',
              'PREPARED candidate reconciliation forbids blind mutation replay',
              'MASTER remains same-format and downstream proof/version/publication remain separate authorities'
            ],
            'qualification': {
              'strict_compile': 'PASS',
              'isolated': {'REBUILD': {'passed': 48, 'planned': 48}, 'MASTER': {'passed': 44, 'planned': 44}},
              'owner_route_integration': 'PASS',
              'cumulative_portable_test_classes_passed': int(os.environ['CUMULATIVE_COUNT']),
              'cumulative_portable_test_classes_planned': int(os.environ['CUMULATIVE_COUNT'])
            },
            'nonclaims': [
              'NO_NATIVE_MICROSOFT_OFFICE_PASS', 'NO_TARGET_DEVICE_PASS',
              'NO_REAL_EXTERNAL_POLICY_PROVIDER_CORRECTNESS_CLAIM', 'NO_HUMAN_OR_AUTHOR_AUTHORITY_CLAIM',
              'NO_PRIVATE_SOURCE_PERMISSION_CLAIM', 'NO_PUBLICATION_AUTHORIZATION_CLAIM',
              'NO_PRODUCTION_STANDING', 'NO_A01_PASS', 'NO_PROSE_WORK'
            ],
            'successor': {
              'objective_id': 'DOCUMENTS-SPINE-EFFECT-RUNTIME-FREEZE-001',
              'state': 'READY_IF_OWNER_HEAD_UNCHANGED_AND_NO_OVERLAP',
              'required_work': [
                're-read CURRENT-AUTHORITY and exact documents/control-v1 live head',
                're-read Documents delegation and repair state and reject stale overlaps',
                'reconcile the exact qualified integration subject onto the live Documents owner lineage',
                'preserve exact qualification evidence and update Documents control evidence',
                'do not claim native/external/publication/A-01 standing'
              ]
            }
          }
          Path('qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          fi
          git config user.name 'system-master-documents-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-QUALIFICATION-ATTEMPT-002.txt
          if [ -f qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json ]; then
            git add qualification/document-system/spine/DOCUMENTS-SPINE-EFFECT-RUNTIME-INTEGRATION-001.json
          fi
          git commit -m 'documents: preserve repaired integration qualification evidence' || true
          git push origin HEAD:documents/spine-effect-runtime-001-20260912
          if [ "$PASS" -ne 1 ]; then exit 1; fi
