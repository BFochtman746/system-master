name: A-01 Control Plane Admission Broker

on:
  workflow_dispatch:
    inputs:
      qualification_id: {description: Registered qualification ID, required: true, type: string}
      workstream_id: {description: Owning workstream, required: true, type: string}
      subject_sha: {description: Exact 40-character commit SHA to qualify, required: true, type: string}
      origin_ref: {description: Workstream branch/ref that owns the return ticket, required: true, type: string}
      resume_on_pass: {description: Authorized continuation after PASS, required: true, type: string}
      resume_on_failure: {description: Authorized continuation after failure, required: true, type: string}
      execution_context: {description: Normal or centrally scheduled overnight execution, required: true, default: normal, type: choice, options: [normal, overnight]}
      repair_attempt: {description: Product repair attempts consumed, required: false, default: 0, type: number}
      max_repair_attempts: {description: Maximum bounded repair attempts, required: false, default: 1, type: number}
      advanced_json:
        description: >-
          Optional JSON object carrying the advanced fields that no longer fit inside
          GitHub's ten-input limit for manual dispatch. Recognised keys:
          notification_target, qualifier_timeout_minutes, job_timeout_minutes,
          not_before, not_after, repair_transaction_id. Example:
          {"qualifier_timeout_minutes": 28, "job_timeout_minutes": 30}
        required: false
        default: '{}'
        type: string
  workflow_call:
    inputs:
      qualification_id: {type: string, required: true}
      workstream_id: {type: string, required: true}
      subject_sha: {type: string, required: true}
      origin_ref: {type: string, required: true}
      resume_on_pass: {type: string, required: true}
      resume_on_failure: {type: string, required: true}
      notification_target: {type: string, required: true}
      execution_context: {type: string, required: false, default: normal}
      qualifier_timeout_minutes: {type: number, required: false, default: 28}
      job_timeout_minutes: {type: number, required: false, default: 30}
      not_before: {type: string, required: false, default: ''}
      not_after: {type: string, required: false, default: ''}
      repair_attempt: {type: number, required: false, default: 0}
      max_repair_attempts: {type: number, required: false, default: 1}
      repair_transaction_id: {type: string, required: false, default: ''}
    outputs:
      result_class:
        description: Authoritative A-01 result when admitted
        value: ${{ jobs.execute.outputs.result_class }}
      promotion_authorized:
        description: Exact-subject promotion authorization
        value: ${{ jobs.execute.outputs.promotion_authorized }}
      repair_transaction_id:
        description: Existing or newly brokered repair transaction
        value: ${{ jobs.execute.outputs.repair_transaction_id }}
      repair_transaction_state:
        description: Durable repair state
        value: ${{ jobs.execute.outputs.repair_transaction_state }}
      repair_target_inbox:
        description: Canonical repair inbox
        value: ${{ jobs.execute.outputs.repair_target_inbox }}
      admission_state:
        description: Trusted metadata-only admission state
        value: ${{ jobs.admit.outputs.admission_state }}
      control_plane_sha:
        description: Exact admitted control-plane SHA
        value: ${{ jobs.admit.outputs.control_plane_sha }}

permissions:
  contents: read
  actions: read

jobs:
  admit:
    name: Verify registration and immutable subject metadata before subject acquisition
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
      admission_state: ${{ steps.admission.outputs.admission_state }}
      control_plane_sha: ${{ steps.admission.outputs.control_plane_sha }}
      registry_version: ${{ steps.admission.outputs.registry_version }}
      policy_version: ${{ steps.admission.outputs.policy_version }}
    steps:
      - name: Checkout exact trusted control-plane authority only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control-plane
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify exact control-plane checkout before admission
        shell: powershell
        env:
          EXPECTED_CONTROL_PLANE_SHA: ${{ job.workflow_sha }}
        run: |
          $actual = (& git -C "$env:GITHUB_WORKSPACE\control-plane" rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_CONTROL_PLANE_SHA) { throw "CONTROL_PLANE_CHECKOUT_MISMATCH:$actual" }
          Write-Host "A01_ADMISSION_CONTROL_PLANE=$actual"
      - name: Evaluate trusted metadata-only admission barrier
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A01_ADMISSION_CONTROL_ROOT: ${{ github.workspace }}\control-plane
          A01_QUALIFICATION_ID: ${{ inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST' }}
          A01_WORKSTREAM_ID: ${{ inputs.workstream_id || 'SYSTEM-MASTER' }}
          A01_SUBJECT_SHA: ${{ inputs.subject_sha || github.sha }}
          A01_CONTROL_PLANE_SHA: ${{ job.workflow_sha }}
          A01_EXECUTION_CONTEXT: ${{ inputs.execution_context || 'normal' }}
          A01_QUALIFIER_TIMEOUT_MINUTES: ${{ inputs.qualifier_timeout_minutes || fromJSON(inputs.advanced_json || '{}').qualifier_timeout_minutes || 28 }}
          A01_REPAIR_TRANSACTION_ID: ${{ inputs.repair_transaction_id || fromJSON(inputs.advanced_json || '{}').repair_transaction_id || '' }}
          A01_ADMISSION_EVIDENCE: ${{ runner.temp }}\a01-admission.json
        shell: powershell
        run: node "$env:GITHUB_WORKSPACE\control-plane\.github\scripts\a01-admission-barrier.js" evaluate-remote
      - name: Publish admission result
        if: always()
        shell: powershell
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## A-01 TRUSTED METADATA ADMISSION BARRIER'
          $evidence = Join-Path $env:RUNNER_TEMP 'a01-admission.json'
          if (Test-Path -LiteralPath $evidence) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
            Get-Content -LiteralPath $evidence | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
          }
      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-admission-${{ inputs.qualification_id || 'A01-CONTROL-PLANE-SELFTEST' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\a01-admission.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed before subject checkout when admission is not valid
        if: always() && steps.admission.outputs.admitted != 'true'
        shell: powershell
        run: |
          Write-Host "A01_ADMISSION_BLOCKED state=${{ steps.admission.outputs.admission_state }}"
          Write-Host 'No qualification subject was checked out or executed during admission.'
          Write-Host 'After registration/policy/control-plane changes, start a fresh caller run.'
          exit 1

  validate_repair_lineage:
    name: Validate optional same-transaction repair lineage without subject acquisition
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.admitted == 'true' && inputs.repair_transaction_id != ''
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout exact admitted control plane only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.admit.outputs.control_plane_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Validate exact durable transaction binding
        env:
          REPAIR_TRANSACTION_ID: ${{ inputs.repair_transaction_id || fromJSON(inputs.advanced_json || '{}').repair_transaction_id || '' }}
          EXPECTED_QUALIFICATION_ID: ${{ inputs.qualification_id }}
          EXPECTED_WORKSTREAM_ID: ${{ inputs.workstream_id }}
          EXPECTED_SUBJECT_SHA: ${{ inputs.subject_sha }}
          EXPECTED_ORIGIN_REF: ${{ inputs.origin_ref }}
        shell: powershell
        run: |
          node --check .github/scripts/a01-repair-ledger.js
          @'
          const ledger = require('./.github/scripts/a01-repair-ledger');
          const c = ledger.prepareRerun({ transaction_id: process.env.REPAIR_TRANSACTION_ID });
          const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
          if (c.qualification_id !== process.env.EXPECTED_QUALIFICATION_ID) throw new Error('REPAIR_RERUN_QUALIFICATION_MISMATCH');
          if (c.workstream_id !== process.env.EXPECTED_WORKSTREAM_ID) throw new Error('REPAIR_RERUN_WORKSTREAM_MISMATCH');
          if (!same(c.subject_sha, process.env.EXPECTED_SUBJECT_SHA)) throw new Error('REPAIR_RERUN_SUBJECT_MISMATCH');
          if (c.origin_ref !== process.env.EXPECTED_ORIGIN_REF) throw new Error('REPAIR_RERUN_ORIGIN_REF_MISMATCH');
          console.log(`A01_REPAIR_LINEAGE_ADMITTED transaction=${c.transaction_id} state=${c.transaction_state}`);
          '@ | node

  execute:
    name: Execute only after trusted metadata admission succeeds
    needs: [admit, validate_repair_lineage]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.admitted == 'true' && (inputs.repair_transaction_id == '' || needs.validate_repair_lineage.result == 'success')
    uses: ./.github/workflows/a01-control-plane-executor.yml
    with:
      qualification_id: ${{ inputs.qualification_id }}
      workstream_id: ${{ inputs.workstream_id }}
      subject_sha: ${{ inputs.subject_sha }}
      origin_ref: ${{ inputs.origin_ref }}
      resume_on_pass: ${{ inputs.resume_on_pass }}
      resume_on_failure: ${{ inputs.resume_on_failure }}
      notification_target: ${{ inputs.notification_target || fromJSON(inputs.advanced_json || '{}').notification_target || 'originating-workstream' }}
      execution_context: ${{ inputs.execution_context }}
      qualifier_timeout_minutes: ${{ inputs.qualifier_timeout_minutes || fromJSON(inputs.advanced_json || '{}').qualifier_timeout_minutes || 28 }}
      job_timeout_minutes: ${{ inputs.job_timeout_minutes || fromJSON(inputs.advanced_json || '{}').job_timeout_minutes || 30 }}
      not_before: ${{ inputs.not_before || fromJSON(inputs.advanced_json || '{}').not_before || '' }}
      not_after: ${{ inputs.not_after || fromJSON(inputs.advanced_json || '{}').not_after || '' }}
      repair_attempt: ${{ inputs.repair_attempt }}
      max_repair_attempts: ${{ inputs.max_repair_attempts }}
      repair_transaction_id: ${{ inputs.repair_transaction_id || fromJSON(inputs.advanced_json || '{}').repair_transaction_id || '' }}
      control_plane_sha: ${{ needs.admit.outputs.control_plane_sha }}
      admission_state: ${{ needs.admit.outputs.admission_state }}
    secrets: inherit
