name: Claim Driver

# The unattended executor. This is the launcher this repository has described in its
# governance records since the beginning and never actually had: it runs
# ClaimDriverMain, which drives ClaimLedger.Consumer.tick() inside two ceilings and
# prints a run summary an operator can read the next morning.
#
# NOT A REQUIRED CHECK, AND DELIBERATELY UNREACHABLE FROM A PULL REQUEST.
# There is no pull_request trigger here, and this workflow must never be bound as a
# required status check. A scheduled runner has no business being a merge gate.

on:
  schedule:
    - cron: '0 3,4,6,7,8,9 * * *'
  workflow_dispatch:
    inputs:
      claim_id:
        description: 'Optional claim id to queue for this run'
        required: false
        type: string
      payload_digest:
        description: 'Payload digest for the inline claim'
        required: false
        type: string
      max_iterations:
        description: 'Iteration ceiling for this run'
        required: false
        default: '25'
        type: string
      budget_seconds:
        description: 'Wall-clock ceiling in seconds'
        required: false
        default: '300'
        type: string

concurrency:
  group: claim-driver
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # dispatch claim-work and read its run status/conclusion

jobs:
  drive:
    name: claim-driver
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn -q -B compile

      - name: Drive claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIM_WORK_WORKFLOW: claim-work.yml
          # Dispatch the work definition from the same ref as this driver. Scheduled
          # production runs resolve to main; a manual feature-branch qualification can
          # exercise the branch's matching dispatch_id/run-name protocol before merge.
          CLAIM_WORK_REF: ${{ github.ref_name }}
          IN_CLAIM_ID: ${{ inputs.claim_id }}
          IN_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          IN_MAX_ITERATIONS: ${{ inputs.max_iterations }}
          IN_BUDGET_SECONDS: ${{ inputs.budget_seconds }}
        run: |
          set -euo pipefail
          args=(--queue execution/claims/queue
                --max-iterations "${IN_MAX_ITERATIONS:-25}"
                --budget-seconds "${IN_BUDGET_SECONDS:-300}")
          if [ -n "${IN_CLAIM_ID:-}" ]; then
            args+=(--claim "${IN_CLAIM_ID}=${IN_PAYLOAD_DIGEST:-manual-dispatch}")
          fi
          java -cp target/classes org.systemmaster.core.ClaimDriverMain "${args[@]}"
