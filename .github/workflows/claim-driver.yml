name: Claim Driver

# Unattended crash-safe dispatcher. Durable state lives on a dedicated non-code branch;
# state mutation crosses the protected Control Gateway writer, so this ordinary workflow
# needs repository read access plus Actions dispatch/read access only.
# Final audit: the legacy direct-write state store is removed; protected Control Gateway
# mutation is the sole production durable-state write path.

on:
  schedule:
    - cron: '0 3,4,6,7,8,9 * * *'
  workflow_dispatch:
    inputs:
      claim_id:
        description: 'Optional claim id to queue for this run'
        required: false
        type: string
      payload_digest:
        description: 'Payload digest for the inline claim'
        required: false
        type: string
      max_iterations:
        description: 'Iteration ceiling for this run'
        required: false
        default: '25'
        type: string
      budget_seconds:
        description: 'Wall-clock admission ceiling in seconds'
        required: false
        default: '300'
        type: string

concurrency:
  group: claim-driver
  cancel-in-progress: false

permissions:
  contents: read  # ordinary reads/checkout only; state writes use the protected writer
  actions: write  # dispatch protected writer/claim-work and read run status/conclusion

jobs:
  drive:
    name: claim-driver
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn -q -B compile

      - name: Drive claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAIM_WORK_WORKFLOW: claim-work.yml
          CLAIM_WORK_REF: ${{ github.ref_name }}
          CLAIM_STATE_REF: second-shift/execution-state
          CLAIM_STATE_ROOT: execution/claims/state
          IN_CLAIM_ID: ${{ inputs.claim_id }}
          IN_PAYLOAD_DIGEST: ${{ inputs.payload_digest }}
          IN_MAX_ITERATIONS: ${{ inputs.max_iterations }}
          IN_BUDGET_SECONDS: ${{ inputs.budget_seconds }}
        run: |
          set -euo pipefail
          args=(--queue execution/claims/queue
                --max-iterations "${IN_MAX_ITERATIONS:-25}"
                --budget-seconds "${IN_BUDGET_SECONDS:-300}")
          if [ -n "${IN_CLAIM_ID:-}" ]; then
            args+=(--claim "${IN_CLAIM_ID}=${IN_PAYLOAD_DIGEST:-manual-dispatch}")
          fi
          java -cp target/classes org.systemmaster.core.ClaimDriverMain "${args[@]}"
